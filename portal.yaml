  # ── Tasks (claimant-owned task store + captain board) ───────────────
  # All read-only: the platform-server tasks router exposes no mutating
  # endpoints. Two-way GitHub sync runs through the CLI, not this server.
  GET /api/tasks:
    - ^local-only
    - ^read-only
  GET /api/tasks/board:
    - ^local-only
    - ^read-only
  GET /api/tasks/calibration:
    - ^local-only
    - ^read-only
  GET /api/tasks/whoami:
    - ^local-only
    - ^read-only
  GET /api/tasks/inbox:
    - ^local-only
    - ^read-only
  GET /api/tasks/:id:
    - ^local-only
    - ^read-only

  # Tasks WRITE verbs — each PROXIES the enforced updateTask state-machine path
  # (assertTransition + settlement fire identically to the CLI/MCP). Not the
  # read router; write-capable, local-only.
  POST /api/tasks/:id/claim:
    - ^local-only
    - ^write-capable
  POST /api/tasks/:id/start:
    - ^local-only
    - ^write-capable
  POST /api/tasks/:id/done:
    - ^local-only
    - ^write-capable
  POST /api/tasks/:id/block:
    - ^local-only
    - ^write-capable
  POST /api/tasks/:id/unblock:
    - ^local-only
    - ^write-capable
  # Inbound two-way GitHub sync — pulls remote state, applies through the same
  # enforced writers. No client-supplied remote state.
  POST /api/tasks/sync:
    - ^local-only
    - ^write-capable

  # ── WebSocket ───────────────────────────────────────────────────────
  WS /ws:
    - ^local-only
    - ^authenticated-session
