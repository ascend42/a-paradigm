version: 2.0.0
gates:
  local-only:
    description: 'Local-only access. Enforced two ways — the socket binds loopback by default, AND the #local-guard request middleware rejects 403 any state-changing (POST/PUT/PATCH/DELETE) /api request whose Host is non-loopback or whose (present) Origin is non-loopback (CSRF + DNS-rebinding guard). CORS reflects only loopback origins (never wildcard). GET/HEAD reads are not gated.'
    type: network
    location: platform-server/local-guard.ts
    check: loopback Host ∈ {localhost,127.0.0.1,::1} AND (Origin absent OR loopback) for POST/PUT/PATCH/DELETE on /api/*
    prizes: []
  authenticated-session:
    description: Route requires an active Paradigm session (platform server running)
    type: session
    location: platform-server
    check: process is serving on localhost with active HTTP + WebSocket context
    prizes: []
  read-only:
    description: Route only returns data — no side effects or state mutations
    type: access
    location: route-handler
    check: HTTP method is GET (safe, idempotent)
    prizes: []
  write-capable:
    description: Route modifies state — creates, updates, or deletes data
    type: access
    location: route-handler
    check: HTTP method is POST, PUT, PATCH, or DELETE
    prizes: []
  brain-default-deny:
    description: 'Paradigm Brain default-deny. Every Brain read goes through the single #brain-view choke point (openBrainView). Files are private unless a human shares them; sensitive zones (medical, financial, third-party-data, quarantined) are never listed — the owner sees only {folder, gate, count}. Filtering happens BEFORE any matching, so search/health/suggestions never see hidden records. Brain routes additionally require a loopback Host on GET (DNS-rebinding guard for private metadata).'
    type: access
    location: paradigm-mcp/src/utils/brain/view.ts + platform-server/routes/brain.ts
    check: openBrainView(rootHash, 'owner') only; locked zones → {folder, gate, count}; loopback Host on every /api/brain request
    prizes: []
  brain-owner-write:
    description: Brain owner write credential. POST /api/brain/verdict requires the per-process owner token in the HttpOnly SameSite=Strict `brain_owner` cookie (set by a same-origin GET /api/brain/overview, never in a response body) AND an Origin exactly equal to the Platform's own origin. Other localhost ports get no ACAO and a 403 on every /api/brain request.
    type: access
    location: platform-server/routes/brain-write.ts
    check: timing-safe equal(x-brain-token, process owner token) AND ^local-only
    prizes: []
  voice-armed:
    description: 'Gnomon voice arm is live (spec §14.7, P8-D58–D62): voice intents may decide cards only inside an armed window (hard minutes, maxDecisions per arm class, headphones + handle + challenge). Reserved in M1.1; no route yet — enforced by #approval-broker in Move 4.'
    type: capability
    location: packages/gnomon (#approval-broker, Move 4)
    check: an unexpired voice arm record exists for the deciding principal and the card class is within the arm's limits
    prizes: []
  # voice-origin-clamp: RETIRED by TD-2026-10-23-939 (superseded TD-2026-10-21-514's clamp). A voice-sent turn now runs
  # under the session's run mode, saved Always rules and standing grants exactly like a typed turn; the origin stamp on
  # turn.sent is a record only. What remains as a gate is ^voice-never-approves below.
  voice-never-approves:
    description: 'Gnomon voice never approves anything (spec §14.7, TD-2026-10-23-939): cards, grants, trust and mode changes. The voice principal''s every approve form is refused FORBIDDEN gate voice (voice-off, or voice-hand-only for a hand-only card) at dispatch before any port and again in #approval-broker; a human connection''s voice intent form (via voice, or a voice param) is refused the same way. Holds until Move 4 arms voice approvals, whose precondition is in §14.7.'
    type: capability
    location: packages/gnomon/src/kernel/broker/broker.ts:767-775 (#approval-broker approve) + packages/gnomon/src/kernel/socket/dispatch.ts:813 (approve, voice class)
    check: principalClass is not voice AND the approve params carry no via voice and no voice key
    prizes: []
  loop-trusted:
    description: 'Gnomon Loops (docs/specs/gnomon-loops.md, TD-2026-10-22-369): a loop runs, fires or lands only while a human trust record (the loop-trust card, hand only, root key) matches its compiled definition and content hash; any change to the definition or its protected set drops trust until re-trusted.'
    type: capability
    location: packages/gnomon/src/kernel/loops/registry.ts (#loop-registry) and the loop runners that consult it
    check: the loop's current compiled definition hash equals the hash in an unrevoked human loop-trust record
    prizes: []
  loop-origin-clamp:
    description: 'Gnomon Loops: a session a loop raises gets no automatic pass (auto-edits, read-only, Always rules) beyond what its trusted definition allows; everything else raises a card (loop-clamp.ts, default deny, exact loop-trust match).'
    type: capability
    location: packages/gnomon/src/kernel/supervisor/loop-clamp.ts (#loop-clamp), packages/gnomon/src/kernel/supervisor/supervisor.ts (mayAuto)
    check: loopClampAllows(origin, pass) is true for the loop's trusted definition
    prizes: []
  mcp-server-enable:
    description: 'Gnomon turns on one of the human''s own MCP servers for sessions only by the human''s decision (T-2026-10-23-003, #mcp-servers). request.mcp.enable / request.mcp.disable are served from a human-class gui or device connection only (never voice, an agent, a mod or a session; dispatcher-only, never a row). Enable raises ONE grant card (detail.action mcp.enable): root class (presence AND the root key), hand-only, never standing, re-checked against the server''s launch hash inside the touch; a server from a repo''s own .mcp.json (or a per-folder ~/.claude.json entry) is turned on for that one repo only, never for all; a changed declaration is not launched until turned on again. Disable and the first-party Paradigm MCP on/off narrow or restore the default and take no card. Rows and cards carry env and header NAMES only; values reach only the session''s own 0600 mcp.json.'
    type: capability
    location: packages/gnomon/src/kernel/desk/mcp-server-cards.ts (McpServers.request) + packages/gnomon/src/kernel/socket/dispatch.ts (request.mcp.* routing)
    check: principalClass human AND credential gui|device; enable needs an allowed grant card whose launchHash still matches; project/local servers only with scope repo = their own folder
    prizes: []
  peer-paired:
    description: 'Gnomon kernel link is paired (spec §3.9, P8-R9, P8-D73–D76): link verbs (brief send, cowork, inject origin peer) require a root-signed pairing with the peer''s root key. Reserved in M1.1; enforced by #peer-link in M2.8.'
    type: capability
    location: packages/gnomon (#peer-link, M2.8)
    check: a root-signed registry row of kind link names the peer's rootKeyId and is not revoked
    prizes: []
  certified:
    description: 'Gnomon contract node is certified (spec §7.3, P8-D86–D88 review cap): a node lands only when its oracles pass and its review converged within review.maxRounds. Reserved in M1.1; enforced by the contracts compiler / #approval-broker in Move 2.'
    type: capability
    location: packages/gnomon (#contracts-compiler, Move 2)
    check: every oracle for the node reports pass and the review lineage is converged
    prizes: []
  setup-token:
    description: 'Gnomon setup mode one-shot token (spec §11.2 rule 11, T-2026-10-19-005). The #setup-endpoint mints ONE 32-byte token per endpoint, 60 s TTL, single use, carried only in the URL fragment (#setup=<tok>&k=<spki>) on the TTY line or the Gnomon.app wrapper channel pipe; never argv, env, files or logs. The setup WebSocket (exact Origin, Host 127.0.0.1:<port>) is refused every gnomon-setup:v1 call before auth {setupToken}; a second connection is refused, and a reuse inside the TTL aborts provisioning and journals setup.token-reuse without the token. No gnomon-rpc verb is reachable on this endpoint.'
    type: access
    location: packages/gnomon/src/kernel/setup/setup-endpoint.ts (#setup-endpoint)
    check: constant-time equal(auth.setupToken, the minted token) AND now < expiresAt AND not yet consumed AND no other setup connection
    prizes: []
  unprovisioned-only:
    description: 'Gnomon first-run provisions only a home with NO keys/identity.json (spec §2.4 rule 9). An existing identity is shown (createdAt, root keyId) and never adopted or replaced; a malformed one is shown, never touched; a dev or symlinked home is refused. The writes allowed on a provisioned home are the I10 completion of a missing device registry row (the saved, already root-signed row; no new signature) and setup.purge of a leftover, non-live key generation the checks listed (behind a presence prompt; the live and GNOMON_HOME generations are protected). Enforced by gnomon setup, bare gnomon, up --wrapper routing and the #setup-endpoint setup.begin / setup.complete.'
    type: access
    location: packages/gnomon/src/cli/setup-cli.ts + src/cli/up-cli.ts + src/kernel/setup/setup-endpoint.ts (#first-run, #setup-endpoint)
    check: ~/.gnomon is missing, or a real non-dev directory with no keys/identity.json; else only setup.complete of a missing registry row for the existing identity, or setup.purge of a listed non-live leftover generation
    prizes: []
  git-init-gate:
    description: 'Gnomon kernel-run git.init and git.worktree.add/remove (T-2026-10-23-002, #git-verbs; MCP tools gnomon_git_init, gnomon_worktree_add, gnomon_worktree_remove on the kernel''s own SDK server, never a socket or port). Run under the session''s run mode like an edit: manual refuses until a plan is approved, auto-edits runs after an approval.auto{modeRef:mode:auto-edits} row (no row, no run), ask raises a permission card (allow / deny, no Always); a force worktree remove always takes its own irreversible card; loop sessions refuse. init refuses a folder already in a repo (an ancestor''s .git included), the home folder, a system folder, the Gnomon home, a non-root, a symlinked .git or a gitfile; the repo gets the kernel''s [core]-only config and an empty hooks dir.'
    type: access
    location: packages/gnomon/src/kernel/git/kernel-verbs.ts (#git-verbs) + src/kernel/supervisor/kernel-mcp.ts (#kernel-mcp)
    check: session not a loop AND (mode = auto-edits with an approval.auto row OR an allowed permission card) AND initRefusal(root) = null re-checked after the decision
    prizes: []
  git-push-gate:
    description: 'Gnomon kernel-run git.push and repo.create (T-2026-10-23-002, #git-verbs; MCP tools gnomon_git_push, gnomon_repo_create). Always attended: a permission card composed from the kernel''s own reading (the remote URL git resolves with the push''s own env and flags, the host shown plainly; a lookalike or punycode host flagged claim-mismatch with no Always), never agent text. git.push honours Always rules from the same RuleBook keyed to (repoKey, gnomon_git_push, the exact URL and host); a force push (force: true) is its own irreversible card; a public repo is irreversible-flagged; repo.create offers no Always. The remote and branch are re-read after the decision. Runs with the human''s own credentials (credential helper or gh sign-in) in a scrubbed env, https/ssh only, no redirects, no hooks, never tags or a mirror; the repo config must hold plain keys only.'
    type: access
    location: packages/gnomon/src/kernel/git/kernel-verbs.ts (#git-verbs)
    check: session not a loop and not manual without a plan AND configProblems(.git/config) = [] AND (an allowed or always card OR a kernel-derived Always rule for that exact remote, not force, not flagged) AND the re-read remote URL and branch equal the card's
    prizes: []
  command-execution-consent:
    description: 'Operator consent before an agent run through the Anthropic API provider (#claude-provider; paradigm team spawn / orchestrate, background orchestrations) may run shell commands on the operator''s machine. run_command stays on by default, but the first call asks the person at the terminal once ("Paradigm agents can run shell commands on your machine with your permissions. Keep this on? [y/N]") and saves the answer as agent-provider.allow-commands in ~/.paradigm/config.yaml (per user, never read from the project''s config, so a cloned repo cannot grant itself shell access). Undecided with no terminal (background, orchestrated, MCP, piped) means the tool is not offered; false means not offered; --allow-commands / --no-allow-commands override for one run and are not saved. Separately, read_file, write_file, search_files and the run_command cwd resolve by realpath inside the run''s working directory, symlinks that lead out are refused, and every run_command (command, cwd, exit code, timestamp; never env values) is appended to .paradigm/events/agent-commands.jsonl. write_file also has a deny-list (#write-guard): .git/.hg/.svn at any depth, editor/hook/CI configuration at the root (.claude, .mcp.json, .vscode, .husky, .github, .envrc, .npmrc, ...), all of .paradigm, ~/.paradigm, ~/.claude, the command log, and new or changed package.json install scripts. The deny-list protects the OFF state and the time before consent, because those files run commands the next time a tool touches the repo. It bounds nothing once commands are ON: a command can write any of them itself.'
    type: capability
    location: packages/paradigm/src/core/providers/command-consent.ts (#command-consent) + packages/paradigm/src/core/providers/claude-tools.ts (#claude-provider tools)
    check: flag allowCommands, else saved agent-provider.allow-commands, else (interactive terminal AND the operator answers y) ; run_command offered only when not denied, and refused at call time unless allowed ; model-supplied paths pass resolveContained(workingDirectory) ; write_file passes checkWrite (#write-guard)
    prizes: []
  gate-check:
    description: Internal gate used by the @a-company/portal SDK for validating gate definitions and checks (see packages/portal/sdk/.purpose).
    type: internal
    location: packages/portal/sdk
    check: SDK-internal validation of a gate definition
    prizes: []
