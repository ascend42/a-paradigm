version: 2.0.0

gates:
  local-only:
    description: Server binds to localhost only — no external access
    type: network
    location: express-bind
    check: req.hostname === 'localhost'
    prizes: []

  authenticated-session:
    description: Route requires an active Paradigm session (platform server running)
    type: session
    location: platform-server
    check: process is serving on localhost with active HTTP + WebSocket context
    prizes: []

  read-only:
    description: Route only returns data — no side effects or state mutations
    type: access
    location: route-handler
    check: HTTP method is GET (safe, idempotent)
    prizes: []

  write-capable:
    description: Route modifies state — creates, updates, or deletes data
    type: access
    location: route-handler
    check: HTTP method is POST, PUT, PATCH, or DELETE
    prizes: []

# ─── Platform Server Routes (/api/*) ────────────────────────────────
# All routes bind to localhost only. The platform server must be running
# (paradigm platform) which implies an active session context.

routes:

  # ── Health & Info ───────────────────────────────────────────────────
  GET /api/health:
    - ^local-only
    - ^read-only
  GET /api/platform/health:
    - ^local-only
    - ^read-only
  GET /api/platform/sections:
    - ^local-only
    - ^read-only
  GET /api/info:
    - ^local-only
    - ^read-only

  # ── Overview ────────────────────────────────────────────────────────
  GET /api/platform/overview:
    - ^local-only
    - ^authenticated-session
    - ^read-only

  # ── Agent Commands ──────────────────────────────────────────────────
  POST /api/platform/agent-command:
    - ^local-only
    - ^authenticated-session
    - ^write-capable

  # ── Lore ────────────────────────────────────────────────────────────
