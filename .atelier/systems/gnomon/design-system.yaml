        rows: "readonly rows (component settings-form keys under the value): label = server name (· plugin, or · <folder> (repo)); value led by a mark ✓ on in every repo | ✓ on in this folder | ✕ <the kernel's reason> | ? changed since you turned it on | off; how = from <source> · runs <command args> | <transport> · <url> · env <NAMES> (values not shown) · takes <NAMES> from ~/.gnomon/loop-env · runs a shell (<sh>) · downloads what it runs at each launch (npx)"
