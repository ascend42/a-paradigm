      - { date: 2026-10-28, decided_by: none, status: proposed, what: "C6'b2-2 (Mika's design, review #1, #2, #5): a brokered MCP card that can't be undone (flag irreversible; the kernel asks fresh presence on Allow). Its flag chip reads the word 'can’t be undone' (never the code 'irreversible', on any card) and, on a brokered card, sits on its own line (.card-flags) above the keys, so the key row stays Allow · Deny · Always ▾ at 340px. Its Allow key reads 'allow · Touch ID'. When the kernel offers Always on a destructive tool (the hashed detail.brokered.class destructive), the Always ▾ fold holds ONE key, visible text 'this tool, any arguments · Touch ID', accessible name 'Always: {tool} on {server} · Touch ID', and its visible note is the kernel's own line VERBATIM ('Always: any call of {tool} on server {server} in this repo, any arguments, by you from / AND by the model without asking. It can delete or overwrite. Paused if the tool or server changes.'), not repeated in the body. No Always is drawn when the kernel does not offer it.", source: "packages/gnomon-gui/src/core/render.ts toolScopesOf, TOOL_SCOPE_KEY.destructive / destructiveShort / touchId, FLAG_WORD, flagChip, alwaysChoices; static/styles.css .card-flags" }
      - { date: 2026-10-23, decided_by: atelier-mika, open_to: creator, what: "scoped Always (TD-2026-10-23-939 follow-up): when a card offers scoped always choices (Bash prefixes, edit file/repo), its key row is Allow · Deny · 'Always ▾'. The ▾ key decides nothing; it unfolds .always-choices under the row (a group labelled 'always allow, no card next time:'), one decision key per choice with its note visible under it (never only in title=), 8px between choices, 2px key-to-note. Keys read the scope ('this exact edit', 'edits to this file', 'edits in this repo', or the quoted prefix words); each key's accessible name starts 'Always:'. Esc folds back to the key; the fold and focus survive a repaint, per card and zone. Why: five long keys wrapped to three or four ragged rows in the pile at every width and to three pinned at 1024, and the one note that tells the repo choice from auto-edits lived only on hover. A popover menu was not used: the pile clips and fans, and a choice must never be buried.", source: "packages/gnomon-gui/src/core/render.ts alwaysChoices; packages/gnomon-gui/src/ui/app.ts setAlwaysFold; packages/gnomon-gui/static/styles.css .always-choices" }
      - { date: 2026-10-23, decided_by: creator, quote: "as long as the card text is scrollable in the event it's too large that's fine", what: "body-scroll: a card body (its lines and field blocks) taller than --card-body-max scrolls inside the card; title, keys and presence line stay in view", source: "packages/gnomon-gui/static/styles.css .card-body; packages/gnomon-gui/src/core/render.ts renderCard CARD_BODY_LABEL" }
      - { date: 2026-10-23, decided_by: creator, quote: "grouped cards of related things needs to occur if possible", what: "variant mcp-batch: ONE ⊙ gnomon grant card turning several MCP servers on; each server its own field block; one presence", source: "packages/gnomon/src/kernel/desk/mcp-server-cards.ts mcpBatchCardLines; packages/gnomon/src/kernel/broker/batch-card.ts" }
    body_scroll:
      rule: "Any card whose body (lines and field blocks) is taller than --card-body-max scrolls INSIDE the card (max-height + overflow-y auto, overscroll contained, stable gutter). The title, the k-line, the root rows, the keys, the presence line and the contentHash line sit outside the scroll area, so Allow is visible without scrolling. Never cut, never a 'show more'."
      tokens: { card-body-max: "min(42vh, 26em)", focus: "2px solid --key-edge, offset 1" }
      keyboard: "ONLY while the body overflows (measured after mount, on every box change and on scroll: render.ts markCardBody, app.ts ResizeObserver) is it ONE tab stop (tabindex 0, role group, named 'what the card says (scrolls)'): arrow keys and Page Up/Down scroll it; Tab moves on to the keys, so it never traps focus. A body that fits adds no stop (Mika 2026-10-23)."
      cue: "macOS hides scrollbars at rest, so the cut alone does not say 'more': a body that scrolls has a 1px dashed --rule at its cut edge and, under it, .card-more (--fs-label, --sec) 'more below: scroll the card text' with a down arrow, then 'end of the card text' once scrolled to the end (words, never only a fade or a hue; the line keeps its height, so Allow never moves under the pointer)"
      covers: [mcp-enable (one server and the batch), rules.apply batch (strictness), git push, every other card body]
      status: clear
      from: { date: 2026-10-23, decided_by: creator, quote: "as long as the card text is scrollable in the event it's too large that's fine" }
    mcp_batch:
      rule: "Founder principle 'grouped cards of related things, one password': related changes ride ONE card and ONE fresh presence. The MCP batch card: title 'Turn on N MCP servers', the k-line, then each server as a fenced field block ('server i of N: <name> for all your repos' / 'in <folder>', '  │ ' facts: source, what it runs or where it connects, shell/fetch/inline warnings, env and header NAMES, takes-from, auto-allow rules, launch hash, '  └ end of …'), then 'Allow takes the root key and your presence …, once for all N'. Over 16 servers or the card-size cap the kernel refuses, never cuts. A server that changed while the card waited is skipped and named after Allow."
