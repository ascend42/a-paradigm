  rule-row:
    role: "One saved Always rule in Settings › Permissions › Rules: what it allows, where, since when, from which card, and whether it is on. Changes are staged in the page and applied by ONE save (rules-save-bar)."
    anatomy:
      - "what (11.5, 500 --ink, wraps anywhere): the KERNEL's plain words (status.rules words, rules.ts ruleWords), never page text: 'this exact command: npm run build' · 'Bash commands starting paradigm lore record …' · 'edits to <path>' · 'edits in this repo (same as auto-edits)' · 'this exact edit (Edit)'"
      - "meta (10.5 --sec): since ('today 12:53' · 'yesterday' · 'Oct 19', by the kernel's now) · state ('on' · 'off' · 'off until 15:07' · 'off until tomorrow 06:00'; off in 600 --ink2). The group heading names the repo, so the meta line doesn't repeat it; the title= says where ('a repo not open now' when no session names it), 'from the card asked in <session>' and the rule id (Mika 2026-10-23)"
      - "staged line (10.5, 600 --ink): '→ off for 1 hour' · '→ off until tomorrow' · '→ off until you turn it back on' · '→ on again' · 'removed on save'; a rule whose turn-on rides a waiting card: '→ on again when you allow its card' and no key"
      - "keys (right, --key-h): on: 'Turn off ▾' + Remove (quiet); off: 'Turn on' + Remove (quiet); staged: 'undo'; removed: 'keep'. Esc in the open presets folds them back to 'Turn off ▾'"
      - "Turn off ▾ opens INLINE under the row (like the card's Always ▾: a left rule, keys in a row), never a popover: 'for 1 hour · until 15:07', 'until tomorrow · 06:00', 'until I turn it back on' (each end named by the kernel clock, status.rules.presets)"
    grouping: "grouped by repo (heading 11.5 600 + '3 rules · 1 off' 10.5 --sec), newest first, groups by their newest rule; a filter field (words, repo or tool) above 12 rules; a staged row never hides behind the filter. Planned for 0, 1, 5, 50 and 200 rules."
    reused_by: "C6'b1: the Tools and memory drawer's All tools uses the same groups (.rules-group, heading 11.5 600 + 'n tools'), rows (.rule-row: name in .rule-what; 'reads · offered now' and the description in .rule-meta; the Pin key at the right) and the fold (a server group starts folded at 50 tools; a filter unfolds what it matches; the filter field shows at 12 tools). Gnomon's own verbs are the first group and have no Pin."
    folding:
      rule: "At 50 rules or more every repo group starts folded: its heading and count only. The heading is the fold key (a button inside the heading, aria-expanded, ▸ folded / ▾ open by glyph, never by hue; it reads as the heading, same size and weight). A filter unfolds every group it matches (and the fold key steps aside while it filters); a group holding a staged change, an open Turn off ▾ or a rule waiting on a card stays unfolded. Under 50 nothing folds."
      status: clear
      from: { date: 2026-10-23, decided_by: creator, quote: "folded works" }
      source: "packages/gnomon-gui/src/core/rules.ts FOLD_AT, toggleFold, rulesBlock; packages/gnomon-gui/src/ui/rules-block.ts; packages/gnomon-gui/static/styles.css .rules-fold"
    states: [on, off, off-until, off-open, staged-off, staged-on, staged-remove, filtered-out, empty, group-folded, group-unfolded, paused]
    destructive: "C6'b2-2 (Mika, from K3 status.rules[].class; proposed): a tool rule of class destructive carries the chip 'can't be undone' under its words (.chip.rule-chip: ink, a word, never a hue, never a key). Its repo group states the kernel's limit ONCE under the heading, folded or not (.rules-limit, 10.5 --sec): 'rules that can’t be undone run for you and the model · at most 3 a minute per session, 30 a day per rule' (Mika #3: it names which rules, since a group may hold others). A group with no such rule says nothing. Source: packages/gnomon-gui/src/core/rules.ts DESTRUCTIVE_CHIP, DESTRUCTIVE_LIMIT; src/ui/rules-block.ts"
    paused: "C5'b (status.rules paused, K2): an on tool rule that would not match now says why in its state, weight 600 --ink2, never a hue: 'paused: <server> isn''t trusted now' · 'paused: the tool changed' · 'paused: <server> is off'. The keys are unchanged; the counts name it ('3 rules · 1 off · 1 paused')."
    never: ["a hue for on/off or staged (words and weight carry it)", "the amber ◆ for a staged change", "Remove that hides the row before Save (it stays, struck through, with keep)"]
    copy:
      empty: "No Always rules yet. When you choose Always on a card, the rule shows here. (no '0 rules' summary above it: said once)"
      no-match: "No rule matches “<filter>”."
      summary: "5 rules · 1 off · 3 repos"
    entry_points: ["palette 'Rules…' (rules.open: Settings opened section-focused at Permissions › Rules)", "the mode menu's last entry 'Always rules…'", "the toast after an Always decision: 'Always rule saved: no card next time' with the key 'see Rules'"]
    status: clear
    from: { session: 2026-10-23-gnomon-rules-view, choice: "C1 Settings › Permissions › Rules; C2 three kernel-clock presets inline", decided_by: "Mika (design review), Aegis (security review)" }
  rules-save-bar:
    role: "The staged Rules batch: one line and its keys, sticky at the foot of the Rules block while anything is staged; the cost is named before the press."
    anatomy:
      - "count (11.5, 600): '3 changes'"
      - "Save (default key): 'Save · no Touch ID' when the batch only tightens; 'Save · asks Touch ID or your Mac password once' when any rule turns back on; busy 'Saving…'"
      - "Discard changes (quiet)"
      - "result line above the keys (.sf-result; role=status, or alert when it fails): 'saved 3 changes.' · 'card waiting 2 changes saved; 1 rule comes back on when you allow its card.' (+ key 'Decide in the stack') · 'not saved <plain words>' + 'next: <what to do>'; never the kernel's message, a rule or card id, or a code (principle 5)"
    behaviour:
      - "Save sends ONE request.rules.apply{changes}. remove and off apply at once (no presence); every rule turning back on rides ONE strictness card the same press decides allow (Touch ID or the Mac password, once)"
      - "A refusal leaves every change staged and says it in plain words with next:"
      - "A refused or waiting check: the narrowing is saved, the card stays in the stack: 'card waiting · Decide in the stack'"
      - "Closing Settings with changes staged asks inline at the top of the block: '3 changes not saved' + the bar's own Save label (its cost named the same way) + 'Discard changes' (the sheet stays open; focus on Save)"
      - "A rule that comes back on by itself when its time ends: a 6 s info toast 'rule back on: <rule>' (key 'see Rules')"
    states: [hidden, tighten-only, loosen, saving, saved, waiting, refused, close-prompt]
    status: clear
    from: { session: 2026-10-23-gnomon-rules-view, choice: "C3 the save bar names its cost", decided_by: "Mika (design review), Aegis (security review)" }

  # ── Proposed 2026-11-23, session 2026-11-23-gnomon-board-medium (milestone S1.1 of dimensions). Nothing below is
  # codified: every entry is `proposed` (board-slip `contested`, as offer-slip is) with decided_by: none. Rendered in
  # .atelier/systems/gnomon/specimen-board.html; the bd-* classes live in that page until the S1.1 build moves them
  # into styles.css, so these entries carry `specimen:` anchors and no `examples:` (examples would draw unstyled in
  # specimen.html). Each `chose` records the alternative, so the founder can overrule cheaply.
  board-leaf:
    role: "The board medium's view of a dimension: a GUI-owned leaf over the centre column (the loops-leaf pattern), where the founder and the session's agents draw. It covers the chat header and the chat, and stops above this session's pinned cards and the composer, so talking goes on while it is open."
    pattern: "loops-leaf (variant): same head, keep line, Esc-to-edge-tab and leaf-in arrival; differs in that it never covers the pinned zone or the composer (S1 plan §1, spec §11.4 amendment)."
    anatomy:
      - "head (the .lp-head row, on --sheet): ◰ · the dimension's title (17, .title) · '› board' (11.5 --sec, the medium) · ✎ rename (key quiet) · spacer · Dimensions ▾ (key quiet: this project's dimensions, the same list as /boards; design-foot: it opens components.dimension-list, the leaf's menu hung under the key) · esc (key quiet: fold). What the head gives up in a narrow leaf: widths_narrow"
      - "keep line (.lp-keep): 'dimension in ■ <project> · attached ◇ <session>[ +n] · opened from <how> · hh:mm'. <how> is one of '/board', 'the ⋯ menu', '<agent>'s offer' (session.start's command | menu | offer, amendment A9)"
      - "body: board-rail (48px) | the board (the engine's canvas on --ground, no dot grid, the desk's grain by day)"
      - "foot (10.5 --sec over a dashed --rule): the hands on this board: 'you <n>' with a plain pin, then each agent's seal, name and mark count; a self-claimed sub-agent adds '· claimed'. luna 2026-11-25 (S1.4): the foot also lists every attached session's agent, with marks or none, each with its draw key: hands_foot below and components.draw-grant. design-foot: the check stands at the foot's right end when all of it fits after the hands (check below)"
      - "under the leaf, always visible: the turn strip (turn_strip below; luna 2026-11-24, decided by Luna, pending founder review: replaces 'the turn's working line' alone), then the pinned cards and the composer"
    turn_strip:
      decided: "luna 2026-11-24, decided by Luna, pending founder review (T-2026-11-25-001; plan .paradigm/research/gnomon-canvas/s1.3-p4b2-turn-strip-plan.md, section 'Luna's rulings'). Proposed with the leaf; Mika draws it into specimen-board.html#leaf before its CSS ships."
      what: "The latest turn, in at most two one-line rows between the leaf's tab and the pinned cards: a 1px --rule top edge on --sheet, no box, no radius. A transcript-row variant (turn-strip), not a new component: the you row and the turn row are one-line forms of the user and assistant variants, the turn row reuses the working key as it is, and show chat is a key quiet."
      rows:
        you: "'you · <message, one line, cut with …> · hh:mm' (11.5; 'you' 600 --ink, the words --ink, the time 10.5 --sec tabular); 24px. Queued behind a running turn: 'waiting' takes the time's place until turn.sent. Refused or not sent: the send.refused row's own first line verbatim (never a second wording), in --fail, led by ✕ when it has none, cut with …; its next: is in the chat"
        turn: "28px (it holds a key). While the turn runs: the working key (transcript-row variant working, its words, clock and title unchanged). Once it ends: '<Claude|local model> · <the turn's latest assistant line, one line, cut with …>' (--ink2), plain text, never a key, no title=. If the run did not end 'done', the result line's how-it-ended words follow (no tokens): ' · stopped: turn limit' in --warn-ink, ' · error' in --fail; a normal end adds nothing. An empty reply reads '<agent> · no answer' with the same tail. Before the first send: the row reads nothing and shows only show chat"
        more: "the turn row's tails. ' · needs you' (never cut) when the reply of this turn ends in choices that are still live and wait on the person (core/choices.ts liveChoiceKey; the reply's own option lines, which the strip never copies). Else ' · more in the chat' when the turn holds offer slips, host slips or run rows. None of those is ever copied into the strip. luna 2026-11-25, a correction (T-2026-11-25-003 b): this line said '(a question card's choice)'. A question card never drives the tail: it is a card, pinned under the strip and in the stack, and it speaks for itself there. The words were also brought to luna_final 1 (' · needs you', not ' · needs you in the chat')"
        show_chat: "key quiet 'show chat' (--key-h) at the turn row's right end; title 'Show the chat · folds the board; ⌥B reopens it'. It folds the leaf (fold(), trusted presses only), focus goes to #viewport at the latest row. On a board held still with words kept or unsaved changes it does not fold: the leaf says its held line again (as Esc does) and the key's title reads 'Kept open: your words are on this page only'"
      room: "2 rows when the board's room without the strip is 300px or more, else the turn row alone (the you row goes first). The strip never hides, the too-short state included. Room is measured without the strip so the switch cannot flicker. At 1024 × 768 with no pinned cards the board keeps 538 − 53 = 485px (24 + 28 + the 1px rule), over the rail's 472, so the rail stays whole in the common case; a third row would fold it"
      room_measured: "luna 2026-11-25, pass design-foot, proposed, pending the founder (R4). The sum in room is not true of the app: at 1024 × 768 with no pinned cards the board has 419px with a two-row strip, not 485, so the rail is never whole there once the session has a turn (419 + 53 = 472). It draws every tool, line-and-fill, Hand and the percent, with + and − in the percent key's menu (408px needed). The two-row rule itself stands. See heights and heights_measured"
      keys: "Esc in the composer folds the board and leaves focus in the composer (after the slash menu, dictation grace and stop-speaking; never on repeat, IME composition, a modifier or a focused card); on a held board it says the held line. A press on the working key does what show chat does and leaves the step list unfolded in the chat, focus on that working key. Tab stops: the working key (while running) and show chat; the strip is no live region (#turn-say stays the one)"
      mika_review:
        by: "mika 2026-11-24 (atelier-mika), drawn and rendered in specimen-board.html#turn-strip and #turn-strip-review at centres 424 / 680 / 840 (1024 / 1280 / 1440 windows), day and night; proposed, not decided; each item below is Mika's, for Luna and the founder"
        verdict: "approved-with-fixes: the pattern holds (two rows, 53px with its rule, the rail stays whole at 1024 x 768; strip and composer read as one talk band under the board; contrast passes in both themes). Fixes 1-4 before the CSS ships; 5-8 are smaller"
        build: "#board-turn.bd-turn: flex column, padding 0 14px (the composer's and the leaf head's inset), background --sheet, border-top 1px solid --rule, 11.5 / line-height 18px, --ink2; never overflow:hidden (show chat's focus ring sits 3px outside the row). Rows: display flex, align-items center, white-space nowrap, min-width 0; you 24px tall (--ink), turn 28px. The row's text sits in a flex 0 1 auto, min-width 0 box with margin-right 12px; show chat is flex none, margin-left auto. Separators ' · ' and tails are flex none, white-space pre. The message and the reply are flex 0 1 auto, min-width 0, overflow hidden, text-overflow ellipsis, with dir=auto. The time is 10.5 --sec, tabular numerals, flex none. The working key goes in as .trow.role-working, with only the row reset: position static, margin 0, padding 0, max-width none, min-width 0 (the chat's row is absolutely placed and indented 42px with 4/6px padding, 34px tall, so 'unchanged' means the key, not the row)"
        fixes:
          - "1 (high) never-cut words overflow at 1024. At a 424px centre the turn row's text has 301px (about 43 characters). 'local model · ' + ' · stopped: step limit 20' + ' · needs you in the chat' needs 435px: the tail runs under show chat and the reply is 0px wide ('local model ·  ·'). With turn limit alone the reply keeps 12 characters, with needs you alone 10. Fix: (a) ' · needs you in the chat' -> ' · needs you' (the Workshop's word exactly; show chat beside it already says where); (b) a tight row drops, in order, the reply (with the name's separator), then the agent's name, then ' · more in the chat'; the how-it-ended words and ' · needs you' are never dropped. Measure with the strip's own paint (line.scrollWidth > clientWidth), never by a viewport query. The how-it-ended words come from store.ts STOP_LABEL / CLAUDE_RESULT_LABEL (step limit N, budget limit, aborted too, not only turn limit and error), with resultLine's tone"
          - "2 (high) bidi. The message and the reply each get dir=auto (an isolate; HTML gives the span unicode-bidi isolate), and model text goes through displayText() (core/render.ts:34, the contracts sanitizer, Aegis M2), so a U+202E shows as ⟨RLO⟩ and reverses nothing. Without dir an RTL message loses its first words to the ellipsis, and a planted override makes the reply read as something it is not (rendered: 'siht tub · hsilbup mpn nar · devorppa'). The refusal line gets dir=auto too"
          - "3 (medium) the strip's working key. It keeps the chat's ▸ caret and aria-expanded=false, but in the strip it never unfolds; it folds the board and opens the steps in the chat (ruling 6). That state is false (WCAG 4.1.2). In the strip: no caret, no aria-expanded, aria-label '<what it names> · show its steps in the chat'; the title stays its words"
          - "4 (medium) refusals keep their code out. refusalText (app.ts:183) leads with the wire code ('CODE reason  message') until migration batch refusal-copy lands, so 'the first line, verbatim' puts the code in the strip against principle 5. Show the refusal's message (the same words, no second wording). A refused send has no turn, so the refusal takes the turn row beside show chat and the strip is one row; no empty 28px row under it"
          - "5 (low) 'may not have been sent: the connection to the kernel failed' is not a refusal; a ✕ says it did not happen. Lead it with nothing and keep --fail, or ask Luna for the not-sure mark"
          - "6 (low) the held title says the held line's fact in a second wording: 'Kept open: your words are on this page only' beside KEEP_COPY.wordsHeld 'Not connected · your words are kept on this page only'. Use 'Kept open · your words are kept on this page only'"
          - "7 (low) at night in grayscale ' · error' (--fail) reads quieter than the reply (--ink2), and --warn-ink and --ink2 are 1.13:1 in luminance. The words carry the state, so grayscale-holds-hierarchy passes, but the worst end looks the least. Weight 500 on the how-it-ended words fixes it at no cost"
          - "8 (low) before the first send the turn row is an empty 28px band with a key. Acceptable; 'nothing sent yet' in --sec on the left would say why it is empty"
        questions_for_luna:
          - "The agent's name at 400 --ink2 beside 'you' at 600 --ink: the person's own words outweigh the news. Proposed: the name 600 --ink like 'you', the reply staying --ink2 (drawn in #turn-strip-review)"
          - "While a second message waits, the you row shows the queued message and the turn row shows the running turn of the one before it, so the two rows describe different turns. Keep it (it confirms what you just did), or keep the running turn's message and say 'waiting' some other way?"
        contrast: "on --sheet. Day: --ink 16.8, --ink2 13.4, --sec 6.6, --fail 5.5, --warn-ink 7.5, --key-edge 13.4. Night: --ink 15.5, --ink2 12.2, --sec 5.8, --fail 6.8, --warn-ink 10.8. Show chat hovered (--fold): --ink2 10.5 / 10.6. The --rule edge is 1.35 / 1.30, a separator, not a boundary 1.4.11 asks for; the strip is set off by the ground-to-sheet change"
        not_checked: "the strip was drawn statically, not run in the GUI: tab order, Esc from the composer, the trusted-press rule, the 300px switch and focus landing in #viewport are build tests (plan section 4). Targets: show chat is 28px tall and 80px wide, above 24 x 24 (2.5.8)"
      luna_final:
        by: "luna 2026-11-24, decided by Luna, pending founder review: rulings on mika_review. Where these differ from rows above, these win"
        fixes:
          - "1 accepted: the tail is ' · needs you' (the Workshop's word; show chat beside it says where). A tight row drops, in order, the reply (with its separator), the agent's name, then ' · more in the chat'. The end words and ' · needs you' are never dropped. End words are STOP_LABEL / CLAUDE_RESULT_LABEL (core/store.ts:946-948) as the result line says them: stopped: step limit N, turn limit, budget limit in --warn-ink; error in --fail; aborted quiet --sec"
          - "2 accepted: a refused send shows refusal.message (the same words the chat will say once batch refusal-copy lands; never the wire code), in --fail, on the turn row beside show chat; the strip is that one row, with no empty row under it"
          - "3 accepted: 'may not have been sent…' takes no ✕ (it is not known to have failed); it keeps --fail, as the chat row does. ✕ leads only a refusal"
          - "4 accepted: held title 'Kept open · your words are kept on this page only' (KEEP_COPY.wordsHeld's fact, one wording)"
          - "5 accepted: weight 500 on the end words and on ' · needs you'"
          - "6 accepted: before the first send the turn row reads 'nothing sent yet' (11.5 --sec) left of show chat"
          - "Mika 2 (bidi, dir=auto, displayText) and 3 (no caret or aria-expanded on the strip's working key; aria-label '<what it names> · show its steps in the chat') accepted as drawn"
        answers:
          agent_name: "yes: 'Claude' / 'local model' at 600 --ink like 'you'; the reply stays --ink2. Both speakers weigh the same (principle 3: hierarchy by weight), and the news is the reply's words, not the speaker"
          queued_message: "keep it: the you row shows the queued message with 'waiting', the turn row the running turn before it. 'waiting' already says this message has no answer yet, so the two rows read as 'you queued this; it is still on the last one'"
      luna_s14:
        by: "luna 2026-11-25, pass S1.4 P4-design, proposed, pending the founder (T-2026-11-25-003 and s1.4-draft.md L4). Where these differ from the rows and luna_final above, these win. Drawn in specimen-board.html#hand-words"
        sending: "T-2026-11-25-003 (a): REPLACED. Between a send and the turn starting (no turn.sent yet, nothing back, no working item) the turn row reads 'sending' (11.5 --sec, left of show chat, as 'nothing sent yet' is), not 'waiting'. Reason: in this console 'waiting' means something waits on the person ('card waiting', 'loops 1 · 2 waiting', 'nothing waiting'), so alone in the turn row it reads as a call to act. It is also a second fact: 'waiting' on the you row is a message queued behind a running turn; this one is a message on its way. One word per fact. The row then reads in order: nothing sent yet, sending, the working key, the reply. 'waiting' stays on the you row only. No ellipsis, as 'saving' has none. Build: TURN_COPY gains sending; core/board-turn.ts turnStripRows uses it where it says C.waiting for the turn row"
        error_weight: "T-2026-11-25-003 (c): WITHDRAWN after mika's render (R10). 600 was ruled here; rendered at night in grayscale it added 0.7% ink to the word and the two crops could not be told apart, so ' · error' still read quieter than the reply. See error_leads. The fail-tone end words go back to 500, the weight of every end word: a fork nobody can see is not worth a rule"
        error_leads: "luna final (mika R10, her first proposal, taken): a FAILED end leads the row. When the run's end has the fail tone, its words come first, straight after the name: 'Claude · error · I could not finish…', in --fail at 500, the reply after them in --ink2. Place does what weight could not, in both themes, with no new mark. Every other end (the limit words, aborted) stays a tail after the reply. In a tight row the reply goes first as before; the failed end words are never dropped, and when the name goes they lead the row alone. Mika's second choice (the reply in --sec when the turn failed) is not taken: it would quieten the only words that say what went wrong. Build: core/board-turn.ts turnStripRows puts a fail-tone end part before the reply"
        drew: "s1.4-draft.md L4, CONFIRMED with a short form. Once the turn has ended, a tail ' · drew <n> on the board' follows the reply when board rows from a tool surface name this turn in their causes. n is the marks the turn added, counted from the rows and never from the reply. A turn that added nothing and changed, moved or removed its own marks reads ' · changed <n> on the board' (n is the marks it touched). 11.5 --ink2, weight 400: it reads on from the reply as what the agent did. Order of tails: the end words, then drew, then needs you or more. It never shows while the turn runs (the working key has no tails; the foot's count moves instead)"
        drew_tight: "The draft made the whole tail 'never dropped'. Changed: the COUNT is never dropped; the words 'on the board' are. A tight row drops, in order: the reply (with its separator), the agent's name, ' · more in the chat', then ' on the board' (the tail becomes ' · drew <n>'; the strip sits directly under the board, so the place is not in doubt). Measured at a 424px centre (301px of text, about 43 characters at 11.5): 'stopped: budget limit · drew 64 · needs you' is 43 and clears show chat; with the full tail it is 56 and runs under the key. Build: a fourth drop level in core/board-turn.ts (partsAt), on a span of the drew tail. Mika measures it with the strip's own paint. luna final (mika R7, applied as she proposed): that row is not the tightest. With 'stopped: step limit 200' the row ends 3.4px from show chat and a four-digit limit runs under it. So a FIFTH level: the limit words lose 'stopped: ' ('step limit 200 · drew 64 · needs you', 36 characters); the warn tone and the weight still say it ended. Order of drops: the reply, the name, ' · more in the chat', ' on the board', 'stopped: '. The count, the limit's own words, a failed end and ' · needs you' are never dropped. Drawn in specimen-board.html#hand-words"
      luna_final_s14:
        by: "luna 2026-11-25, final pass on Mika's rendered review; proposed, pending the founder"
        R7: "applied: a fifth drop level takes 'stopped: ' off the limit words (luna_s14.drew_tight); the step-limit row is drawn"
        R10: "ruled: a failed end leads the row; the 600 weight is withdrawn (luna_s14.error_leads, error_weight)"
      notice:
        by: "luna 2026-11-26, pass E-design, proposed, pending the founder (s1.4-edit-anything-draft.md 4 'End-of-turn notice', F1; Aegis edit-anything G2, G6 and ruling 5's always-announced line). Where these differ from the rows above, these win. The key is components.undo-key. Drawn in specimen-board.html#undo-notice"
        rows: "Two new row kinds, both 28px (they hold a key) and both the turn row's shape: the NOTICE row and the MARK row. They take the you row's slot and never the turn row's, so the strip is then [notice or mark row, turn row]. With room for one row only (room under 300px) a standing notice still shows and the strip is two rows while it stands: the board gives up 28px. Room is measured without the strip, as before, so it cannot flicker. The turn row and show chat never move: the strip grows upward"
        slot_order: "the mark row while one mark is selected and it has an undoable change; else the newest standing notice; else the you row"
        notice: "One line per agent turn that changed or removed marks of ANOTHER hand, or undid a person's change (F1: a turn that touched only its own marks raises none). Any agent on the board, this session's own included. '<Name> changed 3 · removed 2 of your marks' (aegis G2: changed and removed counted apart, never summed; a zero part is left out: 'Claude removed 2 of your marks'). Moves and restyles count as changed. Then ' · hh:mm' (10.5 --sec, tabular) and, when more notices stand behind it, ' · +<k>' (title '<k> more behind this one'). Keys: undo (the whole turn) and dismiss. 11.5; the name 600 --ink as on the turn row; the counts --ink2, never cut"
        undid: "ALWAYS ANNOUNCED (aegis ruling 5, kept by the founder when H1 and H2 were not adopted): a turn that undid a person's change-set raises a notice whatever else it touched, and these words LEAD the line and are never dropped: 'Claude undid your change' (of a person's action); 'Claude put back what you undid' (of a person's undo). A turn that also touched your marks: 'Claude undid your change and removed 2 of your marks'. Its undo undoes that turn, which brings your change back field by field (aegis H3: the agent's undo rows belong to its turn). The lead is --ink at 500, as end words are"
        others: "A turn that touched other AGENTS' marks and none of yours: '<Name> changed 2 of Mika's marks', or 'of other hands' marks' for more than one. It stands in the slot for six seconds (paused while hovered or focused), then goes, and it is not pinned (G6 pins only sets that touched a person's marks); its marks can still be undone through the mark row. A turn that touched yours and others' counts yours on its face; the others are in title= and spoken"
        stands: "A notice that touched YOUR marks or undid your change STANDS until its undo or dismiss is pressed (aegis G6: the board keeps that set undoable while it stands, at most 8 per board). Newest first; pressing either shows the next. When a ninth would push the oldest out, the oldest leaves and the line under the head says once 'An older change of Claude's can't be undone in one step now'. A notice of this session's own turn stands the same way: the person's next message does not dismiss it"
        stopped: "When the person turns a hand's draw key off while its turn runs and that turn has touched your marks, its notice comes AT ONCE, ' before it was stopped' after the counts ('Claude changed 3 of your marks before it was stopped'), so stopping and undoing is two presses with nothing to wait for (supervision.stop_then_undo). While the turn runs and the hand may still edit there is no undo: the slot may say '<Name> is still changing your marks' with no key (undo-key.state-notes.not-yet)"
        mark_row: "THE UNDO KEY ON A SELECTED MARK. While exactly one mark is selected whose newest change-set is not one of the person's own edits (an agent's turn, or anyone's undo), the slot shows that mark's row with ONE key, scoped to that mark (dim.undo with ids: [its id]): 'Claude changed this mark · 14:20' / 'Claude drew this mark · 14:20' / 'Claude wrote these words · 14:20' → undo; a removed mark of yours (a cut-out, below) 'Claude removed your mark · 14:20' → put back (aegis G2: a removed mark can be put back alone); after the person's own undo of it 'You undid Claude's change to this mark' → redo. The person's own edit as the newest change gives no row: ⌘Z is theirs. Several marks selected: no row. Why the strip and not the mark: no key may stand on a board (rule nothing-on-a-board-is-a-key), and the strip sits directly under the board"
        cut_out: "A REMOVED MARK OF YOURS, while the notice that removed it stands, is drawn as a CUT-OUT where it was: four corner ticks round its last box (1px --sec, arms 6px, 2px outside each corner; host DOM in screen space, never an engine element) and the remover's countermark at its foot. The papercraft reading: a piece was cut out of the sheet here. No fill, no words, nothing between the ticks, so it never reads as a frame, a selection or anyone's mark. A press inside it selects the cut-out (host arithmetic, as hover) and the slot shows its mark row with put back. A box under 12px on the screen draws its ticks on a 12px square round its centre. Cut-outs leave with their notice: undo puts the mark back, dismiss keeps it removed. Hover chip: 'removed by Claude'. Only YOUR removed marks get cut-outs in S1.4; another agent's removed marks come back through the notice's undo, and their cut-outs wait for the history slice"
        own_turn: "This session's own turn: the turn row keeps its tails (luna_s14.drew) and, once the turn has ended with rows on the board, an undo key in its own slot left of show chat (F1: every turn can be undone). When that turn raised a notice, the undo key is on the notice row only, never on both: one place per turn"
        tight: "The notice row's words give way in this order: ' · hh:mm'; the session's name, cut to 5 characters with … and then gone (it stays in title= and in the key's name); ' before it was stopped' becomes ' before stopped'; then ' of your marks' goes (a STANDING notice is always about your marks; the whole line stays in title= and is spoken; a notice about other agents' marks keeps ' of Mika's marks'). Never dropped: the name, the counts, the undid lead, ' · +<k>'. Measured with the row's own paint, as the turn row is. Rendered at a 424px centre the words have about 239px after both keys (about 34 characters): 'Claude changed 3 · removed 2 of yours' (37) does not fit, 'Claude changed 3 · removed 2' (28) does. The turn row gains a SIXTH drop level after 'stopped: ' goes: its undo key leaves the turn row and the turn is undone through its marks (mark_row); show chat stays"
        spoken: "The arrival line (said.arrival) carries the same counts once, at the turn's end: 'Claude in billing-ui added 2 marks, changed 3 of yours and removed 2 of yours'. 'Claude undid your change' is spoken even when nothing else is"
        folded: "While the board is folded a standing notice waits; the edge tab ends ' · your marks changed' (title= has each notice line) and the board slip says nothing new. Nothing pops up"
        never: ["a notice for a turn that touched only its own marks", "changed and removed summed into one number", "an agent's own words in a notice (counts come from rows, names are the host's)", "a notice that touched your marks leaving on its own", "a toast, an alert or a card for it", "a key on a cut-out or anywhere on the board"]
    hands_foot:
      by: "luna 2026-11-25, pass S1.4 P4-design, proposed, pending the founder (s1.4-draft.md 4.3, L3, F3). Drawn in specimen-board.html#hand-grant"
      lists: "'you <n>' first and always. Then one hand for each ATTACHED session's agent, whether it has drawn or not: seal, name, mark count, and its draw key (components.draw-grant). Then hands that have marks here but whose session is no longer attached: seal, name and count, no key (there is nothing to set). Then 'unknown hand <n>' with its hollow pin, no key. A claimed sub-agent has no key either: the setting is its session's"
      order: "By when the session attached, oldest first, and it never changes while the board is open: not by mark count and not by first mark (core/board-overlay.ts footHands orders by first mark today). Reason: a key that moves under the pointer gets pressed by mistake, and an agent must not be able to move one by drawing. Counts are tabular numerals. aegis, bound: every count, 'you' included, sits in a fixed slot 4 characters wide, so a count going from 9 to 1 000 leaves every key's box where it was. A count over 999 reads '999+' with the whole number in title="
      height: "32px, as shipped (styles.css .bd-foot), which holds a --key-h key with 2px above and below. Text stays 10.5 --sec; the keys are 11.5 like every key. Hands 16px apart, a hand's parts 6px apart; no box round a hand, no rule between hands. mika R3, applied: the foot clips SIDEWAYS ONLY (overflow-x: clip; overflow-y: visible). A key's focus ring stands 3px out and needs 34px; with overflow hidden its top and bottom strokes were cut. The overflow measure (scrollWidth over clientWidth) still works. The key stands 8px after its count"
      overflow: "CHANGED from '+<k> more' as plain text with every hand in title=. A hand's draw key must never be out of reach. In order: (1) the session's name (author-seal.session_hint) is cut with …, down to 5 characters; (2) mika, applied: after that floor the name goes entirely (it stays in the seal's accessible name and the key's name) before any key is cut; with fixed count slots that is what happens at a 1024 window as soon as a second hand exists; (3) hands that still do not fit, from the last, go behind a key quiet '+<k> ▾' (accessible name '<k> more hands'). mika R4, applied: that key opens the leaf's own menu (.bd-menu, ui/board-leaf.ts menuOf, as the rail's ⋯ and zoom menus), UPWARD over the board, its right edge on the key, inside the leaf, in the DOM right after the key; never downward, where the turn strip, the pinned cards and the composer are (rule board-centre-only). One row per hidden hand: seal, name, ◇ session, count, and 'may draw' or 'may not draw' at the row's right end. A row is pressed like the key and has the key's states: its accessible name is the key's sentence, it shows the working mark while pending, and it is aria-disabled while the link is down (the '+<k> ▾' key still opens then, so the hands can be read). Opening the menu leaves focus on the '+<k> ▾' key (aegis); ↓ moves into the rows, Esc closes it and returns focus to the key, Tab leaves it. The menu stays open after a press so the confirmed words are seen. 'you' and the first attached hand are always in the foot"
      a11y: "The foot keeps aria-label 'Hands on this board'. Each hand's seal has the name as its accessible name (with the session when it is shown). Tab order: after the board, each draw key in order, then the '+<k> ▾' key, then on to the turn strip. The foot itself takes no focus"
      link_down: "FINAL (aegis C3.3, a conflict in this record, resolved): 'held still' here means held by the LINK or by a mismatch only. A board that is too short is held still for its own reason and its draw keys WORK (too_short.aegis C3_3). While the board is held still by the link or a mismatch (not connected, reconnecting, or out of date) every draw key is aria-disabled and says why in its title; the counts stay as last known. See components.draw-grant.states.link-down"
      gives_way: "luna 2026-11-25, pass design-foot, proposed, pending the founder (L2). The check (check below) is in this foot and gives way FIRST and WHOLE: before a session's name is cut, before a name goes, before any hand goes behind '+<k> ▾'. Then the order in overflow. Reason: a draw key must never be out of reach, a session's name is what tells two Claudes apart, and the check is a status that has a second home. P4b-3 built the opposite (the hands gave way to the check): right while the hands carried no key, reversed from the pass that gives them one. mika, measured in the rendering of this pass: 'you' with its slot is 64px, a hand with its name, slot and key 230, without its name 186, '+1 ▾' 46, the check 183 at its longest usual words, gaps 16. So: at a 1024 window (394px of foot) one agent leaves 84px (68 after the gap; the check needs 189) and it is not in the foot; two agents is 'you', one hand and '+1 ▾', full. At a 1280 window (650px) one agent leaves room and the check is whole; two agents with their sessions' names fill it and the check is not in the foot. Drawn in specimen-board.html#foot-check"
      narrow: "luna 2026-11-25, pass design-foot, proposed, pending the founder (L7). In a leaf under 340px (Decide at a 1024 window: 303px, 273 of foot) 'you' and the first attached hand with its name need 310px. There the first hand's NAME gives way and its seal, count slot and draw key stay (266px); the name is in the seal's accessible name and in the key's sentence, and the seal's letter is still read. A second hand goes behind '+<k> ▾' as recorded; there is room for that key only when the first hand is behind it too, so with two or more agents at this width the foot is 'you' and '+<k> ▾' and every hand is a menu row (the one exception to overflow's 'the first attached hand is always in the foot'). The check is not in the foot at this width once an agent's hand is"
    said:
      by: "luna 2026-11-25, pass S1.4 P4-design, proposed, pending the founder (s1.4-draft.md 5, L4). The lines an agent's drawing makes the leaf say. All through the leaf's one say path (ui/board-leaf.ts say); names through boardAgentName, and the label 'claude' is shown as 'Claude', the turn strip's word. Drawn in specimen-board.html#hand-words"
      arrival: "CONFIRMED: '<Name> added <n> marks' ('Claude added 3 marks'; 'Claude added 1 mark'). One line per agent turn, when the turn ends, never per row. A turn that also changed or removed its own marks: 'Claude added 3 marks, changed 2 and removed 1' (changed counts restyled and moved marks; a part that is zero is left out; a turn with no adds leads with what it did: 'Claude changed 2 marks'). Nothing is said when nothing landed (every op refused: that is a count row and gnomon dim stats, never the leaf). SPOKEN ONLY: it goes to the leaf's polite status line (the sr-only role=status), not to the keep line. Sighted, the same news is the marks themselves, the foot's count and the strip's tail; three signs are enough, and the keep line stays the person's own (saved, not saved). Folded board: nothing is said; the edge tab counts"
      removed: "REPLACED, to fit: 'Claude removed the mark you were moving' (the draft: 'Claude removed that mark while you were moving it'). Same fact, 39 characters for 49. The leaf's line is one row and holds about 62 characters at a 1024 window; with a session's name in it (author-seal.session_hint) the draft's line is cut off there and this one is not ('Claude in billing-ui removed the mark you were moving'). A resize, a restyle or a text edit in hand reads '… the mark you were changing'. Said at the drop, shown in the keep line for six seconds and spoken once, as a refusal line is; it is not a refusal: no ✕, no --fail. The mark simply leaves; nothing is rolled back and nothing else is lost. mika, applied: in every said line a session's name is cut at 16 characters with …, as it is in the foot; a 22-character name overflowed the line at a 1024 window"
      grant: "The draw key's lines are components.draw-grant.words"
      never: ["a line per row or per mark", "an agent's own words in any of these lines (the name is the host's label, the count is from rows)", "the words error, failed or conflict for a mark an agent removed", "a toast for any of them (they are the leaf's, and a toast would sit over the board)"]
      undo:
        by: "luna 2026-11-26, pass E-design, proposed, pending the founder. What the line under the head says once an undo key's press is answered: a said line for six seconds (keep_words.precedence.said), spoken once. Stated lines: the fact first, at most 40 characters, the rest after ' · ' (keep_words.fact_first)"
        done: "'Undid Claude's turn' · 'Undid Claude's change to this mark' · 'Put back your mark' · 'Put back Claude's mark' · 'Redone · Claude's changes are back'. With author-seal.session_hint: 'Undid Claude's turn in billing-ui'"
        partial: "'Undid Claude's turn · 2 marks changed since were left as they are' (the draft's words, kept; one: '1 mark changed since was left as it is'). skipped.gone: '1 mark removed since stays removed'; skipped.refused (today's board would refuse it: a secret, a colour too faint): '1 mark couldn't be put back'. Parts in that order, joined by ', ': 'Undid Claude's turn · 2 marks changed since were left as they are, 1 couldn't be put back'. Cut from its end, whole in title= and spoken"
        more: "'Undid part of Claude's turn · undo again for the rest' (the answer said more: the key stays 'undo'; one press is one call)"
        expired: "undo-expired: 'Too old to undo in one step · change the marks by hand'. The history to step back through is not built yet, so the line does not name it; when the scrub ships it adds ' or step back through the history'. The row that offered it leaves"
        nothing: "undo-nothing: 'Nothing to undo · the marks are already as they were'. The row leaves"
        busy: "a busy refusal: 'Not undone · the board was busy; press undo again'. The key stays"
        other: "undo-set-bad, undo-not-allowed or any other refusal: 'Not undone · nothing was changed'. The row is drawn again from the rows"
        pushed_out: "'An older change of Claude's can't be undone in one step now', said once when a ninth standing notice pushes the oldest out (aegis G6)"
        never: ["the words error, failed, conflict, revert or rollback", "a wire code, a seq or a row count", "a toast for any of them"]
      changed_since:
        by: "luna 2026-11-26, pass E-design, proposed, pending the founder (s1.4-edit-anything-draft.md 4 'Two agents on one mark'; founder F4: base is optional). Drawn in specimen-board.html#changed-since"
        ruling: "CONFIRMED: when an agent's edit is refused changed-since, NOTHING shows to the person: no line, no sign, no count, no toast. The board is as the other hand left it, which is what the person sees. The refusal is the agent's (its tool answer and its next view) and is counted where every refused op is (the count row, gnomon dim stats). Why: a refused op changed nothing, so there is nothing to watch or undo; a line would put a conflict on the leaf in the one case where a change was protected; and the leaf's lines are the person's (said.never). Without base, the last writer wins and its change shows a countermark like any other"
        not_this: "The person's own gesture is never refused changed-since (dim.op sends no base). An agent REMOVING a mark the person holds is said.removed. An agent CHANGING a mark the person holds is a BUILDER QUESTION for E3: does the drop write only the fields the gesture changed? Until that is answered, 'Claude changed the mark you were moving' is said at the drop, like said.removed, and the countermark stays"
    supervision:
      by: "luna 2026-11-26, pass E-design, proposed, pending the founder (s1.4-edit-anything-draft.md 4; Aegis edit-anything ruling 6). Several agents (Mika and Luna, say) on one board while a person watches and supervises. Only what S1.4 builds. Drawn in specimen-board.html#supervise"
      who_is_where: "The hands foot as recorded (hands_foot: attach order, fixed count slots, each attached session's agent with its draw key, '◇ <session>' when two would read the same, '+<k> ▾' when full). A hand's count stays the marks it ADDED; it does not move when that hand changes another hand's marks, so the counts stay a census, not an activity meter, and no hand can move a key by working"
      as_it_lands: "As a hand's rows land, its marks come with their signs: its own marks dashed, its seal on hover; another hand's marks it changes gain its countermark or words sign at once (author-seal.other_hands), not at the turn's end. Hovering any mark names every hand in it. No motion is added (motion-on-events-only: the mark's own change is the event)"
      at_the_end: "At each agent turn's end: the spoken arrival line per hand (said.arrival, with the counts of other hands' marks) and, when the turn touched another hand's marks or undid a person's change, its notice (turn_strip.notice). Two agents ending together raise two notices, newest first, ' · +1' on the first"
      stop_one: "Stop one hand: its draw key, one press, to 'may not edit' (components.draw-grant). The others keep editing. Undo does not stop a hand (F7), and stopping undoes nothing"
      stop_then_undo: "Stop, then undo: turning a hand off while its turn runs brings that turn's notice at once (turn_strip.notice.stopped), and its undo undoes what the turn wrote so far. Undo is field by field, so anything another hand changed afterwards is left as it is and said (said.undo.partial): undoing Mika's turn never takes back Luna's later work on the same marks. Each of Mika's turns is its own notice and its own press"
      waits: "Waits for the history and scrub slice, named here so nobody builds it as a one-off: a list of every turn of one hand; undoing an older turn without first dismissing newer notices; 'undo all of Mika's turns since 14:00'; per-hand filters; stepping the board back to an earlier point; cut-outs for other agents' removed marks and for dismissed notices; who changed a mark before its newest other hand; the ping-pong advisory; soft locks"
    entry: ["/board (reopens this session's last dimension)", "chat header ⋯ → Open board (⌥B: reopens or folds a board this session already has; see key_open)", "Open on a board offer slip (pointer, or with focus in the slip)", "a row of the Dimensions list (components.dimension-list: the head key's menu, /boards, ⌘K dimensions: list)"]
    esc_order: "Esc leaves a text edit or returns to Select first, then closes the tray, then folds the leaf to its edge tab; focus returns to what opened it. Esc never reaches the board while a card is focused. design-foot: an open leaf menu (the rail's, the hands', the Dimensions list) takes Esc before any of these: it closes, focus returns to its key, and the leaf stays open."
    focus: "mika: opening the board by /board, ⌥B, the ⋯ menu, a Dimensions row or a slip's Open moves focus to the board (the canvas), so the letters on the empty note work at once. Exception: while a card is focused the board opens yielded and focus stays on the card. Folding returns focus to what opened it; when that is gone, to the composer."
    tab_order: "mika: head (rename, Dimensions, esc) → rail (one stop) → board (one stop; arrow keys and letters act inside) → then on to the pinned cards and the composer. Tab and Shift+Tab always leave the canvas: the engine must not trap them (text editing included: Esc ends the edit, then Tab moves on). The foot and the empty note take no focus; the note is the board region's aria-description."
    interrupted: "mika: fold while editing text: the text is kept as typed (committed), then the leaf folds. Fold with the tray open: the tray closes with it and is closed on reopen. Session switched while open: the leaf follows the session (its own board, or none). A custom colour typed and not yet valid when the tray closes: dropped, never applied. Rename open when the leaf folds: cancelled, as rename-btn does elsewhere."
    key_open: "aegis: ruling 7, with mika's check of the bindings. ⌥B is handled by the desk, never by the board bundle. It matches event.code === 'KeyB' with Alt alone (no Meta, Ctrl or Shift) and calls preventDefault: on a Mac ⌥B otherwise types ∫ into the composer, and event.key is '∫', not 'b'. It reopens or folds the board this session already has, from anywhere on the desk, the composer included. It never moves focus off a focused card (the board then opens yielded), never accepts a live offer unless focus is inside that slip, and does nothing when the session has no board (no toast: the ⋯ menu row is disabled with title 'This session has no board yet'). No binding in packages/gnomon-gui/src uses Alt alone today (app.ts:4385-4438 binds `, ⌘K, ⌘,, ⌘N and Esc; the voice app's chords are all ⌃⌥)."
    edge_tab: "The loops-leaf edge tab (.lp-edgetab). When the Loops tab is also folded the board tab sits 8px under the Loops tab's bottom edge, whatever its height (in review: '56px down' overlapped a long Loops tab); alone, it takes the Loops tab's place at 48px. '<title> · board', and '<title> · board · <agent> +<n>' when marks were added while folded. The title is cut at 24 characters with … in the tab; the whole title is in title= and the accessible name. luna 2026-11-25 (S1.4): when more than one agent hand added marks while it was folded the tab reads '<title> · board · +<n>' with the total, and each hand with its session and count is in title=; two hands named 'Claude' side by side in a 24px tab would say nothing."
    states: [loading, open, arriving, empty, yielded, failed, folded, too-short]
    state-notes:
      too-short: "design-foot: see too_short. No rail; the board shown and held still; the foot kept; the line in ink"
      empty: "one pinned paper note at the board's centre (the scrap look, paper swatch, plain pin): 'Nothing drawn yet' (13.5/600), then 'N for a sticky · T to write · or pick a tool and draw.' and, from S1.4, 'Ask in the composer and this session's agent can draw here too.' It is host DOM with pointer-events none, takes no focus, has no key, and leaves at the first mark. Not the empty-state sheet: that one carries a primary key. mika: agreed, rendered: empty-state is the centre's 'No session open' sheet with + New session, and a board holds no key (rule nothing-on-a-board-is-a-key); the note borrows the scrap, which is the board's own device. The key hints on it are true only because opening moves focus to the board (focus, below)."
      yielded: "while a card is focused (document.activeElement is inside a .card in the stack or the pinned zone) the board takes no keyboard input: board-rail draws yielded and the keep line is replaced by '◆ A card has the keys · click the board to draw' (ink, 500; the ◆ in --ink). In review: the first wording measured 472px against 394px of line at a 1024 window, and its amber ◆ broke principle 1 (this is a status, not a warning). The waking press must be trusted (isTrusted), only moves focus to the board and draws nothing, on the canvas and on a rail key alike (aegis: ruling 7); deciding the card or moving focus into the leaf with Tab ends the state too. No programmatic focusCard runs while a board text edit is active (aegis: ruling 7), so a card arriving mid-word cannot take the next keystroke."
      loading: "mika: owed since the S1.0 review (findings 4 and 5). The engine chunk and its stylesheet load on first open. The head draws at once; the line under it reads 'opening the board…'; the rail draws with every key disabled and no letters; the board is the bare desk. Nothing of the engine paints before its stylesheet has loaded. Under 300ms nothing but the head shows (no flash)."
      failed: "mika: the chunk did not load, or the engine stopped after mounting. One pinned paper note at the board's centre (the empty note's look): 'The board didn't open' (13.5/600), the cause in plain words, then 'next: Try again, or Esc to go back to the chat'. The key is in the head, where keys live: 'Try again' (key quiet) takes the place of Dimensions ▾. It retries the whole load (a failed stylesheet is removed first). No code and no engine text on the note; both go to the raw view. Marks already saved are never lost by this state: they are op rows."
      open_items: "mika, for Arky and Luna before S1.3: (1) what the leaf shows when the kernel link drops while a board is open: are marks queued or refused, and where the line 'not saved' goes (the line under the head is the candidate); (2) optimistic rollback (S1.3): a mark that the mod refuses leaves the board, and the refusal is a toast naming the field, never a silent vanish."
    never: ["cover the sessions rail, the stack, the header, the alerts band, the Workshop, the pinned cards or the composer (zones.centre.never, G-DDL-08)", "hold a decision key, a card, or anything drawn as a key inside the board", "open by itself: an agent raises it only through an offer the founder opens", "the engine's own toolbar, menus, welcome screen, library, help, zoom island or hand-drawn font (G-DDL-07)", "the engine's violets (aegis: ruling 8: a family, not one hex: #6965DB, #5B57D1, #5753D0, #4A47B1, and #A8A5FF in its dark theme beside night state.knot #A79CFF): selection, multi-select, handles, guides, the binding highlight and the text caret draw in --ink / --key-edge", "the engine's phone layout: the board is 374px wide at a 1024 window, under the width where the engine switches to it (S1.0 review finding 7); the host owns the layout at every width"]
    widths: "Desktop only. mika, measured in the real .desk grid (styles.css:219): at a 1024 window the columns are 260 / 424 / 340, so the leaf is 424px and the board 374px, not the 620px of the specimen's desk mock or the 'about 470' first written here. Nothing in the leaf wraps. Head: '› board' goes when the head is under 520px (it stays in the title's title=), then the title truncates with …; the keys never shrink. Line under the head: one line, truncated from its end with …, whole text in title= (the project and the session stay; 'opened from' and the time go first). Foot: hands that do not fit become '+<k> more' with every hand in title=; 'you' is always first. The working line truncates and its key never wraps. Drawn at 424px in specimen-board.html#leaf 'At a 1024 window'. The transcript margin rail from the early read (.paradigm/research/gnomon-canvas/luna.md §1) does not fit at 1024 and waits for the board layout preset."
    heights: "luna 2026-11-25, pass design-foot, proposed, pending the founder (R4): CORRECTED to the app as mika measured it (s1.3-p4b3-mika-review.md 6: the dev preview over the fake kernel, day, page visible, turn strip showing; night is 2px less). It replaces 'a 1024 × 768 window with no pinned cards gives the board 538px; with two pinned cards 304px, and a 640-high window with one card gives 308px', which predated the turn strip (53px with two rows, 29 with one) and counted the foot as 29 (it is 32). The whole rail needs 472px and is never drawn at 1024 × 768 once the session has a turn: 419 + 53 is exactly 472. The table is heights_measured. A board under 230px is an ordinary case (three of the nine preset and window pairs), so the rail folds on down (components.board-rail.fold) and the leaf is too short only under the tight rail's own need (too_short). The wrapper's minimum window is 640 × 400 (gnomon-wrapper/src/main.rs:282), so too short is reachable"
    heights_measured:   # mika 2026-11-25, the real app; board = the height the rail and the canvas share
      - { window: "1024 × 768", preset: Desk, pinned: 0, board: 419, rail: "all eight tools, line-and-fill, Hand, the percent (+ and − in its menu)" }
      - { window: "1024 × 768", preset: Desk, pinned: 1, board: 248, rail: "Select, Sticky, Text, ⋯" }
      - { window: "1024 × 768", preset: Desk, pinned: 3, board: 224, rail: "Select, Sticky, ⋯" }
      - { window: "1280 × 800", preset: Desk, pinned: 1, board: 292, rail: "Select, Sticky, Text, Rectangle, ⋯" }
      - { window: "1280 × 640", preset: Desk, pinned: 1, board: 156, rail: "tight: Select, ⋯" }
      - { window: "1024 × 768", preset: Focus, pinned: 1, board: 324, rail: "five tools, ⋯" }
      - { window: "1280 × 800", preset: Focus, pinned: 1, board: 356, rail: "six tools, ⋯" }
      - { window: "1280 × 640", preset: Focus, pinned: 1, board: 220, rail: "Select, Sticky, ⋯" }
      - { window: "1024 × 768", preset: Decide, pinned: 1, board: 228, leaf_width: 303, rail: "Select, Sticky, ⋯" }
      - { window: "1280 × 800", preset: Decide, pinned: 1, board: 273, rail: "Select, Sticky, Text, Rectangle, ⋯" }
      - { window: "1280 × 640", preset: Decide, pinned: 1, board: 137, rail: "none: too short (too_short)" }
    too_short:
      by: "luna 2026-11-25, pass design-foot, proposed, pending the founder (L6). Drawn in specimen-board.html#too-short"
      floor: "140px of board: the tight rail's own need (components.board-rail.fold). ONE number, taken from the rail's model (core/board-leaf.ts BOARD_MIN_HEIGHT follows core/board-rail.ts railNeed of the tight layout), never a second constant. It was 148, which left 140 to 147px unusable for no reason"
      shows: "REPLACES 'it keeps its head and one line and nothing else', which in the app was a head, a line and 169px of blank ground (Decide at 1280 × 640 with one pinned card: 137px). Under the floor there is no rail and the board is still SHOWN, held still: the LOOK the leaf has while the link is down, for a reason of its own (FINAL, aegis C3.3 and mika: never through setInert, which is the dock's one slot for link-down and out-of-date; too short is its own flag that yielded() reads). The wheel and a pinch still pan and zoom, nothing is drawn, no key reaches the engine, and a press on the board says the line again. The canvas takes the rail's 48px too. The FOOT STAYS, so the hands, the draw keys and the check stay where they are (aegis: a stop is one press). The head's keys all work. Under 56px of board the body is not drawn at all: head, line, foot"
      line: "'No room to draw · decide a card or make the window taller', in ink (keep_words). FINAL (mika): with NO card pinned (a 640 × 400 window is too short with none) it reads 'No room to draw · make the window taller': a line never names a move that does nothing. The dock passes the pinned count to the leaf. While typed words are held (aegis C3_2) it reads 'No room to draw · your words are kept on this page'. It replaces 'The window is too short to draw here · make it taller, or decide the pinned cards': 81 characters, cut at every leaf under 540px, with the commoner way out (decide the card) last"
      why: "In Decide the person is deciding a card with the board beside it; what they need from a 137px board is to see it. A blank leaf over the chat gives them neither the board nor the chat"
      aegis:
        by: "Aegis 2026-11-25, s1.3-p4b3-design-aegis-ruling.md 3: ACCEPTED WITH CONDITIONS. The board's height changes with no act of the person (a pinned card arrives, the turn strip goes from 29 to 53px), so an agent can put the board into this state mid-word. Each line is a test"
        C3_1: "keys typed across the change reach nothing: not the engine, not a card's decision keys, not the composer. Focus is not moved by the page. Real-input test: type while a card arrives; no card is decided and no composer text appears"
        C3_2: "an open text edit is never dropped silently and never sent on a stamp made without a trusted event. It is committed on the still-valid stamp of the gesture that began it, or held on the page (the typed() / putTyped path), said under the head ('No room to draw · your words are kept on this page'), and given back on a trusted press when there is room ('Your words are waiting · T, then click, gets them back'). No line says 'saved' for held words"
        C3_3: "too short is its OWN inert reason, never link-down. Under it the draw keys work (to stop an agent at the least), Esc and the esc key fold, rename and Dimensions work. Resolves the conflict with hands_foot.link_down"
        C3_4: "line precedence: out-of-date, then the link-down and not-saved lines, then too short (keep_words.precedence). Pending batches still settle and are said while too short"
        C3_5: "a drag or a stroke in hand at the change ends cleanly: rolled back or stored, and said ('That change wasn't kept · the board is as it was')"
        C3_6: "crossing the 140px floor back and forth (a turn strip row coming and going) loses nothing, and the line is spoken once per entry, never again within 1.5 seconds of the last time"
      chose: { what: "show the board, held still", over: "one more fold step: a three-key rail (the tool in hand, ⋯, the percent; 108px) with line-and-fill as a row of ⋯", why: "the tray hangs from the line-and-fill key and would need a second anchor; a 108px strip is too thin to draw on with care; held still is a state the leaf already has. For the founder if he wants to draw in Decide at 1280 × 640" }
    check:
      by: "luna 2026-11-25, pass design-foot, proposed, pending the founder (L2, L3). The check: what this page's fold of the board was compared with, as the mod vouches for it. P4b-3 moved it from a hover title to the foot; this rules its words and where it goes when the hands need the foot. Drawn in specimen-board.html#foot-check and #dimension-list"
      words:
        latest: "checked up to the last change"
        behind: "checked up to <k> changes ago (k = 1: 'checked up to 1 change ago'). k is the number of THIS dimension's rows the page holds with seq above the checked point: every row kind (a mark, a rename, an attach), never seq minus checkedSeq (aegis C1.1, C1.2). Over 999 reads '999+'"
        behind_uncounted: "checked up to an older change. FINAL (mika C2): it was 'an earlier change', 195px, which did not fit a 303px leaf with your hand only. Said whenever the point is not the latest and a count would not be true: the page holds only part of the dimension (aegis C1.6), or a change of the person's is not stored yet or typed words are held (aegis C1.4)"
        empty: "nothing to check yet (the board's log holds no row that makes, changes or removes a mark). Never while the board is unchecked: a page that has not compared the rows cannot say the board is empty (aegis C1.5)"
        unchecked: "not checked yet"
        mismatch: "doesn't match the saved board (in --fail). What to do is the keep line's: 'This board is out of date · fold it and open it again'"
      number: "REPLACES 'Checked up to change <N>[ of <M>]' and 'Did not match at change <N>'. N is the log's row number, not this board's: a new empty board read 'you 0' beside 'Checked up to change 79', and on a daily driver N reaches seven digits (246px, cut off at a 303px leaf). No number is on the face. The point is still named, in the person's terms: the last change, or how many of this board's changes ago. The row numbers stay in the raw view and, as an extra, in the line's title=. FINAL (aegis C1.7): the title reads 'log row 79; this board's latest is row 81', because the numbers are the log's"
      case: "lower case, 10.5 --sec: it is a quiet readout of the foot, like 'you 5' (rule quiet-lines-are-lower-case). No box, no fill, no glyph, no pill"
      place: "The right end of the hands foot (margin-left auto). FINAL (mika C2): whether it is there is decided by THE HANDS ALONE, never by what it says now: it is in the foot when its longest wording (189px, '999+ changes ago') and its 16px gap fit after everything the hands need (hands_foot.gives_way), and otherwise it is not, whatever its words. So it never appears when the board is unchecked and vanishes when it is checked. It is never cut with … and has no short form; its words are 95 to 189px wide (the first record said 183). When it is not in the foot the leaf shows its two signs (signs, below). Its second home, at every width and whether or not it is in the foot, is the open board's row of the Dimensions list (components.dimension-list, row 'open here · <the check>'), which focus and a press reach. Never a hover title again (hover-has-equivalent)"
      mismatch_shown: "superseded by signs.mismatch (FINAL): 'in ink' was not enough. mika, rendered: at 303 and 424px with an agent in the foot the mismatched leaf differed from a healthy one by one 10.5px line going from --sec to --ink, and looked exactly like 'Reconnected'"
      signs:
        by: "luna 2026-11-25, design-foot FINAL, after mika's rendered review (s1.3-p4b3-design-mika-review.md) and aegis's ruling (s1.3-p4b3-design-aegis-ruling.md); proposed, pending the founder. What the leaf itself shows, without hover and without a menu, when the check is not passing. Drawn in specimen-board.html#foot-check and #keep-words"
        mismatch: "mika C1, applied in the form she proposed (her Q2). The out-of-date line under the head draws its FACT, 'This board is out of date', in --fail at weight 500, and the rest (' · fold it and open it again') in ink. --fail on --sheet is 5.45:1 by day and 6.82:1 at night. One rule at every width: the failed colour on the leaf means the board does not match. The words carry it in grayscale. No stated line that passes (Reconnected, Not saved · reconnecting) is ever drawn this way. It outranks every other standing line (keep_words.precedence). The foot's 'doesn't match the saved board' in --fail is there too when the hands leave room, and the Dimensions row says it always"
        unchecked: "aegis C2.2, ruled. While the board is open, unchecked (verified is null) and the check is not in the foot, the line under the head LEADS with 'not checked yet · ' and then goes on as it would have: before the quiet keep line in lower case and --sec ('not checked yet · dimension in ■ a-paradigm · …'), and before a standing stated line with a capital and in ink ('Not checked yet · No room to draw · …', 'Not checked yet · ◆ A card has the keys · …', and the two lines about missing marks). A lead is never cut: the line is cut from its end. Not on the out-of-date line (it says more) and not on the link-down lines (nothing can be compared until the link is back; the lead returns with the quiet line). It leaves when the check has a point. When the check IS in the foot, the foot says it and there is no lead. Why the line under the head: it is the one place on the leaf with 95px free at every width; the foot has 7px at 303 with one agent, and making the hands give way to this one wording would move a draw key when the state changes"
        passing: "mika Q1, answered: when the check passes and is not in the foot, nothing on the leaf points to it. Absence claims nothing (aegis: the passing forms vouch for a past point only), and a pointer on every healthy board is noise. A person never has to find the row to learn of a problem: both problems are said under the head. The row is for the person who wants the point"
        never_implied: "aegis C2.3, bound. No line on the leaf implies a check while the check is absent or not passing: 'Reconnected · everything here is saved' reads 'Reconnected' while verified is null or false, and no line says 'checked', 'whole' or 'up to date' but the check. The leaf keeps data-check and its tone on its root whether or not the line is drawn"
      build: "core/board-leaf.ts checkLine takes the count of this dimension's held rows after checkedSeq (a new store call, rowsAfter(dim, seq): nothing exposes it now; the open dimension is pinned, so its rows are held), whether any is a mark row, whether the dimension is partial, and the pending and unsaved counts; CHECK_COPY holds the words. ONE function gives the foot and the Dimensions row the same string (aegis C2.4). ui/board-leaf.ts drawFoot lays out the hands first and then asks whether 189px and the gap fit (measure with the foot's own paint, a hidden probe of the longest wording). styles.css .bd-check stays flex none; mika's R1 of the build review (ellipsis on the check) is superseded: a check that would be cut is not drawn"
      aegis:
        by: "Aegis 2026-11-25, s1.3-p4b3-design-aegis-ruling.md 1 and 2: the words and the place ACCEPTED WITH CONDITIONS. Each line is a test of the build"
        C1_1: "k is the count of this dimension's rows the page holds with seq > checkedSeq; never seq − checkedSeq. Test: rows of another dimension between the point and the head do not change k"
        C1_2: "k counts every row kind. Test: a rename or an attach after the point reads '1 change ago', never 'the last change'. (mika asked for mark rows only, so an attach would not read as a change; not taken: with marks only a rename after the point would give 'the last change' falsely, and an attach IS a change to the dimension)"
        C1_3: "'checked up to the last change' only when verified is true and checkedSeq equals the dimension's latest seq"
        C1_4: "never 'the last change' while a change of the person's is pending or unsaved, or typed words are held: then 'checked up to an older change'. The confirmed fold does not hold the unstored mark that is on screen"
        C1_5: "precedence: verified false (mismatch), then verified null or checkedSeq null ('not checked yet'), then empty, then latest or behind. 'nothing to check yet' never while verified is null"
        C1_6: "a partial dimension shows only 'checked up to an older change' or the mismatch; never a count, never 'the last change'"
        C1_7: "title= reads 'log row <N>; this board's latest is row <M>'"
        C2_1: "a mismatch at 303px and at 424px with an agent's hand in the foot, in the too-short and the yielded states: the out-of-date line is present without hover, its fact in --fail (signs.mismatch, keep_words.precedence)"
        C2_2: "open, verified null, the check not in the foot: the lead 'not checked yet · ' is on the line under the head (signs.unchecked). Test a resumed session: the in-page map is empty until the next open or close answer, and the lead stands for all of that time. If the builder shows the state cannot persist, the lead stays as ruled and is simply rare"
        C2_3: "signs.never_implied"
        C2_4: "the foot and the Dimensions row use checkLine and give the same string; the row's words change in place while the menu is open; the row is readable while the link is down and while the board is too short"
        C2_5: "the foot does not start giving way in a build where the second home does not exist: the palette row's check ships in the SAME change as the foot's new rule"
        C2_6: "binding on S1.4, not on this pass: an agent's rows reach this page through the log, so nothing vouches for them until a hash point exists at or after the last row of each agent turn. Until then the marks a person watches arrive are the unchecked ones and the check reads behind. For the S1.4 spec"
      luna_final:
        by: "luna 2026-11-25, design-foot FINAL, after mika's rendered review (s1.3-p4b3-design-mika-review.md) and aegis's ruling (s1.3-p4b3-design-aegis-ruling.md); proposed, pending the founder"
        second_home: "mika WITHDREW the hands menu and agrees that the open board's row of the Dimensions list is the check's second home; chose[0] is no longer an open disagreement. It holds 'always' only with dimension-list luna_final D1 and D3"
        C2: "applied: the hands alone decide (place); 'an older change'; the range 95 to 189px"
        k: "changed from mika's should-fix: every row kind is counted (aegis C1.2), not mark rows only"
      chose:
        - { what: "when the check does not fit, its home is the open board's row of the Dimensions list", over: "mika's recommendation: a short form first, then the last row of the '+<k> ▾' hands menu", why: "the hands menu exists only when a hand is hidden. At a 1024 window with one agent, the common case from S1.4 on, no hand is hidden, 68px are left and the check needs 189: there is no menu to hold it, and a key added to open one has no room at 303px. The Dimensions key is in the head at every width. mika, final: agreed, the hands menu is withdrawn. Still for the founder to see: the list is a less obvious place to look for a passing check than the foot" }
        - { what: "the point named in words", over: "the log's row number, or no point at all", why: "the number is not this board's and means nothing to a person; 'checked' alone is the bare 'verified' aegis ruled out" }
    keep_words:
      by: "luna 2026-11-25, pass design-foot, proposed, pending the founder (L4, mika R2). The words of every line that stands under the head. core/board-leaf.ts KEEP_COPY, INERT_COPY and LEAF_COPY follow this; where a line here differs from the code, this wins. Drawn in specimen-board.html#keep-words"
      case_and_colour: "ONE rule (rule quiet-lines-are-lower-case). A QUIET line is a readout: lower case, --sec, weight 400: the usual keep line ('dimension in ■ a-paradigm · …') and the three passing states. A STATED line takes the keep line's place to say something happened or is so: a sentence with a capital, in --ink (.bd-said-line), weight 400; the yielded line keeps its 500 and its ◆. mika R2 is confirmed by this: the lines about missing marks and waiting words are stated lines and read in ink, never in the quietest text on the leaf"
      quiet: { opening: "opening the board…", folding: "folding the board…", saving: "saving…" }
      one_wording: "The first open reads 'opening the board…' from the moment the head draws until the board is ready: LEAF_COPY.loading and KEEP_COPY.opening are the same words. 'Opening…', 'Folding…' and 'Saving…' with capitals are withdrawn. These three keep their … (they are passing, as the recorded loading line is)"
      contractions: "The console's voice uses them (principle 5's own examples; 'The board didn't open'; the refusal lines). Every line of the leaf does, with the typographic apostrophe: weren't, wasn't, can't, isn't, aren't, doesn't, didn't. 'were not saved', 'could not', 'are not shown', 'Did not match' and failedCause's 'did not load' / 'did not start' are brought to it"
      stated:
        partial: "Earlier marks aren't shown here · the saved board has them"
        dropped: "Some marks may be missing here · the saved board has them"
        wordsGone: "The words you were typing weren't saved"
        wordsAndChangesGone: "Your words and <n> changes weren't saved ('and one change' for one)"
        changesGone: "One change on the board wasn't saved / <n> changes on the board weren't saved"
        tooShort: "No room to draw · decide a card or make the window taller"
        unchanged: "Not saved · reconnecting; Not saved · not connected; Reconnecting; Not connected; Reconnected; Not connected · your words are kept on this page only; Reconnecting · your words are kept on this page only; Your words are waiting · T, then click, gets them back; Your words are back · click away to save them; Nothing was copied · copy it again once reconnected; Folded while reconnecting · unsaved changes were dropped; That board was folded · opening it starts it again; This board is out of date · fold it and open it again; A card needs you · finish the text on the board first"
      held: "'could not be held' is withdrawn: 'held' is the code's word, and this leaf already uses it for a board held still and for held words. The person's fact is that some marks are not on this page"
      what_next: "mika asked that partial and dropped say what to do next. Ruled short of that, on purpose: nothing the page does today brings the missing rows back short of reading the log again (core/dim-session.ts reset()), and a line must not name a move that does nothing. So the second half says the fact that matters most, that nothing is lost from the saved board. BUILDER QUESTION, to answer before these two lines ship: if folding and opening the board again, or reloading the window, does bring the marks back, the line ends with that instead ('… · fold it and open it again'), and this entry is updated"
      fact_first: "A stated line says what happened before ' · ' and what to do after it, and the fact is at most 40 characters, so it survives the cut in a 303px leaf (43 characters). The whole line is in title= and is spoken whole through the leaf's status line. Rendered at 424px: no stated line is cut. At 303px ten are cut, each after its fact"
      precedence:
        by: "luna 2026-11-25, design-foot FINAL, after mika's rendered review (s1.3-p4b3-design-mika-review.md) and aegis's ruling (s1.3-p4b3-design-aegis-ruling.md); proposed, pending the founder (mika C1, aegis C2.1 and C3.4). The line under the head holds ONE standing line. The highest of these that is true stands"
        order:
          - "1 out of date: 'This board is out of date · fold it and open it again', its fact in --fail at 500 (check.signs.mismatch). Nothing standing outranks it: not the link-down lines, not too short, not yielded, not saving"
          - "1b luna 2026-11-26 (E-design, aegis G7): 'Who changed what couldn't be checked · the marks themselves match', a stated line in ink, while this page's attribution digest does not match the board's (author-seal.other_hands.attr). Under 1, over everything else"
          - "2 the link-down and not-saved lines (Reconnecting, Not connected, Not saved · …, the held-words lines)"
          - "3 too short ('No room to draw · …')"
          - "4 yielded ('◆ A card has the keys · click the board to draw')"
          - "5 the lines about missing marks (partial, dropped)"
          - "6 the passing states (opening the board…, folding the board…, saving…)"
          - "7 the usual keep line"
        said: "A line SAID for a few seconds (a press on a still board, a refused copy, a refusal, Reconnected) may stand in any of their places and the standing line returns after it. That is the only thing that may cover line 1"
        lead: "'not checked yet · ' leads lines 3 to 7 when check.signs.unchecked applies"
        build: "too short never takes the held-still slot (ui/board-leaf.ts inert) from out-of-date: it is its own flag. Test (aegis C2.1): a mismatch while too short and while yielded, at 303 and 424px with an agent's hand in the foot, shows line 1"
      luna_final:
        by: "luna 2026-11-25, design-foot FINAL, after mika's rendered review (s1.3-p4b3-design-mika-review.md) and aegis's ruling (s1.3-p4b3-design-aegis-ruling.md); proposed, pending the founder"
        C1: "applied: the precedence above; the mismatch's fact in --fail at 500 (mika's own proposal for the form)"
        too_short_no_card: "applied: 'No room to draw · make the window taller' when no card is pinned"
        what_next: "still open, and both reviewers ask for it before the two lines about missing marks ship: the builder's answer to what_next"
    widths_narrow:
      by: "luna 2026-11-25, pass design-foot, proposed, pending the founder (L7). Drawn in specimen-board.html#head-narrow"
      supported: "The leaf is supported down to 300px wide. widths (above) measured Desk only; Decide at a 1024 window gives 260 / 304 / 460 and a 303px leaf, and it is a shipped preset at a supported window, so it counts. Under 300px (Decide between 900 and 1024) nothing more is promised than that nothing wraps and no key is clipped"
      head: "The head gives up its ornament before a control, and its title last. In order: (1) '› board' under 520px (recorded). (2) When the title would still be cut, the ◰ glyph goes (24px; it is ornament, and the title is the name). (3) Under 340px of leaf, when the title would still be cut, the esc key goes (49px): the Esc key, 'show chat' under the board and ⌥B all still fold it, and one of them is a pointer's. (4) Then the title is cut with …, whole in title=. Rename and Dimensions never go: neither has another way in. Measured with the head's own paint (title.scrollWidth over clientWidth), as the foot is; a container query cannot know the title's length. Rendered at 303px by day the title has 114px ('Totals are of…') where it had 'Tot…'"
      keep_line: "One row, cut from its end with …; keep_words.fact_first is what makes that safe at 303px"
      foot: "hands_foot.narrow"
      list: "components.dimension-list.placement (the list is the leaf's width less its insets)"
      luna_final:
        by: "luna 2026-11-25, design-foot FINAL, after mika's rendered review (s1.3-p4b3-design-mika-review.md) and aegis's ruling (s1.3-p4b3-design-aegis-ruling.md); proposed, pending the founder"
        H1: "applied: esc leaves the head ONLY while 'show chat' folds. While the board is kept open (held still with words kept or unsaved changes, where show chat does not fold and its title reads 'Kept open…'), the head's esc is the pointer's only fold: it stays and the title is cut further"
        H2: "applied: 'the head's own paint' means ONE draw: put the glyph and esc back, measure, then drop in order, as drawFoot does. Measuring the head as it stands flips the glyph on and off each draw. Measure again when the theme or the title changes: the title's face is wider at night (cut at 424px at night, whole by day)"
        mark: "the check's signs put nothing in the head, so the head's widths do not change with the check"
    tokens: { fill: "--ground; head, keep line and rail on --sheet", edge: "1px --rule left (as .lp-leaf)", arrive: "leaf-in 360ms; none when reduced" }
    specimen: "specimen-board.html#leaf"
    chose:
      - { what: "stops above the composer, with the working line as the only view of the chat", over: "a narrow transcript rail on the board's left (my early read)", why: "the centre is about 470px at 1024; a rail leaves under 250px to draw on. The plan requires the composer to stay visible, and the working line already says what the agent is doing" }
      - { what: "luna 2026-11-24 (decided by Luna, pending founder review): a two-row turn strip (you; the working key, then the reply) replaces 'the working line as the only view of the chat' above", over: "the working line alone (it is gone once the turn ends, so the reply was never seen); Arky's three rows (you, reply, working at once)", why: "DESIGN.md: the board stops above the composer 'so you keep talking while it is open', and a conversation needs both sides; the third row cost the rail its whole length at 1024 × 768, and while a turn runs the working key says more than a half-written line. The transcript rail stays rejected: rows cost height, not width" }
      - { what: "no dot grid; the board is the bare desk", over: "FigJam-style dots or the engine's line grid", why: "dots are the template's tell, and scraps pinned to the desk are the device" }
      - { what: "the hands foot ships with S1.3 as 'you <n>' and gains seals at S1.4", over: "no legend until agents draw", why: "the foot's place is then stable from the first dogfood" }
    status: proposed
    from: { session: 2026-11-23-gnomon-board-medium, board: board-leaf, decided_by: none, plan: ".paradigm/research/gnomon-canvas/s1-build-plan.md §2 S1.1, §7 S1.3; s1-scale-amendments.md A7, A9", review: "Mika 2026-11-23, rendered: buildable with the changes marked mika:. Aegis 2026-11-23: accepted with conditions (aegis-s1.1-design-rulings.md 7, 8)" }
  board-rail:
    role: "The board's tools, replacing the engine's toolbar: a graduated strip of the sheet down the leaf's left edge. Each tool is the system's segment key (key seg, var(--key-h) square) carrying a drawn glyph; the rail is one vertical radiogroup that calls the engine's setActiveTool."
    anatomy:
      - "the strip: 48px (foundations.space.layout), --sheet, 1px --rule right edge; graduations on its left edge, a 4px --sec tick every 8px and a 10px tick where a group ends (the scale rule: rules and spacing, no boxes round groups)"
      - "rows of 28px, 4px apart: the tool's letter in the margin beside its tick (10.5 --sec), then the key"
      - "groups, top down: Select | Sticky, Text | Rectangle, Ellipse, Arrow, Frame | Stroke | the line-and-fill key (opens content-tray) | spacer | Hand, +, the percent (a key quiet, 40 × 28, set over the letter column so '100%' fits at 10.5; it fits everything. In review: it was an underlined word with no edge, which breaks principle 2), −"
    tools:
      select:  { letter: V, also: "Esc returns here" }
      sticky:  { letter: N, draws: "a pinned scrap in the current fill; lemon by default" }
      text:    { letter: T, also: "double-click the desk" }
      rect:    { letter: R, draws: "square corners" }
      ellipse: { letter: O }
      arrow:   { letter: C, draws: "an open head; dragging from one mark to another connects them (the named verb connect)" }
      frame:   { letter: F, draws: "a 1px --sec region with its title above the top-left corner (11.5/600)" }
      stroke:  { letter: P, draws: "freehand, smoothed, roughness 0" }
      hand:    { letter: H, also: "hold Space; two-finger scroll" }
      zoom:    { keys: "⌘ +, ⌘ −, ⌘ 0 (fit)", also: "pinch, ⌘ scroll" }
    glyphs: "Drawn for Gnomon on a 16 grid: 1.5 stroke, butt caps, mitre joins, currentColor, no fill (the sticky's pin head is the one filled dot). Not an icon kit. The paths are in glyph_paths below (in review: this pointed at a `const I` that is not in the specimen)."
    glyph_paths:   # viewBox 0 0 16 16; copied from the rendered specimen
      select:  "M3.5 2 V13 L6.5 10.2 L8.6 14.5 L10.4 13.6 L8.3 9.4 L12.5 9.2 Z"
      sticky:  "M2.5 3.5 H13.5 V10 L10 13.5 H2.5 Z M13.5 10 H10 V13.5 + circle cx 8 cy 3.5 r 1.75, filled"
      text:    "M3.5 5.5 V3.5 H12.5 V5.5 M8 3.5 V12.5 M6 12.5 H10"
      rect:    "M2.5 4 H13.5 V12 H2.5 Z"
      ellipse: "ellipse cx 8 cy 8 rx 5.75 ry 4.25"
      arrow:   "M3 13 L12.5 3.5 M7 3.5 H12.5 V9"
      frame:   "M2 5.5 V2.5 H5 M11 2.5 H14 V5.5 M14 10.5 V13.5 H11 M5 13.5 H2 V10.5 + M6.5 2.5 H9.5"
      stroke:  "M2.5 11.5 C3.5 6 6 5.5 7.2 8.6 S10.5 12.5 13.5 4.5"
      hand:    "M8 2 V14 M2 8 H14 M6 4 L8 2 L10 4 M6 12 L8 14 L10 12 M4 6 L2 8 L4 10 M12 6 L14 8 L12 10"
      line-and-fill: "two overlapping 14px wells (components.content-tray.well): the line well top-left, the fill well bottom-right, showing the current pair"
      more:    "the ⋯ character at 11.5, as the chat header's ⋯ key"
    glyphs_at_1x: "mika, rendered at device pixel ratio 1: rectangle, ellipse, arrow, frame, text and stroke hold. Two are soft. Select: its tail (the L 8.6 14.5 L 10.4 13.6 leg) blurs into the head; redraw the pointer without the tail, or snap the tail to whole pixels. Hand: the four-way cross reads as 'move the selection', which is what Select does; a board's Hand moves the view. Question for Luna (not changed): a drawn hand, or the cross inside a frame-corner, would say 'the view'. Until she rules the cross ships with its title= 'Hand: drag to move the view'."
    states: [rest, hover, focus, chosen, pressed, yielded, tight]
    state-notes:
      tight: "design-foot: the shortest rail (140px): four keys 4px apart, graduations kept, no group tick, no spacer. See fold.tight"
      chosen: "day: the segment's filled ink key. Night: the key's ring is redrawn as a bracket (left and right bars 2px wide with 6px returns, 2px thick, in --ink). In review: at 1px the chosen key carried less ink than a resting one and read as the weakest key in the rail, in colour and in grayscale; at 2px it is the heaviest, the glyph carries the chosen segment's glow (rule night-glow-sparing already lists the chosen segment). Night's text brackets ([ ]) are off for rail keys: a glyph and two brackets do not fit 28px."
      yielded: "a card is focused: every key is aria-disabled and draws the disabled key (edge --rule, glyph --sec, no offset), the letters and the graduations are removed, and the leaf's keep line says why. Keys keep their place in the tab order. aria-disabled is truthful: the first pointer press while yielded only wakes the board (focus moves, nothing is chosen or drawn; aegis: ruling 7), and the next press chooses. A keyboard user never meets a disabled rail: moving focus into the rail leaves the card, which ends the state."
    keyboard: "Single letters act only while focus is in the board and no text is being edited. No tool uses A or D (the letters the plan keeps for deciding a card, G-DDL-08), Enter, or ⌘O / ⌘S / ⌘⇧E (the engine's file keys are off). The rail is one tab stop; ↑ ↓ move within it. Every key has title= '<Tool> (<letter>)' and an accessible name. mika, checked against packages/gnomon-gui/src: no single letter is bound desk-wide today. The live letter handlers are scoped to focus inside their own group: a question card picks options with 1 to 9 and a to i (core/ask-card.ts:83), reply choices with their own letters (core/choices.ts:243, app.ts:4053). So C, F and H are letters a focused question card also reads: the letters are a second guard for A and D only, and the yield is the one guard for the rest. The bare ` mic key (app.ts:4387) still toggles the mic while focus is on the board and no text is being edited; no tool uses it. ⌘N is New session (app.ts:4435) and does not collide with N. ⌘ +, ⌘ − and ⌘ 0 zoom the board only while focus is in it; in a browser tab they then no longer zoom the page, which is accepted. Not in the rail, by keys only: ⌘Z and ⇧⌘Z (undo, redo, as inverse ops), ⌫ deletes the selection, ⌘A selects all, ⌘D is off (no duplicate in S1)."
    short_windows: "luna 2026-11-25, pass design-foot, proposed, pending the founder (R4, L1): CORRECTED to the measured app and carried on under 230px; the steps are in fold. The rail never scrolls and is never taller than its room: the fullest layout that fits is drawn. Whole at 472px. Under 472: + and − go into the percent key's menu (408 needed). Under 408: Hand goes into ⋯ (Space still pans) and tools fold from the bottom of the list into the one ⋯ key (key quiet; a menu of rows: glyph, name, letter): Stroke, Frame, Arrow, Ellipse, Rectangle, then Text, then Sticky. Select folds last. Every letter still works. The always-visible set of the first record (Select, Sticky, Text, ⋯, line-and-fill, the percent) needs 230px, not 232, and is no longer a floor: a board under 230px is ordinary (components.board-leaf.heights_measured). History: mika's first rule replaced 'under 520px the zoom keys fold; the tools never scroll'. Drawn at 304px in specimen-board.html#rail and from 230 to 140px in #rail-fold"
    fold:
      by: "luna 2026-11-25, pass design-foot, proposed, pending the founder (L1, L6, mika S1 and S2). Drawn in specimen-board.html#rail-fold"
      metrics: "core/board-rail.ts RAIL_METRICS, held to the paint by a test: padding 16 (8 and 8), a row 28, a gap 4, a group's tick 5 (1px and its 2px margins), the spacer above the percent at least 4"
      steps:
        - { need: 472, shows: "all eight tools, line-and-fill, Hand, +, the percent, −" }
        - { need: 408, shows: "all eight tools, line-and-fill, Hand, the percent" }
        - { need: "367, 335, 303, 271", shows: "Hand in ⋯; then Stroke, Frame, Arrow, Ellipse fold, one a step" }
        - { need: 230, shows: "Select | Sticky, Text, ⋯ | line-and-fill, the percent" }
        - { need: 198, shows: "Select | Sticky, ⋯ | line-and-fill, the percent" }
        - { need: 157, shows: "Select, ⋯ | line-and-fill, the percent" }
        - { need: 140, shows: "tight: Select, ⋯, line-and-fill, the percent; no group tick and no spacer" }
      order: "CONFIRMED as built: Text folds before Sticky, and Select is the last tool. Sticky is the board's own device (the pinned scrap) and the first thing a person reaches for; Text has T and a double-click on the desk"
      tight: "The last step drops the two group ticks and the spacer, which is what its 17px are. It KEEPS the graduated edge (mika S1, taken): the graduations are the rail's own background and cost no height, and a bare strip is the yielded rail's look, so a tight rail without them reads as a rail that takes no keys. The letters stay in the margin. Build: delete styles.css '.bd-rail.tight { background: var(--sheet); }'"
      chosen: "RULED for the floor: the tool in hand is always on the rail. A folded tool that is chosen takes the LAST visible tool slot, at every step, the one-slot steps included: there the chosen tool holds the only slot and Select leads the ⋯ menu (Esc and V still return to Select). So 'always visible: Select, Sticky, Text' gives way to the chosen tool, and what holds instead is: the chosen tool always; Select whenever there are two slots or more; Sticky from three slots, or two when the chosen tool is not a guest. When the board grows or another tool is chosen, the guest goes back to its own place"
      guest_tick: "mika S2, taken: a chosen folded tool brings NO tick of its own. It stands in the row of the tool it displaced, inside that group's ticks, so the rail's need is the need of the unchosen layout and choosing a tool swaps exactly one key. As built a guest from another group added a tick, and from 230 to 238px any chosen folded tool cost both Sticky and Text (72 of 1076 height and tool pairs lost two). Its letter in the margin and its chosen look say which tool it is; the tick marks a group's end, and a guest has no group there. Build: core/board-rail.ts railNeed counts the groups of the unchosen layout; ui/board-leaf.ts draws no tick before a tool that is not in its own place"
      under: "Under 140px there is no rail: components.board-leaf.too_short"
    menus_scroll: "luna 2026-11-25, pass design-foot, proposed, pending the founder (mika S4). A leaf menu (.bd-menu: ⋯, the percent, the hands, the Dimensions list) stays inside the leaf and scrolls inside itself when it is taller than its room. When it scrolls, the cut passes THROUGH A LINE OF TEXT, never between two lines (FINAL, mika D2): whole rows plus half a row for one-line rows (14px of 28); for the Dimensions list's two-line rows, whole rows plus 30px, through the second line (half of 42px is the padding and the whole title, which read as a complete one-line row). So a cut row always says there is more; at 198px the ⋯ menu ended exactly on a row with Hand out of sight below it. No fade and no arrow: the cut row is the sign. Nothing wraps inside a row (mika S3: white-space nowrap on .bd-mi and its kbd). Drawn in specimen-board.html#menu-cut"
    tokens: { fill: --sheet, edge: "1px --rule", tick: --sec, key: "key quiet seg (fill --sheet, edge --key-edge, hover --fold, focus 2px --key-edge)", letter: "10.5 --sec" }
    specimen: "specimen-board.html#rail"
    chose:
      - { what: "a rail on the leaf's left edge", over: "the engine's top-centre island or FigJam's floating bottom bar", why: "a floating bar covers the drawing at 470px and is the stock look; an edge rail costs a fixed 48px and reads as part of the instrument" }
      - { what: "Arrow is C (connect) and Sticky is N (note)", over: "the engine's A for arrow and its number row", why: "A and D decide cards; the yield at capture is the guard, and letters that never collide are the second one" }
      - { what: "letters shown in the rule's margin", over: "tooltips only, or a kbd inside each key", why: "a glyph-only rail needs its letters visible to be learnt; a kbd inside a 28px key crowds the glyph" }
      - { what: "humans get no stroke-style control (solid only)", over: "offering dotted or dashed for 'planned' lines", why: "the dash is the authorship cue and must never be a choice (TD-2026-11-24-500); tentative lines use graphite or the fine weight" }
    status: proposed
    from: { session: 2026-11-23-gnomon-board-medium, board: tool-rail, decided_by: none, review: "Mika 2026-11-23, rendered (glyphs at 1x, night bracket, short rail). Aegis 2026-11-23 (ruling 7)" }
  content-tray:
    role: "Where content colour and weight are picked: a tray that opens beside the rail from its line-and-fill key. Content colours are round wells, so they never read as the square project swatch."
    anatomy:
      - "rows led by one lowercase word (10.5 --sec), no boxes: line | fill | weight | custom"
      - "line: ink, graphite, then the hues that have a line value (lemon has none)"
      - "fill: none (a slashed well), paper, then every hue"
      - "weight: a seg of fine (2) | bold (4) | marker (8, Stroke only), in board units"
      - "custom: a 10ch hex field; when the colour passes, its well and 'custom · at night #… as a line, #… as a fill'"
    well: "18px circle, 1px --key-edge ring. A fill well is filled; a line well is --sheet with a 4px ring of the line colour. Chosen: a 2px --key-edge outline, 2px out. Wells are a radiogroup per row; each has its swatch name as title= and accessible name."
    well_names: "mika: each row ends with the name of its hovered, focused or else chosen swatch (10.5 --sec: 'line  ● ● ● …  cobalt'). Rendered at night the fill wells are six dark discs between 1.5 and 1.7 to 1 against the desk, and under deutan and protan simulation sky, cobalt and orchid are one blue in both themes, so a well's title= alone leaves the choice to hue. The fill row shows its chosen well with the same 2px outline as the line row (the specimen draws it only on the line row). 'marker' is disabled unless the tool is Stroke, with title= 'Marker is for the Stroke tool'."
    states: [closed, open, well-hover, well-focus, well-chosen, custom-ok, custom-refused]
    state-notes:
      custom-refused: "a custom colour inside the reserved distance is not applied. The row under the field says '✕ not used · <why in plain words>' (for example 'at night this red is the failed colour', 'that is a project colour') and offers one quiet key, 'Use <nearest swatch>'. The measured distance and the reserved token's name stay in the raw view. aegis: ruling 3: this refusal stands for the picker and for the shared validator (one function); the picker never substitutes a colour. luna 2026-11-25: the same row serves the contrast refusals of content_palette.contrast_rule, with their own words ('too faint to see on the board', 'too faint to read as words', 'words would be too faint on it', 'it would not show against this mark's fill', 'this mark's line would not show against it') and their own offered swatch."
    tokens: { fill: --sheet, edge: --key-edge, shadow: "foundations.shadow.overlay (day)", row-gap: 8, lead: "10.5 --sec, 52px" }
    specimen: "specimen-board.html#palette"
    chose:
      - { what: "refuse with the nearest swatch offered", over: "snapping the colour silently (the wording of the Aegis S1.2 condition)", why: "with no warm hues in the named set, the nearest swatch to an amber is a green; a silent swap would look like a bug. The stored value is still never inside the distance, which is what the condition protects. Arky and Aegis to confirm at S1.2" }
      - { what: "round wells", over: "reusing the square swatch", why: "the square swatch means a project" }
    status: proposed
    from: { session: 2026-11-23-gnomon-board-medium, board: content-palette, decided_by: none, review: "Mika 2026-11-23, rendered. Aegis 2026-11-23: refuse at the picker and the validator; the renderer resolves a failing stored token to ink or none (ruling 3)" }
  author-seal:
    role: "Who drew a mark, without colour. Two cues: the stroke (solid is the human's, dashed is an agent's, derived from the host-stamped author and never an input) and the seal, a small stamp worked out from the author id each time it is drawn. Never stored, never chosen."
    grammar: "Solid means the host vouches; dashed means it is not the host's word. Three hands (aegis: ruling 5 adds the third). You: solid marks, a plain pin. An agent the host named: dashed marks, a seal with a solid rim. The unknown hand: a mark whose row carries no author the host vouches for (no well-formed relayedFor, or any author the fold cannot resolve): dashed marks, no seal, a hollow pin, and the words 'unknown hand' wherever a name would go. It never draws solid, so it can never pass for yours. A fourth, waiting for S1.4: a sub-agent that named itself inside a session (s1-scale-amendments.md §4): a seal with a dashed rim, always attached to its parent's solid seal."
    derivation:
      input: "aegis: ruling 5: the host-stamped principal plus agent, length-prefixed; never a nickname and never tool input. The function does not depend on the id's format; S1.2 fixes the format. The name beside a seal is a bidi-isolated, length-capped text node, and the name is the authority: 5 cuts by 8 beads is 40 shapes, so the seal is a recognition aid and a matching one can be found by trial."
      hash: "h = FNV-1a 32-bit over the id's UTF-8 bytes (offset 0x811C9DC5, prime 0x01000193)"
      cut: "h mod 5 → 0 round, 1 square, 2 diamond, 3 hex, 4 tab (a square with a pointed foot)"
      cut_geometry:   # mika: in an 18 box with its centre at 9,9; the specimen's viewBox is -2 -2 22 22. Stroke 1.5.
        round:   "circle r 7.75"
        square:  "1.75,1.75 16.25,1.75 16.25,16.25 1.75,16.25"
        tab:     "1.75,1.75 16.25,1.75 16.25,11.5 9,17.5 1.75,11.5 (letter baseline 12, not 12.75)"
        diamond: "9,-1.5 19.5,9 9,19.5 -1.5,9: 21 across, drawn at its optical size. In review: at 17 across (9,0.5 17.5,9 …) A, K, M and W touched the rim at 1x in both themes; at 21 they clear it, and the diamond then has the square's side (14.8 against 14.5)."
        hex:     "4,1.75 14,1.75 19.5,9 14,16.25 4,16.25 -1.5,9: flat top and foot, points left and right, 21 across. In review: the hex was specified and never drawn (none of the first twelve names hashes to it; quill and lux do). A regular hex at 17 across is told from the round cut only side by side, so it is drawn wide."
        box:     "The diamond and the hex overhang the 18 box by 1.5 each side, and a bead on a point by 1.75 more; rows that hold seals give them 22px and 2px of clear space."
      bead: "(h >>> 8) mod 8 → a 1.75 radius dot on the rim where the ray from the centre at bead × 45° (0 is up, clockwise) meets the cut. mika, rendered: at 18px and 1x the bead reads as a bump on the rim; it parts two seals seen together (jinx, judge) and does not carry recognition alone. Accepted, because the name is always beside the seal."
      letter: "the first [a-z0-9] of the id's name part, upper-cased, mono 10.5/600"
      test_vectors: { arky: "9eec954e · square · bead 5 · A", luna: "05033d87 · tab · bead 5 · L", kit: "6cf7bb37 · diamond · bead 3 · K", mika: "867d2e5b · square · bead 6 · M", aegis: "560edd4c · diamond · bead 5 · A", loid: "f5f3eb61 · round · bead 3 · L", jinx: "b622116a · tab · bead 1 · J", judge: "aae2e5a4 · tab · bead 5 · J", quill: "f4468af6 · hex · bead 2 · Q", lux: "44920086 · hex · bead 0 · L" }
      note: "mika: all ten vectors recomputed in review and correct. Vectors use bare nicknames as ids for illustration; the shipped input is principal plus agent (input above), so shipped seals will differ from these. jinx and judge share a cut and a letter and are parted by the bead: the bead is why the seal survives a twelve-agent roster."
    seal:
      sizes: { small: "18 (on a pin, in the foot, on a slip)", large: "28 (the hover and focus line, the Dimensions list)" }
      verified: "fill --sheet, rim 1.5 --ink solid, letter 600, bead filled --ink"
      claimed: "WAITS FOR S1.4 (aegis: ruling 5): not built in S1, because the host has no carrier for a self-claimed name and may not read one from input. Design kept: rim 1.25 --ink dashed 2.5 2, letter 400, bead hollow; every text that names it adds 'claimed' ('Kit · claimed, inside Arky's session'). Conditions for when it is built: it hashes under a separate domain that includes the parent's agent, and it is always drawn attached to its parent's solid seal (overlapping it by 7px, to its right), never alone: a dashed rim alone is a 1.25px difference at 18px, and a sub-agent claiming 'arky' would otherwise wear Arky's cut, bead and letter. On a pin the pair is centred on the pin."
      ring: "luna 2026-11-25 (L2): what a seal becomes under 50% zoom, and what a mark too small to show its dash carries at every zoom (strokes.too-small). A 6px circle in screen space on the host layer: 1.5px --ink rim, filled --sheet by day and --ground at night; no letter, no bead, no name, no title. It is centred where the seal would be (the pin's place, the text box's top edge, the frame's top right corner, the seal point of a drawn mark) and so stands on an edge or beside a first point, never in the middle of a mark's box: a ring inside a box is a radio button. It is round at every size, takes no pointer and no focus, and is aria-hidden; the mark's own accessible name carries the hand. One ring per mark, none for a label. It is not a new device: it is the seal's rim with everything taken out. mika R6, applied with one change: for an ARROW and a STROKE the ring does not sit at the seal point, which is 5px behind the first point and so inside whatever the arrow starts from (rendered, it read as a port on that mark). It stands beside the line: 5px off the middle of the first run (ring half 3, 2px clear), square to it, on its upper side (the left side for an upright run), clamped into view. Mika asked for 'the side away from the nearest mark'; that needs a search of every other mark on each view change, and off the middle of the run either side is clear of the mark it starts from, so the side is fixed"
      human: "no seal: a plain pin (8px --ink disc by day; a ringed point at night). Seals for several humans wait for team editing (S7)."
      unknown: "aegis: ruling 5, drawn by mika: no seal. The pin is hollow: an 8px ring, 1.5 --ink on --sheet by day; 1px --ink on --ground at night (your night pin without its point). In the hands foot: the hollow pin, 'unknown hand <n>', after every named hand. For Luna: at night the hollow pin differs from yours by one 2px point; the dashed edge carries the difference, and she may want a stronger second cue."
      zoom: "seals and pins are host DOM in screen space: they do not scale with the board and are never drawn by the engine."
    strokes:
      human: "solid, at the chosen weight"
      agent: "dashed, about 3× the weight on and 2× off as the eye sees it. luna final (mika, buildable): the engine has ONE dash function in board units and paints round caps, 0.5 wider than the weight. So the rule is written as the engine can keep it: the pattern is 2× the weight on, 3× off, in BOARD UNITS (fine 4 6, bold 8 12, marker 16 24), which with round caps is seen as 6.5 on 3.5 off, 12.5 on 7.5 off and 24.5 on 15.5 off at 100%. That is one counted patch to the dash function (today [8, 8 + width]). Round caps are accepted; 'butt caps' is withdrawn, since it needed a second patch for no gain the eye can see. The gap is 3.5px or more at 100% (aegis: at least 2). Dotted is never used. The dash is derived from the author in the mapping (dim-map), never an element input a human or an agent can set (aegis: ruling 9). An agent mark's dashed edge keeps at least 3:1 against its own fill (content_palette.contrast_rule). Withdrawn (mika R5): 'a mark under 24 board units on its short side tightens to 3 2'; a per-mark dash cannot be built on a function that does not see the zoom, and too-small below covers the case"
      unknown: "as an agent's: dashed at the same lengths, never solid"
      agent-sticky: "the scrap's edge is dashed and its pin head is the seal"
      agent-text: "a 1px dashed --ink2 edge round the text block, with the seal at its top edge, both ALWAYS on, at every zoom and without hover (aegis: ruling 9: night keys are text brackets, so agent text '[ Allow ]' in the same mono face would imitate a key). The box and seal are host DOM in screen space. An unknown hand's text has the same box with the hollow pin."
      agent-stroke: "PROPOSED, PENDING THE P4a ENGINE PROOF (does 0.18.1 dash a `line` along its whole length; no golden exists). luna 2026-11-25 (L1): an agent's stroke is drawn by the engine as ONE dashed line of even width along its whole length (the node stays kind stroke; only the engine element differs, and only the mapping may choose it, from the stamped author), at the lengths in agent above, in the mark's own line colour. With the dash in the stroke itself a stroke joins the shapes and arrows: its seal shows on hover and selection, no longer always (core/board-overlay.ts ENGINE_DASHES gains stroke only once the golden shows the dash). An unknown hand's stroke is drawn the same way, with its hollow pin on demand. A person's stroke stays freehand and solid; no tool, paste or drop can make the dashed line (Aegis reviews that filter). FALLBACK if the proof fails: an agent's stroke stays as shipped in S1.3, a freehand stroke with its seal always on; the hand is still marked, and L1's stroke waits"
      agent-frame: "PROPOSED, PENDING THE P4a ENGINE PROOF (one counted patch at the engine's single frame-outline paint site, which knows the element and the zoom; mika prefers it to a host box because it keeps the frame's place among the marks). luna 2026-11-25 (L1): an agent's frame has ONE edge and it is dashed: 1px --ink2, 6 on 4 off on the screen, the same hand box as round an agent's text. Its seal is ALWAYS on, on the top edge at the right corner (as built: markSealPoint), because a frame carries a title and the title is the agent's words. Condition: no solid edge may show on an agent's frame at any zoom; a dashed box laid over the engine's solid edge is refused. The golden of an agent frame shows gaps on all four sides at 25%, 100% and 400%. An unknown hand's frame: the same edge, the hollow pin in the seal's place. FALLBACK if the patch cannot be made: the frame stays as shipped in S1.3 (the engine's edge, the seal always on) and the dashed frame waits; nothing is faked with a box on top"
      too-small: "luna final (mika R5, applied and made one rule). A dash is seen only when two periods of it fit. A mark whose dashed run is shorter than TWO PERIODS OF ITS OWN DASH AS PAINTED carries the ring (seal.ring) at EVERY zoom. The run is an open mark's longer box side and a closed mark's shorter side. A period is 5× the weight in board units, so in board units, at any zoom: fine under 20, bold under 40, marker under 80. The host's overlay can work this out from the mark's box and weight alone. If the screen floor below is proven and in force, the period on the screen is never under 7px, so the run is then also compared with 14px. This replaces 'an open mark under 16px, a closed mark under 12px' (blind to weight: a 60px marker stroke shows one dash and a stub) and withdraws the tight 3 2 dash for small closed marks. Honest limit: a small box can still be left with only corner pieces by where the engine starts its dash; the ring is what marks it, and P4a takes a golden of an agent box 14px on its short side so that Mika can look at it. SCREEN FLOOR: PROPOSED, PENDING THE P4a ENGINE PROOF: a dash never under 4px on and 3px off on the screen, painted from the canvas transform where the dash is drawn (the engine caches shapes without the zoom, so it cannot be done in the dash function). FALLBACK, and what ships until it is proven: no floor; dashes shrink with the board and close up under about 50%, and the ring on every mark that is not the person's carries the hand there (low-zoom, item 2)"
      low-zoom: "luna 2026-11-25 (L2), final after mika's review and aegis's ruling 2 (aegis: ruling 9 of S1.1 asked for an always-on cue under 50%). 'Under 50%' is zoom < 0.5: at 50% exactly a seal is a seal, at 49% it is a ring; goldens at both. (1) EVERY seal becomes the ring (seal.ring): on a scrap's pin, on a text, on a frame's edge. (2) Every drawn mark of an agent or an unknown hand (shape, arrow, stroke) carries the ring. Mika's question 1 asked to keep rings only where a seal was, since a dash floor would keep dashes readable: NOT taken. The floor is unproven and without it dashes close up under 50%, which is the reason the ring exists; aegis's cue stands. If P4a proves the floor, a later pass may thin the rings, with Aegis. (3) Agent text never becomes an empty box. Under 50% its box loses the screen-space padding it has at 100% (4px round, 12px above for the seal) and stands 2px off the letters, with the ring on its top edge. aegis, bound: the next switch is PER MARK, from that mark's own letter height on the screen, never from the zoom alone, because the agent chooses the size: when a mark's letters are under 4px tall on the screen its box gives way to a dashed rule under the text (1px --ink2, the text's width, the ring at its start); any text with letters of 4px or more has the box. No agent or unknown text is ever shown with neither form (goldens at 25%, at the 4px boundary and at 50%, day and night, with text at two sizes). The unknown hand is treated exactly as an agent, its hollow pin becoming the same ring: under 50% the ring says 'not yours'. Hover and selection give back the full box, the full seal or hollow pin, and the name (naming below) at any zoom. (4) luna final (mika's question 2): under 50% at night the person's pin FILLS: an 8px --ink disc, as by day. Rendered at 1x the night pin (a ring with a 2px point) and the ring were two pale circles 2px apart in size; filled against hollow needs no size to read. The switch is instant, with no animation. Withdrawn: 'the dashed edge carries it down to 16px' (mika, at true scale: a sticky's edge at 25% is a quarter-pixel hairline and carries nothing)"
      low-zoom-aegis:
        by: "Aegis 2026-11-25, ruling 2: accepted with conditions, each a P4a golden or test"
        conditions: ["the switch is per mark, by that mark's letter height on screen (under 4px), never by zoom alone", "no agent or unknown text is ever shown with neither the box nor the rule and ring", "the unknown hand gets the same treatment as an agent", "hover, focus and selection restore the full box and seal at any zoom (in S1.4: hover and selection; see naming)"]
    where: ["luna 2026-11-26 (E-design): at every zoom, the countermark at the foot of a mark another hand changed, and the words sign under words another hand wrote into a mark of yours (other_hands)", "always, at 50% zoom and over: on the pin of an agent's scrap (sticky, stub)", "always, at 50% and over: on an agent's text block, with its dashed box", "always, at 50% and over: on the top edge of an agent's frame, at its right corner (luna 2026-11-25)", "on hover or selection, at any zoom: at the seal point of an agent's drawn mark (shape, arrow, and a stroke once the engine dashes it), with the name beside it (naming); an unknown hand's reads 'unknown hand'", "under 50% zoom: the ring in place of every seal and hollow pin, and on every agent or unknown-hand drawn mark (strokes.low-zoom)", "at every zoom: the ring on a mark too short to show two dashes (strokes.too-small)", "always: the hands foot of the leaf", "the board slip's 'added' line"]
    naming:
      by: "luna 2026-11-25, final pass, ruling mika R8 (hover, keyboard focus and the naming line were in the record and in no change list). Built in P4a. Proposed, pending the founder"
      hover: "The pointer over a mark of a hand that is not the person's (the host's own arithmetic: the pointer inside the mark's screen box grown by 4px, the topmost such mark; no engine fact is needed) gives back the full seal or hollow pin at the mark and, beside it, the hand's NAME as the system's chip (components.chip, plain: 10.5, an 18px line, a --rule edge): 'Claude', or 'unknown hand'. The name is a bidi-isolated text node cut at 24 characters and is the authority (aegis: S1.1 ruling 5). Nothing else: no time, no session, so the chip stays short and nothing jumps as the pointer crosses a board"
      selection: "One selected mark of a hand that is not the person's: the same seal and chip at the mark, and the whole line '<name> · hh:mm · ◇ <session>' in the leaf's line under the head, for as long as that one mark is selected. It takes the resting line's place only: a held line, a said line or the yielded line wins. Several marks selected: seals and chips, no line. The session's name is cut at 16 characters. If the fold carries no time for a mark the line is '<name> · ◇ <session>'"
      keyboard: "NOT in S1.4, and said plainly: no mark can take keyboard focus yet (keyboard-only drawing is deferred), so 'keyboard focus' is struck from where and from rule small-hand-is-a-ring until marks can take it. Until then a keyboard user reads the hands from the foot. For Aegis: under 50% a hand is named on hover and on selection, both of which need a pointer in S1.4"
      build: "P4a: the handle reports the pointer's board position or the overlay listens on the board; core/board.ts BoardMarkView gains hovered; BoardAuthor gains the session (from the stamped principal) and the mark's time (from its row, when the fold has it); core/board-overlay.ts overlayItems reads hovered beside selected; ui/board-leaf.ts draws the chip and the line"
    luna_final_s14:
      by: "luna 2026-11-25, final pass on Mika's rendered review; proposed, pending the founder"
      R5: "applied, as one rule in board units: two periods of the mark's own dash (strokes.too-small). The 24-unit sentence is removed from strokes.agent; the tight 3 2 dash is withdrawn"
      R6: "applied with one change: an arrow's and a stroke's ring stands beside the line off the middle of its first run, on a fixed side (seal.ring)"
      R8: "ruled: hover and selection are built in P4a, with the name as a chip at the mark and the whole line in the leaf's line on selection; keyboard focus is struck for S1.4 (naming)"
      R9: "applied: section 9's low zoom is redrawn at true line widths, with solid arrowheads; an arrowhead is exempt from 'no solid edge' (rule agent-marks-are-dashed)"
      question_1: "keep the ring on every dashed mark under 50%: the floor that would make them spare is unproven (strokes.low-zoom, item 2)"
      question_2: "strengthen it: the person's night pin fills under 50% (strokes.low-zoom, item 4)"
      buildability: "mika's four engine findings are taken as limits: one dash function in board units (the pattern is ruled in board units); round caps (accepted, butt caps withdrawn); a screen floor only at paint time (pending); no per-mark dash (withdrawn)"
      pending_engine_proof:
        - "an engine `line` dashed along its whole length, for an agent's stroke. Fallback: the stroke as shipped in S1.3, freehand with its seal always on (strokes.agent-stroke)"
        - "the frame outline dashed by one counted patch at its paint site. Fallback: the frame as shipped in S1.3, seal always on (strokes.agent-frame)"
        - "a screen floor of 4px on and 3px off painted from the canvas transform. Fallback, and what ships until then: no floor; rings carry the hand under 50% (strokes.too-small)"
      not_pending: "the dash pattern 2w on 3w off (one line in the engine's dash function, per mika), the ring, the text box's three forms, the frame's seal, hover and the chip, the foot and the draw key, every word: all host code or one known patch"
    session_hint:
      by: "luna 2026-11-25, pass S1.4 P4-design, proposed, pending the founder (s1.4-draft.md F3: every Claude Code session's agent is labelled 'claude'). Drawn in specimen-board.html#hand-grant and #hand-words"
      name: "The host's label 'claude' is shown as 'Claude' everywhere on a board, the turn strip's word (TURN_COPY.claude); one wording"
      when: "Only when it is needed to tell two hands apart: two or more agent hands on this board (attached, or with marks) would show the same name. With one session the foot reads 'Claude 3' and the line under the head already names the session"
      foot: "'<seal> Claude ◇ <session> <n>' then the draw key. ◇ is the system's session glyph (family-by-glyph-and-word). The session's name is 10.5 --sec like the rest of the foot, a bidi-isolated text node, cut at 16 characters with …, whole in title= and in the seal's accessible name ('Claude, fix-auth')"
      lines: "In a spoken or said line the session follows the name in words, with no glyph: 'Claude in fix-auth added 3 marks', 'Claude in billing-ui removed the mark you were moving', 'Not changed · Claude in fix-auth may still draw'"
      hover: "Unchanged: the hover, focus and selection line always ends '· ◇ <session>'"
      strip: "The turn strip never needs it: it shows this session's own turn"
      seal: "The seal's input is the host-stamped principal plus agent (derivation.input), so two sessions' seals share the letter C and differ by cut or bead. That is 40 shapes, so two sessions will sometimes get the same seal: the session's name is what tells them apart, and the seal is the aid. Condition for the build (s1.4-draft.md 'Not verified'): the id the seal and the foot key on must include the principal, or every Claude is one hand"
      same_name: "Two attached sessions with the same name: the foot shows both as they are, and the hover line and each title= add the session's short id after the name. Rare, and not worth a rule in the foot"
      unknown_session: "A hand whose session this page does not know (closed, or from another window): '◇' and the session's short id"
      never: ["the session's name in place of the agent's name", "a session's name taken from anything an agent wrote on the board or sent as tool input", "colour to tell two Claudes apart"]
    # ── luna 2026-11-26, pass E-design (edit-anything): any hand may change any mark. Proposed, decided_by: none.
    other_hands:
      by: "luna 2026-11-26, pass E-design, proposed, pending the founder (s1.4-edit-anything-draft.md 2.4; Aegis edit-anything G1, mandatory). Any hand may now change any mark. This is how a mark shows that a hand other than the one that drew it changed it or wrote words into it. Drawn in specimen-board.html#other-hand (section 11, day and night)"
      owner: "A mark keeps its OWNER's look: its line, its pin or seal and its box come from `by`, the hand that added it, as before. A person's rect that Claude restyled or moved stays solid and has no seal. Nothing another hand does to a mark makes it read as that hand's own mark, and nothing takes the person's solid line off a mark the person drew"
      signs: "Two signs, both host DOM in screen space, both from the fold's fields (never from a row's payload, never from tool input), never colour: (1) the COUNTERMARK, for the hand that changed the mark (otherBy); (2) the WORDS SIGN, for a hand that wrote words into it (wordsBy). One sign per hand: when otherBy and wordsBy are the same hand, only the words sign is drawn. Both show whenever their field is set, at every zoom and without hover (aegis G1: 'no sign' is not an option)"
      countermark:
        what: "The changing hand's head, made small: the 6px ring (seal.ring: 1.5 --ink rim, --sheet inside by day, --ground at night) when an agent or the unknown hand changed the mark; a 6px --ink DISC, filled in both themes, when YOU changed another hand's mark. Solid is yours and hollow is not, which the low-zoom pin already says. Not a new device: the ring and the pin, in a new place"
        place: "Where a signature goes on paper: at the foot. A closed mark (rect, ellipse, diamond, sticky, stub, frame, a text's box): outside its bottom-right corner, centred 5px right of and 5px below the corner, touching neither the edge nor the engine's corner handle. An open mark (arrow, line, stroke): beside its LAST run, 5px off the middle of that run, square to it, on its LOWER side (the right side for an upright run): the opposite side from the one seal.ring uses for an owner's ring on the first run, so on a one-run arrow the two never meet. Clamped into view as markSealPoint is. Every head the record already has stands at the top or at the first point (a scrap's pin, a text's seal, a frame's seal at its top right, a drawn mark's seal point), so the foot is free on every kind"
        hover: "The pointer over the mark (naming.hover's arithmetic) gives back the changing hand's full head in the countermark's place, moved 8px further out on the same diagonal so the corner handle stays clear: the full seal for an agent, the hollow pin for the unknown hand, your plain pin for you. Beside it the system's chip (components.chip, plain): 'changed by Claude', 'changed by you', 'changed by unknown hand'; with session_hint, 'changed by Claude in fix-auth'. The name is cut at 24 characters, as naming.hover cuts it"
        newest: "It names the NEWEST other hand only (otherBy is overwritten by the next other hand). Earlier hands are in the log and wait for the history slice"
        after_undo: "FOR ARKY (E0), proposed: when the newest change to a mark is an honoured undo that put back every field the other hand had changed on it, the fold clears otherBy for that mark, so a mark undone to what its owner had shows no countermark. FALLBACK if the fold keeps otherBy: the countermark stays and its chip reads 'changed by Claude · undone by you'. Both are honest; the first is calmer"
      words_sign:
        what: "When words in a mark whose look is the PERSON's (solid) were written or cleared by another hand (wordsBy is an agent or the unknown hand), those words carry that hand's mark as an agent's own words do, ALWAYS on. In a sticky, a shape's or an arrow's label, and a frame's title: the hand rule under the words (1px --ink2, dashed 6 on 4 off on the screen: the hand-edge look, the words' width) with that hand's seal (or hollow pin) at the rule's END, just past the last letter, where it covers neither the scrap's edge nor the first letter. In a free text mark: the whole hand box round the text with the seal on its top edge, exactly as an agent's text (strokes.agent-text), because a text mark is only words and the box is what stops '[ Allow ]' passing for a night key. Hover adds the chip 'words by Claude'"
        why_end: "The low-zoom text form puts its ring at the rule's START because that text stands free; inside a scrap or a shape the start is against the edge, so the seal goes to the end. Under 50% the ring goes where the seal was"
        reverse: "YOUR words written into another hand's mark: the mark keeps its owner's look (dashed, its seal) and your filled disc stands at its foot with the chip 'words by you'. Your words then read as not vouched, which fails closed; they are never shown solid inside a mark the host does not vouch for, as an agent's words are never shown solid inside yours"
        fail_closed: "Words read as the person's only when every hand that wrote them is the person: by is human and wordsBy is unset or human. A person correcting one letter of Claude's text does not make Claude's text read as the person's"
      low_zoom: "Under 50% (strokes.low-zoom) the countermark keeps its form: it is ring-sized already and stays at the foot. The words sign's seal becomes the ring; the rule stays. A solid mark with a ring at its foot can then read like an agent's mark, because dashes close up under 50%: that errs towards 'not yours', and hover names the hands"
      too_small: "A mark too short to show two dashes (strokes.too-small) keeps its owner's ring at its first point; a countermark on it stands at least 4px rim to rim from that ring, moving out along its own diagonal until it clears, so two rings never touch or read as one figure"
      selection: "One mark selected with another hand in it: the line under the head (naming.selection) names every hand, owner first, then words by, changed by and put back by, then the newest change's time: 'yours · words by Claude · changed by Kit · 14:20'; 'Claude · ◇ fix-auth · changed by you · 14:20'. A quiet readout (lower case, --sec). Cut from its end, whole in title= and spoken. It now applies to the person's own marks too, which had no selection line"
      attr: "aegis G7: when this page's attribution digest does not match the board's (attr), the signs are drawn as this page folded them and the line under the head stands at keep_words.precedence 1b: 'Who changed what couldn't be checked · the marks themselves match'. No mark is dropped or hidden for it"
      never: ["the changing hand's seal at the owner's place (a scrap's pin head, a text's top edge, a frame's corner, a drawn mark's seal point): that reads as the changing hand's mark", "a sign told by colour, tint or a fill of the mark", "a sign shown only on hover", "a countermark inside a mark's box or on its edge", "the person's solid line taken off a mark the person drew", "an agent's words in a person's mark with no seal beside them", "a sign worked out from anything but the fold's otherBy, wordsBy and restoredFrom"]
    restored:
      by: "luna 2026-11-26, pass E-design, proposed, pending the founder (Aegis edit-anything G5, kept by the founder). A mark put back by an undo has a new id and is stamped by the hand that undid (s1.4-edit-anything-draft.md 3.1, F5). Drawn in specimen-board.html#restored"
      look: "It wears its ORIGINAL hand's look, from restoredFrom.by: Claude's text put back by you keeps its dashed box and Claude's seal; Kit's sticky put back by Claude keeps Kit's seal on its pin. When the hand that put it back is not the original hand, that hand is the countermark (other_hands.countermark) with the chip 'put back by you' or 'put back by Claude'. A mark put back by its own hand shows nothing more than it did before"
      solid: "aegis G5, bound: a restored mark is solid only when BOTH by (the hand that put it back) and restoredFrom.by are the person. So your mark put back by Claude keeps YOUR head (your plain pin on a scrap, no seal anywhere, its words never sealed as Claude's) but its line is dashed, because the putting back was Claude's row, and Claude's ring stands at its foot: 'put back by Claude'. A forged restoredFrom.by of the person on an agent's add never makes it solid"
      for_the_founder: "The brief asked for 'the reverse' too: a person's mark put back by an agent wearing the person's look. Drawn as far as Aegis's fail-closed condition allows: the person's pin and name, never the agent's seal, but a dashed line. If the founder wants it solid, Aegis must agree; the mod, not the agent, writes restoredFrom, so it may be safe, but G5 as ruled says dashed. Recorded as a choice, not settled here"
      words: "A restored mark's words are its original hand's: other_hands.words_sign reads restoredFrom.by as it reads by"
      selection: "'Claude · put back by you · 14:20'; 'yours · put back by Claude · 14:20'"
      low_zoom: "as its original hand's marks; the countermark as other_hands.low_zoom"
      never: ["the look of the hand that put it back in place of the original hand's", "a restored mark drawn solid unless both hands are the person"]
    never: ["authorship by hue, tint or fill", "a seal stored in an op, a file or a setting", "a human able to pick the dashed stroke", "a claimed seal drawn with a solid rim, or drawn without its parent's seal", "a mark with no host-vouched author drawn solid", "a seal for the unknown hand", "a seal as a control (it is not clickable in S1; the hands filter is later)"]
    specimen: "specimen-board.html#seal"
    chose:
      - { what: "a claimed sub-agent keeps its own cut, bead and letter, with a dashed rim", over: "showing only the session agent's verified seal with a 'has sub-agents' ring", why: "in Claude Code most named agents are sub-agents of one session, so nearly every seal would be the same and 'who made what' would be lost; the dashed rim keeps the claim honest" }
      - { what: "cut + bead + letter", over: "a letter alone, or a generated pattern (an identicon)", why: "a letter alone collides (jinx, judge); an identicon cannot be said aloud or recognised at 18px" }
      - { what: "seals always on scraps, on demand on drawn marks", over: "a seal on every mark", why: "thirty seals on a diagram bury it; the dash already says 'an agent', the seal says which" }
    status: proposed
    from: { session: 2026-11-23-gnomon-board-medium, board: author-seal, decided_by: none, decision: "TD-2026-11-24-500 (authorship is never shown by colour)", review: "Mika 2026-11-23, rendered at 1x (diamond and hex redrawn; bead accepted as an aid). Aegis 2026-11-23: accepted with conditions (ruling 5)", amended_by: [{ pass: "S1.4 P4-design", date: 2026-11-25, by: luna, decided_by: none, what: "strokes.agent-stroke, agent-frame, too-small and low-zoom; seal.ring; session_hint; where" }, { pass: "E-design", date: 2026-11-26, by: luna, decided_by: none, what: "other_hands (the countermark and the words sign, aegis G1); restored (aegis G5)" }] }
  pin:
    role: "The board's crafted device, reused wherever paper sits on the desk: a scrap is pinned, and its shadow is short and hard. On a live node the shadow is also a clock: it lengthens in steps as the node's reading ages, as on the instrument the product is named for."
    scrap: "A scrap is paper: a sticky, the stub (fallback-node), the empty note, and later a live node. Ink drawn on the desk (rect, ellipse, arrow, stroke, text, frame) is not a scrap: no pin, no shadow."
    anatomy:
      - "pin head, centred on the scrap's top edge: the human's plain pin (8px --ink disc, 1px 2px 0 shadow; at night a ringed point, no glow) or an agent's seal (author-seal, 18), or the unknown hand's hollow pin (author-seal.seal.unknown)"
      - "scrap: fill from the content palette (paper = --sheet), 1px edge in the swatch's line colour (--sec for lemon and paper), solid for the human and dashed for an agent; radius 3 by day, 0 at night; text 11.5 --ink"
      - "shadow, day: N px N px 0 rgba(22, 21, 15, .16), hard, no blur. Night: no fill shadow (phosphor has none); a 1px --sec trace of the scrap's outline offset by the same N"
    shadow_steps: { rest: 2, steps: [2, 4, 6, 8, 10], rule: "a live node declares how often it refreshes (every). Age under 1× every: 2. 1 to 2×: 4. 2 to 4×: 6. 4 to 8×: 8. 8× and over: 10, and its 'as of' line turns ink 600." }
    second_cue: "The shadow is never the only signal. A live node always prints 'as of hh:mm · <age>' (10.5 --sec), and its status reads by mark and word (rule status-in-ink)."
    motion: "A step change is an event (the age crossed a threshold): the shadow moves to its new length over droop 500ms ease-out. Nothing animates between steps. Reduced motion: instant."
    ships:
      s1: ["the pin on stickies, the stub and the empty note (plain head; the seal head arrives with S1.4)", "the shadow at rest (2) on every scrap, day and night", "the tokens for the steps, reserved and unused"]
      waits: ["the lengthening shadow: S6a, the live tray (S1 has no live nodes, so nothing in S1 changes length)", "paper tape for images: S2", "an agent's cap travelling to where it draws: after S1.4", "the hands filter that dims other hands' marks: later"]
    never: ["a shadow in --key-edge or at the key's 2px 2px 0 --key-edge (that is a key)", "a glow at night", "length as the only cue to staleness", "a pin on drawn ink"]
    engine_note: "The engine cannot draw shadows or pins. Scrap fills and edges are engine elements; pins, seals and shadows are a host layer tracking the viewport. If that layer cannot hold 60fps while panning, S1 ships pins and seals only and the shadow waits: say so at the S1.1 review instead of faking it in the engine."
    live_node_grammar: "mika, for S6a (nothing in S1): the loop graph (components.loop-graph) already uses the same strokes for other meanings: dashed is 'not reached' or 'not taken', dotted is 'waiting', a heavy vermilion edge is 'failed'. On a board dashed means 'not the host's word'. A live node that shows a loop or a run is drawn by the host, so its own edge is solid and it is a scrap (paper, pin, 'as of'); the loop graph's dashes and its fail colour may appear only inside that paper, never as ink on the desk, and rule content-colour-stays-on-the-board needs an exception written for host-drawn live nodes before one ships. An agent must not be able to draw a mark that passes for a live node: no agent mark gets a pin with an 'as of' line."
    night_trace: "mika, rendered: at rest (2px) the night trace shows as an L along the scrap's right and bottom edges and reads as paper lifted off the desk; it holds. At 6px and over it starts to read as a second sheet under the first, which in this console means a pile (zones.stack). Not an S1 matter. For S6a: draw the trace as the far two edges only, or shorten the night steps; decide with the live tray rendered."
    specimen: "specimen-board.html#pin"
    status: proposed
    from: { session: 2026-11-23-gnomon-board-medium, board: pin-and-shadow, decided_by: none, origin: ".paradigm/research/gnomon-canvas/luna.md §4; synthesis.md 'Look'", needs: "overrides: the proposed entry on foundations.shadow ('material, never a state signal')", review: "Mika 2026-11-23, rendered: the S1 parts hold (pin, shadow at rest, day and night)" }
  fallback-node:
    role: "How a node of a kind this build has no drawing for appears (a later medium's node, a mod's node; amendment A1): a stub. It must be legible, must not pass for an approval, and must not look broken."
    anatomy:
      - "a scrap on --sheet with a 1px --sec edge and a pin (dashed edge and sealed pin when an agent placed it)"
      - "a 12px hatched left margin (the leaf gutter's hatch, --rule): the mark of 'kept, not drawn'"
      - "line 1: the fixed lead word 'kind' (10.5 --sec, the tray's row-lead style), then the kind as written, '<ns>:<kind>', mono 11.5/500 --ink2, cut at 36 characters with … and the whole kind in title=. aegis: ruling 6: the lead word is never dropped, so a kind named like an instruction ('allow:approved-by-you', 'gnomon:run-this-now') reads as a name. The A13 fixture includes an approval-worded kind; the specimen draws one."
      - "line 2: 'not drawn by this Gnomon · kept as it is' (10.5 --sec)"
    size: "the node's own w and h when present, never under 156 × 52; else 156 wide and as tall as its two lines"
    behaviour: "Selectable, movable and deletable like any mark (ops address ids); never editable. Its unknown fields are carried through untouched and never shown: the only text taken from the node is its kind, which the kind grammar has already validated."
    states: [rest, selected, agent-placed]
    not_an_approval: ["no --key-edge, no key, no offset key shadow, no bracket", "no verb and no 'Allow', 'Open', 'Run' in its copy", "nothing in it is clickable"]
    not_broken: ["no ✕, no ◆, no vermilion or amber", "never the words error, unknown, unsupported, missing or failed", "no question mark, no placeholder icon"]
    specimen: "specimen-board.html#stub"
    chose:
      - { what: "show only the kind", over: "showing a label or text field when the node has one", why: "an unknown kind's fields are untrusted text from a newer build or a mod (Aegis S1.2: no free customData)" }
      - { what: "one sentence for every unknown kind", over: "naming the mod or version that would draw it", why: "this build cannot know which; a guess would be wrong half the time" }
    status: proposed
    from: { session: 2026-11-23-gnomon-board-medium, board: fallback-node, decided_by: none, plan: "s1-scale-amendments.md A1, A13 (the 'future dimension' guard fixture renders these)", review: "Mika 2026-11-23, rendered. Aegis 2026-11-23: accepted with the lead word (ruling 6)" }
  board-slip:
    role: "The offer slip's states for a board: how an agent offers one, and what the slip under a reply says once the board is folded and an agent has kept drawing ('Arky added 3')."
    pattern: "offer-slip (variant). offer-slip is contested until session 2026-10-20-gnomon-mod-invitations closes; this entry adds states to that pattern and settles nothing about it. If the founder's picks there change the slip, these states follow."
    states:
      live: "tab '◰ offer · board' · the agent's question · 'takes: a new dimension in <project> · nothing is drawn until you open it' · Open + not now. The Open key shows no key hint (aegis: ruling 7; it showed ⌥B)"
      gone: "'opened board · <title> · hh:mm'"
      added: "flat (no tilt: it is a record, not an invitation). Tab '◰ board · <title>'. One line: each agent's seal, '<name> added <n>' (a claimed sub-agent: '<name> added <n>, claimed'), at most two agents then '+<k> more', and 'since you folded it' when it fits. One GUI key: 'Open board ⌥B' (key quiet). It replaces the gone line under the latest reply that drew; older replies keep theirs."
    counts: "n is marks (nodes) added since the founder last had the board open, folded from the op rows by host-stamped author. The line is kernel-rendered DOM (Aegis S1.5); the agent never writes it. The dimension's title is a text node, cut at 40 characters, bidi-isolated."
    open_key: "aegis: ruling 7 (this does not settle the contested slip; it bounds it). ⌥B belongs to the desk (components.board-leaf.key_open) and only reopens or folds a board that already exists, so it is shown on the 'added' state's key and nowhere on a live offer. A live offer is accepted by a pointer press on Open, or from the keyboard only while focus is inside that slip (the Open key's own activation, or ⌥B there): otherwise an agent could time an offer to catch the habitual key. It never moves focus off a focused card. The slip's Open is not bound to Enter as a slip-wide shortcut, so it cannot collide with a decision key (Aegis S1.5). The hint on other offers (↵ today) belongs to the open session."
    never: ["open on arrival, on hover or by voice in S1", "a count the agent supplied", "a decision key, or the word Allow"]
    specimen: "specimen-board.html#slip"
    status: contested
    note: "Contested because its parent pattern is. Do not build the 'added' state before session 2026-10-20-gnomon-mod-invitations closes (S1 plan §3: it blocks S1.5)."
    from: { session: 2026-11-23-gnomon-board-medium, board: board-slip, decided_by: none, depends_on: { session: 2026-10-20-gnomon-mod-invitations, board: invitation }, review: "Mika 2026-11-23, rendered (states only; the slip pattern is not reviewed here). Aegis 2026-11-23 (ruling 7)" }
  # ── Proposed 2026-11-25, pass S1.4 P4-design. One new component; it is in the record before any of it is built.
  draw-grant:
    role: "The draw key: the one control beside an attached session's agent in the hands foot. It says whether that agent may draw on this board and a press changes it. It is a setting the person flips whenever they like (the board's write grant per session, s1.4-draft.md 4.3: the first session attached starts on, later ones start off), never a decision the kernel asks for."
    pattern: "key (variant quiet). No new shape: the system's quiet key at --key-h, with a small line glyph before its words. The overflow reuses menu. What is new is where it sits and the list of things it may never borrow (not_a_decision)."
    anatomy:
      - "the key: key quiet, --key-h (28px), 11.5, padding 0 8px, 6px between glyph and words. Its width is held at its longest words (min-width 12ch plus the glyph and padding), so a press never moves the next hand's key"
      - "the glyph, an 18 x 12 slot, 1.5 stroke, currentColor: ON is a straight line across the middle of the slot, dashed 4 on 2 off (M1 6.25 H17: three whole dashes at 1x), which is how this hand's marks look on the board. OFF is the empty slot: no line is drawn. luna final (Mika's question 4): the first glyph was a wave dashed 3 2, which at 1x was three or four specks; and the first OFF was a flat solid line, which beside a dashed ON would have read as the person's solid line. Not a dot (a filled dot beside a name is the person's pin, a hollow one is the unknown hand and the low-zoom ring), not ✓ (✓ is the stamp's mark) and not a switch track"
      - "the words: 'may draw' or 'may not draw', both in the quiet key's own ink (--ink2, weight 400), in both themes. luna final (Mika's question 3): ON was --ink at 500, which at night, where keys have no shadow, is one step from a card's Deny. The line and the words tell the two states apart; weight and colour do not. State is a word plus a mark, in ink (content.voice); no hue"
      - "place: in the hands foot, 8px after its hand's count slot (mika: 6px let the focus ring touch the count), components.board-leaf.hands_foot. The seal, the name and the count are not part of the key and do not press"
    states: [on, off, hover, focus, pending, refused, link-down, no-key]
    state-notes:
      on: "the dashed line, 'may draw'. The agent's next draw is taken"
      off: "the empty slot, 'may not draw'. The agent can still look at the board (looking needs no grant); its draws are refused by the board, and nothing of that shows in the leaf. Off is not disabled: the edge stays --key-edge and the words --ink2"
      hover: "--fold, as every key"
      focus: "2px --key-edge, 1px offset, as every key"
      pending: "mika R1, applied; aegis agrees (his M9: the foot shows 'may not draw' only after the mod's ok answer). Pressed, and the board has not answered. Under 300ms nothing changes (no flash). After that the key KEEPS THE WORDS THE BOARD LAST CONFIRMED, with the working mark (the working key's 9px spinner; still when motion is reduced) in the glyph's place, aria-busy and aria-disabled, the disabled look. It ends when the board's own answer or rows show the grant. The key never shows a state the board has not confirmed, in either direction. This replaces 'the words of what was asked for', which showed 'may not draw' on a hand that still could, and broke this component's own never"
      refused: "the board did not take the change (the session is no longer attached, the board has ended, or the board did not answer). The key goes back to what the rows say, keeps focus, and the leaf says one line for six seconds (words.refused). No ✕ and no --fail on the key: nothing failed that the person must fix"
      link-down: "mika R2 and aegis ruling 3, applied. The board is held still (not connected, reconnecting, out of date). BOTH states take the disabled look: edge --rule, words --sec at weight 400, the glyph in --sec; so 'may not draw' is not read as a live assurance. The key shows what was last known and its name reads 'Not connected · this can't be changed until the board is back'. A press sends nothing and is dropped; it says the leaf's held line again. When the link returns the key STAYS disabled until the board has said again who may draw (the grant map in the open answer, or the rows); only then does it show the state and take a press. The key adds no warning of its own: the line under the head says the board is not connected. Build: .key.quiet.bd-grant[aria-disabled='true'] { color: var(--sec); font-weight: 400 } must outrank the state's look. Residual, for the spec: while the link is down the person has no one-press stop on this page, and an agent whose grant was on may keep drawing"
      no-key: "a session whose agent has no way to draw (in S1.4 a local model session; s1.4-draft.md A6): its hand reads '<seal> local model <n> · can't draw on a board yet' in --sec, and there is no key. A key that sets nothing would lie"
    words:
      on: "may edit (luna 2026-11-26, E-design: was 'may draw'; edit_anything below)"
      off: "may not edit (was 'may not draw')"
      title_on: "<Name> may draw on this board · press to stop it drawing"
      title_off: "<Name> may not draw on this board · press to let it draw"
      title_pending: "<Name> <the confirmed words> on this board · saving the change"
      title_down: "Not connected · this can't be changed until the board is back"
      refused: ["Not changed · <Name> may still draw", "Not changed · <Name> still may not draw", "◇ <session> is no longer attached to this board (its hand then loses its key)"]
      no_key: "can't draw on a board yet"
      menu_row: "<seal> <Name> ◇ <session> <n>, then 'may draw' or 'may not draw' at the row's right end"
      with_session: "when author-seal.session_hint applies, <Name> is '<Name> in <session>' in the titles and the refused lines"
      why: "'may draw' is the task's own phrase and reads as a fact about the agent, not an order to the person. Off is 'may not draw' and not 'view only', 'looks only' or 'read-only': the first is a mode word, the second is odd, the third is jargon, and off has to be unmistakable at a glance. The title carries the next move (principle 5), because the key's face carries the state: the run mode key and the voice pill do the same"
    press: "One press changes it; there is no confirm, because both directions are cheap to undo and a stop has to be one press (aegis: accepted, ruling 1). aegis, bound: (1) the command carries an EXPLICIT TARGET, write true or write false, taken from the state the board last confirmed; it is never a toggle, so two presses racing another window's change can never invert what the person meant. (2) A press while the key is pending, while any draw key's change is in flight, while the link is down or while the board is held is DROPPED: never queued, never replayed on reconnect. While one change is in flight past 300ms every draw key takes the disabled look, and only the pressed one shows the working mark. (3) Nothing focuses a draw key except its own press: a render, an arrival line, a session attaching, the '+k' menu opening and a refusal all leave focus where it was, so Space or Enter cannot land on a key the person did not choose. If a focused key's hand goes (its session detached), focus goes to the board, never to another key (mika proposed the next key; aegis's condition overrules that). (4) Turning drawing on is spoken once, and it is never sent in the same stamp as an attach: attaching a session sends no grant. The press must be trusted (isTrusted) and is sent by the listener's own event through the one sender (dim.grant). Pointer, or Space or Enter while the key itself has focus. Nothing else reaches it: no letter, no chord, no ⌥B, no Enter from anywhere else, no voice phrase, no ⌘K command, no slash command, and nothing an agent can raise. Turning it off takes effect at the board's next row"
    a11y: "A button whose accessible name is the sentence in words.title_* (so the visible words are inside the name); no aria-pressed and no switch role, because the name already changes with the state. mika: set the name once, as aria-label on the button, and put the pointer's tip on the words inside it, or a screen reader says the sentence twice. aria-busy while pending. A confirmed change is spoken once through the leaf's polite line: '<Name> may draw' or '<Name> may not draw'. Target 28px tall and over 120px wide"
    not_a_decision:
      - "aegis (S1.1): nothing on a board may look like a card or an approval key. The foot is the leaf's own chrome, outside the board, and no mark can be drawn over it (the board clips at its edge); the key still borrows nothing from a decision"
      - "look: the quiet key only. Never the primary key (no ink fill), no offset key shadow, no sheet or box round the hand, no left edge in a project hue, no family glyph (◇ here is a session's name, not a card's head), no stamp and no fade when it changes, no countdown"
      - "words: never Allow, Deny, Approve, Trust, Grant, Always, 'permission' or 'access', on the key, in its title or in its lines; no cost after ' · ' ('· presence', '· needs trust'): it costs nothing and asks for no presence"
      - "keys: never A or D, never Enter from outside the key, no kbd hint, no voice tag"
      - "place: never in the stack, the pinned zone, a card, a slip, a toast or the board itself; never beside an agent's question. It does not arrive: it is there from the moment a session is attached, in the same place, and nothing an agent does moves it (hands_foot.order)"
      - "record: it writes the board's own grant row; it raises no card and is no rule in Settings › Permissions. The kernel's run mode still holds every tool in manual mode, and a loop session still cannot draw; this key cannot loosen either"
    never: ["a filled or primary look for 'on'", "a switch track, a checkbox or a pill", "glyph only, with no words", "optimistic words the rows have not confirmed", "a key for a hand that has nothing to set (unknown hand, a claimed sub-agent, a session no longer attached, a local model in S1.4)", "a confirm dialog", "a toast for its lines", "hidden behind an overflow with no way to press it (hands_foot.overflow)"]
    aegis:
      by: "Aegis 2026-11-25, s1.4-draft.md 'Aegis rulings: S1.4 P4-design (three items)'. Each line is a P4b test"
      one_press: "accepted with conditions: an explicit target, never a toggle; a press while pending, link-down or held is dropped, never queued or replayed; no agent activity moves a key (the count sits in a fixed-width slot: a count going from 9 to 1 000 leaves every key's box unchanged); nothing focuses a draw key except its own press; turning on is spoken once and is never sent with an attach. Bound in press, state-notes and components.board-leaf.hands_foot"
      link_down: "accepted with conditions: both states take the disabled look while down; on return the key stays disabled until the grant map has arrived again; no press in that gap sends anything; the residual is stated. Bound in state-notes.link-down"
      pending: "agrees with mika R1: the key shows only what the mod confirmed (his M9)"
      for_the_spec: "this is not a kernel grant, and any holder of the GUI credential can set it (his M10 sentence stays in the spec)"
    luna_final_s14:
      by: "luna 2026-11-25, final pass on Mika's rendered review; proposed, pending the founder. Where these differ from anything above them in the history of this entry, these win"
      R1: "applied: pending keeps the confirmed words (state-notes.pending, words.title_pending); redrawn"
      R2: "applied: the disabled look outranks the state's look, weight 400 (state-notes.link-down); both states drawn"
      R3: "applied: the foot clips sideways only (components.board-leaf.hands_foot.height)"
      R4: "applied: the hands menu is the leaf's .bd-menu and opens upward (components.board-leaf.hands_foot.overflow); redrawn above the foot"
      low: "applied: the key stands 8px after the count; 'press to stop it drawing'; the name set once. Not applied: mika's 'focus to the next key' when a focused key's hand goes, which aegis's focus condition overrules (press, item 3)"
      question_3: "both states at --ink2 400 in both themes (anatomy, the words)"
      question_4: "a straight line dashed 4 2 for ON, an empty slot for OFF (anatomy, the glyph)"
      caution_kept: "mika: the held-width key with left-set words reads a little like a field at night. Kept: the held width is what stops a press moving the next key, and the key has a key's edge, height and pointer. For the founder to see at night"
    edit_anything:
      by: "luna 2026-11-26, pass E-design, proposed, pending the founder (Aegis edit-anything ruling 1: 'the draw key's words say what the grant now allows (\"may draw and change marks\")'; Aegis reads them). Where this differs from anything above it in this entry, this wins. Drawn in specimen-board.html#draw-key-edit"
      face: "CHANGED: 'may edit' and 'may not edit' (were 'may draw' and 'may not draw'). A grant now lets an agent add, change and remove any mark, the person's included, and 'draw' says only the first. Aegis's 'may draw and change marks' is 25 characters: it breaks the held width (12ch), the foot at a 1024 window holds one hand as it is, and at 303px the first hand already loses its name to keep its key. 'may edit' says add, change and remove in one plain word, its longest face 'may not edit' is 12 characters, and every width in hands_foot stays as Mika measured it"
      titles: "title_on: '<Name> may draw on this board and change or remove any mark, yours included · press to stop it'. title_off: '<Name> may not draw or change marks on this board · press to let it'. title_pending: '<Name> <the confirmed words> on this board · saving the change'. title_down unchanged. The sentence says what is at stake where there is room for it"
      spoken: "turned on: '<Name> may edit this board: it can change and remove any mark'; turned off: '<Name> may not edit this board' (once, through the leaf's polite line)"
      refused: ["Not changed · <Name> may still edit", "Not changed · <Name> still may not edit", "◇ <session> is no longer attached to this board (its hand then loses its key)"]
      menu_row: "'may edit' or 'may not edit' at the row's right end"
      unchanged: "the glyph (the dashed line when on, the empty slot when off), both states in --ink2 400, the held width, the press rules, pending, link-down and every not_a_decision line. A local model's hand still reads 'can't draw on a board yet': it cannot add marks either"
      why: "'edit' is the plain word for changing a document, and a board is one; it reads as a fact about the agent, as 'may draw' did. Not 'may change' (alone it reads as 'might change'), not 'write' or 'full access' (jargon, and banned here), not two keys per hand (draw, change), which would double the foot"
    specimen: "specimen-board.html#hand-grant"
    chose:
      - { what: "a quiet key that states the fact ('may draw' / 'may not draw'), its title naming the next move", over: "a two-part segment 'draw | look' per hand, or a ▾ menu per hand", why: "a segment per hand doubles the foot's width, which holds one hand at a 1024 window as it is; a menu makes stopping an agent two presses" }
      - { what: "the key sits after the hand; the seal and name do not press", over: "the whole hand as one key", why: "a seal is never a control (author-seal.never), and the hands filter planned for later needs the hand's own press" }
      - { what: "the glyph is the hand's own dashed line", over: "a filled or hollow dot, ✓, or a switch track", why: "dots in the foot are already the person's pin, the unknown hand and the low-zoom ring; ✓ is the stamp's; a switch track is the stock control. The dashed line is what this setting lets onto the board" }
      - { what: "no confirm on either press", over: "a confirm when turning drawing on", why: "a confirm would make it a decision, and the place for decisions is the stack" }
    status: proposed
    from: { pass: "S1.4 P4-design", date: 2026-11-25, by: luna, decided_by: none, plan: ".paradigm/research/gnomon-canvas/s1.4-p4-design-rulings.md", draft: ".paradigm/research/gnomon-canvas/s1.4-draft.md (L1 to L4, F3)", amended_by: [{ pass: "E-design", date: 2026-11-26, by: luna, decided_by: none, what: "edit_anything: the face reads may edit / may not edit; titles say a grant lets the agent change and remove any mark" }] }
  dimension-list:
    role: "This project's dimensions as a list you open one from: what the board leaf's 'Dimensions ▾' key opens, and the rows that /boards and ⌘K 'Dimensions: list' show. Until this pass the key opened the centred command palette over a scrim, 553px wide across the sessions rail and the stack, while its ▾ promised a menu."
    pattern: "menu (variant), in the leaf's own menu (.bd-menu, ui/board-leaf.ts menuOf and placeMenu, as the rail's ⋯, the percent and the hands menus). Its row is the loop-row's two-line form (mark, name first, facts in the readout voice). No new surface, no new token. Not a sheet: no scrim, nothing behind it is dimmed, and the board stays as it was."
    anatomy:
      - "the menu: .bd-menu (fill --sheet, 1px --key-edge, radius 3, the menu's shadow), 4px of padding, rows with no gap and no rule between them: spacing and the two-line rhythm set them apart"
      - "a row, two lines, 42px: a mark (spans both lines, 11.5 --ink) · line 1: the title (11.5, weight 500, --ink; cut with …; 'Untitled' when it has none) and, at the right, the time (10.5 --sec, tabular) · line 2 (10.5 --sec, cut from its end with …): who is attached and the state, in words joined by ' · '"
      - "the mark: ● a dimension that is open somewhere (its board has not been folded for good: the model's ended is false) · ○ folded · … was opening when the link dropped. Ink only, never a hue (principle 1); the loop-row's marks, with the same meanings of live, idle and waiting"
      - "the time: from the listing's lastAt, the kernel's time of its last row: hh:mm today, else 'Nov 24', and 'Nov 24 2025' when it is not this year (core/board-open.ts listTime; mika); nothing when unknown"
      - "line 2, by case. The board open in this leaf: 'open here · <the check>' (components.board-leaf.check; the mismatch in --fail). Open somewhere, this session attached: 'attached ◇ <session>[ +n]', this session first (the keep line's form). Open somewhere, this session not attached: '◇ <session>[ +n] · opening attaches this session'. Folded: 'folded · opening starts it again'. Folded and held only in part (the model's partial): 'folded · opening shows part of it' (FINAL, mika D4 and her Q3: the first record's ' · partly shown' was cut off at 303px and said 'shown' of a board that is not shown). Open somewhere and held in part: ' · part of it is shown' after its other words. Was opening: 'didn't finish opening · a press tries again' (FINAL: 'was opening when the link dropped' did not say what a press does). A session the page cannot name is counted: '2 sessions'. FINAL (mika D4): when 'open here · <the check>' would be cut, 'open here · ' goes; the check is never cut"
      - "the open board's row: a 2px --key-edge rule on its left edge and its title at 600 (the loop-row's active rule, without the fill, so it is not taken for hover); aria-checked true. FINAL (mika D1): it is ALWAYS THE FIRST ROW and stands above the rows that scroll, as the find row stands below them, wherever the log's order would put it. FINAL (mika D6): it takes no fold fill for hover or focus, only the inset ring for focus, so the mismatch's --fail stays on --sheet (5.45:1; on --fold it is 4.30:1 by day)"
      - "the last row, under a 1px --rule: 'Find a dimension…' with '/boards' at its right (a plain .bd-mi row). It opens the palette's find list (below). Always in view: when the rows scroll, they scroll above it"
      - "no heading: the key that opened it says 'Dimensions'"
    placement: "Hung under the head's Dimensions key, 4px below it, its right edge on the key's right edge, downward over the keep line and the board, INSIDE the leaf: never over the turn strip, the pinned cards or the composer (rule board-centre-only). Width: 344px, or the leaf's width less its 14px insets when that is less (275px in a 303px leaf); it never passes the leaf's left inset. Height: its rows, up to the leaf's foot less 8px; past that the rows between the open row and the find row scroll and are cut through a second line (components.board-rail.menus_scroll). FINAL (mika D3): when that room is under 87px (the open row, the rule and the find row), the head key opens the palette's list instead, which carries the same rows and the check; its aria-haspopup is then 'dialog'. So the list never covers the foot or the draw keys and the check's second home is always in reach. In the DOM right after its key, so Tab goes key → rows → esc (the menu component's rule). A redraw of the head keeps the key and the open menu"
    states: [closed, open, row-hover, row-focus, row-current, empty, reopens, partly-shown, was-opening, link-down, scrolls, mismatch]
    state-notes:
      row-hover: "--fold, as every menu row"
      row-focus: "--fold and an inset 2px --key-edge ring (the slash menu's active row)"
      empty: "no row: one quiet line, 'No dimensions here yet · /board opens one' (10.5 --sec), then the find row. With no session open: 'Open a session first'. No drawing, no key, no empty-state sheet"
      reopens: "a folded dimension. Its row presses like any other and says before the press what it will do: 'folded · opening starts it again'. After the press the leaf says the keep line's 'That board was folded · opening it starts it again' once"
      partly-shown: "the page holds only part of this dimension (it was dropped from the page's memory and written again). its row says 'folded · opening shows part of it' (or ' · part of it is shown' when it is open somewhere); opened, the leaf says 'Earlier marks aren't shown here · the saved board has them'"
      was-opening: "a dimension this page asked to open whose rows it has not read. Listed straight after the open row, with … and no time, so none is lost from sight; its line says a press tries again"
      link-down: "the board is held still. The list still opens and can be read. Its first line reads, in ink, 'Not connected · nothing can be opened yet'; every row and the find row are aria-disabled and draw in --sec, keep their place in the arrow order, and a press sends nothing and says that line again. The open board's row keeps its rule"
      mismatch: "the open board's second line reads 'open here · doesn't match the saved board' in --fail; the keep line says what to do"
      opening: "a press closes the menu at once and the leaf's own line reads 'opening the board…'; a refusal is the leaf's line, never a line in a closed menu"
    press: "A row opens its dimension on THAT trusted press (isTrusted): attach first when this session is not attached, then open (core/board-open.ts planBoardRow, as built). The open board's row only closes the menu. Nothing else is in a row: no rename, no end, no delete, no second key"
    keyboard: "On the key: Enter, Space or ↓ opens it and focus goes to the open board's row (else the first row). ↑ ↓ move and do not wrap; Home and End; a typed letter goes to the next title that starts with it. Enter or Space opens the row. Esc closes the menu ONLY and returns focus to the key; the leaf stays open (components.board-leaf.esc_order). Tab closes it and moves on. No letter typed here reaches the rail or the board"
    a11y: "The key: aria-haspopup='menu' and aria-expanded (it said 'dialog' while it opened the palette). The menu: role menu, aria-label 'Dimensions in this project'. Rows: role menuitemradio, aria-checked on the open board's; the accessible name is the title, the time and the second line in full, cut or not. A row that cannot open is aria-disabled and focusable, never removed"
    slash_boards: "RULED: '/boards' and ⌘K 'Dimensions: list' keep opening the palette's list (as built, ui/app.ts openDimensions), with or without a board open, and with the SAME rows: this anatomy in the palette's row, the same marks, words and press. Reason: they must work when no board is open (there is no head key to hang from), and a project can hold hundreds of dimensions, which needs the palette's find field. The menu is the near list; the palette is the find. The menu's last row is the way from one to the other. The head key's title becomes 'Dimensions in this project' (it said '(/boards)', which is now the find row's own hint). Until the menu ships, the palette's rows take these words, the check on the open board's row included"
    never: ["a sheet, a scrim or a centred box for the head key's list", "a card look: no left edge in a project hue, no box or rule round a row, no shadow on a row, no family glyph, no stamp", "a decision key, a primary key, or any key inside a row; the letters A and D; a kbd hint on a dimension's row (the find row's '/boards' is the one hint)", "a pill or a badge for a state: states are a mark and words", "a small uppercase label over the rows", "a row an agent can add, reorder or press: the order is the log's (newest first) as it was when the list opened, and the press is the person's", "open over the pinned cards, the turn strip or the composer", "a state only in a title="]
    tokens: { fill: --sheet, edge: "1px --key-edge", radius: 3, row: "42px; padding 4 8 4 6; 2px left rule (transparent, --key-edge when open here)", title: "11.5 500 --ink (600 when open here)", time: "10.5 --sec tabular", line2: "10.5 --sec; --fail for a mismatch", hover: --fold, focus: "--fold + inset 2px --key-edge", disabled: --sec }
    specimen: "specimen-board.html#dimension-list"
    aegis:
      by: "Aegis 2026-11-25, s1.3-p4b3-design-aegis-ruling.md 4: ACCEPTED WITH CONDITIONS. A row never shows mark text, an agent's own words, a preview of its last row, or a dimension outside this session's project. Each line is a test"
      C4_1: "scope is core/board-open.ts listingsFor only. When the session's repo cannot be told, only the dimensions this session is attached to are listed (and 'opening attaches this session' then never shows). Test with listings of two repos"
      C4_2: "the title goes through the same check as the leaf head's and is set by textContent only. A title that fails reads 'Untitled', never raw. Control and bidi characters are removed. It stands only in line 1. Line 2 is fixed words and host labels"
      C4_3: "a session's name is the host's label through the foot's function, cut at 16 characters. A session the page cannot name is a count"
      C4_4: "the open row's check comes from this page's session (checkLine), never from the listing"
      C4_5: "the plan is computed from the listing AT THE PRESS. If ended or attached has changed since the row was drawn, the press sends nothing and the row redraws. 'opening attaches this session' gives an agent a hand, so it must be what the person read"
      C4_6: "row order is frozen while the menu is open (luna_final D5)"
      C4_7: "link down: a press on a disabled row sends no dim.attach and no dim.open, and nothing is queued to fire when the link returns"
      C4_8: "the press is trusted (isTrusted) on the row itself: a click, or Enter or Space with the row focused. The key press that opened the menu and typeahead never open a row"
    luna_final:
      by: "luna 2026-11-25, design-foot FINAL, after mika's rendered review (s1.3-p4b3-design-mika-review.md) and aegis's ruling (s1.3-p4b3-design-aegis-ruling.md); proposed, pending the founder. mika: 'a sound component and not a stock one'; six changes before it is built"
      D1: "applied: the open board's row is always first, above the rows that scroll (anatomy)"
      D2: "applied: the cut passes through a line of text; whole rows plus 30px here (components.board-rail.menus_scroll)"
      D3: "applied: under 87px of room the head key opens the palette's list (placement)"
      D4: "applied: the record and the specimen now agree. 'folded · opening shows part of it' (her wording); 'open here · ' goes before the check is cut; never 'a kbd hint on a dimension's row'"
      D5: "applied, and aegis C4.6: while the menu is open the rows KEEP THEIR ORDER and no row is added above the pointer; a row's words may change in place (the check, who is attached). The menu is rebuilt only when what it shows has changed (the rail's own rule, ui/board-leaf.ts). A dimension that appears while it is open is added at the end of the scrolling rows. core/board-open.ts dimensionRows sorts by lastSeq, so without this an agent that draws moves its row under the pointer"
      D6: "applied: no fold fill on the open row (anatomy)"
      B1: "applied to the builder list (s1.3-p4b3-design-rulings.md): 'through menuOf and placeMenu' was wrong. menuOf builds one-line menuitem rows and sends focus to the board after a press; placeMenu finds its menu inside the rail. The list needs its OWN builder, a placeMenu that takes a menu and its room, and the rows and a choose callback in the leaf's options (the dock has rows() and choose(dim, event))"
      should_fix: "applied: 'didn't finish opening · a press tries again'; the year on a date that is not this year; the #menu-cut caption (a 140px board)"
    chose:
      - { what: "the leaf's own menu under the key", over: "the centred palette (as built), a sheet, or a key without ▾", why: "the ▾ promises a menu; a sheet with a scrim covers the stack, where a card may be waiting; a key without ▾ that opens a palette is a second ⌘K" }
      - { what: "two-line rows set apart by spacing", over: "one line with the state in a chip, or a grid of dimension cards", why: "a chip per row is the pill the house rule bars, and a card is the one thing a board's chrome may never look like (rule nothing-on-a-board-is-a-key)" }
      - { what: "/boards keeps the palette", over: "/boards opens the head key's menu", why: "the menu has no anchor when no board is open and no find field for a long list" }
    status: proposed
    from: { pass: "design-foot", date: 2026-11-25, by: luna, decided_by: none, review: "s1.3-p4b3-mika-review.md L5", plan: ".paradigm/research/gnomon-canvas/s1.3-p4b3-design-rulings.md" }
  # ── Proposed 2026-11-26, pass E-design. One new component; it is in the record before any of it is built.
  undo-key:
    role: "The key that undoes one hand's change on a board: a whole agent turn, an agent's undo of a person's change, or one hand's change to one mark. It lives only in the turn strip (components.board-leaf.turn_strip.notice). It is the board's way back from a change another hand made; the page's own ⌘Z (core/dim-undo.ts, B3) stays the person's undo of their own edits and never presses this key."
    pattern: "key (variant quiet), like show chat and the draw key: --key-h, 11.5, padding 0 8px, words only, no glyph. What is new is where it sits, its fixed slot, its words and what it may never borrow (not_a_decision, as in draw-grant)."
    words: { undo: "undo", redo: "redo", put_back: "put back", dismiss: "dismiss" }
    slot: "aegis E3, bound: each key sits in a FIXED-WIDTH slot at its row's right end, held at the longest word it can say in that row plus room for the working mark (undo and redo: 4ch; put back: 8ch; dismiss: 7ch; each plus 16px of padding and 14px for the 9px working mark and its gap), so a change of words, the pending mark or a count in the row never moves it or a key beside it. From the right edge: show chat (turn row only), then the undo key, then dismiss (notice row only); 8px between keys, 12px between the words and the first key. The row's words give way first (turn_strip.notice.tight); a key is never cut"
    states: [live, hover, focus, pending, done, dismissed, refused, link-down, too-short, not-yet]
    state-notes:
      live: "the words in --ink2 400 on the quiet key's --key-edge edge"
      hover: "--fold, as every key"
      focus: "2px --key-edge, 1px offset, as every key"
      pending: "pressed and the board has not answered: under 300ms nothing changes (no flash); then the key keeps its words with the working mark (the 9px spinner) before them, aria-busy and aria-disabled, and EVERY undo, redo, put back and dismiss key on the leaf takes the disabled look until the answer (draw-grant.press item 2). A press now is dropped"
      done: "the board answered ok: the line under the head says what was undone (board-leaf.said.undo) and the pressed key becomes 'redo' in the same slot for six seconds, paused while hovered or focused (the toast's rule), then its row goes. redo is the undo of that undo (s1.4-edit-anything-draft.md 3.1) and is pressed and dropped by the same rules. A partial answer that says more keeps 'undo' (said.undo.more)"
      dismissed: "dismiss changes no mark: the notice goes, its cut-outs go, and the board is told the notice was seen, which releases its hold on that change-set (aegis G6). The marks can still be undone one by one through the mark row while the board keeps the change"
      refused: "the board did not undo (too old, nothing to undo, busy): the key stays or its row leaves as said.undo says, and the line under the head says why for six seconds. No ✕ and no --fail on the key: nothing failed that the person must fix"
      link-down: "held still by the link or a mismatch: every key here takes the disabled look (edge --rule, words --sec, weight 400) and its name reads 'Not connected · this can't be undone until the board is back'. A press sends nothing and is dropped, never queued and never sent on reconnect. On return the keys stay disabled until the board has caught up (the open answer or a check point after the rows the row was drawn from); the row is drawn again first"
      too-short: "NOT held for these keys: as the draw keys do (board-leaf.too_short C3_3), undo works while the board is too short to draw on"
      not-yet: "a turn still running whose hand may still edit: no undo key (undoing under a hand that is still writing races its next rows). The slot may say '<Name> is still changing your marks'. The key comes at the turn's end, or the moment the person turns that hand's draw key off (board-leaf.supervision.stop_then_undo)"
    press: "aegis E3 and P4-design ruling 1, bound. (1) A TRUSTED press only (isTrusted): a pointer press, or Space or Enter while the key itself has focus, sent by the listener's own event through the one sender (dim.undo). No letter, no chord, no ⌘Z or ⇧⌘Z, no Enter from elsewhere, no voice phrase, no ⌘K or slash command, nothing an agent can raise. (2) An EXPLICIT TARGET, taken at the press from what the row showed: the change-set its row names (turn:<hsid>/<n>, or a person's act), ids when it is a mark row, and base, the seq the row was drawn at. If that set is no longer what the row says (undone already, or the row is stale), the press sends nothing and the row is drawn again. Never 'undo the latest' and never a toggle, so a press racing an agent's next turn undoes what the person read. (3) DROPPED, never queued, never replayed: while it or any undo or draw key is pending, while the link is down, while the board is held still, and on reconnect. (4) Nothing focuses it but its own press: a notice arriving, a row changing, a turn ending and a refusal leave focus where it was; when a focused key's row goes, focus goes to the board, never to another key. (5) One press is one call: a plan larger than one call answers more and the person presses again; the page never sends the rest on its own"
    a11y: "A button whose accessible name is the whole sentence, set once as aria-label (the visible word is inside it): 'Undo Claude in billing-ui's turn of 14:20 · it changed 3 and removed 2 of your marks', 'Undo Claude's change to this mark', 'Put back your mark that Claude removed', 'Redo · put Claude's changes back', 'Dismiss · keep these changes'. The notice and mark rows are not live regions (#turn-say and the leaf's status line stay the ones that speak). Tab order: the notice row's keys, then the turn row's (working key, undo, show chat). Target 28px tall and at least 44px wide"
    not_a_decision:
      - "look: the quiet key only. No ink fill, no offset shadow, no night brackets of a primary key, no stamp or fade when pressed, no countdown, no kbd hint"
      - "words: undo, redo, put back and dismiss only. Never Allow, Deny, Approve, Accept, Reject, Keep, Revert, Trust, Grant, Always, 'permission' or 'access'; no cost after ' · '"
      - "keys: never A, D, Enter from outside the key, ⌘Z or ⇧⌘Z"
      - "place: the turn strip only. Never the stack, the pinned zone, a card, a slip, a toast, the foot, or on the board (rule nothing-on-a-board-is-a-key: that is why 'the undo key on a selected mark' is the strip's mark row and not a key at the mark)"
      - "undo and dismiss are two quiet keys side by side, as an alert's 'Open run' and 'Dismiss' are (components.alert, a sheet that decides nothing). Neither is primary and neither word answers a question, so the pair never reads as a card's Allow and Deny. 'keep' was not taken for dismiss because 'undo · keep' reads as a choice the board asks for"
    never: ["a key drawn at a mark or anywhere on the board", "a key that undoes 'the latest' rather than the set its row names", "a press replayed on reconnect", "words the board has not confirmed", "a confirm dialog (the undo is itself undoable)", "⌘Z reaching it", "an agent able to raise, move or focus it"]
    specimen: "specimen-board.html#undo-notice"
    chose:
      - { what: "one place for undo keys, the turn strip, with a mark row for a selected mark", over: "a key at the selected mark on the board, or keys in the hands foot", why: "no key may stand on a board; the foot holds one hand at a 1024 window as it is; the strip sits under the board and already holds the turn's key" }
      - { what: "a standing notice with undo and dismiss", over: "a said line for six seconds, or a notice dismissed by the person's next message", why: "aegis G6 keeps the change undoable until the person has pressed or dismissed it; a six-second line would let a destructive turn scroll away, and a next message in this session says nothing about another session's turn" }
      - { what: "redo in the pressed key's slot for six seconds", over: "no redo, or a redo that stays", why: "every change easy to undo includes the undo; a key that stays would be one more standing thing" }
    status: proposed
    from: { pass: "E-design", date: 2026-11-26, by: luna, decided_by: none, plan: ".paradigm/research/gnomon-canvas/s1.4-e-design-rulings.md", draft: ".paradigm/research/gnomon-canvas/s1.4-edit-anything-draft.md (2.4, 3, 4; Aegis G2, G6, E3, ruling 5)" }

# ─────────────────────────────────────────────────────────────────────────────────────────────────────────────────────
# Content palette (PROPOSED 2026-11-23, session 2026-11-23-gnomon-board-medium). The colours of what is drawn on a
# board, published to contracts as content-palette:v1 at S1.2. It is deliberately NOT under foundations.color: that
# block is the console's palette and `atelier check` reads it as "allowed in any Gnomon UI file". Content colours are
# allowed only as board content (rule content-colour-stays-on-the-board). Free hues for content were decided by the
# founder (TD-2026-11-24-500) over Luna's recorded dissent; this block is how that decision is carried out.
# ─────────────────────────────────────────────────────────────────────────────────────────────────────────────────────
content_palette:
  id: "content-palette:v1"
  status: proposed
  roles:
    line: "strokes, arrows, frame edges when coloured, and text drawn in a colour"
    fill: "sticky paper and shape backgrounds"
  text_on_fill: "The text of a sticky or a filled shape is always the theme's text.primary on a named fill (measured in review: 13.57:1 or better by day, 9.69:1 or better at night). On a custom fill it is text.primary; a custom fill that would bring that pair under 4.5:1 is refused by fill_rule, so text never flips to text.on-ink (aegis: ruling 1: an ink fill with on-ink text is the primary key). luna 2026-11-25: that refusal was written here and never built (measured in the contracts pass: custom:#404040 passed as a fill with ink on it at 1.76). It is now exact: contrast_rule.fill."
  fill_rule: "aegis: ruling 1 (S1.2). The neutral exemption is for the line role only. A fill, named or custom, neutral or not, is tested against text.primary and line.key-edge of each theme it is seen in, with no exemption, at minimum_distance.min. An agent mark's dashed edge has at least 3:1 against its own fill. mika, measured: every named fill is 0.52 or more from both tokens in both themes, and every named edge on its own fill is 4.49:1 or better by day and 4.54:1 or better at night (lemon and paper take the --sec edge: 6.06 and 6.55 by day, 4.17 and 5.78 at night), so the named set passes."
  renderer: "aegis: ruling 3. The renderer never trusts a stored row: a stored colour token that fails the current check resolves to ink (line) or none (fill) when drawn; it is never stepped towards a passing colour and the row is never rewritten. Reserved values may change after rows exist."
  contrast_rule:
    by: "luna 2026-11-25, final pass on S1.4 P4-design, ruling the open question of Aegis S1.2 nit 6 (the contracts builder built nothing and asked). Proposed, decided_by: none; the contracts pass builds on it. It adds to the distance rule and replaces nothing in it"
    ratio: "The WCAG 2 contrast ratio, (L1 + 0.05) / (L2 + 0.05) on relative luminance, from the same literal 256-entry linearisation table as the distance rule (aegis: S1.1 ruling 4: one implementation in gnomon-contracts/src/content-palette.ts), compared as integers with no rounding up: 4.499 fails 4.5. A colour is tested as its day value against the day surfaces AND as its night transform (custom.night_transform, by role) against the night surfaces. Both themes must pass, because a board is seen in both"
    surfaces: { day: { ground: "#EDE8DC", sheet: "#F8F5EE", text.primary: "#16150F" }, night: { ground: "#0F1116", sheet: "#171A21", text.primary: "#E8F4F0" }, note: "the desk a mark is drawn on (surface.ground) and paper (surface.sheet, the paper swatch). A line must clear BOTH in each theme, so the lower ratio governs: by day that is the ground, at night the sheet" }
    line: "(a) A LINE colour, named or custom: at least 3.0 against the ground and against the sheet, in both themes, when it is the line of a shape, arrow, stroke, frame, sticky or stub; at least 4.5 against both when it is the colour of a TEXT mark, because there it is read as words. Two floors, chosen by the kind of the mark the field belongs to, which the validator already has. Why not 4.5 everywhere: the founder decided for free hues (TD-2026-11-24-500), and a teal or a mid grey line at 3.5 is a fair line and an unfair paragraph; 3:1 is the floor for a drawn line and 4.5:1 for words. Why both surfaces: custom:#767676 is 4.17 on the sheet and 3.72 on the ground, and marks are drawn on the ground"
    neutral_line: "(b) A neutral line (chroma under 0.02) stays exempt from the DISTANCE rule and is NOT exempt from this floor. custom:#F8F5EE as a line is 1.00 on the day sheet and is refused; custom:#767676 passes as a line (3.72) and is refused as text"
    fill: "A FILL colour, named or custom, neutral or not: text.primary of each theme has at least 4.5 on it (day value under day ink, night fill transform under night ink). This is text_on_fill made exact. custom:#404040 as a fill is refused (ink on it 1.76); custom:#808080 passes (4.63)"
    pair: "(c) THE EDGE ON ITS OWN FILL: when a mark has a line and a fill other than none, the line has at least 3.0 against that fill, in both themes (day line on day fill; night line transform on night fill transform). Enforced WHEN THE MARK IS WRITTEN, by the one shared validator, for EVERY hand: the person in the tray and an agent through its tool get the same refusal. Not agents only: one validator serves both (aegis: S1.1 ruling 3), every named line on every named fill already passes (lowest 4.11), so the person meets it only with a custom colour, and an edge that cannot be seen is no use to the person either. For an agent it is also what keeps the dash visible (aegis: S1.1 ruling 1). The field refused is the one being written, judged against the mark's other colour as it will be after the op. AT PAINT the renderer checks again and never trusts the row (aegis: ruling 3): a stored line that fails any part of this rule draws as ink, a stored fill that fails draws as none, and a stored pair that fails draws its line as ink; ink on a passing fill is 4.5 or better, so the edge always shows. Nothing is rewritten"
    measured: "computed 2026-11-25 with the record's own transform (it reproduces the swatch table). Named lines, lower of ground and sheet: 4.59 or better by day, 6.56 or better at night; graphite 5.83 and 5.78. Ink on named fills: 13.57 or better by day, 9.69 or better at night. So every named swatch passes every part. Over a 16-step grid of all colours the night line transform is never under 6.03 and night ink on a night fill never under 7.20: the day value is what decides a line and a fill; only the pair can fail at night alone (sampled as low as 2.83)"
    refusal: "Code colour-bad, no new code (aegis: S1.1 ruling 3; the refusal codes are a published list). The value is never stored. In the tray, under the field, '✕ not used · <why>' and one quiet key naming a swatch that works (content-tray custom-refused). The why, in plain words: a line that fails: 'too faint to see on the board'; a text colour that fails: 'too faint to read as words'; a fill that fails: 'words would be too faint on it'; a line that fails against the mark's fill: 'it would not show against this mark's fill'; a fill that fails against the mark's line: 'this mark's line would not show against it'. When only the night value fails, ' at night' is added. The swatch offered: for a line or a text colour, the nearest named line by the distance rule's measure (ink and graphite included); for a fill, the nearest named fill; for a pair, 'Use ink' for the line or 'Use paper' for the fill, which always pass. An agent's tool gets field, code and a fixed fix sentence naming that swatch, and none of its input back. The ratio and the surface stay in the raw view"
    test_vectors:
      - { v: "#F8F5EE", role: line, pass: false, why: "1.00 on the day sheet, 1.12 on the ground; neutral, and not exempt" }
      - { v: "#868686", role: line, pass: false, why: "2.98 on the day ground" }
      - { v: "#858585", role: line, pass: true, why: "3.02 on the day ground; as text it fails" }
      - { v: "#767676", role: line, pass: true, why: "3.72 on the day ground, 4.17 on the sheet" }
      - { v: "#767676", role: text, pass: false, why: "3.72 on the day ground" }
      - { v: "#696969", role: text, pass: false, why: "4.49 on the day ground" }
      - { v: "#686868", role: text, pass: true, why: "4.56 on the day ground" }
      - { v: "#00897B", role: line, pass: true, why: "3.53 on the day ground; as text it fails; as a fill it fails (ink on it 4.24)" }
      - { v: "#1E90FF", role: line, pass: false, why: "2.65 on the day ground; passes as a fill (ink on it 5.65)" }
      - { v: "#FF8800", role: line, pass: false, why: "1.96 on the day ground; passes as a fill (7.64)" }
      - { v: "#404040", role: fill, pass: false, why: "day ink on it 1.76" }
      - { v: "#767676", role: fill, pass: false, why: "day ink on it 4.03" }
      - { v: "#808080", role: fill, pass: true, why: "day ink on it 4.63, night 7.50" }
      - { pair: "custom line #858585 on the cobalt fill #CDDFFE", pass: false, why: "2.74 by day: each passes alone, the pair does not; refused on the field being written" }
      - { pair: "custom line #858585 on the lemon fill #F3F287", pass: true, why: "3.14 by day" }
      - { pair: "custom line #00897B on the cobalt fill #CDDFFE", pass: true, why: "3.20 by day" }
      - { pair: "a night custom line on a night custom fill", pass: false, why: "sampled at 2.83 in the contracts pass; the validator's own vector replaces this line when it exists" }
    amends: "test_vectors below: #808080 'passes as a line' stays true (3.23 on the ground) and it is refused as a text colour. custom.neutral: 'used as a line it passes without the distance test' stays true and the floor above still applies"
  defaults: { line: ink, shape-fill: none, sticky-fill: lemon, weight: fine }
  neutrals:   # theme tokens, not new values; chroma under 0.02. Exempt from the distance rule as a LINE only (aegis: ruling 1); paper is a fill and passes fill_rule by measurement
    ink:      { line: text.primary }
    graphite: { line: text.secondary }
    paper:    { fill: surface.sheet }
  swatches:   # day values are the stored truth; night values are transform(day) by role, printed so the transform can be tested
    lemon:     { day: { fill: "#F3F287" },                  night: { fill: "#373500" }, note: "fill only: a yellow dark enough to write with (4.5:1 on the ground) lands within 0.06 of ochre.ink and sage.ink" }
    leaf:      { day: { line: "#007835", fill: "#BAF6C5" }, night: { line: "#63C37B", fill: "#194224" } }
    sky:       { day: { line: "#067092", fill: "#C0EDFF" }, night: { line: "#5EB4D9", fill: "#133E4C" } }
    cobalt:    { day: { line: "#1957BB", fill: "#CDDFFE" }, night: { line: "#83B2FE", fill: "#2F3D56" } }
    orchid:    { day: { line: "#8E389B", fill: "#F4D4FE" }, night: { line: "#D789E2", fill: "#492F51" } }
    raspberry: { day: { line: "#B62268", fill: "#FFD9E2" }, night: { line: "#EE79A4", fill: "#4B2E36" } }
  contrast:   # measured, WCAG 2 ratio
    day-line-on-ground:   { leaf: 4.60, sky: 4.59, cobalt: 5.50, orchid: 5.39, raspberry: 5.03, floor: 4.5 }
    night-line-on-ground: { leaf: 8.65, sky: 8.10, cobalt: 8.78, orchid: 7.70, raspberry: 7.11, floor: 4.5 }
    fill-on-ground: "about 1.0 to 1.2 by day and 1.5 to 1.7 at night: a fill never carries its own outline, so every scrap and filled shape keeps a 1px edge (components.pin.anatomy)"
    measured_in_review:   # mika, WCAG 2 ratio and OKLab distance, computed 2026-11-23; Luna's line-on-ground figures above reproduce exactly
      line-on-fill: "A coloured line over a tinted fill keeps 3:1 everywhere (lowest 4.11). As TEXT it does not always keep 4.5: by day leaf and sky read 4.17 to 4.49 on the sky, cobalt, orchid and raspberry fills; at night raspberry reads 4.11 to 4.37 on leaf, sky, cobalt and orchid, sky 4.68 on cobalt, orchid 4.46 on cobalt. Coloured text is promised 4.5:1 on the desk and on paper only."
      graphite-on-fill: "text.secondary on a named fill: 5.29 or better by day; 3.62 to 4.17 at night. Graphite is a line colour on a night fill, not a text colour."
      fill-to-fill: "sky and cobalt fills are 0.038 apart in both themes, orchid and raspberry 0.047, cobalt and orchid 0.057: closer to each other than the 0.06 this palette asks of a reserved colour. Two stickies in sky and cobalt are told apart by their edges (line colours 0.105 apart by day, 0.070 at night), not their paper."
      colour-vision: "deutan and protan (rendered): sky, cobalt and orchid collapse to one blue as fills and nearly as lines; leaf joins lemon; the raspberry line turns grey and sits beside graphite. Tritan: leaf, sky and cobalt collapse. Grayscale: the six fills are one tone. The console reads no meaning from content colour, so nothing of the product is lost; a board that colour-codes is weaker for these readers, which is why the tray names its swatches."
  custom:
    form: "custom:#rrggbb, the day value, upper or lower case, six digits, no alpha"
    night_transform:
      space: "OKLCH from OKLab (Ottosson 2020 matrices) over 8-bit sRGB"
      line: "L' = clamp(1.24 − L, 0.70, 0.88) · C' = min(C, 0.15) · h' = h"
      fill: "L' = clamp(1.26 − L, 0.30, 0.42) · C' = min(C, 0.07) · h' = h"
      gamut: "lower C' by 0.002 at a time until every linear channel is within [−0.0005, 1.0005], then clip and round to 8 bits"
      role: "chosen by the field the colour is used in (stroke and text: line; background: fill)"
      note: "The named swatches' night values above are this transform applied to their day values, so the table is also the transform's test vectors. The engine stays in its light theme; the host supplies these colours at night (S1 plan §1)."
    neutral: "a colour with OKLCH chroma under 0.02 is ink or paper. Used as a line it passes without the distance test. Used as a fill it has no exemption (fill_rule): custom:#16150f as a fill is refused. luna 2026-11-25: exempt from the distance test only; a neutral line still has to meet contrast_rule.line (custom:#F8F5EE as a line is refused)."
    distance_rule: "A custom colour passes only if ALL hold: d(day value, r) ≥ 0.06 for every r in reserved.day; d(line transform, r) ≥ 0.06 and d(fill transform, r) ≥ 0.06 for every r in reserved.night. d is the Euclidean distance in OKLab."
    on_fail: "The value is never stored. GUI: the tray says why in plain words and offers the nearest named swatch for that role (nearest by d on day values; lemon is not offered for a line). Agent tool: the op is refused with field, code and fix naming that swatch (amendment A10). Alternative recorded in components.content-tray.chose: silent snap. aegis: ruling 3 confirms refuse for the picker and the validator (one shared function, code colour-bad), and adds the renderer's resolve (renderer above)."
  minimum_distance:
    metric: "Euclidean distance in OKLab (ΔEok)"
    min: 0.06
    why: "The two closest reserved colours are 0.045 apart (day: terracotta.ink and rose-clay.ink; night: terracotta and rose-clay at 0.047). At 0.06 a content colour is always further from any reserved colour than those two are from each other."
    named_clearance: "smallest distance from any named swatch value to any reserved value: 0.068 (cobalt night line to state.knot). Day minimum 0.071 (raspberry fill to state.warn-bg)."
    alternative: "0.08 (stricter). Cost: cobalt, sky and raspberry would need re-tuning and fewer blues and pinks would pass as custom. Chosen 0.06 because content colours are only ever seen inside the board, where no project swatch or state colour is drawn."
  reserved:   # copied from foundations.color so the rule can be tested; a test should also assert this list equals the foundations
    day:
      mineral: { terracotta.fill: "#C08A73", terracotta.ink: "#8E4E38", sage.fill: "#9DAF8C", sage.ink: "#56663F", slate.fill: "#8C9DBB", slate.ink: "#44577C", ochre.fill: "#D2B074", ochre.ink: "#7A5A1C", rose-clay.fill: "#C9949A", rose-clay.ink: "#874B54", sea-grey.fill: "#8FB0AE", sea-grey.ink: "#3F6664" }
      semantic: { state.fail: "#B4382A", state.warn-ink: "#6E4700", state.warn-edge: "#A8730C", state.warn-bg: "#F6E3B8", state.knot: "#5B4FD6" }
    night:
      mineral: { terracotta: "#E6A88F", sage: "#B7CCA3", slate: "#A9B9DB", ochre: "#E8C88C", rose-clay: "#E4AEB4", sea-grey: "#A8CFCB" }
      semantic: { state.fail: "#FF7A66", state.warn-ink: "#FFC15A", state.knot: "#A79CFF" }
      left_out: "state.warn-bg at night is rgba(255, 193, 90, 0.10): over the ground and the sheet it composites to #27231D and #2E2B27, near-neutral darks that every dark fill sits close to. It is told by its amber edge and text (#FFC15A, reserved above), so it is not in the distance list. For Aegis to confirm."
    approval:
      values: { text.primary: "#16150F / #E8F4F0", line.key-edge: "#2A2925 / #C9DCD6", surface.sheet: "#F8F5EE / #171A21", text.on-ink: "#F8F5EE / #171A21", retired-stamp: "#3F6664 (the old --stamp; equal to sea-grey.ink, so already in the mineral list)" }
      note: "Approval has no hue of its own (status is ink, board gnomon-status-colour), and ink on paper is exactly what a board is drawn with, so distance cannot protect it. It is protected by shape: rules nothing-on-a-board-is-a-key and agent-marks-are-dashed. This reads the Aegis S1.2 condition ('away from mineral, semantic and approval colours') as distance for the first two and shape for the third. For Aegis to confirm."
  test_vectors:   # custom value → verdict (worst distance, where, nearest reserved) → nearest swatch offered (line / fill)
    - { v: "#C08A73", pass: false, why: "0.000 day terracotta.fill", offer: "raspberry / raspberry" }
    - { v: "#B4382A", pass: false, why: "0.000 day state.fail", offer: "raspberry / raspberry" }
    - { v: "#5B4FD6", pass: false, why: "0.000 day state.knot", offer: "cobalt / cobalt" }
    - { v: "#FF0000", pass: false, why: "0.035 night line state.fail (passes by day)", offer: "raspberry / raspberry" }
    - { v: "#E53935", pass: false, why: "0.036 night line state.fail", offer: "raspberry / raspberry" }
    - { v: "#8A2BE2", pass: false, why: "0.050 night line state.knot", offer: "orchid / orchid" }
    - { v: "#7B3FA0", pass: false, why: "0.059 night line state.knot", offer: "orchid / orchid" }
    - { v: "#6D4C41", pass: false, why: "0.033 night line rose-clay", offer: "sky / cobalt" }
    - { v: "#FFF59D", pass: true, why: "0.066 day state.warn-bg" }
    - { v: "#FF8800", pass: true, why: "0.079 night line state.fail", night: "#E38230 line, #6A4225 fill" }
    - { v: "#1E90FF", pass: true, why: "0.096 night line state.knot", night: "#54A1F9 line, #304F72 fill" }
    - { v: "#00897B", pass: true, why: "0.103 day sea-grey.ink", night: "#47B3A4 line, #0F5950 fill" }
    - { v: "#FFD700", pass: true, why: "0.128 day state.warn-bg", night: "#BA9C00 line, #4C400B fill" }
    - { v: "#808080", pass: true, why: "neutral (chroma under 0.02): passes as a line; as a fill it is tested by fill_rule and passes", night: "#9E9E9E line, #4D4D4D fill" }
    - { v: "#16150F", role: fill, pass: false, why: "aegis: ruling 1: 0.000 from day text.primary; with on-ink text it would be the primary key", offer: "none as a fill; passes as a line (it is ink)" }
    - { v: "#2A2925", role: fill, pass: false, why: "0.000 from day line.key-edge", offer: "none as a fill" }
  honest_limits:
    - "There is no named red, orange, amber or violet: those neighbourhoods belong to failed, warning and KNOT. Raspberry is the red pen. A custom orange or gold can pass when it is far enough from amber (see #FF8800, #FFD700)."
    - "The nearest-swatch offer can jump hue (a brown is offered sky): the named set has no warm colours to offer."
    - "Colour here carries no meaning the product reads. A board that uses colour to mean something is the author's own key."
    - "mika: the six fills are not six clearly different papers: sky and cobalt are 0.038 apart, and under the commonest colour-vision differences the set reduces to about three (contrast.measured_in_review). For Luna: re-tune cobalt's fill away from sky's, or accept five distinct papers. Swatch names are what is stored, so values can still move after S1.2."
    - "mika: a named orange is refused on principle (the neighbourhood belongs to warning), yet custom #FF8800 passes the rule at 0.079 and #FFD700 at 0.128. Either a seventh named warm swatch is safe by this palette's own measure, or the rule is looser than the principle. The founder should see an orange sticky beside an amber held countdown before S1.2 freezes the list. Raspberry reads as a pink-red by day and holds as the correcting pen; under deutan and protan it turns grey."
    - "mika: coloured text keeps 4.5:1 on the desk and on paper, not on every tinted fill (contrast.measured_in_review.line-on-fill)."
  chose:
    - { what: "six hues placed in the gaps between reserved hues, plus three neutrals bound to theme tokens", over: "a FigJam-like nine-hue set including red, orange and violet", why: "those three land on the failed, warning and KNOT colours, the only saturated colours the console has" }
    - { what: "named night values are the transform of the day values", over: "hand-tuned night values per swatch", why: "one behaviour for named and custom colours, and the swatch table becomes the transform's fixture" }
    - { what: "OKLab distance", over: "CIEDE2000", why: "a few lines of arithmetic with no trigonometric corrections, easy to keep identical in contracts, the mod and the GUI" }
  from: { session: 2026-11-23-gnomon-board-medium, board: content-palette, decided_by: none, decision: "TD-2026-11-24-500 (free hues for content; never the minerals or semantic colours; authorship never by colour)", conditions: "s1-build-plan.md §7: S1.1 'palette leaves room for a minimum-distance rule', S1.2 'custom snapped away'", review: "Mika 2026-11-23, rendered day and night, grayscale and three colour-vision simulations; every figure in `contrast` recomputed. Aegis 2026-11-23: accepted with conditions (rulings 1 to 4): fill_rule and renderer above; the reserved-equals-foundations test names night state.warn-bg as its one exception and computes its composites; one implementation in gnomon-contracts/src/content-palette.ts with a literal 256-entry linearisation table and integer compare, run on these vectors in Node, Chrome and WKWebView", aegis_not_verified: "Aegis could not compute any OKLab figure; mika recomputed the contrast table and spot-checked distances (raspberry to state.fail 0.100 day, 0.089 night; cobalt night line to state.knot 0.068, as named_clearance says). The night transform itself was not re-derived.", computed_by: "OKLab script, 2026-11-23; values reproduced in specimen-board.html#palette" }

# ─────────────────────────────────────────────────────────────────────────────────────────────────────────────────────
# Zones (the desk). Main surface: the GUI window (packages/gnomon-gui/static/index.html). Desktop widths only.
# ─────────────────────────────────────────────────────────────────────────────────────────────────────────────────────
zones:
  header:
    surface: desk
    holds: ["wordmark menu (Gnomon ▾: Layout presets, Panes and Workshop…, Loops…, Pause all loops, Day/Night/Auto, Mods…, Voice settings…, Settings… ⌘,)", "⌘K palette field", "quiet kernel status (link dot; the loops word while any loop is enabled; browser-risk chip)", "voice pill (+ Stop speaking while speaking)", "pane toggles (sessions, decisions) under 900px"]
    never: ["notices, outcome text or toasts inside the row", "tool keys (Layout, theme, Mods, Settings)", "a second Start voice key", "anything that wraps inside a control"]
    overflow: "The row never wraps: the loops word drops 'waiting' to its counts first (full text in title=), then the palette's words truncate, then the pill's fact (20ch < 1040px, 10ch < 760px). With 'loops 1 · 2 waiting' the row held at 1440, 1024, 900 and 760, day and night (Mika, direction page, 2026-10-22). Phone widths are out of scope (rule desktop-only); the 390px clipping of the decisions toggle is left for the mobile version, not fixed here."
    status: clear
    from: { session: 2026-10-21-gnomon-voice, board: header-5b, choice: wordmark-menu, narrow: { session: 2026-10-21-design-systems, board: gnomon-narrow-header, choice: out-of-scope }, confirmed: { session: 2026-10-21-design-systems, board: bulk-confirm } }
    amended_by: [{ session: 2026-10-22-gnomon-loops-ui, board: running-indicator, choice: header-kernel-status, what: "loops word in the kernel status; Loops… and Pause all loops in the wordmark menu" }]
  notices:
    surface: desk, the band under the header
    holds: ["kernel alerts only: re-pin, voice dev build"]
    never: ["GUI outcomes, refusals, update available or offers (they are toasts)", "inside the header row", "anything outside .shell", "retired vocabulary (Ambient, push-to-talk)"]
    overflow: "One alert per line, in arrival order; each stays until acknowledged or resolved."
    status: clear
    from: { session: 2026-10-21-design-systems, board: gnomon-notices, choice: band-for-alerts }
  toasts:
    surface: "over the chat column, top-right (styles.css:956); lifted under the header while an overlay is open"
    holds: ["GUI outcomes (saved, not sent, refusal code + reason + next:)", "voice idle auto-off", "update available (with Restart now, which focuses the upgrade card)", "standing-grant offers and confirmations", "loop outcomes that need nothing: goal reached, landed (6s, Open run)", "Pause all's confirmation, Run now started, a budget applied (tighter)"]
    never: ["kernel alerts (the band)", "a decision key (a toast may focus a card, never decide one)", "bottom-right or bottom-centre placement", "covering the header row or a decision key", "a loop that still needs you: fail, stop, kernel pause (stack alerts) or waiting for trust (the slip)"]
    overflow: "At most three, newest on top; an older info toast leaves first. Text wraps to 4 lines at 44ch; a longer refusal keeps its next: line and puts the rest in title=. Hidden while an overlay is open, back when it closes."
    status: clear
    from: { session: 2026-10-21-design-systems, board: gnomon-notices, choice: band-for-alerts }
    amended_by: [{ session: 2026-10-22-gnomon-loops-ui, board: notify-decide, choice: stack-alerts-toast-outcomes, what: "placement recorded at the chat column's edge (supersedes 'under the voice pill'); loop outcomes join; loop trouble never toasts" }]
  sessions:
    surface: desk, left (200-260px)
    holds: ["+ New session (⌘N)", "search", "Active grouped by project (swatch + state note)", "Past collapsed", "mod slot left-bottom (bounded 45%)"]
    never: ["decision keys", "kernel status"]
    overflow: "Names truncate with the full name in title=; the list scrolls; under 900px it is a drawer from the sessions toggle."
    status: clear
    from: { session: 2026-10-15-gnomon-aesthetic, board: decision-stack-and-sidebar, choice: desk, confirmed: { session: 2026-10-21-design-systems, board: bulk-confirm } }
  centre:
    surface: desk, centre
    proposed:
      - { session: 2026-11-23-gnomon-board-medium, board: board-leaf, status: proposed, decided_by: none, holds: "the board leaf over the chat header and the chat (/board, ⋯ Open board, ⌥B for a board the session already has, Open on a board slip, a Dimensions row); Esc folds it to an edge tab below the Loops tab; the turn's working line and the composer stay under it", never: "a board leaf over the pinned cards or the composer; a decision key or card inside a board; a board opened by an agent without the founder's Open", see: "components.board-leaf, rules board-centre-only, board-yields-the-keys" }
    holds: ["chat header: title (✎ rename) · ■ project · model · started · run mode ▾ · ⋯ (small controls are 24px keys)", "a local session's chat header: ■ project · local model · tier N ▾ · started (#gui-tool-tier, C4'b: the tier key where a Claude session's model key sits; the source as a word, tier 2 | tier 3 · yours | tier 1 · provisional; the owner of a live session gets the quiet key and its .mode-menu, then a .sheet-card confirm; anyone else, or an ended session, a plain chip titled 'Only the person who opened this session can change its tier.'; a loop session shows none)", "the chat (timestamps, took Ns, activity fold, working line)", "'↓ latest' (one key at the chat's bottom right, only while scrolled up; '↓ latest · N new')", "offer slips under their reply", "this session's pending cards pinned above the composer (max 30vh)", "the composer (one send key)", "the empty sheet when no session is open", "the Loops leaf over the chat (header loops word, Gnomon ▾ Loops…, ⌘K loops.open); Esc folds it to an edge tab", "a loop-trust card unfolded over the chat by its Read key (fold or Esc puts it back)"]
    never: ["the raw kernel feed as default (it is a palette view)", "a second send control", "a mod surface covering header, stack, Workshop or pinned cards", "a leaf or unfolded card that covers the sessions rail, the stack or the header", "page-level sideways scroll from a loop graph (it zooms inside its own frame)"]
    overflow: "Rows hold an 80ch measure; the title gives way before the meta; pinned scrolls past 30vh."
    status: clear
    from: { session: 2026-10-15-gnomon-aesthetic, board: decision-stack-and-sidebar, choice: desk, confirmed: { session: 2026-10-21-design-systems, board: bulk-confirm } }
    amended_by: [{ session: 2026-10-22-gnomon-loops-ui, board: loops-zone, choice: centre-leaf, what: "the Loops leaf" }, { session: 2026-10-22-gnomon-loops-ui, board: trust-card, choice: card-unfolds, what: "the unfolded loop-trust card" }, { date: 2026-10-23, what: "records the chat's follow rule and its existing '↓ latest' key (#jump-latest, a .key at the chat's bottom right, 18px in, 10px up): at the bottom the chat follows every new row, a row that grows, a fold that opens and the composer growing; only the human's own scroll (wheel, scroll keys, touch, focus moving into the chat, a pointer on it or its scrollbar) unpins it, never a scroll the layout made. Scrolled up, nothing moves it (not a new row, not a send, not an unfold) and '↓ latest' shows, counting what arrived ('↓ latest · 3 new'); the key or scrolling back to the bottom by hand pins it again", founder_words: "as im speaking and the gnomon agent chat is going back and forth, it doesn't keep the scrolling to the bottom even though ive been at the bottom and haven't moved it", review: "records shipped behaviour (follow rule 2026-10-19, the key unchanged); atelier-mika 2026-10-23 accepted, with one amendment: a wheel, key or touch toward the top unpins only when there is something above to read (scrollTop > 0), so a chat that does not overflow yet never loses its follow" }, { date: 2026-10-23, decided_by: atelier-mika, what: "run mode ▾ while an 'edits in this repo' Always rule stands in ask: 'ask · edits by rule ▾', and ≤1040px 'ask ✓ ▾' (spoken 'edits allowed by rule'; the full words in its title). The wider forms pushed the model key out of the header at 1024. ask's menu line reads 'commands raise a card; edits in this repo pass by your Always rule', and the last entry is 'stop edits by rule' with its note (removes the rule, no Touch ID)." }]
  stack:
    surface: desk, right (300-340px; Decide preset 320-460px)
    holds: ["Stack head: 'n to decide · m alerts' · hover to fan · project filter (a 24px key)", "the pile, in this order: decision cards (most urgent first), then alerts, then the waiting-for-trust slip at the foot", "a family head on every card and alert, by glyph and word (↻ loop, ◇ session; ✦ mod and voice planned)", "+N more", "mod slot right (ruled off, headed mods, outside the pile's scroll)"]
    never: ["model-text controls beside decision keys (Aegis M2)", "toasts over a decision key (pile reserves 140px)", "an alert above a decision card, or an alert tail that pushes a decision key out of reach", "a decision key on an alert or on the slip", "a family told by hue", "outcomes that need nothing (goal reached, landed: toasts)", "kernel alerts (the band)"]
    overflow: "The pile scrolls; decision cards fan on hover/focus while alerts and the slip sit flat beneath them; under 900px it is a drawer from the decisions toggle."
    status: clear
    from: { session: 2026-10-15-gnomon-aesthetic, board: decision-stack-and-sidebar, choice: desk, confirmed: { session: 2026-10-21-design-systems, board: bulk-confirm } }
    amended_by:
      - { session: 2026-10-22-gnomon-loops-ui, board: agent-loops-surface, choice: stack-slip, decided_by: creator, override: "the stack holds only cards", what: "the stack becomes decision cards plus alerts, styled by what they relate to; the slip at its foot" }
      - { session: 2026-10-22-gnomon-loops-ui, board: notify-decide, choice: stack-alerts-toast-outcomes, decided_by: creator, what: "order: decisions, then alerts, then the slip; loop fail, stop and kernel pause are alerts" }
  workshop:
    surface: desk, footer strip (default, 64px) or a 76px column left/right
    holds: ["Workshop mod caps: Needs you | Working", "Install Workshop when absent", "one quiet status line (live · waiting · log · rpc), right end"]
    never: ["kit.Button (Aegis M2)", "a per-mod hue", "type under 10.5"]
    overflow: "Under 900px it is always the footer; in the 76px column cap questions truncate at about 9 characters with the full text in title=. In the footer every word (mod label, zone title, quiet note, paused line, status line) sits in ONE line box of --key-h at the strip's floor, so all baselines agree with each other and with a key there; hats stand on the floor, a waiting cap's question above its hat, and the reduced-motion word of a working cap ('working') above its hat too, never below the floor (Mika 2026-10-23). Nothing wraps from 1024 to 2560: the host and the status line clip."
    status: clear
    from: { session: 2026-10-15-gnomon-aesthetic, board: iconography, note: "founder 2026-10-17 placement: footer default, vertical edges as presets", confirmed: { session: 2026-10-21-design-systems, board: bulk-confirm } }
    amended_by: [{ session: 2026-10-23-gnomon-folder-picker, decided_by: creator, what: "the strip's line: one --key-h line box at the floor for every footer word (titles were pinned to the top and notes to the bottom, the status line centred)", founder_words: "even the bottom workshop area has strange alignment" }]
  overlays:
    surface: over the desk
    holds: ["command palette", "new session", "Settings sheet", "Mods sheet", "Voice settings drawer (teaching inline under its row)", "reconnect"]
    never: ["a modal over the Voice settings sheet", "toasts (hidden while any overlay is open)"]
    overflow: "Sheets cap at 78vh and scroll their body; under 900px they take the width minus 32px."
    status: clear
    from: { session: 2026-10-21-gnomon-voice, board: teach, choice: inline-in-sheet, confirmed: { session: 2026-10-21-design-systems, board: bulk-confirm } }
  kernel-owned:
    surface: every zone
    holds: ["voice pill", "link status, the loops word (and its keep-alive line) and the browser-risk chip", "a loop card's kernel line (Raised by loop … / changed by …)", "run mode", "re-pin and voice-dev alerts", "dictation ring", "handle words", "held countdown", "card bodies, the voice tag and the contentHash line"]
    never: ["hidden by any layout preset, pane switch or mod"]
    overflow: "n/a"
    status: clear
    from: { session: 2026-10-20-gnomon-gui-fidelity, note: "spec §11 kernel-owned regions; preserve_from", confirmed: { session: 2026-10-21-design-systems, board: bulk-confirm } }

# ─────────────────────────────────────────────────────────────────────────────────────────────────────────────────────
content:
  vocabulary:
    use:
      session: "one Claude (or local model) conversation in a folder"
      card: "one decision the kernel asks of you"
      stack: "the global pile of every pending card (header 'Stack'; 'decision stack' in long form)"
      pinned: "this session's pending cards above the composer ('pending in this session')"
      KNOT: "a conflict git can't see; violet; the only use of violet"
      run mode: "manual / ask / auto-edits, per folder or per session. Always the two words 'run mode' (never 'mode' alone, never 'run'); it is a session's permission setting and has nothing to do with loops"
      loop: "a definition that runs on its own (triggers, nodes, budgets; loop:v2), named by its id in mono"
      run: "one execution of a loop, from trigger to @goal, @stop or @pause. Inside loop surfaces (the leaf, loop cards, alerts, loop toasts) just 'run': Run now, Open run, last run, run 7f3a. Anywhere else, 'loop run'. A session is never a run"
      round: "one pass of a fix cycle inside a run ('round 3 of 8')"
      waiting for trust: "a loop definition no human has trusted at this hash"
      trust: "the root-key, hand-only decision that lets a loop definition run; Untrust takes it back; 'Don't trust' on the card"
      Pause all: "the loops kill switch (key label); no presence; resuming needs presence ('Resume all · presence'); a row paused by it reads 'paused · kill switch'"
      kernel pause: "the kernel paused a loop (thrash, strictness, content or closure change, budget); 'kernel-paused' on a row; resuming needs presence"
      alert: "a stack sheet that decides nothing: a loop that is stuck and still needs you"
      family: "what a card or alert relates to, named by glyph and word in its head (↻ loop, ◇ session)"
      autonomy: "observe / act / propose, with the cap reason ('act → propose (L2: a-paradigm strictness)'); never 'mode'"
      presence: "fresh Touch ID, or the Mac password where Touch ID is unavailable; named in a key's cost ('Resume · presence'); long copy says 'Touch ID or your Mac password' (amended by session 2026-10-22-gnomon-local-model)"
      local model: "a model server on this Mac that sessions and loops can use instead of Claude (8.0: loopback only); 'Set up local model…', 'none set up'"
      card waiting: "a request whose card is in the stack (a plain chip in the sheet that asked for it)"
      land: "a loop committing its scratch work to the branch; 'landed <sha>'; 'waiting to land'; 'parked' when it waited too long"
      Workshop: "the caps mod: Needs you | Working"
      cap: "one session in the Workshop"
      rung: "a voice preset on the ladder: Off, Talk, Dictate, Send word, Pieces"
      open mic: "the mic is listening without a held key"
      send word: "the word that sends a voice turn"
      chip: "a status label nobody clicks (never 'badge' in copy)"
      key: "anything you click"
      toast: "a notice that is not a kernel alert"
      hand only: "a card voice can't decide (the voice tag's words)"
      mod: "an installed extension, named mod:<name>"
      offer: "the agent's single suggestion to open a mod"
      kernel-owned: "a region no preset or mod can hide"
      folder: "where a session works (the session.open cwd), in GUI copy; 'cwd' stays in the wire, the CLI and logs"
      recent folders: "the folders past sessions opened in, newest first (at most six in New session)"
    retired:
      Ambient: "the rung name (Dictate, Send word or Pieces) or 'open mic'"
      push-to-talk: "Talk"
      inbox: "stack"
      LOOPS n running: "'loops n · m waiting' (the spec's Shuttle line; the indicator is the header loops word)"
      loop mode: "autonomy (observe / act / propose) or run mode, whichever is meant"
      cwd: "'folder' in GUI copy (the New session field label)"
    proposed:   # session 2026-11-23-gnomon-board-medium; decided_by: none. Naming itself is the founder's (TD-2026-11-24-053)
      use:
        dimension: "the space things are shown in: it has a title, belongs to a project, has sessions attached, and is what is listed and kept ('Dimensions', 'dimension in ■ a-paradigm', 'Rename dimension'). 'dim' only in the raw view, the CLI and logs"
        medium: "a named way of showing a dimension. Rarely needed in copy: say the medium's own name"
        board: "the whiteboard medium: what you open, fold and draw on ('Open board', '/board', '<title> › board', 'offer · board', 'Board tools')"
        mark: "one thing drawn on a board, whoever drew it ('Arky added 3', '10 marks'); 'node' stays in the raw view"
        hand: "an author on a board; the leaf's foot lists the hands ('you 5 · Arky 4')"
        seal: "an agent's stamp, worked out from its id"
        claimed: "said of a sub-agent the host could not name itself ('Kit · claimed, inside Arky's session')"
        unknown hand: "the author of a mark whose row names no one the host vouches for (aegis: ruling 5); never 'unknown author', 'anonymous' or 'error'"
        sticky: "a pinned paper note on a board"
        fold: "what Esc does to a leaf (as Loops); a board is folded, not closed"
        may draw: "luna 2026-11-25: said of an attached session's agent the person lets draw on this board; its other state is 'may not draw' (the draw key, components.draw-grant). Never 'allowed', 'granted', 'permission', 'access' or 'write' in GUI copy; 'grant' stays in the raw view, the CLI and logs"
        draw key: "luna 2026-11-25: the key beside a hand in the foot that says and sets 'may draw' (the name is for this record and for reviews; the GUI never needs it)"
        ring: "luna 2026-11-25: what a seal becomes under 50% zoom: 'not yours', with no name until you point at the mark"
        drew: "luna 2026-11-25: what the turn strip says an agent's turn put on the board (' · drew 5 on the board'); 'changed' when it added nothing. 'added' is the word everywhere else ('Claude added 3 marks', the slip's 'Arky added 3')"
        sending: "luna 2026-11-25: a message that has left and whose turn has not started (the turn strip). 'waiting' is a message queued behind a running turn, or something that waits on you"
        check: "luna 2026-11-25 (design-foot): what the foot says this page's copy of the board was compared with: 'checked up to the last change', 'not checked yet', 'doesn't match the saved board'. Never 'verified', 'valid', 'hash' or 'in sync' in GUI copy, and never 'checked' with no point named"
        the saved board: "luna 2026-11-25 (design-foot): the board as its log has it, as against what this page shows ('the saved board has them', 'doesn't match the saved board'). Never 'the log', 'the server' or 'the mod' in the leaf's lines"
        Claude: "luna 2026-11-25: how the host's agent label 'claude' is shown on a board and in the turn strip; with its session after ◇, or 'in <session>' in a sentence, only when two hands would otherwise read the same"
        may edit: "luna 2026-11-26 (E-design): replaces 'may draw' on the draw key, now that a grant lets an agent change and remove any mark; its other state is 'may not edit'. 'may draw' stays in the titles' sentences ('may draw on this board and change or remove any mark')"
        changed by: "luna 2026-11-26 (E-design): said of the newest other hand that changed a mark ('changed by Claude'); 'words by' for the hand that wrote its words; 'put back by' for the hand that undid its removal. The record calls the sign the countermark; the GUI never needs that word"
        undo: "luna 2026-11-26 (E-design): the key that undoes another hand's change on a board, and its line ('Undid Claude's turn'); 'redo' undoes that undo; 'put back' undoes a removal of one mark. Never 'revert', 'rollback' or 'restore' in GUI copy ('restore' stays in the raw view)"
        dismiss: "luna 2026-11-26 (E-design): the key that keeps another hand's changes and lets their notice go, as an alert's Dismiss"
        cut-out: "luna 2026-11-26 (E-design), the record's word only: where a removed mark of yours was, drawn as four corner ticks while its notice stands"
      retired:
        canvas: "board"
        whiteboard: "board"
        doodle: "board (doodle is kept as a later medium's name, never the system's)"
        Excalidraw: "never named in the GUI; 'the board'"
      open_question: "/boards (founder-approved, amendment A7) opens a list headed 'Dimensions'. Kept as approved; the alternative is to head the list 'Boards' until a second medium exists."
    status: clear
    from: { session: 2026-10-21-gnomon-voice, note: "commit 6f986338 retired Ambient/push-to-talk; 'stack' from the desk board (global decision stack)", confirmed: { session: 2026-10-21-design-systems, board: bulk-confirm } }
    amended_by:
      - session: 2026-10-22-gnomon-loops-ui
        what: "loop vocabulary; 'run' (a loop run) vs 'run mode'"
        decision: "Keep both words and keep them apart; no rename. 'run' is the spec's and the kernel's word ($loop-run, loop.run.*, Run now) and the founder approved copy built on it; 'run mode' is shipped, kernel-owned vocabulary. They never share a surface (the Loops leaf covers the chat header that holds run mode ▾), so the collision is only in the words: 'run mode' always appears as both words, loops never use 'mode' (they have 'autonomy'), and 'loop run' is the long form outside loop surfaces."
        decided_by: recommendation
        note: "Decided, not contested: renaming run mode would churn shipped kernel copy for a collision that never shares a screen. Reopen if a loop surface ever shows run mode."
      - session: 2026-10-22-gnomon-local-model
        what: "local model, card waiting; presence includes the Mac password"
        decided_by: creator
      - session: 2026-10-23-gnomon-folder-picker
        what: "folder, recent folders; cwd retired from GUI copy"
        decided_by: creator
  voice:
    - "Name the state plus one live fact; never only a glyph (board pill)"
    - "Lowercase, numbers before nouns ('4 running'), items joined with ' · ' (cli-voice)"
    - "No emoji, no exclamation marks, no 'Oops' (cli-voice)"
    - "Every refusal: CODE in caps, the reason in plain words, then 'next:' (cli-voice; app.ts refusalText)"
    - "Durations '2m 14s', clock '14:02', thin-space thousands '1 204' (cli-voice)"
    - "A disabled control says why in words, not only in a tooltip (settings-sheet.ts:44-47)"
    - "Never ask the user to say the product name; spoken phrases are plain sentences (board teach)"
    - "A voice instruction quotes the exact phrase the grammar accepts, in “ ” after 'say' (board gnomon-voice-tag)"
    - "State is a word plus a mark (filled or hollow dot, ✓ ✕ ◆) and weight, in ink; colour only for the three semantic states, never alone (board gnomon-status-colour)"
  cli_example: |
    $ gnomon status
    sessions  4 running · 1 failed · 2 need you
    cards     permission ×1 · knot ×1
    voice     armed · reversible · 41:10 left
    ✓ kernel 8.0.0-dev · log verified (1 204 events)
  from: { session: 2026-10-15-gnomon-aesthetic, board: cli-voice, choice: instrument-readout, confirmed: { session: 2026-10-21-design-systems, board: bulk-confirm } }

specimen:
  stylesheets: [packages/gnomon-gui/static/styles.css]
  # the folder-field-bridge.css bridge was dropped by the folder picker build (TD-2026-10-23-162, 2026-10-23): styles.css
  # carries the folder-field classes and the --key-h key size (migration batches folder-field and key-height)
  # the local-model-bridge.css bridge was dropped by the Local model build (2026-10-22): styles.css carries the
  # settings-form, .lp-refusal and .card-root-rows classes (migration batch settings-form)
  # the loops-direction.css bridge was dropped by the LP8 build: styles.css carries the loop classes
  themes:
    day: { html_attrs: 'data-theme="day" data-motion="full"' }
    night: { html_attrs: 'data-theme="night" data-motion="full"' }
    day-still: { html_attrs: 'data-theme="day" data-motion="reduced"' }
  body_class: shell
  preview: "packages/gnomon-gui/scripts/preview.mjs (real GUI over a fake kernel; fixtures in src/preview/fixtures.ts)"
