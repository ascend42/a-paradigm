    amended_by:
      - { date: 2026-10-23, what: "state dictating: the live words show AT THE CARET, where the turn will land (the start, mid-paragraph, over a selection; an unfocused composer uses its last caret, else the end). #composer-ghost becomes an aria-hidden mirror laid exactly over the textarea (same box, font, line height and wrapping); while it shows, the textarea's own text is transparent and its caret stays, and the mirror draws the composer text with the words spliced in. The textarea never holds a live word (B1). Committed words --ink with a dotted --sec underline (so they never read as typed text); the unfixed tail --sec italic at full strength (Mika: 0.55 was 2.4:1 day, 2.7:1 night); '…' (--sec italic) at the caret before any words. The textarea's stale selection highlight is not drawn while ghosting (the mirror shows the words replacing it); after new words the mirror and textarea scroll together to show them with one line of context, and when the textarea cannot scroll as far its caret hides until they line up. An IME composition shows the textarea itself while it lasts. Forced colours keep the textarea transparent. The composer grows to fit the words like typed text. Each heard turn lands at the caret and the caret moves just after it; the joins are fixed (one space, never two; a capital at a sentence start; a plainly capitalised first word lowered mid-sentence, never 'I' or an acronym; no full stop before the sentence goes on). A turn that lands anywhere but the end makes the draft edited and held: Enter (or the send word) sends it as one message", founder_words: "based on where the user's cursor is in the [composer] that is where all of the text should be input to. like if i go back to the top or in the middle of a paragraph what i say should be injected there", replaces: "the ghost line under the textarea (an italic --sec line of its own)", review: "proposed 2026-10-23 by the builder; atelier-mika 2026-10-23 accepted with amendments (the dotted --sec underline on committed words is accepted: --sec is 6.6:1 day and 5.8:1 night on --sheet, and it tells live words from typed ones in grayscale; the amendments are the full-strength tail, the '…' at the caret, the hidden stale selection, the offset caret, IME and forced colours). Mid-sentence capitals: lowered unless the human already wrote that word capitalised mid-sentence (a name); the creator may still choose never-lower. Aegis pending (a mid-draft turn sends as one edited part)" }
