    from: { session: 2026-10-22-gnomon-loops-ui, board: trust-card, choice: card-unfolds, decided_by: creator }
  loop-listing:
    role: "The ordered listing of a loop's nodes on the trust card: number, id and type, then argv, argv0 realpath with sha and interpreter, pass rule, tools, inputs, exits, and the outgoing edges. It reads at 80ch without wrapping argv; it is what you trust, so it is text."
    anatomy: ["verdict margin (empty on the trust card)", "number", "id (600) + type · role", "key/value lines (key 10ch --sec, code on --fold)", "edges line (10.5 --sec): outcome → target, ↺ for a back edge"]
    states: [check, model, notify, call]
    source: ".atelier/sessions/2026-10-22-gnomon-loops-ui/refs/direction.html (frame trust, ol.lst)"
    examples:
      check: '<ol class="lst"><li><span class="v"></span><span class="n">1</span><span class="hd"><b>tsc</b> <span class="ty">check · read · start</span></span><span class="ln"><span class="k">run</span><code>node_modules/.bin/tsc -p packages/gnomon --noEmit</code></span><span class="ln"><span class="k">argv0</span>…/node_modules/typescript/bin/tsc · sha 8e1f04c2 · under node (kernel) 22.11.0</span><span class="ln"><span class="k">pass if</span>tsc parse, 0 failed · timeout 600s</span><span class="ed">pass → @goal · fail → fix</span></li></ol>'
      model: '<ol class="lst"><li><span class="v"></span><span class="n">2</span><span class="hd"><b>fix</b> <span class="ty">model · act · local coder</span></span><span class="ln"><span class="k">tools</span>read, edit (scratch worktree) · 20 turns · 80k tokens</span><span class="ln"><span class="k">exit</span>8 visits · 3 fails in a row</span><span class="ed">pass → tsc ↺ · fail → tsc ↺ · unsure → ask · unavailable → ask</span></li></ol>'
      notify: '<ol class="lst"><li><span class="v"></span><span class="n">3</span><span class="hd"><b>ask</b> <span class="ty">notify · card</span></span><span class="ln"><span class="k">choices</span>continue, stop</span><span class="ed">continue → fix · stop → @stop · timeout → @pause</span></li></ol>'
      call: '<ol class="lst"><li><span class="v"></span><span class="n">2</span><span class="hd"><b>fix</b> <span class="ty">call</span></span><span class="ln"><span class="k">calls</span>green-typecheck-gnomon@3f9a1c02 (pinned; a change to it pauses this loop)</span><span class="ed">pass → tell · fail → tell</span></li></ol>'
    example_note: "call is composed from spec Example C; the rest are verbatim"
    status: clear
    from: { session: 2026-10-22-gnomon-loops-ui, board: trust-card, choice: card-unfolds, decided_by: creator, note: "the trust card keeps the listing although the detail draws a graph (board loop-detail)" }

