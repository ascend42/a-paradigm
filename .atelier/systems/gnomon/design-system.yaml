zones:
  header:
    surface: desk
    holds: ["wordmark menu (Gnomon ▾: Layout presets, Panes and Workshop…, Loops…, Pause all loops, Day/Night/Auto, Mods…, Voice settings…, Settings… ⌘,)", "⌘K palette field", "quiet kernel status (link dot; the loops word while any loop is enabled; browser-risk chip)", "voice pill (+ Stop speaking while speaking)", "pane toggles (sessions, decisions) under 900px"]
    never: ["notices, outcome text or toasts inside the row", "tool keys (Layout, theme, Mods, Settings)", "a second Start voice key", "anything that wraps inside a control"]
    overflow: "The row never wraps: the loops word drops 'waiting' to its counts first (full text in title=), then the palette's words truncate, then the pill's fact (20ch < 1040px, 10ch < 760px). With 'loops 1 · 2 waiting' the row held at 1440, 1024, 900 and 760, day and night (Mika, direction page, 2026-10-22). Phone widths are out of scope (rule desktop-only); the 390px clipping of the decisions toggle is left for the mobile version, not fixed here."
    status: clear
    from: { session: 2026-10-21-gnomon-voice, board: header-5b, choice: wordmark-menu, narrow: { session: 2026-10-21-design-systems, board: gnomon-narrow-header, choice: out-of-scope }, confirmed: { session: 2026-10-21-design-systems, board: bulk-confirm } }
    amended_by: [{ session: 2026-10-22-gnomon-loops-ui, board: running-indicator, choice: header-kernel-status, what: "loops word in the kernel status; Loops… and Pause all loops in the wordmark menu" }]
  notices:
    surface: desk, the band under the header
    holds: ["kernel alerts only: re-pin, voice dev build"]
    never: ["GUI outcomes, refusals, update available or offers (they are toasts)", "inside the header row", "anything outside .shell", "retired vocabulary (Ambient, push-to-talk)"]
    overflow: "One alert per line, in arrival order; each stays until acknowledged or resolved."
    status: clear
    from: { session: 2026-10-21-design-systems, board: gnomon-notices, choice: band-for-alerts }
  toasts:
    surface: "over the chat column, top-right (styles.css:956); lifted under the header while an overlay is open"
    holds: ["GUI outcomes (saved, not sent, refusal code + reason + next:)", "voice idle auto-off", "update available (with Restart now, which focuses the upgrade card)", "standing-grant offers and confirmations", "loop outcomes that need nothing: goal reached, landed (6s, Open run)", "Pause all's confirmation, Run now started, a budget applied (tighter)"]
    never: ["kernel alerts (the band)", "a decision key (a toast may focus a card, never decide one)", "bottom-right or bottom-centre placement", "covering the header row or a decision key", "a loop that still needs you: fail, stop, kernel pause (stack alerts) or waiting for trust (the slip)"]
    overflow: "At most three, newest on top; an older info toast leaves first. Text wraps to 4 lines at 44ch; a longer refusal keeps its next: line and puts the rest in title=. Hidden while an overlay is open, back when it closes."
    status: clear
    from: { session: 2026-10-21-design-systems, board: gnomon-notices, choice: band-for-alerts }
    amended_by: [{ session: 2026-10-22-gnomon-loops-ui, board: notify-decide, choice: stack-alerts-toast-outcomes, what: "placement recorded at the chat column's edge (supersedes 'under the voice pill'); loop outcomes join; loop trouble never toasts" }]
  sessions:
    surface: desk, left (200-260px)
    holds: ["+ New session (⌘N)", "search", "Active grouped by project (swatch + state note)", "Past collapsed", "mod slot left-bottom (bounded 45%)"]
    never: ["decision keys", "kernel status"]
    overflow: "Names truncate with the full name in title=; the list scrolls; under 900px it is a drawer from the sessions toggle."
    status: clear
    from: { session: 2026-10-15-gnomon-aesthetic, board: decision-stack-and-sidebar, choice: desk, confirmed: { session: 2026-10-21-design-systems, board: bulk-confirm } }
  centre:
    surface: desk, centre
    holds: ["chat header: title (✎ rename) · ■ project · model · started · run mode ▾ · ⋯ (small controls are 24px keys)", "the chat (timestamps, took Ns, activity fold, working line)", "offer slips under their reply", "this session's pending cards pinned above the composer (max 30vh)", "the composer (one send key)", "the empty sheet when no session is open", "the Loops leaf over the chat (header loops word, Gnomon ▾ Loops…, ⌘K loops.open); Esc folds it to an edge tab", "a loop-trust card unfolded over the chat by its Read key (fold or Esc puts it back)"]
    never: ["the raw kernel feed as default (it is a palette view)", "a second send control", "a mod surface covering header, stack, Workshop or pinned cards", "a leaf or unfolded card that covers the sessions rail, the stack or the header", "page-level sideways scroll from a loop graph (it zooms inside its own frame)"]
    overflow: "Rows hold an 80ch measure; the title gives way before the meta; pinned scrolls past 30vh."
    status: clear
    from: { session: 2026-10-15-gnomon-aesthetic, board: decision-stack-and-sidebar, choice: desk, confirmed: { session: 2026-10-21-design-systems, board: bulk-confirm } }
    amended_by: [{ session: 2026-10-22-gnomon-loops-ui, board: loops-zone, choice: centre-leaf, what: "the Loops leaf" }, { session: 2026-10-22-gnomon-loops-ui, board: trust-card, choice: card-unfolds, what: "the unfolded loop-trust card" }]
  stack:
    surface: desk, right (300-340px; Decide preset 320-460px)
    holds: ["Stack head: 'n to decide · m alerts' · hover to fan · project filter (a 24px key)", "the pile, in this order: decision cards (most urgent first), then alerts, then the waiting-for-trust slip at the foot", "a family head on every card and alert, by glyph and word (↻ loop, ◇ session; ✦ mod and voice planned)", "+N more", "mod slot right (ruled off, headed mods, outside the pile's scroll)"]
    never: ["model-text controls beside decision keys (Aegis M2)", "toasts over a decision key (pile reserves 140px)", "an alert above a decision card, or an alert tail that pushes a decision key out of reach", "a decision key on an alert or on the slip", "a family told by hue", "outcomes that need nothing (goal reached, landed: toasts)", "kernel alerts (the band)"]
    overflow: "The pile scrolls; decision cards fan on hover/focus while alerts and the slip sit flat beneath them; under 900px it is a drawer from the decisions toggle."
    status: clear
    from: { session: 2026-10-15-gnomon-aesthetic, board: decision-stack-and-sidebar, choice: desk, confirmed: { session: 2026-10-21-design-systems, board: bulk-confirm } }
    amended_by:
      - { session: 2026-10-22-gnomon-loops-ui, board: agent-loops-surface, choice: stack-slip, decided_by: creator, override: "the stack holds only cards", what: "the stack becomes decision cards plus alerts, styled by what they relate to; the slip at its foot" }
      - { session: 2026-10-22-gnomon-loops-ui, board: notify-decide, choice: stack-alerts-toast-outcomes, decided_by: creator, what: "order: decisions, then alerts, then the slip; loop fail, stop and kernel pause are alerts" }
  workshop:
    surface: desk, footer strip (default, 64px) or a 76px column left/right
    holds: ["Workshop mod caps: Needs you | Working", "Install Workshop when absent", "one quiet status line (live · waiting · log · rpc), right end"]
    never: ["kit.Button (Aegis M2)", "a per-mod hue", "type under 10.5"]
    overflow: "Under 900px it is always the footer; in the 76px column cap questions truncate at about 9 characters with the full text in title=. In the footer every word (mod label, zone title, quiet note, paused line, status line) sits in ONE line box of --key-h at the strip's floor, so all baselines agree with each other and with a key there; hats stand on the floor, a waiting cap's question above its hat, and the reduced-motion word of a working cap ('working') above its hat too, never below the floor (Mika 2026-10-23). Nothing wraps from 1024 to 2560: the host and the status line clip."
    status: clear
    from: { session: 2026-10-15-gnomon-aesthetic, board: iconography, note: "founder 2026-10-17 placement: footer default, vertical edges as presets", confirmed: { session: 2026-10-21-design-systems, board: bulk-confirm } }
    amended_by: [{ session: 2026-10-23-gnomon-folder-picker, decided_by: creator, what: "the strip's line: one --key-h line box at the floor for every footer word (titles were pinned to the top and notes to the bottom, the status line centred)", founder_words: "even the bottom workshop area has strange alignment" }]
  overlays:
    surface: over the desk
    holds: ["command palette", "new session", "Settings sheet", "Mods sheet", "Voice settings drawer (teaching inline under its row)", "reconnect"]
    never: ["a modal over the Voice settings sheet", "toasts (hidden while any overlay is open)"]
    overflow: "Sheets cap at 78vh and scroll their body; under 900px they take the width minus 32px."
    status: clear
    from: { session: 2026-10-21-gnomon-voice, board: teach, choice: inline-in-sheet, confirmed: { session: 2026-10-21-design-systems, board: bulk-confirm } }
  kernel-owned:
    surface: every zone
    holds: ["voice pill", "link status, the loops word (and its keep-alive line) and the browser-risk chip", "a loop card's kernel line (Raised by loop … / changed by …)", "run mode", "re-pin and voice-dev alerts", "dictation ring", "handle words", "held countdown", "card bodies, the voice tag and the contentHash line"]
    never: ["hidden by any layout preset, pane switch or mod"]
    overflow: "n/a"
    status: clear
    from: { session: 2026-10-20-gnomon-gui-fidelity, note: "spec §11 kernel-owned regions; preserve_from", confirmed: { session: 2026-10-21-design-systems, board: bulk-confirm } }

# ─────────────────────────────────────────────────────────────────────────────────────────────────────────────────────
content:
  vocabulary:
    use:
      session: "one Claude (or local model) conversation in a folder"
      card: "one decision the kernel asks of you"
      stack: "the global pile of every pending card (header 'Stack'; 'decision stack' in long form)"
      pinned: "this session's pending cards above the composer ('pending in this session')"
      KNOT: "a conflict git can't see; violet; the only use of violet"
      run mode: "manual / ask / auto-edits, per folder or per session. Always the two words 'run mode' (never 'mode' alone, never 'run'); it is a session's permission setting and has nothing to do with loops"
      loop: "a definition that runs on its own (triggers, nodes, budgets; loop:v2), named by its id in mono"
      run: "one execution of a loop, from trigger to @goal, @stop or @pause. Inside loop surfaces (the leaf, loop cards, alerts, loop toasts) just 'run': Run now, Open run, last run, run 7f3a. Anywhere else, 'loop run'. A session is never a run"
      round: "one pass of a fix cycle inside a run ('round 3 of 8')"
      waiting for trust: "a loop definition no human has trusted at this hash"
      trust: "the root-key, hand-only decision that lets a loop definition run; Untrust takes it back; 'Don't trust' on the card"
      Pause all: "the loops kill switch (key label); no presence; resuming needs presence ('Resume all · presence'); a row paused by it reads 'paused · kill switch'"
      kernel pause: "the kernel paused a loop (thrash, strictness, content or closure change, budget); 'kernel-paused' on a row; resuming needs presence"
      alert: "a stack sheet that decides nothing: a loop that is stuck and still needs you"
      family: "what a card or alert relates to, named by glyph and word in its head (↻ loop, ◇ session)"
      autonomy: "observe / act / propose, with the cap reason ('act → propose (L2: a-paradigm strictness)'); never 'mode'"
      presence: "fresh Touch ID, or the Mac password where Touch ID is unavailable; named in a key's cost ('Resume · presence'); long copy says 'Touch ID or your Mac password' (amended by session 2026-10-22-gnomon-local-model)"
      local model: "a model server on this Mac that sessions and loops can use instead of Claude (8.0: loopback only); 'Set up local model…', 'none set up'"
      card waiting: "a request whose card is in the stack (a plain chip in the sheet that asked for it)"
      land: "a loop committing its scratch work to the branch; 'landed <sha>'; 'waiting to land'; 'parked' when it waited too long"
      Workshop: "the caps mod: Needs you | Working"
      cap: "one session in the Workshop"
      rung: "a voice preset on the ladder: Off, Talk, Dictate, Send word, Pieces"
      open mic: "the mic is listening without a held key"
      send word: "the word that sends a voice turn"
      edits ask first: "the clamp on a voice-sent turn"
      chip: "a status label nobody clicks (never 'badge' in copy)"
      key: "anything you click"
      toast: "a notice that is not a kernel alert"
      hand only: "a card voice can't decide (the voice tag's words)"
      mod: "an installed extension, named mod:<name>"
      offer: "the agent's single suggestion to open a mod"
      kernel-owned: "a region no preset or mod can hide"
      folder: "where a session works (the session.open cwd), in GUI copy; 'cwd' stays in the wire, the CLI and logs"
      recent folders: "the folders past sessions opened in, newest first (at most six in New session)"
    retired:
      Ambient: "the rung name (Dictate, Send word or Pieces) or 'open mic'"
      push-to-talk: "Talk"
      inbox: "stack"
      LOOPS n running: "'loops n · m waiting' (the spec's Shuttle line; the indicator is the header loops word)"
      loop mode: "autonomy (observe / act / propose) or run mode, whichever is meant"
      cwd: "'folder' in GUI copy (the New session field label)"
    status: clear
    from: { session: 2026-10-21-gnomon-voice, note: "commit 6f986338 retired Ambient/push-to-talk; 'stack' from the desk board (global decision stack)", confirmed: { session: 2026-10-21-design-systems, board: bulk-confirm } }
    amended_by:
      - session: 2026-10-22-gnomon-loops-ui
        what: "loop vocabulary; 'run' (a loop run) vs 'run mode'"
        decision: "Keep both words and keep them apart; no rename. 'run' is the spec's and the kernel's word ($loop-run, loop.run.*, Run now) and the founder approved copy built on it; 'run mode' is shipped, kernel-owned vocabulary. They never share a surface (the Loops leaf covers the chat header that holds run mode ▾), so the collision is only in the words: 'run mode' always appears as both words, loops never use 'mode' (they have 'autonomy'), and 'loop run' is the long form outside loop surfaces."
        decided_by: recommendation
        note: "Decided, not contested: renaming run mode would churn shipped kernel copy for a collision that never shares a screen. Reopen if a loop surface ever shows run mode."
      - session: 2026-10-22-gnomon-local-model
        what: "local model, card waiting; presence includes the Mac password"
        decided_by: creator
      - session: 2026-10-23-gnomon-folder-picker
        what: "folder, recent folders; cwd retired from GUI copy"
        decided_by: creator
  voice:
    - "Name the state plus one live fact; never only a glyph (board pill)"
    - "Lowercase, numbers before nouns ('4 running'), items joined with ' · ' (cli-voice)"
    - "No emoji, no exclamation marks, no 'Oops' (cli-voice)"
    - "Every refusal: CODE in caps, the reason in plain words, then 'next:' (cli-voice; app.ts refusalText)"
    - "Durations '2m 14s', clock '14:02', thin-space thousands '1 204' (cli-voice)"
    - "A disabled control says why in words, not only in a tooltip (settings-sheet.ts:44-47)"
    - "Never ask the user to say the product name; spoken phrases are plain sentences (board teach)"
    - "A voice instruction quotes the exact phrase the grammar accepts, in “ ” after 'say' (board gnomon-voice-tag)"
    - "State is a word plus a mark (filled or hollow dot, ✓ ✕ ◆) and weight, in ink; colour only for the three semantic states, never alone (board gnomon-status-colour)"
  cli_example: |
    $ gnomon status
    sessions  4 running · 1 failed · 2 need you
    cards     permission ×1 · knot ×1
    voice     armed · reversible · 41:10 left
    ✓ kernel 8.0.0-dev · log verified (1 204 events)
