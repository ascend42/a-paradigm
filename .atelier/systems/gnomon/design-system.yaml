  folder-field:
    role: "Naming a folder (or, in the file variant, a file) on this Mac. You choose it; you don't type it. Recent folders are one-click choices, Choose folder… opens the Mac's own chooser (the kernel opens it), and a typed path is an Advanced fallback, shown open only when no chooser exists."
    variants:
      recents: "New session: a radiogroup of up to six recent folders, then Choose folder… and Type a path ▸"
      compact: "one value, no recents (Settings › Local model runner, Mods › Add from folder): the value or 'none · <what happens>', Choose folder… / Choose another…, Clear, Type a path ▸"
      file: "the compact variant for a file (Mods › Configure command): Choose file…"
    anatomy:
      - "legend: the sheet's own label style (New session: .meta 11.5 --sec, like 'model'; settings-form: .sf-label 10.5)"
      - "recent row (.ff-row, role=radio, roving tabindex, min-height 40): mark (✓ chosen, ✕ chosen but failed its check) · project swatch · name (11.5, 500; 600 chosen) over path (10.5 --sec, ~-shortened by the kernel) · when (10.5 --sec: today 14:06, yesterday, Oct 19, just chosen, from terminal)"
      - "opens-in line (10.5 --ink2, path 600 --ink, wraps anywhere): the whole path of the chosen folder, plus ' · outside your home folder' when it is"
      - "keys: Choose folder… (default key; busy 'Choosing…') and Type a path ▸ (quiet, aria-expanded)"
      - "typed field (folded): label 'path', no placeholder, note 'a full path, or one starting with ~/ · checked as you type'"
      - "one check line: ✓ note, ✕ error (.sf-err, role=alert) or ◆ warning (10.5 --warn-ink, role=status)"
    states: [empty, recents, chosen, chooser-open, chooser-cancelled, typed-open, checking, found, not-absolute, missing, not-a-folder, unreadable, wrong-contents, home-or-above, outside-home, terminal-hint, no-chooser, opening, refused, open-failed, open-failed-keyed]
    behaviour:
      - "Sheet opens: the chosen row is the centre session's folder, else the most recent (C2); focus on it, so ⌘N then Enter opens. No recents: focus on Choose folder…"
      - "Arrows move and choose within the list; Home/End jump; Tab leaves the list; Enter anywhere submits the sheet"
      - "Choose folder… asks the kernel to open the macOS chooser (C1; trusted event only), starting in the parent of the most recent folder; the key is busy and a status line says it may be behind the window; picking a recent, Esc or cancel closes the chooser"
      - "A chosen folder that isn't a recent goes to the top, chosen, 'just chosen'; focus returns to it. Cancelling changes nothing; focus returns to Choose folder… and a hidden status says 'No folder chosen. Nothing changed.'"
      - "Every choice is checked by the kernel (read-only) before Open is enabled; 'checking…' only past 150 ms; typed paths 300 ms after the last key"
      - "Every folder choice (row, chooser, typed, hint) restores the claude model remembered for that folder"
      - "Open keeps the sheet open, busy 'Opening…', until session.open answers; success closes it; a refusal shows in place and keeps the choice"
      - "Recents that no longer exist are left out; the home folder or above is allowed with the amber warning (C4); no drag from Finder in 8.0 (C3: the Mac's chooser takes a Finder drag and ⌘⇧G)"
    copy:
      title: "New session"
      legend: "folder"
      keys: { choose: "Choose folder…", choose-again: "Choose another…", choosing: "Choosing…", typed: "Type a path ▸ / ▾", clear: "Clear", open: "Open", opening: "Opening…", cancel: "cancel" }
