# ─────────────────────────────────────────────────────────────────────────────────────────────────────────────────────
# Components. Source paths are relative to the repo root. Examples are the real markup (index.html or the h() calls);
# where a decision changes the markup, the example is the decided markup and the migration names the change.
# ─────────────────────────────────────────────────────────────────────────────────────────────────────────────────────
components:
  key:
    role: "Anything you can click that the kernel or the app owns: decisions, actions, toggles, and every small control on a chip-sized line. Never drawn from model text."
    anatomy: [label, "kbd hint (optional)"]
    variants:
      default: "sheet fill, key-edge ring, hard ink offset by day; ring only at night"
      pri: "filled ink, on-ink text: the one primary per group (first non-deny decision; send)"
      quiet: "no offset, --ink2, the same height as every key (var(--key-h)): secondary actions (close, done, raw, ⤢, Hold, cancel, Advanced ▸, Type a path ▸) and the small keys that used to be drawn as chips (✎ rename, run mode ▾, stack filter). Quiet is a look, not a size (amended 2026-10-23: was 24px min)"
      seg: "a segmented choice (.seg-key in .seg); selected = filled ink by day, [bracketed] + glow at night"
      newb: "+ New session: full-width, [bracketed] at night"
      cost-label: "a key whose press costs something names it after ' · ': 'Loosen · needs trust', 'Resume · presence', 'Resume all · presence'; tightening says so too ('Apply · tighter'). From session 2026-10-22-gnomon-loops-ui, board steer-stop."
    sizes: { all: { min-height: "var(--key-h) 28", min-width: "var(--key-h) 28 (glyph keys)", font: 11.5 } }
    build: "height comes from min-height: var(--key-h) with inline-flex centring (padding 0 10; quiet 0 8), not from padding + line-height, so glyph labels (✎ ⋯ ⤢ ▸) and words land on the same box. The day offset shadow stays outside the layout box. A key whose label wraps may grow past it (min-height, not height)."
    states: [default, hover, focus, pressed, selected, disabled, busy]
    state-notes: { disabled-quiet: "a disabled or aria-disabled quiet key draws --sec text on a --rule edge (.key.quiet[disabled], .key.quiet[aria-disabled=true]); quiet's --ink2 must never out-rank the disabled look (Mika C4'b F5)", busy: "a busy key is aria-disabled, not disabled, so it keeps focus", aria-disabled: "C5'b (Mika 2026-10-28): any disabled or aria-disabled key draws the quiet look, border --rule and no offset shadow (.key[disabled], .key[aria-disabled=true]), so its edge never says it presses (principle 2); its text is --sec" }
    tokens: { fill: --sheet, edge: --key-edge, text: --ink, hover: --fold, offset: --key-shadow, pri-fill: --ink, pri-text: --on-ink, focus: "2px solid --key-edge" }
    source: packages/gnomon-gui/static/styles.css:180-197,244
    examples:
      default: '<button class="key" type="button" data-decision="deny">Deny</button>'
      hover: '<button class="key is-hover" type="button">Deny</button>'
      focus: '<button class="key" type="button" data-focus-visible>Deny</button>'
      pri: '<button class="key pri" type="button" data-decision="allow">Allow</button>'
      quiet: '<button id="settings-close" class="key quiet" type="button" title="Close (Esc)">close</button>'
      small: '<button class="key quiet rename-btn" type="button" aria-label="Rename session">✎</button>'
      selected: '<span class="seg" role="radiogroup" aria-label="Motion"><button class="key quiet seg-key current" type="button" role="radio" aria-checked="true">Follow the Mac</button><button class="key quiet seg-key" type="button" role="radio" aria-checked="false">Reduce</button></span>'
      disabled: '<button class="key workshop-install" type="button" disabled>Install Workshop</button>'
      busy: '<button class="key" type="button" aria-busy="true">Allow</button>'
      pressed: '<button class="key composer-tall" type="button" aria-pressed="true" aria-label="Tall view">⤢</button>'
      cost-label: '<button class="key" type="button">Loosen · needs trust</button>'
    status: clear
    from: { session: 2026-10-20-gnomon-gui-fidelity, board: s1-tokens-themes, note: "ink keys, >= 3:1 edge, 28px; Aegis: model text never gets .key; small keys at 24px from board gnomon-chip", confirmed: { session: 2026-10-21-design-systems, board: bulk-confirm } }
    amended_by: [{ session: 2026-10-22-gnomon-loops-ui, board: steer-stop, what: "variant cost-label" }, { session: 2026-10-23-gnomon-folder-picker, decided_by: creator, what: "one key size var(--key-h) 28 for every variant; quiet is a look, not a size (measured: 7 of 14 variants were 24px beside 28px keys)" }]
  field:
    role: "Text entry: composer, search, palette field, rename, settings inputs."
    variants: { default: ".field", palfield: "the header's palette launcher (a button drawn as a field)", composer: "one container: the composer draws the only border and the focus ring" }
    states: [default, hover, focus, invalid, disabled]
    tokens: { fill: --sheet, edge: "--sec (5.8:1 on the page, 6.5:1 on the sheet)", hover: --key-edge, focus: "2px solid --key-edge", invalid: --fail-edge }
    source: packages/gnomon-gui/static/styles.css:199-206,755,800-804,865-871,966
    examples:
      default: '<input id="session-search" class="field" type="search" placeholder="search sessions" aria-label="search sessions">'
      palfield: '<button id="palette-btn" class="palfield" type="button" title="Command palette (⌘K)"><span class="pal-ph">Search, run, jump<span class="pal-ph2">, or open anything</span>…</span><kbd>⌘K</kbd></button>'
      invalid: '<input class="field" type="text" aria-invalid="true" value="sendd">'
      disabled: '<input class="field" type="text" disabled value="kernel-owned">'
    status: clear
    from: { session: 2026-10-21-design-systems, board: gnomon-field-border, choice: sec-edge }
  menu:
    role: "A popover list under its trigger: the wordmark menu, run mode, model, ⋯ more."
    anatomy: [heading (.menu-h), item (.mode-item / .app-item: name, note, kbd), rule (.menu-rule)]
    states: [default, hover, focus, current, disabled, expanded-group]
    tokens: { fill: --sheet, edge: --key-edge, shadow: --sheet-shadow, radius: 3, hover: --fold }
    source: packages/gnomon-gui/static/styles.css:611-618,784-798
    examples:
      default: '<button class="mode-item app-item" type="button" role="menuitem" data-run="settings.open"><span class="mode-name">Settings…</span><kbd class="mode-kbd">⌘,</kbd></button>'
      current: '<button class="mode-item app-item current" type="button" role="menuitemradio" aria-checked="true"><span class="mode-name">Desk</span></button>'
      disabled: '<button class="mode-item app-item" type="button" role="menuitem" disabled><span class="mode-name">Workshop</span><span class="mode-note">not installed</span></button>'
    status: clear
    rules:
      - "A menu is never clipped by its trigger's row: when the trigger sits in a part that clips its overflow (the chat header's left part, where the title and meta ellipsize), the menu hangs from the row itself (.pane-head), placed under its key, and sits in the DOM right after the clipped part so Tab goes key → its items → the next key."
      - "A repaint of the row a menu hangs from keeps the trigger and the open menu (the chat header repaints on every row a streaming session adds)."
    from: { session: 2026-10-21-gnomon-voice, board: header-5b, note: "the .mode-menu / .mode-item idiom is the menu", confirmed: { session: 2026-10-21-design-systems, board: bulk-confirm } }
    amended_by: [{ date: 2026-10-23, what: "rules not-clipped and survives-repaint (founder: the header model key 'default ▾' did nothing when pressed: its menu opened inside the clipped header part and every streamed row rebuilt it)", reviewed: { by: atelier-mika, date: 2026-10-23, verdict: accepted, amended: "Tab order: the hung menu follows its key in the DOM" } }]
    variants:
      slash-menu: "C6'b2-1: the composer's / menu (component slash-menu): a menu hung ABOVE the composer, a listbox, not a menu of menuitems"
  slash-menu:
    role: "The composer's / menu (C6'b2-1, #gui-slash-menu): the focused session's skills, Gnomon commands and this local session's tools by server, run by the human from /. A variant of menu, hung above the composer; the textarea keeps the focus."
    pattern: "menu (variant): the same sheet fill, key edge, shadow and radius; .menu-h group headings; rows in the .mode-item rhythm"
    anatomy:
      - "role listbox (#slash-list) driven from the composer textarea by aria-activedescendant; option ids are a hash of the row key, so they stay the same across repaints (a header repaint or a re-read never moves or closes it)"
      - "groups, in order: Skills · Gnomon commands · Tools · <server> (one group per server, the kernel's order); heading .menu-h"
      - "row (.slash-opt, role option): name (11.5 500 --ink) · note at the right = its cost tag (runs now · asks first · card with Touch ID · posts as your turn · opens a screen; 10.5 --sec) · why under it (the description; 10.5 --sec)"
      - "row that cannot run: aria-disabled, focusable, quiet ink (--sec), the reason as its note in --ink2 on its own line ('not trusted · next: trust it in Settings › MCP servers', 'Gnomon can't check its inputs: <detail>'); never a kernel code; a press sends nothing and says the reason again"
      - "tier 0, servers not started: ONE row 'Start servers for /' · 'starts N servers; the model still gets no tools'; while it runs 'starting…' aria-disabled; a failure in the drawer's fitWords under it"
      - "servers off at a tier above 0: ONE row 'servers are off in this session' · 'see Tools' (opens the Tools drawer)"
      - "foot (10.5 --sec over a --rule): '↑ ↓ move · Enter opens · Esc closes the menu'"
      - "args panel (#slash-args, replaces the list in place): head (name · on <server>), why, one field per argument (label 10.5, '· needed' when required; text and number inputs, a seg for an enum or a boolean, a mono JSON textarea for anything complex; a skill's one line labelled Arguments with its argument hint as placeholder, the skill's description said once under the head; never a type word as a placeholder: a number says 'a number' or 'a whole number'; the composer's own textarea reset never reaches these fields, so the JSON field keeps its edge and focus ring), the field's problem in words ('needed: fill this in'; 10.5 600 --fail, aria-invalid + aria-describedby), a refusal line (.sf-result fail, role alert), keys: Run (pri) naming its cost ('Run · runs now' / 'Run · asks first' / 'Run · card with Touch ID' / 'Run · posts as your turn') and close (quiet)"
      - "one persistent polite live line (#slash-say), made at mount"
    keyboard: "Typing '/' and one word opens it and filters it (the typeahead); ↑/↓ move the active row; Enter on a row opens its args panel (a read tool with no arguments runs at once; a command opens its screen; Start starts); nothing matching: Enter sends the text as a message; Esc closes ONLY the menu. In the panel, focus is in the first field, Tab stays inside (the shared trapTab), Enter in a one-line field runs, ⌘Enter from the JSON field, Esc closes the menu and focus returns to the textarea (on any close from inside the menu). Until the human presses ↑/↓ the active row is the first enabled row on every refresh."
    states: [closed, reading, loaded, unreachable, no-match, active, row-disabled, starting, args, args-invalid, args-refused, running-skill]
    never: ["take the focus from the textarea while the list shows", "a kernel code shown raw", "a send on an untrusted event (G-GUI-04)", "a run from an aria-disabled row or key", "a live region made per update"]
    tokens: { fill: --sheet, edge: --key-edge, shadow: --sheet-shadow, radius: 3, active: "--fold fill + inset 2px --key-edge ring (as .mode-item focus)", disabled: --sec, max-height: "min(360px, 50vh), scrolls inside" }
    source: packages/gnomon-gui/src/core/slash-menu.ts; packages/gnomon-gui/src/ui/slash-menu.ts; packages/gnomon-gui/static/styles.css (.slash-menu, .slash-opt, .slash-args)
    examples:
      list: '<div class="slash-menu"><div id="slash-list" class="slash-list" role="listbox" aria-label="/ menu"><div class="slash-group" role="group" aria-labelledby="slash-g-0"><div class="menu-h slash-h" id="slash-g-0" role="presentation">Skills</div><div class="slash-opt active" role="option" aria-selected="true" id="slash-o-skill-1x2y"><span class="slash-name">/review</span><span class="slash-note">posts as your turn</span><span class="slash-why">review the diff</span></div></div><div class="slash-group" role="group" aria-labelledby="slash-g-1"><div class="menu-h slash-h" id="slash-g-1" role="presentation">Tools · fs</div><div class="slash-opt off" role="option" aria-selected="false" aria-disabled="true" id="slash-o-tool-3z"><span class="slash-name">rm</span><span class="slash-note">not trusted · next: trust it in Settings › MCP servers</span></div></div></div><p class="slash-foot">↑ ↓ move · Enter opens · Esc closes the menu</p></div>'
      args: '<div id="slash-args" class="slash-args" role="group" aria-labelledby="slash-args-h"><p class="slash-args-h" id="slash-args-h">write<span class="slash-note"> on fs</span></p><div class="slash-field"><label class="sf-label" for="slash-f-0">path<small class="slash-req"> · needed</small></label><input class="field" id="slash-f-0" aria-required="true"></div><div class="sf-keys"><button class="key pri" type="button">Run · asks first</button><button class="key quiet" type="button">close</button></div></div>'
    status: proposed
    from: { design: "Mika, C6'b2 brief (TD-2026-10-28-956, -969)", founder: "first-use question inline on the run row; a Send this one key; taint in the drawer plus one transcript note (b2-2)", decided_by: none, review: "atelier-mika reviews it rendered (C6'b2-1)" }
