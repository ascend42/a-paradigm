        what: "choice-multi: when the line just above a recognised option run (or the reply's said line) asks for several (pick any, any of, all that apply, one or more, select multiple, multi-select, as many as), the chips are toggles: a click, Space or Enter toggles one (aria-pressed, the ✓ state), letters and numbers only move focus (Aegis M1 as before), arrows move. One .choice-send key after the chips ('Send 2' naming the count; aria-disabled with none toggled) sends the toggled options as ONE human message, one 'K — label' line each in list order, through the composer's submit (a draft is never overwritten: the lines go after it and nothing is sent). A toggled option whose label needs confirming (long, a backtick, shell-like) arms the Send key (amber, 'again to send') instead. Only runs the existing parser recognises; the multi cue never makes a list into options. After sending: the sent options stay marked picked, the rest inert."
        founder_words: "regarding options that gnomon presents to the user, even multi selections, it would be nice to click them"
        review: "atelier-mika 2026-10-24 Delta 11 approved-with-fixes (a 12px box drawn at rest on each live chip, filled ✓ when toggled, so the chips never reflow; focus to the composer after Send); Aegis L3 (the Send key's title and aria-label carry the composed lines; armed, a .choice-compose note under the chips shows the lines and which label armed it and why), L4 (the group, chips and Send carry data-reply-hash of the painted reply; a toggle, pick or Send against changed text is refused)"
        examples:
          multi: '<div class="choices multi live" role="group" aria-label="Reply with any of these options"><small class="choices-hint">pick any, then send</small><button class="choice toggled" type="button" aria-pressed="true"><kbd class="choice-k">1</kbd> <span class="choice-t">logging</span></button><button class="choice" type="button" aria-pressed="false"><kbd class="choice-k">2</kbd> <span class="choice-t">metrics</span></button><button class="choice-send" type="button">Send 1</button></div>'
  question-card:
    role: "A session's AskUserQuestion, answered by clicking: the ask-user card's picker, in the pinned zone of its session (the chat column, above the composer) and in the stack. Built ONLY from the card's contentHash-verified structured detail (askDetailOf), never from display text; the kernel checks the answer against the questions it holds."
    anatomy: ["per question a group (role radiogroup for one pick, group for many) with: the header as a quiet chip before the question (11.5 --sec), the question (reading 13.5 --ink)", "options as .ask-opt buttons in a column: a number kbd (1..9), the control drawn at rest before the label (a 12px ring for one pick, a 12px box for many, 1px --sec; picked: the ring filled --ink with a --sheet gap, the box filled --ink with a ✓; nothing is inserted, so the label never shifts), the label (--ink, a hanging indent past the control), the description under it (10.5 --sec, aligned with the label); one pick: role radio, many: role checkbox, both aria-checked", "Other: a last .ask-opt 'Other…' that focuses the text field under the options (.ask-free, the kernel's maxAnswerChars); typing there is the answer for a one-pick question (it clears the pick) and is added after the toggled labels for a many-pick question", "preview: when any option of a question has one, a .ask-preview box beside the options (3fr options, 2fr preview, top-aligned, sticky) when the picker is 600px wide or more (a container query: the pinned zone at 1440 and up), else under them: mono 11.5 on --ground, 1px --rule, pre-wrap, plain text only (never markdown or HTML), showing the focused option's preview, else the picked one's; 'no preview' for an option without", "the card's one decision key reads 'Submit' ('Submit answers' for several), is the card's .key pri, and is aria-disabled until every question has an answer (drawn as the disabled pri key: --sheet fill, --sec text, as .key.pri[disabled]); pressed early it keeps the focus and the page's own line under it names what is open ('… Not answered yet: Checks.', no kernel code), cleared once every question has an answer", "answered: the card leaves; the transcript's decided line reads 'answered · Rounding: Round every line · Checks: unit tests, typecheck' on this page (page-only, never logged: the kernel keeps a noteHash), and the focus goes to the composer"]
    variants: { one: "a single one-pick question", many: "multiSelect: toggles", several: "2..8 questions stacked, each its own group; Submit answers all at once", preview: "with previews: options, then the preview box" }
    states: [default, picked, toggled, "other (text typed)", "incomplete (Submit aria-disabled)", "refused (the kernel's refusal line under the keys)", "stamped (the decision word), then the card leaves like every card"]
    keyboard: "A one-pick question is ONE tab stop (the radio group pattern: the picked option, Other when typed, else the first; it follows the focus while arrowing); a many-pick question's options are a tab stop each (checkboxes). ↑/↓ (and ←/→, Home, End) move between a question's options and Other; Space or Enter picks or toggles; a number 1..9 or a letter a..i picks or toggles that option of the question holding the focus; Tab moves on to the text field and Submit. Keys never act while the focus is in the text field; Enter there submits."
    never: ["render a preview or option as markup (text nodes only)", "pick, toggle or submit without a trusted gesture (a click or a key press; isTrusted)", "answer by voice except through the existing voice decision rules (the ask-user answer is the voice allowlist's reversible decision; this card adds no voice path)", "look like a model-text-control (these come from the kernel's verified detail: key family, kernel-owned)", "keep an answer after the card left (the page's picks are dropped with the card)"]
    tokens: { option: "key family, quiet: 1px --rule edge, --key-h min height, 6px 10px padding, full width", picked: "1px --ink2 edge, a filled ● (one pick) or ✓ (many) before the label", number: "kbd mono 10.5", description: "10.5 --sec", preview: "mono 11.5 --ink on --ground, 1px --rule, max-height 240px scrolling inside", gap: "6px between options, 12px between questions" }
    source: packages/gnomon-gui/src/core/ask-card.ts; packages/gnomon-gui/src/core/render.ts askDetailOf; packages/gnomon-gui/src/ui/app.ts (the ask handlers); packages/gnomon-gui/static/styles.css .ask-picker
    examples:
      one: '<div class="ask-picker" data-ask-card="card:01J"><div class="ask-q" role="radiogroup" aria-label="Lib: Which date library?"><p class="ask-head"><span class="chip ask-h">Lib</span> <span class="ask-text">Which date library?</span></p><div class="ask-opts"><button class="ask-opt picked" type="button" role="radio" aria-checked="true"><kbd>1</kbd> <span class="ask-l">dayjs</span> <small class="ask-d">Small, immutable, moment-compatible API via plugins.</small></button><button class="ask-opt" type="button" role="radio" aria-checked="false"><kbd>2</kbd> <span class="ask-l">moment</span> <small class="ask-d">Long-established, mutable date API.</small></button><button class="ask-opt ask-other" type="button" role="radio" aria-checked="false"><kbd>3</kbd> <span class="ask-l">Other…</span></button><input class="field ask-free" type="text" placeholder="or type your own answer"></div><pre class="ask-preview">import dayjs from &#39;dayjs&#39;;</pre></div></div>'
    status: proposed
    from: { founder: "regarding options that gnomon presents to the user, even multi selections, it would be nice to click them", date: 2026-10-24, decided_by: none, review: "atelier-mika 2026-10-24 Delta 11 approved-with-fixes (controls drawn at rest, preview beside when wide, one tab stop per one-pick question, the aria-disabled pri look, the early-Submit line, the answered line, focus to the composer); Aegis M2 (the preview refresh goes through displayText), L1 (voice never answers: broker #approve refuses voice)" }
