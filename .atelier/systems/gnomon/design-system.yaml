        batch: { amended_by: { date: 2026-10-23, decided_by: creator, quote: "grouped cards of related things needs to occur if possible" }, entry: "readonly row 'Several at once' after the servers (grp), shown when two or more servers can be turned on and nothing is marked or waiting: value 'one card, one Touch ID or password'; how 'Mark the servers you want, then turn them all on with one root card.'; key 'Mark several' (quiet; focus moves to the first Mark key). Marking with none marked yet: 'Marked to turn on' · 'none yet' · how 'Press Mark on each server you want; Turn on shows here once one is marked.' · key 'Stop marking' (quiet; Clear marks and Stop marking bring the one-press keys back and focus Mark several)", marked-row: "value 'marked to turn on for all repos | in <folder>' by word and weight, never a hue (Mika: 'marked: on' read as already on); key Unmark", bar: "readonly row 'Marked to turn on' after the servers (grp, live): value '<n> servers: <name> (all repos | <folder>), …'; keys 'Turn on <n> servers · asks Touch ID or your Mac password once' (pri) + 'Clear marks' (quiet); how 'One card lists every marked server, each with what it runs, its env names, its network host and your auto-allow rules. Allow takes the root key and your presence once.'; while a card waits the pri key is disabled and the how says 'Turn on waits until you decide the card above: one card at a time.'", waiting-row: "a server on the waiting card: value 'off until you allow its card', no key", skipped: "On <names> at hh:mm. <names> changed while the card waited, so it stays | they stay off. next: look at it | them again, then turn it | them on again. (from this card's entry in status.mcp.skips; On names its `on`; the skip sentence only for the connection that decided the card, entry.connId; another window's page shows only 'On <its on>', or nothing)" }
        request: { chip: "card waiting", line: "hh:mm · turn on <name> · all repos | <folder>, <name> · …", key: "Decide in the stack", how: "Allow takes the root key and your presence. Deny keeps the server off. (a batch card: 'Allow takes the root key and your presence once for all of them. Deny keeps them off.') Meanwhile you can mark the next servers; they go on the next card.", placement: "a one-press card: under its server's row, and its outcome too (Delta 7's rule); a batch card: with the batch, after the last server (it belongs to no one row; each of its rows reads 'off until you allow its card'), and the batch's outcome there too; an off result always shows under its server (Mika 2026-10-23)" }
        results: { on: "On <name> at hh:mm. New sessions start it.", off: "Turned off <name> at hh:mm. New sessions won’t start it.", denied: "Not changed: <name> stays off; the card was denied at hh:mm.", refused: "Not changed: <plain reason>. next: <what to do> (by data.why: repo-only, not-found, changed, platform; never the wire code or the symbol)", no-answer: "Not changed: Gnomon did not answer. next: check the connection (⌘K, Reconnect), then press it again." }
