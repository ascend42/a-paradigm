  # ── Loops (session 2026-10-22-gnomon-loops-ui; direction refs/direction.html, approved by the founder 2026-10-22).
  # Examples are the direction page's markup (frames desk, leaf, trust, choice); where a state was not drawn there,
  # the example is composed from the same markup and says so in example_note. CSS for these classes lives in the
  # direction's reference CSS until the build moves it into packages/gnomon-gui/static/styles.css.
  alert:
    role: "A stack sheet that decides nothing: a loop that is stuck and still needs you (failed, stopped by a budget or exit, paused by the kernel). It sorts under every decision card and above the trust slip, and stays until dismissed or its cause clears."
    anatomy: ["family head (↻ loop · ■ project · alert · hh:mm)", "title led by a state mark (✕ failed, ■ stopped, ‖ paused)", "run path with node marks", "quiet keys only: Open run, Dismiss"]
    variants: { fail: "vermilion left edge; ✕ and the title in --fail", stop: "--key-edge edge; ■ and the title in ink; names the limit that stopped it", kernel-pause: "dashed amber left edge; ‖ and the reason; Resume · presence lives in the detail, not on the alert", refused-start: "--key-edge edge; a loop whose trigger fired but which was refused before any step (no-local-model): title '■ <id> didn’t start', path '<reason> · scheduled hh:mm · refused before any step · ×n since <day>'; quiet keys to the fix (Set up local model…) and Dismiss; one per loop, a repeat refusal updates its count; clears itself when the cause clears; the loop also pins to needs you" }
    never: ["a decision key (Allow, Trust, Continue)", "the fold shadow or the fan rotation (alerts sit flat, --r 0deg)", "a family told by hue", "an outcome that needs nothing (goal, landed: a toast)"]
    states: [fail, stop, kernel-pause, refused-start]
    tokens: { fill: --sheet, shadow: none, day-ring: "1px --rule", edge-w: --edge-w, fail-edge: --fail-edge, kernel-pause-edge: "--warn-edge, dashed", title: "11.5 control" }
    source: ".atelier/sessions/2026-10-22-gnomon-loops-ui/refs/direction.html (frame desk, .card.alert); not yet in packages/gnomon-gui"
    examples:
      fail: '<section class="card alert fail" role="group" aria-label="loop alert"><header class="card-head k"><span class="fam">↻ loop</span> · <span class="card-project">■ storefront</span> · <span class="card-kind">alert · 14:24</span></header><p class="card-title">✕ flow-health-checkout failed at tests</p><p class="path">defn ✓ → gates ✓ → tests <span class="x">✕</span> 3 failed in test/checkout → why → tell</p><div class="card-keys"><button class="key quiet" type="button">Open run</button><button class="key quiet" type="button">Dismiss</button></div></section>'
      stop: '<section class="card alert" role="group" aria-label="loop alert"><header class="card-head k"><span class="fam">↻ loop</span> · <span class="card-project">■ a-paradigm</span> · <span class="card-kind">alert · 02:41</span></header><p class="card-title">■ green-typecheck-gnomon stopped: 8 of 8 rounds used</p><p class="path">tsc <span class="x">✕</span> → fix ×8 → tsc <span class="x">✕</span> → @stop</p><div class="card-keys"><button class="key quiet" type="button">Open run</button><button class="key quiet" type="button">Dismiss</button></div></section>'
      kernel-pause: '<section class="card alert kpause" role="group" aria-label="loop alert"><header class="card-head k"><span class="fam">↻ loop</span> · <span class="card-project">■ a-paradigm</span> · <span class="card-kind">alert · 18:44</span></header><p class="card-title">‖ evening-tidy paused by the kernel: day compute cap reached (900s)</p><p class="path">reindex ✓ → digest ‖</p><div class="card-keys"><button class="key quiet" type="button">Open run</button><button class="key quiet" type="button">Dismiss</button></div></section>'
      refused-start: '<section class="card alert" role="group" aria-label="loop alert"><header class="card-head k"><span class="fam">↻ loop</span> · <span class="card-project">■ a-paradigm</span> · <span class="card-kind">alert · 18:30</span></header><p class="card-title">■ evening-tidy didn’t start</p><p class="path">no local model · scheduled 18:30 · refused before any step · ×3 since Monday</p><div class="card-keys"><button class="key quiet" type="button">Set up local model…</button><button class="key quiet" type="button">Dismiss</button></div></section>'
    example_note: "stop and kernel-pause are composed from the fail markup; the direction drew only fail; refused-start is from session 2026-10-22-gnomon-local-model refs/local-model.html"
    build_requirements: ["refused-start needs the kernel to log a refused fire (today runner.ts:443 refuses no-local-model with no row a GUI can read)"]
    status: clear
    from: { session: 2026-10-22-gnomon-loops-ui, board: notify-decide, choice: stack-alerts-toast-outcomes, decided_by: creator }
    amended_by: [{ session: 2026-10-22-gnomon-local-model, decided_by: creator, what: "variant refused-start (rule stuck-to-stack-done-to-toast: a scheduled loop must not fail silently)" }]
