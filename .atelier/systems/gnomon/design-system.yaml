do; oldest first by start, a live step with its own clock; a step with detail folds like the raw variant (▸ / ▾) to its whole lines pretty-printed (rowDetail: the same redaction and withheld rules, text only). The list scrolls inside itself (max 40vh, never sideways, overscroll contained); a plain list labelled \"This turn's steps\" (no role=log: a remounted live region announces unreliably), the clocks aria-hidden. It folds away when the turn ends, leaving hook-result", claude-note: "Claude's own synthetic note (a stream user line marked isSynthetic that is not hook feedback): one quiet line 'Claude · <text>' (--sec, label size, 28px in, a 2px --rule left rule). Never role-system: that look is the kernel's own notes (run mode, session ended), so a repo hook cannot forge one (Aegis M1 2026-10-23)", hook-result: "the turn's one quiet summary line under its reply, before its result line (--sec, label size, 28px in, like voice-heard): each hook group of one event that is notable, '<Event> hook · [name ·] <secs> · <outcomes>' or 'N <Event> hooks · <secs> · <outcomes>' (outcomes a comma list of ok, '[name ]blocked: <first line of the reason>', 'timed out', 'failed (exit N)'), plus 'N tool call[s] failed'; groups joined by '; '. Only a blocked, failed or timed-out hook draws attention (tone warn: --warn-ink text, 2px --warn-edge left rule); ok hooks under 2 s and a turn with nothing notable show no line. Output lives only in the raw view's fold and the step-list detail", tool: "↳ line", voice-heard: "secondary line", voice-refused: "vermilion left rule + reason", said: "a spoken reply (ink2 rule)", result: "the turn's last line (--sec, label size): how the run ended, then its tokens. Normal: 'done' (Claude: its subtype); a local run that did not stop normally names it ('stopped: step limit 20' with the session's cap when the row carries maxSteps, plain 'stopped: step limit' on older rows; 'aborted'; 'error' + the message, one line, capped), adds 'no answer' when the final