# Gnomon console design system. Codified 2026-10-21 (system session 2026-10-21-design-systems, step 4).
# Layers: foundations, components, zones, content, specimen, rules, preserve, overrides, decisions, migration.
# Every entry traces to a decision (from:). Entries drafted from the extract carry `from: { extract: 2026-10-21 }`;
# every entry the founder accepted in the bulk confirm adds `confirmed: { session: 2026-10-21-design-systems,
# board: bulk-confirm }`; the eight contested entries carry the board that decided them.
#
# Carried from the repo-wide .atelier/design-system.yaml `gnomon:` block (lines 51-188) and .atelier/DESIGN.md
# (lines 43-95), plus sessions 2026-10-15-gnomon-aesthetic, 2026-10-20-gnomon-gui-fidelity,
# 2026-10-20-gnomon-mod-invitations and 2026-10-21-gnomon-voice. This file now governs Gnomon (systems.yaml:
# extends: none); the repo-wide `gnomon:` block is no longer read for Gnomon paths.
#
# Narrative: .atelier/systems/gnomon/DESIGN.md. Specimen: .atelier/systems/gnomon/specimen.html.
# Extract: .atelier/systems/gnomon/inventory.html (56 UI files, 2026-10-21).
# Scanner false positive: `#aadddd` (packages/gnomon-gui/src/core/virtual.ts:34,52,60) is `this.#add`, not a colour.
#
# Still open (not this session's to decide): offer-slip and rule one-offer-per-reply come from session
# 2026-10-20-gnomon-mod-invitations, whose four boards await the founder. They stay `contested` until that session closes.
#
# Amended 2026-10-22 by session 2026-10-22-gnomon-loops-ui (the Loops UI; the founder approved the direction, "Yes,
# that's it": .atelier/sessions/2026-10-22-gnomon-loops-ui/refs/direction.html and DIRECTION.md). It amends two
# existing GUI rules:
#   - the stack: it now holds decision cards AND alerts, then the waiting-for-trust slip, each styled by the family it
#     relates to (founder override of "the stack holds only cards"): zones.stack, components pile, card.family, alert,
#     trust-slip, rule stack-order, overrides;
#   - toast placement and kinds: toasts sit at the chat column's top-right edge (what styles.css:956 already ships; the
#     old "under the voice pill" text is superseded), loop outcomes that need nothing are toasts and loop trouble that
#     still needs you is not: zones.toasts, component toast, rule notices-by-kind.
# New: components alert, trust-slip, loops-word, loops-leaf, loop-row, loop-list, loop-detail, budget-field,
# loop-graph, run-trace, loop-trust-unfolded, loop-diff, loop-listing; card variants loop-trust and loop-choice; key
# variant cost-label; loop vocabulary; Today's ruler as future (components.loop-list.future).
#
# Amended 2026-10-22 by session 2026-10-22-gnomon-local-model (guided local-model setup, TD-2026-10-22-769; the founder
# approved the design, refs/local-model.html, and picked C1 check-first, C2 confirm-when-used, C3 the ⊙ gnomon family).
# New: component settings-form (the sheets' form row; row kinds form and request); card family ⊙ gnomon and variant
# local-config; alert variant refused-start; loop-detail's can't-start line; the sheet's section-focused open defined;
# vocabulary local model, card waiting, presence (amended); rules form-says-where-the-card-is, no-password-for-a-typo;
# migration batch settings-form (pending; the bridge CSS item is done: styles.css carries the classes since the build).
#
# Amended 2026-10-23 by session 2026-10-23-gnomon-folder-picker (founder: "we need a folder picker because writing out a
# path is bad UX"; then "we have inconsistent button heights"). The founder picked C1 the kernel opens the chooser
# (folder.choose), C2 the centre session's folder is chosen else the most recent, C4 the home folder is allowed with the
# amber warning; C3 drag from Finder is parked for 8.0 (recommendation). New: component folder-field; rule
# paths-are-chosen; vocabulary folder, recent folders (cwd retired from GUI copy); token foundations.target.key-h and one
# key size (quiet is a look, not a size); migration batches folder-field and key-height (pending).
# Reference: .atelier/sessions/2026-10-23-gnomon-folder-picker/refs/folder-picker.html (board K: keys before and after).
#
# Proposed 2026-10-23 (founder: "with gnomon seeing what the stop hooks are doing if that information can be shown in
# that little chip label and then after the result of it would be nice"; then "just right there where that 'working
# label' area is just a little bit of labeling on what is being called etc and maybe even clicking on it to expand out
# to see what is being done"): transcript-row's working line becomes a key naming what the turn does now (thinking,
# writing, a tool and its target, a hook, finishing) that unfolds a live step-list; new quiet variant hook-result is the
# turn's summary under the reply (warn only when a hook blocked, failed or timed out). Reviewed atelier-mika 2026-10-23
# (accepted with amendments, see transcript-row.amended_by); Aegis pending.
#
# Proposed 2026-10-23 (founder: "the gnomon tool should always do a pre sanitization before output goes to the user based
# on the context of the situation somewhat like how we have the tool speaking back to the user. we may also want to
# introduce a setting where they can choose to have it just type back and not speak etc. which tbh i love the speaking of
# how it arranges what it says and what it shows AND ESPECIALLY the suggested calls and tools in chat"). New component
# host-slip, a variant of the offer-slip pattern: under a reply whose text tells the human to do something Gnomon has no
# way to do (a slash command, "restart the session", "run claude"), the GUI adds a Gnomon-native suggestion. The reply
# text stays verbatim. voice-ladder and the Voice sheet gain the reply mode (Speak and show | Show only). Mika and Aegis
# review pending.
#
# Proposed 2026-10-24 (founder: "regarding options that gnomon presents to the user, even multi selections, it would be
# nice to click them"). New component question-card: a session's AskUserQuestion (header, options with descriptions,
# multi-select toggles, Other, previews) answered by clicking, in the pinned zone and the stack, from the card's verified
# detail only. model-text-control gains the choice-multi variant (table-talk lists that ask for several: toggles + one
# Send key). Mika reviewed (Delta 11, approved-with-fixes); Aegis M2, L1, L3, L4 folded in.
#
# Amended 2026-10-28 by slice C6'b1 (8.0:local-lane, #gui-capability-browser; Mika's design, TD-2026-10-28-956 and
# -969): the "Tools and memory" drawer of a local session. No new component and no new token: it is the sheet's
# drawer variant (sheet.drawers), seg keys Tools · Memory, over the Settings sheet's readonly rows with keys
# (settings-form gains aria-pressed and a visible why linked by aria-describedby), All tools in rule-row's groups and
# fold (rule-row.reused_by), and the memory's model and tool text behind model-text-control's dashed edge with the
# label "data" (model-text-control.data_group, the run trace's .agent-claimed). Settings › Local model gains Kept
# memory. The tier sheet's unfit-pin words follow the drawer's (no raw "over k"). Mika reviews it rendered.
#
# Amended 2026-10-28 by slice C6'a2-4 (8.0:local-lane, #gui-toast): toast variant rule-ran names who the call ran for
# from the kernel's approval.auto{author}: 'by you from /', 'by the model', or 'by you and the model' for one deduped
# toast that saw both. Proposed: Mika reviews it rendered.
#
# Amended 2026-10-28 by slice C6'b2-2 (8.0:local-lane, #gui-slash-runs, #gui-toast, #gui-rules-view,
# #gui-capability-browser; Mika's design, the C6'b2 brief, founder answers). toast gains variant rule-ran; rule-row
# gains the destructive chip and the group's one limit line; transcript-row variant run gains the policy question and
# the Send this one key. Proposed: Mika reviews it rendered.
#
# Amended 2026-10-28 by slice C6'b2-1 (8.0:local-lane, #gui-slash-menu and #gui-slash-runs; Mika's design, the C6'b2
# brief). New component slash-menu (a menu variant hung above the composer: a listbox driven by aria-activedescendant,
# groups Skills · Gnomon commands · Tools by server, rows name · note (the cost tag) · why, an args panel whose Run key
# names its cost); transcript-row gains variant run (the data fold, the run's states, the policy word; the first-use
# question and the Send this one key come with b2-2); host-slip: a listed, loaded skill's slash command reads "Run it
# from /" with an Open / menu key. No new token. Mika reviews it rendered.
#
# Proposed 2026-11-23 by session 2026-11-23-gnomon-board-medium (Luna; milestone S1.1 of Gnomon dimensions, decision
# TD-2026-11-24-500, naming TD-2026-11-24-053). The founder was away, so NOTHING here is decided: every entry is
# `proposed` with decided_by: none, and each records the alternative it was chosen over (`chose`). New: top-level
# content_palette (content-palette:v1, its night transform, the minimum-distance rule and the reserved values it is
