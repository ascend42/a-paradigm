# ─────────────────────────────────────────────────────────────────────────────────────────────────────────────────────
rules:
  # mechanical (atelier check)
  - { id: color-on-palette, check: color-off-palette, severity: warn, from: { session: 2026-10-15-gnomon-aesthetic, board: colour } }
  - { id: font-on-system, check: font-off-system, severity: warn, from: { session: 2026-10-15-gnomon-aesthetic, board: type } }
  - id: no-inter-no-system-mono
    check: font-forbidden
    args: { values: ["Inter", "Menlo", "SF Mono", "Georgia"] }
    note: "Inter is not used in Gnomon; Menlo/SF Mono/Georgia appear only as fallbacks inside the --mono / --title-font stacks"
    severity: warn
    from: { session: 2026-10-15-gnomon-aesthetic, board: type, note: "JetBrains Mono everywhere; Inter is not used in Gnomon" }
  - { id: type-on-scale, check: type-off-scale, severity: warn, from: { session: 2026-10-21-design-systems, board: gnomon-type-scale } }
  - { id: spacing-on-scale, check: spacing-off-scale, severity: warn, from: { session: 2026-10-21-design-systems, board: gnomon-spacing } }
  - { id: radius-on-scale, check: radius-off-scale, severity: warn, from: { extract: 2026-10-21, confirmed: { session: 2026-10-21-design-systems, board: bulk-confirm } } }
  - id: no-pure-black-white
    check: color-literal-forbidden
    args: { values: ["#000", "#000000", "#fff", "#ffffff"] }
    from: { session: 2026-10-15-gnomon-aesthetic, board: colour, note: "pigment set: ink is #16150F, paper is #F8F5EE" }
  # agent-enforced (Mika's review)
  - id: desktop-only
    rule: "Gnomon targets desktop widths only for now; phone layouts are out of scope. Narrow-width fixes are deferred, not designed. A true mobile version comes later as separate work."
    from: { session: 2026-10-21-design-systems, board: gnomon-narrow-header, choice: out-of-scope }
  - id: chip-is-not-a-key
    rule: "A chip is a status label nobody clicks (18px line, 10.5, --rule edge). Anything clickable is a key: at least 24x24, --key-edge. Never draw a button as a chip."
    from: { session: 2026-10-21-design-systems, board: gnomon-chip, choice: chip-not-key }
  - id: notices-by-kind
    rule: "Kernel alerts live in the band under the header and stay until resolved. A loop that still needs you is a stack alert, card or slip line (rule stuck-to-stack-done-to-toast). Every other notice is one toast style at the chat column's top-right edge. No other notice placement (bottom-right, bottom-centre, unstyled banners)."
    from: { session: 2026-10-21-design-systems, board: gnomon-notices, choice: band-for-alerts }
    amended_by: [{ session: 2026-10-22-gnomon-loops-ui, board: notify-decide, what: "loop alerts go to the stack; toast placement recorded at the chat column's edge" }]
  - id: four-type-steps
    rule: "Four sizes: 10.5 label, 11.5 control, 13.5 reading, 17 title. Hierarchy past that is weight, case and face."
    from: { session: 2026-10-21-design-systems, board: gnomon-type-scale, choice: four-steps }
  - id: status-in-ink
    rule: "Status (live, connected, ok, approved, a voice turn) is ink and reads by mark and weight. Project hues are identity only."
    from: { session: 2026-10-21-design-systems, board: gnomon-status-colour, choice: ink }
  - id: voice-tag-quotes-the-phrase
    rule: "A card that voice can decide quotes the exact phrase the grammar accepts for it (say “<prefix> approve card 3” · reversible; say “<prefix> approve <handle>” · gate), else 'hand only', in the card head after the requester. A phrase the grammar doesn't accept is never shown."
    from: { session: 2026-10-21-design-systems, board: gnomon-voice-tag, choice: say-instruction }
  - id: violet-is-knot-only
    rule: "Violet (--knot) means KNOT and nothing else: card edge/title, cap, nothing decorative."
    from: { session: 2026-10-15-gnomon-aesthetic, board: colour }
  - id: three-semantic-colours
    rule: "Vermilion = failed sessions/runs only; amber = warnings, held voice countdowns, the clamp and GATE; violet = KNOT. No other saturated colour."
    from: { session: 2026-10-15-gnomon-aesthetic, board: colour }
  - id: hue-is-identity
    rule: "A project hue is identity, never state; text in a hue uses its ink pair; every fill keeps a 1px key-edge ring."
    from: { session: 2026-10-15-gnomon-aesthetic, board: colour, upheld_by: { session: 2026-10-21-design-systems, board: gnomon-status-colour } }
  - id: control-edge-3-to-1
    rule: "Every control's edge is >= 3:1 on its surface in both themes: keys --key-edge, fields --sec; --rule is a divider or a non-interactive chip's edge, never a control's."
    from: { session: 2026-10-15-gnomon-aesthetic, board: style, note: "every style needs a >=3:1 key edge; fields --sec from board gnomon-field-border" }
  - id: motion-on-events-only
    rule: "Motion fires only on events (a card arrives, is decided, fails; a cap changes lanes; a session streams); nothing idles. Stack reflow 220ms."
    from: { session: 2026-10-15-gnomon-aesthetic, board: motion }
  - id: reduced-motion-instant
    rule: "Reduced motion (OS or in-app) makes every transition instant; the stamp shows without scaling; the bobbing cap prints 'working'; the dictation ring shows seconds as text."
    from: { session: 2026-10-15-gnomon-aesthetic, board: motion }
  - id: stamp-after-hold
    rule: "Voice-held cards show the 3s countdown first; the stamp plays only after the hold commits and after a successful approve."
    from: { session: 2026-10-15-gnomon-aesthetic, board: motion }
  - id: no-shake
    rule: "A failure droops once (rotate 2.2deg, 3px down, 500ms) while the edge turns vermilion; never a shake."
    from: { session: 2026-10-15-gnomon-aesthetic, board: motion }
  - id: fraunces-day-titles-only
    rule: "Fraunces only on the wordmark and page/section titles by day; at night titles are mono, uppercase, .08em."
    from: { session: 2026-10-15-gnomon-aesthetic, board: type }
  - id: mono-body-leading
    rule: "Long-form mono (replies, card bodies) 13.5px, line-height 1.6, measure <= 80ch."
    from: { session: 2026-10-15-gnomon-aesthetic, board: type }
  - id: night-glow-sparing
    rule: "At night only the wordmark, caps, the chosen segment and the tall-view key glow; no card or sheet glows."
    from: { session: 2026-10-20-gnomon-gui-fidelity, board: s1-tokens-themes }
  - id: model-text-never-a-key
    rule: "Anything built from model text (choices, offers, block buttons, agent bold-label lines) has a dashed edge, no .key, no hard offset, no [ ], and a second cue besides the dash."
    from: { session: 2026-10-20-gnomon-mod-invitations, note: "Aegis L1-L3, M2" }
  - id: panels-movable-kernel-fixed
    rule: "Every panel (sessions, stack, Workshop) can be hidden or moved from the Gnomon menu or ⌘K, persisted per viewer; kernel-owned regions can never be hidden."
    from: { session: 2026-10-21-gnomon-voice, board: header-5b }
  - id: card-in-both-places
    rule: "A card shows in the global stack and pinned in its session; deciding it in either removes it from both."
    from: { session: 2026-10-15-gnomon-aesthetic, board: decision-stack-and-sidebar }
  - id: header-four-things
    rule: "The header holds four things (wordmark menu, palette, quiet status, voice pill); 28px controls; nothing wraps; rarely used tools live in the wordmark menu and ⌘K; the ▾ always shows with hover and pressed states."
    from: { session: 2026-10-21-gnomon-voice, board: header-5b }
  - id: voice-one-ladder
    rule: "Voice is one ladder of presets (Off, Talk, Dictate, Send word, Pieces); the mic follows the rung; each rung states what it does and what it costs. The pill opens only the ladder; everything configured lives in the Voice settings sheet."
    from: { session: 2026-10-21-gnomon-voice, board: mode-model }
  - id: teach-inline
    rule: "Teaching opens inline under its row: one prompt, a live 'I heard', one counter, the risk check right before save; no modal; takes never reach the transcript or composer; a collected mishearing counts only if ticked at save."
    from: { session: 2026-10-21-gnomon-voice, board: teach }
  - id: composer-autogrow
    rule: "The composer grows to 12 lines then scrolls; ⤢ toggles 24; a line count beside it; exactly one send control."
    from: { session: 2026-10-21-gnomon-voice, board: composer }
  - id: one-offer-per-reply
    rule: "At most one offer per reply; none while streaming or while the session has a pinned card; after 'not now' that mod stays quiet for the thread."
    status: contested
    note: "recommendation from a session still open (2026-10-20-gnomon-mod-invitations); that session decides it"
    from: { session: 2026-10-20-gnomon-mod-invitations, board: invitation, decided_by: none }
  - id: stack-order
    rule: "The stack holds decision cards first (most urgent first), then alerts, then the waiting-for-trust slip at the foot. Alerts and the slip never carry a decision key and never bury one; the pile still fans on hover and focus."
    from: { session: 2026-10-22-gnomon-loops-ui, board: notify-decide, decided_by: creator, origin: { board: agent-loops-surface, override: "the stack holds only cards" } }
  - id: family-by-glyph-and-word
    amended_by: [{ session: 2026-10-22-gnomon-local-model, board: C3, choice: gnomon, decided_by: creator, what: "⊙ gnomon for root configuration cards" }]
    rule: "A card or alert names what it relates to in its head by glyph and word (↻ loop, ◇ session, ⊙ gnomon); never by a hue. The six minerals stay projects; the three semantic colours stay three."
    from: { session: 2026-10-22-gnomon-loops-ui, board: notify-decide, decided_by: creator }
  - id: stuck-to-stack-done-to-toast
    rule: "What still needs you is in the stack (a loop's fail, stop or kernel pause as an alert; a loop-choice as a card; loops waiting for trust in the slip), so nothing that needs you can time out. What simply happened is a 6s toast (goal reached, landed, Pause all done, Run now started, a budget applied)."
    from: { session: 2026-10-22-gnomon-loops-ui, board: notify-decide, decided_by: creator }
  - id: cost-in-the-label
    rule: "A key whose press costs trust or presence names it after ' · ' ('Loosen · needs trust', 'Resume · presence'); a tightening says it applies now ('Apply · tighter'). A disabled key says why in words beside it ('Run now waits for trust')."
    from: { session: 2026-10-22-gnomon-loops-ui, board: steer-stop, decided_by: creator }
  - id: trust-reads-whole
    rule: "A loop-trust decision is made on the whole definition: Read unfolds the card over the centre (<= 96ch); a changed loop opens on its diff; Trust and Don't trust come after everything; Trust is hand only with the root key and fresh presence, never standing, never by voice."
    from: { session: 2026-10-22-gnomon-loops-ui, board: trust-card, decided_by: creator }
  - id: diff-without-hue
    rule: "A definition diff reads by + and − marks, weight (added 600 on --fold) and strike (removed, --sec); never red and green."
    from: { session: 2026-10-22-gnomon-loops-ui, board: trust-card, decided_by: creator }
  - id: loop-graph-fits
    rule: "The loop graph fits at 1024 at 100% (left to right when it fits, else top to bottom), zooms only inside its frame, never puts a label on a box, reads verdicts by mark, edge weight and box edge, and holds AA at night. See components.loop-graph.build_requirements."
    from: { session: 2026-10-22-gnomon-loops-ui, board: loop-detail, decided_by: creator, requirements_from: Mika }
  - id: pause-all-everywhere
    rule: "Pause all is in the Loops leaf head, Gnomon ▾ and ⌘K loops.pause-all. After it, the header word, the leaf head, every row, the open detail, the keep-alive line and the edge tab change at once, and one toast says what was stopped and parked."
    from: { session: 2026-10-22-gnomon-loops-ui, board: running-indicator, decided_by: creator, requirement_from: { board: steer-stop, by: Mika } }
  - id: form-says-where-the-card-is
    rule: "A form whose submit raises a card names the cost in its key ('Save · root card'), shows the request in place ('card waiting'), and offers Decide in the stack, which focuses the card, never its Allow. It never relies on a toast while an overlay is open."
    from: { session: 2026-10-22-gnomon-local-model, decided_by: creator }
  - id: no-password-for-a-typo
    rule: "Anything the page or the kernel can check without signing is checked before a card that needs presence is raised: the address and model of a local model are checked (read-only, loopback only) before its root card."
    from: { session: 2026-10-22-gnomon-local-model, board: C1, choice: check-first, decided_by: creator }
  - id: target-floor
    rule: "Every pointer target >= 24x24 (WCAG 2.2 AA 2.5.8); header controls 28px."
    from: { session: 2026-10-21-gnomon-voice, board: header-5b, note: "28px header; 24px floor added by Mika's vet; small keys from board gnomon-chip" }
  - id: paths-are-chosen
    rule: "A folder or file on this Mac is chosen, not typed: recent choices first, then the Mac's own chooser (the kernel opens it); a typed path is an Advanced fallback, open by default only when no chooser exists. Every choice is checked by the kernel before the key that uses it is enabled."
    from: { session: 2026-10-23-gnomon-folder-picker, decided_by: creator, contested: { C1: kernel, C2: preselect, C3: park, C4: warn } }

