      - "anything checkable without signing is checked first (rule no-password-for-a-typo): the page's own checks, then the kernel's read-only check; on errors focus moves to the first invalid field"
      - "on submit focus moves to the request line's key; Decide in the stack closes the sheet and focuses the card group, never its Allow"
      - "one request at a time: the form is replaced by the request line while its card waits"
      - "denied or expired brings the form back with the entries and a 'Not changed' line"
      - "a change that loses something others depend on and costs presence to undo asks once inline, naming what stops (Turn off the local model when loops use it); otherwise it acts on the first press"
