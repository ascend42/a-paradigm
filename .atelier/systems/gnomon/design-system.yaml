  host-slip:
    role: "A Gnomon-native suggestion under a reply that told the human to do something that does not run in Gnomon (a slash command such as /plugin or /mcp, 'restart the session', 'run claude'). The GUI draws it from the reply text with one mapping table (core/host-hints.ts); the reply itself is shown verbatim and never rewritten. It decides nothing and runs nothing."
    pattern: "offer-slip (variant): the same dashed paper slip under its reply, flat (no tilt: it is not an invitation); no Open, no not now, no arm, no kernel row behind it. ONE slip per reply holding up to 3 items (Mika Delta 10: group-by-space-before-boxes, tell card-soup), items parted by a dashed rule."
    anatomy: ["tab: ⊙ note · gnomon (as an offer's '◇ offer · mod:<name>'; Gnomon's words, not the agent's)", "per item: what was said (a command as code, prose in quotes; recognised tokens only, Aegis L1)", "per item: the line, what to do in Gnomon (GUI words from the table); a line equal to the item above is not repeated, and the lead 'Slash commands don't run in Gnomon.' is said once per slip", "per item, optional: the exact shell command in a <code>, selectable, the same bytes the Copy key copies; the part the reply chose (a plugin or marketplace source) underlined, with the note 'underlined: named in the reply, not by Gnomon' (Aegis M1)", "per item, optional: the fixed warning for add/install/enable/update, warn ink: 'Plugins run code on your machine: check where <arg> comes from before you run this.' (Aegis M1)", "per item, optional, one key: Copy (for a command) or the Gnomon screen it opens (Open MCP servers, Open Rules, Open Settings, New session…)"]
    variants: { copy: "a terminal command the human runs in their own terminal: the command plus Copy", screen: "a Gnomon screen: one quiet key that opens it (palette command ids only)", note: "words only (an unknown slash command: 'Slash commands don't run in Gnomon.')" }
    states: [default, "copied (the key reads 'Copied' for 2 s, keeps focus, and #toast-say says 'Copied: <command>')", "unavailable-clipboard (the command is selected instead and a toast says ⌘C)", "mismatch (Aegis L2: the rendered command text differs from the command: nothing is copied, a fail toast says so)"]
    never: ["rewrite, hide or strike the reply text", "send anything to the session or the kernel", "run a command (Copy only writes the clipboard, on a trusted click)", "copy bytes that are not shown (L2: checked against the rendered text at the press)", "a command whose argument holds a shell metacharacter, a space, a quote or a bidi control (the slip falls back to words)", "look like a decision key (.key pri, data-decision) or a kernel card", "more than one slip or more than 3 items under one reply"]
    tokens: { edge: "1px dashed --ink2 (as .slip)", tab: "10.5 --sec over a dashed --rule", said: "10.5 --sec; code on --fold, --ink2", line: "11.5 --ink", command: "mono 11.5 --ink on --ground, 1px --rule, wraps anywhere; the reply's argument underlined 1px", note: "10.5 --sec; the warning --warn-ink", bidi: "unicode-bidi: isolate on said code, command and warning", key: "key quiet (var(--key-h)), Copy min-width 8ch so Copied does not shift it" }
