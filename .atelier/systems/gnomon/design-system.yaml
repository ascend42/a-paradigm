    drawers: { voice: "Voice settings (ui/voice-settings.ts)", tools: "C6'b1 Tools and memory (ui/tools-drawer.ts; .vs-drawer .voice-sheet.tools-sheet): head 'Tools and memory' · the session's title (· updated hh:mm once a re-read moved the generation) · done; then the seg keys Tools · Memory (a radiogroup, one Tab stop, the arrows move and choose); one persistent role=status line; the body is h3 sections of readonly rows with keys. Opens focused on its heading; the shared trapTab; Esc (the page's one Escape chain) closes it and focus returns to the opener. Entry points: the ⋯ more menu, the tier key's menu (its last item), the palette (tools.open); never a header key. Local attended sessions only. It may open over Settings (Kept memory › Open): Esc closes the drawer first." }
