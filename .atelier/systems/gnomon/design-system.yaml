      truncated: '<div class="wt-slip" role="group" aria-label="loops waiting for trust"><div class="tab">↻ 1 loop waiting for trust · no card yet</div><div class="row"><span title="green-typecheck-gnomon-with-escalation · changed · by arky">green-typecheck-gnomon-with-escalation · changed · by arky</span><button class="key quiet" type="button" aria-label="Review green-typecheck-gnomon-with-escalation">Review</button></div></div>'
    build_requirements: ["a truncated row keeps its full text in title= and the Review key names the loop in its accessible name (the direction omits both)", "the slip is hidden, not empty, at 0 loops; a loop that arrives by git pull with no session shows here and in the header count"]
