    examples:
      default: '<form id="composer" class="composer"><div class="composer-main"><textarea id="composer-text" class="field" rows="1" placeholder="Reply…" aria-label="composer"></textarea></div><div class="composer-ctrls"><span class="meta composer-lines" hidden></span><button class="key quiet composer-tall" type="button" aria-pressed="false" aria-label="Tall view">⤢</button><button class="key pri" type="submit">send</button></div></form>'
      grown: '<div class="composer-ctrls"><span class="meta composer-lines">7 lines</span><button class="key quiet composer-tall" type="button" aria-pressed="false" aria-label="Tall view">⤢</button><button class="key pri" type="submit">send</button></div>'
