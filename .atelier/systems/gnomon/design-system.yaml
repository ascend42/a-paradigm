        problem-next: "a ✕ row's how line ends 'next: install it, or give its full path in <source>' (command, plugin-path) · 'next: give it a public https URL in <source>' (remote) · 'next: remove that variable from its entry in <source>' (env-name, law-7) · 'next: rename it in <source>' (name) · else 'next: change its entry in <source>'"
        windows: "the FIRST row after the first-party row (the reason before the rows it explains); rows show, keys don't; row On this PC · rows only: Turning a server on takes the root key, which lives in the Mac helper in 8.0: not on Windows yet. The Paradigm MCP still runs."
