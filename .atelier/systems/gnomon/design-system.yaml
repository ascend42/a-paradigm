    variants: { user: "right-aligned sheet bubble", assistant: "plain prose, measure 80ch", labelled-part: ".reply-part (renamed from .chip): a left rule and a bold label", activity: "collapsible fold with a rule", raw: "the raw view's one-line summary that says what the line is (a system line's subtype and identifying fields, a hook by name, short id and outcome); it folds like activity (▸ / ▾, Enter or Space) to its whole line pretty-printed, text only, in a box that scrolls inside itself (max 40vh, both ways), never the page; hook and tool output only ever in the fold", working: "spinner + a KEY naming what the turn is doing right now, with a live clock: 'thinking', 'writing the reply', '<Tool> · <short target>' ('Read · src/ui/app.ts', 'Bash · npm test') from its call until its result, '<Event> hook[ · matcher]' while one hook runs ('Stop hook · 4s'), '<Event> hooks · N running', 'compacting' (a status line), 'finishing' once the reply ended and the turn has not with nothing else to explain it, else 'working…'. A hook names itself only once it has run 1 s (HOOK_DWELL_MS); until then the key keeps what it named before, so fast PreToolUse / PostToolUse hooks never flick it. The clock counts from the start of what it names. The words ellipsize and the clock never does (tabular numerals); the full words are its title. A row-key like activity (role=button, aria-expanded, Enter or Space, the activity fold's ▸ / ▾, at least 24px tall, focus ring 2px --key-edge): it unfolds step-list under it. The row is no live region (it remounts on every step); the page's one persistent sr-only status #turn-say says '<Claude|The local model> is <what>' once what the turn does has held 2 s. Hook and tool output never reach it", step-list: "under the working key while unfolded: this turn's steps so far, one quiet line each, at least 24px tall (label · duration · outcome: ok, error, blocked: <first line>, timed out, failed (exit N)); the label ellipsizes, the duration and outcome never do; oldest first by start, a live step with its own clock; a step with detail folds like the raw variant (▸ / ▾) to its whole lines pretty-printed (rowDetail: the same redaction and withheld rules, text only). The list scrolls inside itself (max 40vh, never sideways, overscroll contained); a plain list labelled \"This turn's steps\" (no role=log: a remounted live region announces unreliably), the clocks aria-hidden. It folds away when the turn ends, leaving hook-result", claude-note: "Claude's own synthetic note (a stream user line marked isSynthetic that is not hook feedback): one quiet line 'Claude · <text>' (--sec, label size, 28px in, a 2px --rule left rule). Never role-system: that look is the kernel's own notes (run mode, session ended), so a repo hook cannot forge one (Aegis M1 2026-10-23)", hook-result: "the turn's one quiet summary line under its reply, before its result line (--sec, label size, 28px in, like voice-heard): each hook group of one event that is notable, '<Event> hook · [name ·] <secs> · <outcomes>' or 'N <Event> hooks · <secs> · <outcomes>' (outcomes a comma list of ok, '[name ]blocked: <first line of the reason>', 'timed out', 'failed (exit N)'), plus 'N tool call[s] failed'; groups joined by '; '. Only a blocked, failed or timed-out hook draws attention (tone warn: --warn-ink text, 2px --warn-edge left rule); ok hooks under 2 s and a turn with nothing notable show no line. Output lives only in the raw view's fold and the step-list detail", tool: "↳ line", voice-heard: "secondary line", voice-refused: "vermilion left rule + reason", said: "a spoken reply (ink2 rule)" }
    states: [default, live, collapsed, expanded, error, warn]
    source: packages/gnomon-gui/static/styles.css:246-296,834-859 (role-hook beside role-voice-heard)
    examples:
      user: '<div class="trow role-user"><div class="who"><span class="t">14:05</span>you</div><div class="body">Totals are off by a cent on 3-line orders. Find out why.</div></div>'
      activity: '<div class="trow role-activity" tabindex="0">▸ 14:05 · read 6 files · ran 2 commands · 41s of work</div>'
      working: '<div class="trow role-working"><span class="spin"></span>working… · <span class="live-clock">2m 10s</span></div>'
      working-key: '<div class="trow role-working"><div class="work-key" role="button" tabindex="0" aria-expanded="false" data-act="steps:work:12" title="Stop hook"><span class="spin" aria-hidden="true"></span><span class="caret" aria-hidden="true">▸ </span><span class="work-label">Stop hook</span><span class="live-clock"> · 12s</span></div></div>'
      step-list: '<div class="trow role-working open"><div class="work-key" role="button" tabindex="0" aria-expanded="true" title="Bash · npm test"><span class="spin" aria-hidden="true"></span><span class="caret" aria-hidden="true">▾ </span><span class="work-label">Bash · npm test</span><span class="live-clock"> · 3s</span></div><ol class="steps" aria-label="This turn&#39;s steps"><li class="step fold" role="button" tabindex="0" aria-expanded="false"><span class="caret" aria-hidden="true">▸ </span><span class="step-label">Read · src/ui/app.ts</span><span class="step-tail"> · 0.1s · ok</span></li><li class="step live"><span class="caret blank" aria-hidden="true">▸ </span><span class="step-label">Bash · npm test</span><span class="step-tail"> · <span class="step-clock" aria-hidden="true">3s</span></span></li></ol></div>'
      hook-result: '<div class="trow role-hook">Stop hook · paradigm-stop.sh · 1.2s · ok</div>'
      hook-result-warn: '<div class="trow role-hook warn">Stop hook · paradigm-stop.sh · 30.1s · timed out</div>'
      raw: '<div class="trow role-raw fold" role="button" tabindex="0" aria-expanded="false"><span class="caret">▸ </span><span class="t">14:05</span>system · hook response · SessionStart:startup · id 6156c889 · success · stdout 214 chars</div>'
      raw-open: '<div class="trow role-raw-detail"><pre class="raw-line" tabindex="0">{ "type": "system", "subtype": "hook_response", … }</pre></div>'
    status: clear
    from: { session: 2026-10-15-gnomon-aesthetic, board: decision-stack-and-sidebar, note: "chat with timestamps, took Ns, collapsible activity", confirmed: { session: 2026-10-21-design-systems, board: bulk-confirm } }
