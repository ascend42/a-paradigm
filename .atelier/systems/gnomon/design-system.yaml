      removed: '<div class="df del">−   paths: ["packages/gnomon/src/**"]</div>'
      context: '<div class="df ctx">  land:</div>'
      folded: '<div class="df fold">… 6 unchanged lines · argv, argv0 sha, closure digest unchanged</div>'
      gate-note: '<p class="gate-note">new land path: fix may now edit tests the goal check runs. Suppression markers (.skip, .only, @ts-ignore) still drop a land to propose. Also pauses triage-on-commit, which pins 3f9a1c02.</p>'
