# ─────────────────────────────────────────────────────────────────────────────────────────────────────────────────────
rules:
  # mechanical (atelier check)
  - { id: color-on-palette, check: color-off-palette, severity: warn, from: { session: 2026-10-15-gnomon-aesthetic, board: colour } }
  - { id: font-on-system, check: font-off-system, severity: warn, from: { session: 2026-10-15-gnomon-aesthetic, board: type } }
  - id: no-inter-no-system-mono
    check: font-forbidden
    args: { values: ["Inter", "Menlo", "SF Mono", "Georgia"] }
    note: "Inter is not used in Gnomon; Menlo/SF Mono/Georgia appear only as fallbacks inside the --mono / --title-font stacks"
    severity: warn
    from: { session: 2026-10-15-gnomon-aesthetic, board: type, note: "JetBrains Mono everywhere; Inter is not used in Gnomon" }
  - { id: type-on-scale, check: type-off-scale, severity: warn, from: { session: 2026-10-21-design-systems, board: gnomon-type-scale } }
  - { id: spacing-on-scale, check: spacing-off-scale, severity: warn, from: { session: 2026-10-21-design-systems, board: gnomon-spacing } }
  - { id: radius-on-scale, check: radius-off-scale, severity: warn, from: { extract: 2026-10-21, confirmed: { session: 2026-10-21-design-systems, board: bulk-confirm } } }
  - id: no-pure-black-white
    check: color-literal-forbidden
    args: { values: ["#000", "#000000", "#fff", "#ffffff"] }
    from: { session: 2026-10-15-gnomon-aesthetic, board: colour, note: "pigment set: ink is #16150F, paper is #F8F5EE" }
  # agent-enforced (Mika's review)
  - id: desktop-only
    rule: "Gnomon targets desktop widths only for now; phone layouts are out of scope. Narrow-width fixes are deferred, not designed. A true mobile version comes later as separate work."
    from: { session: 2026-10-21-design-systems, board: gnomon-narrow-header, choice: out-of-scope }
  - id: chip-is-not-a-key
    rule: "A chip is a status label nobody clicks (18px line, 10.5, --rule edge). Anything clickable is a key: at least 24x24, --key-edge. Never draw a button as a chip."
    from: { session: 2026-10-21-design-systems, board: gnomon-chip, choice: chip-not-key }
  - id: notices-by-kind
    rule: "Kernel alerts live in the band under the header and stay until resolved. A loop that still needs you is a stack alert, card or slip line (rule stuck-to-stack-done-to-toast). Every other notice is one toast style at the chat column's top-right edge. No other notice placement (bottom-right, bottom-centre, unstyled banners)."
    from: { session: 2026-10-21-design-systems, board: gnomon-notices, choice: band-for-alerts }
    amended_by: [{ session: 2026-10-22-gnomon-loops-ui, board: notify-decide, what: "loop alerts go to the stack; toast placement recorded at the chat column's edge" }]
  - id: four-type-steps
    rule: "Four sizes: 10.5 label, 11.5 control, 13.5 reading, 17 title. Hierarchy past that is weight, case and face."
    from: { session: 2026-10-21-design-systems, board: gnomon-type-scale, choice: four-steps }
  - id: status-in-ink
    rule: "Status (live, connected, ok, approved, a voice turn) is ink and reads by mark and weight. Project hues are identity only."
    from: { session: 2026-10-21-design-systems, board: gnomon-status-colour, choice: ink }
  - id: voice-tag-quotes-the-phrase
    rule: "A card that voice can decide quotes the exact phrase the grammar accepts for it (say “<prefix> approve card 3” · reversible; say “<prefix> approve <handle>” · gate), else 'hand only', in the card head after the requester. A phrase the grammar doesn't accept is never shown."
    from: { session: 2026-10-21-design-systems, board: gnomon-voice-tag, choice: say-instruction }
  - id: violet-is-knot-only
    rule: "Violet (--knot) means KNOT and nothing else: card edge/title, cap, nothing decorative."
    from: { session: 2026-10-15-gnomon-aesthetic, board: colour }
  - id: three-semantic-colours
    rule: "Vermilion = failed sessions/runs only; amber = warnings, held voice countdowns and GATE; violet = KNOT. No other saturated colour."
    from: { session: 2026-10-15-gnomon-aesthetic, board: colour }
  - id: hue-is-identity
    rule: "A project hue is identity, never state; text in a hue uses its ink pair; every fill keeps a 1px key-edge ring."
    from: { session: 2026-10-15-gnomon-aesthetic, board: colour, upheld_by: { session: 2026-10-21-design-systems, board: gnomon-status-colour } }
  - id: control-edge-3-to-1
    rule: "Every control's edge is >= 3:1 on its surface in both themes: keys --key-edge, fields --sec; --rule is a divider or a non-interactive chip's edge, never a control's."
    from: { session: 2026-10-15-gnomon-aesthetic, board: style, note: "every style needs a >=3:1 key edge; fields --sec from board gnomon-field-border" }
  - id: motion-on-events-only
    rule: "Motion fires only on events (a card arrives, is decided, fails; a cap changes lanes; a session streams); nothing idles. Stack reflow 220ms."
    from: { session: 2026-10-15-gnomon-aesthetic, board: motion }
  - id: reduced-motion-instant
    rule: "Reduced motion (OS or in-app) makes every transition instant; the stamp shows without scaling; the bobbing cap prints 'working'; the dictation ring shows seconds as text."
    from: { session: 2026-10-15-gnomon-aesthetic, board: motion }
  - id: stamp-after-hold
    rule: "Voice-held cards show the 3s countdown first; the stamp plays only after the hold commits and after a successful approve."
    from: { session: 2026-10-15-gnomon-aesthetic, board: motion }
  - id: no-shake
    rule: "A failure droops once (rotate 2.2deg, 3px down, 500ms) while the edge turns vermilion; never a shake."
    from: { session: 2026-10-15-gnomon-aesthetic, board: motion }
  - id: fraunces-day-titles-only
    rule: "Fraunces only on the wordmark and page/section titles by day; at night titles are mono, uppercase, .08em."
    from: { session: 2026-10-15-gnomon-aesthetic, board: type }
  - id: mono-body-leading
    rule: "Long-form mono (replies, card bodies) 13.5px, line-height 1.6, measure <= 80ch."
    from: { session: 2026-10-15-gnomon-aesthetic, board: type }
  - id: night-glow-sparing
    rule: "At night only the wordmark, caps, the chosen segment and the tall-view key glow; no card or sheet glows."
    from: { session: 2026-10-20-gnomon-gui-fidelity, board: s1-tokens-themes }
  - id: model-text-never-a-key
    rule: "Anything built from model text (choices, offers, block buttons, agent bold-label lines) has a dashed edge, no .key, no hard offset, no [ ], and a second cue besides the dash."
    from: { session: 2026-10-20-gnomon-mod-invitations, note: "Aegis L1-L3, M2" }
  - id: panels-movable-kernel-fixed
    rule: "Every panel (sessions, stack, Workshop) can be hidden or moved from the Gnomon menu or ⌘K, persisted per viewer; kernel-owned regions can never be hidden."
    from: { session: 2026-10-21-gnomon-voice, board: header-5b }
  - id: card-in-both-places
    rule: "A card shows in the global stack and pinned in its session; deciding it in either removes it from both."
    from: { session: 2026-10-15-gnomon-aesthetic, board: decision-stack-and-sidebar }
  - id: header-four-things
    rule: "The header holds four things (wordmark menu, palette, quiet status, voice pill); 28px controls; nothing wraps; rarely used tools live in the wordmark menu and ⌘K; the ▾ always shows with hover and pressed states."
    from: { session: 2026-10-21-gnomon-voice, board: header-5b }
  - id: voice-one-ladder
    rule: "Voice is one ladder of presets (Off, Talk, Dictate, Send word, Pieces); the mic follows the rung; each rung states what it does and what it costs. The pill opens only the ladder; everything configured lives in the Voice settings sheet."
    from: { session: 2026-10-21-gnomon-voice, board: mode-model }
  - id: teach-inline
    rule: "Teaching opens inline under its row: one prompt, a live 'I heard', one counter, the risk check right before save; no modal; takes never reach the transcript or composer; a collected mishearing counts only if ticked at save."
    from: { session: 2026-10-21-gnomon-voice, board: teach }
  - id: composer-autogrow
    rule: "The composer grows to 12 lines then scrolls; ⤢ toggles 24; a line count beside it; exactly one send control."
    from: { session: 2026-10-21-gnomon-voice, board: composer }
  - id: one-offer-per-reply
    rule: "At most one offer per reply; none while streaming or while the session has a pinned card; after 'not now' that mod stays quiet for the thread."
    status: contested
    note: "recommendation from a session still open (2026-10-20-gnomon-mod-invitations); that session decides it"
    from: { session: 2026-10-20-gnomon-mod-invitations, board: invitation, decided_by: none }
  - id: stack-order
    rule: "The stack holds decision cards first (most urgent first), then alerts, then the waiting-for-trust slip at the foot. Alerts and the slip never carry a decision key and never bury one; the pile still fans on hover and focus."
    from: { session: 2026-10-22-gnomon-loops-ui, board: notify-decide, decided_by: creator, origin: { board: agent-loops-surface, override: "the stack holds only cards" } }
  - id: family-by-glyph-and-word
    amended_by: [{ session: 2026-10-22-gnomon-local-model, board: C3, choice: gnomon, decided_by: creator, what: "⊙ gnomon for root configuration cards" }]
    rule: "A card or alert names what it relates to in its head by glyph and word (↻ loop, ◇ session, ⊙ gnomon); never by a hue. The six minerals stay projects; the three semantic colours stay three."
    from: { session: 2026-10-22-gnomon-loops-ui, board: notify-decide, decided_by: creator }
  - id: stuck-to-stack-done-to-toast
    rule: "What still needs you is in the stack (a loop's fail, stop or kernel pause as an alert; a loop-choice as a card; loops waiting for trust in the slip), so nothing that needs you can time out. What simply happened is a 6s toast (goal reached, landed, Pause all done, Run now started, a budget applied)."
    from: { session: 2026-10-22-gnomon-loops-ui, board: notify-decide, decided_by: creator }
  - id: cost-in-the-label
    rule: "A key whose press costs trust or presence names it after ' · ' ('Loosen · needs trust', 'Resume · presence'); a tightening says it applies now ('Apply · tighter'). A disabled key says why in words beside it ('Run now waits for trust')."
    from: { session: 2026-10-22-gnomon-loops-ui, board: steer-stop, decided_by: creator }
  - id: trust-reads-whole
    rule: "A loop-trust decision is made on the whole definition: Read unfolds the card over the centre (<= 96ch); a changed loop opens on its diff; Trust and Don't trust come after everything; Trust is hand only with the root key and fresh presence, never standing, never by voice."
    from: { session: 2026-10-22-gnomon-loops-ui, board: trust-card, decided_by: creator }
  - id: diff-without-hue
    rule: "A definition diff reads by + and − marks, weight (added 600 on --fold) and strike (removed, --sec); never red and green."
    from: { session: 2026-10-22-gnomon-loops-ui, board: trust-card, decided_by: creator }
  - id: loop-graph-fits
    rule: "The loop graph fits at 1024 at 100% (left to right when it fits, else top to bottom), zooms only inside its frame, never puts a label on a box, reads verdicts by mark, edge weight and box edge, and holds AA at night. See components.loop-graph.build_requirements."
    from: { session: 2026-10-22-gnomon-loops-ui, board: loop-detail, decided_by: creator, requirements_from: Mika }
  - id: pause-all-everywhere
    rule: "Pause all is in the Loops leaf head, Gnomon ▾ and ⌘K loops.pause-all. After it, the header word, the leaf head, every row, the open detail, the keep-alive line and the edge tab change at once, and one toast says what was stopped and parked."
    from: { session: 2026-10-22-gnomon-loops-ui, board: running-indicator, decided_by: creator, requirement_from: { board: steer-stop, by: Mika } }
  - id: form-says-where-the-card-is
    rule: "A form whose submit raises a card names the cost in its key ('Save · root card'), shows the request in place ('card waiting'), and offers Decide in the stack, which focuses the card, never its Allow. It never relies on a toast while an overlay is open."
    from: { session: 2026-10-22-gnomon-local-model, decided_by: creator }
  - id: no-password-for-a-typo
    rule: "Anything the page or the kernel can check without signing is checked before a card that needs presence is raised: the address and model of a local model are checked (read-only, loopback only) before its root card."
    from: { session: 2026-10-22-gnomon-local-model, board: C1, choice: check-first, decided_by: creator }
  - id: target-floor
    rule: "Every pointer target >= 24x24 (WCAG 2.2 AA 2.5.8); header controls 28px."
    from: { session: 2026-10-21-gnomon-voice, board: header-5b, note: "28px header; 24px floor added by Mika's vet; small keys from board gnomon-chip" }
  - id: paths-are-chosen
    rule: "A folder or file on this Mac is chosen, not typed: recent choices first, then the Mac's own chooser (the kernel opens it); a typed path is an Advanced fallback, open by default only when no chooser exists. Every choice is checked by the kernel before the key that uses it is enabled."
    from: { session: 2026-10-23-gnomon-folder-picker, decided_by: creator, contested: { C1: kernel, C2: preselect, C3: park, C4: warn } }
  # proposed 2026-11-23 (session 2026-11-23-gnomon-board-medium; decided_by: none until the founder accepts)
  - id: content-colour-stays-on-the-board
    status: proposed
    rule: "Content-palette colours appear only as board content and in the wells that pick them. No console surface, key, chip, card, toast or status takes one, and no board content takes a mineral or a semantic colour."
    from: { session: 2026-11-23-gnomon-board-medium, board: content-palette, decided_by: none, decision: TD-2026-11-24-500 }
  - id: content-keeps-its-distance
    status: proposed
    rule: "Every content colour, named or custom, is at least 0.06 (Euclidean, OKLab) from every reserved colour of the theme it is seen in; a custom colour is tested as its day value and as both night transforms. Neutrals (chroma under 0.02) are exempt. The reserved list is content_palette.reserved and must equal foundations.color."
    test: "content_palette.test_vectors and the swatch table; G-DDL-07 goldens"
    from: { session: 2026-11-23-gnomon-board-medium, board: content-palette, decided_by: none, condition: "Aegis S1.1 and S1.2 (s1-build-plan.md §7)" }
  - id: agent-marks-are-dashed
    status: proposed
    rule: "On a board the human's marks are solid and an agent's are dashed, with the agent's seal as the second cue; a mark with no host-vouched author is the unknown hand: dashed, no seal, a hollow pin, never solid (Aegis S1.1 ruling 5). The dash and the seal are derived from the host-stamped author every time they are drawn; neither is stored, chosen or offered as a style. Authorship is never shown by colour. luna 2026-11-25 (S1.4 P4-design, proposed): an agent's stroke is dashed along its whole length and an agent's frame has one edge, dashed; no solid edge shows on any mark the host does not vouch for, at any zoom. One exemption (mika R9): an arrowhead is drawn solid, because the engine never dashes a head; a head is never without its dashed shaft, and an arrow too short to show two dashes carries the ring."
    from: { session: 2026-11-23-gnomon-board-medium, board: author-seal, decided_by: none, extends: "model-text-never-a-key (principle 7)", decision: TD-2026-11-24-500 }
  - id: solid-is-vouched
    status: proposed
    rule: "On a board, solid means the host vouches and dashed means it is an agent's word. So a seal has a solid rim only when the host named that agent; a sub-agent that named itself has a dashed rim and the word 'claimed' wherever it is named, and its seal is always attached to its parent's solid seal (built at S1.4, not before). Nothing the host does not vouch for is ever drawn solid."
    from: { session: 2026-11-23-gnomon-board-medium, board: author-seal, decided_by: none, limit: "s1-scale-amendments.md §4" }
  - id: nothing-on-a-board-is-a-key
    status: proposed
    rule: "No kernel key, card or decision is ever drawn inside a board, and no board content gets the key's edge-and-offset, a bracket or a control role; so anything inside the board is content by construction. A node links to its card in the stack and never becomes one."
    from: { session: 2026-11-23-gnomon-board-medium, board: board-leaf, decided_by: none, condition: "synthesis.md 'approval surfaces stay sacred'" }
  - id: board-centre-only
    status: proposed
    rule: "A board leaf covers the chat header and the chat of the centre column and nothing else: the header, alerts band, sessions rail, stack, Workshop, this session's pinned cards and the composer stay visible and usable under every layout preset."
    from: { session: 2026-11-23-gnomon-board-medium, board: board-leaf, decided_by: none, oracle: G-DDL-08 }
  - id: board-yields-the-keys
    status: proposed
    rule: "While a card is focused the board takes no keyboard input, and it shows that it does not: the rail's letters go, its keys draw disabled, and the leaf says 'A card has the keys'. No board tool is bound to A, D or Enter. The first pointer press only wakes the board. ⌥B belongs to the desk and never takes focus from a card."
    from: { session: 2026-11-23-gnomon-board-medium, board: tool-rail, decided_by: none, oracle: G-DDL-08 }
  - id: engine-wears-the-system
    status: proposed
    rule: "Nothing of the drawing engine's own look reaches the screen: no hand-drawn font or roughness, no engine toolbar, menu, welcome, library or help, no engine violet for selection (a family of five values, not one hex), no engine context menu, properties panel, colour picker, export dialog, hint line, toast, scroll-back key or phone layout. Text is JetBrains Mono; selection, handles, guides and the caret are --ink and --key-edge; tools come from the rail."
    from: { session: 2026-11-23-gnomon-board-medium, board: board-leaf, decided_by: none, oracle: G-DDL-07, note: "TD-2026-11-24-500: no stock Excalidraw look ships" }
    surfaces: "mika, from the S1.0 review's inventory of what the stock engine draws; each is removed or replaced, none restyled in place. Removed: tool island, lock, More tools (Web Embed, Laser, Mermaid), main menu, Library, Help, hint line, welcome screen, export dialog, the engine's toasts and error dialogs, the scroll-back-to-content key, undo and redo keys (keys only: ⌘Z, ⇧⌘Z), the phone layout at any width. Replaced: zoom island → the rail's percent, + and −; the properties panel (stroke, background, width, style, sloppiness, edges, opacity, layers, text family, size and align) → content-tray, which offers line, fill and weight and nothing else; the context menu → none in S1 (right-click does nothing on the board; the browser's own menu is suppressed); the colour picker → the tray's wells and hex field. Recoloured: selection, multi-select, handles, snap guides, binding highlight, the text caret and the eraser cursor. Text on a board is one size in S1 (13.5 at 100%, weight 400), until Luna rules on a second step. Oracle G-DDL-07 (aegis: ruling 8): the shipped bundle has no colour literal within the minimum distance of a reserved colour outside a per-patch allowlist, and the day and night goldens (selection, multi-select, caret, guides, binding highlight) hold no chromatic pixel within that distance; one golden at the 374px board width shows no phone layout."
  - id: stale-is-said-and-shown
    status: proposed
    rule: "A live node's age is printed ('as of hh:mm · <age>') and shown by its shadow's length in five steps; the shadow is never the only cue, and it changes only when the age crosses a step. Not used in S1 (no live nodes)."
    from: { session: 2026-11-23-gnomon-board-medium, board: pin-and-shadow, decided_by: none, needs: "the proposed override of foundations.shadow" }
  - id: unknown-kind-is-a-stub
    status: proposed
    rule: "A node of a kind this build cannot draw renders as the stub: the word 'kind', its kind and one calm line, nothing else from its fields; movable and deletable, never editable; never a key, never an error."
    from: { session: 2026-11-23-gnomon-board-medium, board: fallback-node, decided_by: none, plan: "s1-scale-amendments.md A1, A13" }
  - id: dimension-then-medium
    status: proposed
    rule: "In GUI copy a dimension is the titled space that is listed, attached and kept; a board is the medium you open, fold and draw on. Where both appear the dimension comes first ('auth handoff › board'). 'dim' stays in the raw view, the CLI and logs. Never 'canvas', 'whiteboard', 'sheet' or the engine's name; 'doodle' is a future medium's name, not the system's."
    from: { session: 2026-11-23-gnomon-board-medium, board: naming, decided_by: none, founder: "TD-2026-11-24-053 (s1-scale-amendments.md §2)" }
  # proposed 2026-11-25 (pass S1.4 P4-design; decided_by: none until the founder accepts)
  - id: small-hand-is-a-ring
    status: proposed
    rule: "Under 50% zoom every seal and hollow pin on a board becomes a 6px ring with no letter and no name, and every drawn mark of a hand that is not the person's carries one; a mark too short to show two periods of its own dash carries the ring at every zoom. Hover and selection give back the full seal and the hand's name. No mark of an agent may read as an empty box: a box round letters under 4px tall on the screen gives way to a dashed rule under them, mark by mark, and a ring never sits inside a box or inside the mark an arrow starts from. Under 50% at night the person's own pin is filled."
    test: "goldens of an agent stroke, frame, text, sticky and a 20 by 10 box at 25%, 100% and 400%, day and night (s1.4-draft.md 5)"
    from: { pass: "S1.4 P4-design", date: 2026-11-25, by: luna, decided_by: none, condition: "Aegis S1.1 ruling 9 (an always-on cue under 50%)", record: "components.author-seal.strokes.low-zoom, strokes.too-small, seal.ring" }
  - id: draw-key-is-not-a-decision
    status: proposed
    rule: "Who may draw on a board is set by a quiet key in the leaf's hands foot, one per attached session's agent, that reads 'may draw' or 'may not draw'. It is never drawn as a primary key, a card, a slip or a toast, never uses the words Allow, Deny, Approve, Trust, Grant or Always, names no cost, has no letter, chord or voice phrase, and is never raised or moved by an agent. It is pressed only by a trusted pointer press or its own activation, and it is always within reach while its session is attached. It shows only what the board has confirmed, sends the state it means and never a toggle, drops a press it cannot act on, and is never given focus by anything but its own press."
    from: { pass: "S1.4 P4-design", date: 2026-11-25, by: luna, decided_by: none, extends: "nothing-on-a-board-is-a-key, chip-is-not-a-key (principle 2)", record: "components.draw-grant, components.board-leaf.hands_foot" }
  # proposed 2026-11-25 (pass design-foot; decided_by: none until the founder accepts)
  - id: list-rows-are-not-cards
    status: proposed
    rule: "A list a leaf opens (the Dimensions list) is the leaf's own menu: rows set apart by spacing, a mark and words for state, one press per row. A row never has a box, a shadow, a left edge in a project hue, a family glyph, a stamp, a pill, or a key inside it, and no row is ever a decision. The list hangs from its key inside the leaf and never covers the turn strip, the pinned cards, the composer or the stack."
    from: { pass: "design-foot", date: 2026-11-25, by: luna, decided_by: none, extends: "nothing-on-a-board-is-a-key, board-centre-only", record: "components.dimension-list" }
  - id: quiet-lines-are-lower-case
    status: proposed
    rule: "On the board leaf a quiet readout is lower case in the secondary colour (the keep line, 'opening the board…', 'saving…', the foot's hands and its check). A line that takes the keep line's place to state what happened or what is so is a sentence with a capital, in ink, with the fact before ' · ' and the next step after it. No line is both. Contractions throughout."
    from: { pass: "design-foot", date: 2026-11-25, by: luna, decided_by: none, extends: "principle 5 (say what to do), functional-states-say-what-happened", record: "components.board-leaf.keep_words, components.board-leaf.check" }
  # proposed 2026-11-26 (pass E-design; decided_by: none until the founder accepts)
  - id: another-hand-is-signed
    status: proposed
    rule: "A mark keeps the look of the hand that drew it, whoever changes it later. A hand that changed it adds a countermark at the mark's foot (a 6px ring for an agent or the unknown hand, a 6px filled disc for you), and words another hand wrote into a mark of yours carry that hand's dashed rule and seal. Both are always on, at every zoom. Words read as the person's only when the person wrote all of them. A mark put back by an undo wears its original hand's look and is solid only when both its original hand and the hand that put it back are the person. Never colour, never only on hover, never the changing hand's seal in the owner's place."
    test: "goldens at 25%, 49%, 50%, 100% and 400%, day and night: a person's rect restyled by an agent; a person's sticky with agent words, then restyled by a second agent (both signs; wordsBy still names the first, aegis G1); an agent's text put back by the person (dashed, sealed as the agent, aegis G5); a forged restoredFrom.by of the person on an agent's add (never solid); a 14px agent box changed by the person (two rings at least 4px apart)"
    from: { pass: "E-design", date: 2026-11-26, by: luna, decided_by: none, condition: "Aegis edit-anything G1 and G5", record: "components.author-seal.other_hands, components.author-seal.restored" }
  - id: undo-key-is-not-a-decision
    status: proposed
    rule: "The undo of another hand's change is a quiet key in the turn strip, never on the board, in the foot, in a card, a slip or a toast. It reads undo, redo, put back or dismiss and never a decision's words; it has no letter, chord, ⌘Z or voice phrase; it sits in a fixed-width slot; it is pressed only by a trusted press of its own; it names the exact change-set its row showed and never 'the latest'; it is dropped while anything is pending, while the link is down or the board is held still, and never replayed; nothing but its own press focuses it. A notice that touched the person's marks stands until it is pressed or dismissed."
    from: { pass: "E-design", date: 2026-11-26, by: luna, decided_by: none, extends: "draw-key-is-not-a-decision, nothing-on-a-board-is-a-key", condition: "Aegis edit-anything E3, G2, G6", record: "components.undo-key, components.board-leaf.turn_strip.notice" }

