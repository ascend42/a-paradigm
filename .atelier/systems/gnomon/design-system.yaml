    states: [pass, fail, unsure, waiting, agent-claimed, landed]
    source: ".atelier/sessions/2026-10-22-gnomon-loops-ui/refs/direction.html (frame leaf, ol.tr)"
    examples:
      pass: '<ol class="tr"><li><span class="tm">02:00:22</span><span class="m">✓</span><span><b>fix</b> · edited 3 files in scratch · 18 turns · 61k tokens</span><span class="dur">4m 10s</span></li></ol>'
      fail: '<ol class="tr"><li><span class="tm">02:00:00</span><span class="m fail">✕</span><span><b>tsc</b> · 14 errors in 5 files</span><span class="dur">22s</span></li></ol>'
      unsure: '<ol class="tr"><li><span class="tm">02:10:02</span><span class="m unsure">?</span><span><b>fix</b> · unsure · confidence 0.52</span><span class="dur">2m 40s</span></li></ol>'
      waiting: '<ol class="tr"><li><span class="tm">02:12:42</span><span class="m">…</span><span><b>ask</b> · loop-choice card raised · waiting for you</span><span class="dur"></span></li></ol>'
      agent-claimed: '<ol class="tr"><li><span class="tm">02:10:02</span><span class="m unsure">?</span><span><b>fix</b> · unsure · confidence 0.52<span class="agent-claimed"><span class="ac-tag">agent-claimed · model text</span>The remaining errors come from the generated client types; editing them looks wrong.</span></span><span class="dur">2m 40s</span></li></ol>'
      landed: '<ol class="tr"><li><span class="tm">18:36:12</span><span class="m">✓</span><span><b>land</b> · landed 4c1e9a2 on a-paradigm</span><button class="key quiet" type="button" aria-label="Revert 4c1e9a2">Revert</button></li></ol>'
    example_note: "landed is composed; the rest are verbatim"
    status: clear
    from: { session: 2026-10-22-gnomon-loops-ui, board: loop-detail, choice: node-graph, decided_by: creator }
  loop-trust-unfolded:
    role: "The loop-trust card unfolded over the centre column by its Read key: the same card, at most 96ch wide. Reading order: kernel line, the diff (changed loops open on it), the ordered listing, runs when, spends at most, lands and protects (gate-class called out in amber words), then Trust and Don't trust in a sticky foot with the presence line."
    anatomy: ["fold key (Esc)", "family head", "title", "kernel line (changed by · when · paused until you decide · trusted <old> → <new>)", "sections: what changed · does (listing) · runs when · spends at most · lands and protects", "foot: Trust (pri) · Don't trust · presence line · contentHash and what it covers", "stamp TRUSTED"]
    never: ["Trust above the definition", "standing or voice trust (hand only · root key)", "a diff told by hue"]
    states: [new, changed, waiting-presence, trusted]
    source: ".atelier/sessions/2026-10-22-gnomon-loops-ui/refs/direction.html (frame trust, .lt-wrap .lt-sec .lt-foot)"
    examples:
      changed: '<section class="card kind-loop" role="group" aria-label="loop-trust card, unfolded"><header class="card-head k"><span class="fam">↻ loop</span> · <span class="card-project">■ a-paradigm</span> · <span class="card-kind">loop-trust</span> · <span class="card-requester">by arky</span> <span class="chip card-voice kernel-owned">hand only · root key</span></header><p class="card-title">Trust the change to green-typecheck-gnomon</p><span class="k-line kernel-owned">changed by arky · 14:09 · paused until you decide · trusted 3f9a1c02 → 6b07d3e5</span><div class="lt-sec"><h3>what changed · 3 lines</h3><div class="df ctx">  budgets:</div><div class="df del">−   run: { rounds: 8, wallMin: 60, tokens: 400k }</div><div class="df add">+   run: { rounds: 12, wallMin: 60, tokens: 400k }</div><div class="df fold">… 9 unchanged lines</div></div><div class="lt-foot"><div class="card-keys"><button class="key pri" type="button">Trust</button><button class="key" type="button">Don''t trust</button></div><div class="lt-presence">Trust takes the root key and Touch ID · never standing, never by voice</div><small class="content-hash">contentHash 6b07d3e5 · covers the definition, argv0 realpath and sha, argv files, config closure, call pins</small></div></section>'
      new: '<section class="card kind-loop" role="group" aria-label="loop-trust card, unfolded"><header class="card-head k"><span class="fam">↻ loop</span> · <span class="card-project">■ a-paradigm</span> · <span class="card-kind">loop-trust</span> · <span class="card-requester">by arky</span> <span class="chip card-voice kernel-owned">hand only · root key</span></header><p class="card-title">Trust triage-on-commit</p><span class="k-line kernel-owned">written by arky · 14:12 · new · inert until you decide</span><div class="lt-sec"><h3>does · 3 nodes · the ordered listing</h3></div><div class="lt-foot"><div class="card-keys"><button class="key pri" type="button">Trust</button><button class="key" type="button">Don''t trust</button></div><div class="lt-presence">Trust takes the root key and Touch ID · never standing, never by voice</div></div></section>'
      waiting-presence: '<div class="lt-foot"><div class="card-keys"><button class="key pri" type="button" disabled>Trust</button><button class="key" type="button">Don''t trust</button></div><div class="lt-presence">waiting for Touch ID with the root key…</div></div>'
      trusted: '<div class="lt-foot"><div class="card-keys"><button class="key pri" type="button" disabled>Trust</button></div><div class="lt-presence">trusted · loop.trusted 6b07d3e5 · next run 02:00</div></div>'
    example_note: "changed is cut down from the direction's markup; new is composed; waiting-presence and trusted are the direction's foot after Trust"
    status: clear
    from: { session: 2026-10-22-gnomon-loops-ui, board: trust-card, choice: card-unfolds, decided_by: creator }
  loop-diff:
    role: "A loop definition's change against the trusted version, in the unfolded trust card. Marks and weight, never a hue: + added lines bold on --fold with a --key-edge left rule; − removed lines --sec with a 1px strike; unchanged runs folded to '… n unchanged lines', naming what stayed the same (argv, argv0 sha, closure digest)."
    anatomy: ["file line: path · trusted <old> (who, when) → <new> (who, when)", "context, removed and added lines", "fold line", "gate note (--warn-ink words) when a land path or protected input changes"]
    states: [added, removed, context, folded, gate-note]
    tokens: { added: "--ink 600 on --fold, 2px --key-edge left rule", removed: "--sec, line-through 1px", context: --ink2, fold: "10.5 --sec italic", gate-note: "10.5 --warn-ink" }
    source: ".atelier/sessions/2026-10-22-gnomon-loops-ui/refs/direction.html (frame trust, .df)"
    examples:
