  settings-form:
    role: "A form that opens inline under its row in a sheet (Settings, Mods) and asks the kernel for a change. Labelled fields, one key that names its cost, cancel. When the change raises a card, the row shows the request in place and offers Decide in the stack, because toasts are hidden and the stack sits under the scrim while a sheet is open. Codifies the shipped Mods Configure form (.mod-config/.mod-field) and the Voice sheet's inline flow (.vs-flow)."
    anatomy: ["lead line (11.5 --ink2)", "fields: label (10.5 --sec) over control (.field or .seg) over note (10.5 --sec)", "Advanced: a quiet key on a <summary> for rarely needed fields", "keys: the cost-label pri key + quiet cancel; a disabled key says why beside it", "foot note: what happens after the key", "request line after submit: plain chip 'card waiting' + what was asked + quiet key Decide in the stack", "result line: role=status; a refusal in --fail with CODE, reason and next:"]
    row_kinds: { form: "closed: one key (Set up local model…, Change…); open: the form", request: "the card-waiting line that replaces the form while its card waits" }
    behaviour:
      - "Enter in a field presses the key; Esc closes the form before the sheet; entries are kept until the sheet closes"
      - "anything checkable without signing is checked first (rule no-password-for-a-typo): the page's own checks, then the kernel's read-only check; on errors focus moves to the first invalid field"
      - "on submit focus moves to the request line's key; Decide in the stack closes the sheet and focuses the card group, never its Allow"
      - "one request at a time: the form is replaced by the request line while its card waits"
      - "denied or expired brings the form back with the entries and a 'Not changed' line"
      - "a change that loses something others depend on and costs presence to undo asks once inline, naming what stops (Turn off the local model when loops use it); otherwise it acts on the first press"
    states: [closed, open, invalid, checking, submitting, card-waiting, denied, expired, refused, applied]
    chip: "C5'b (8.0:local-lane, Mika): a readonly row may carry ONE optional chip after its value (the shared chip: plain, or .ink), told by its word, never a hue. MCP servers: untrusted (plain), trusted (ink), first-party (ink). The trust preview opens INLINE under the server's row as a confirm block (checking, ready, expired → Preview again, refused, committing), then the request row while its root card waits, then the outcome under the row; never a modal over the sheet."
    keys_disabled: "C5'b: a key whose refusal passes (turn it on first, not listed yet, changed) stays in place aria-disabled and the row's how line says why; a busy key is aria-disabled and keeps its focus"
    keys_pressed: "C6'b1: a toggle key carries aria-pressed (Pin aria-pressed false · Unpin aria-pressed true); a key that is aria-disabled for a reason draws the quiet look and has a VISIBLE why line (10.5 --sec, .why-off or the how line) linked by aria-describedby, never a tooltip only: 'the model can’t use this one; run it from /' · '8 pins: unpin one first'. FormKey.pressed and FormKey.describedBy (core/settings.ts)."
    how_id: "C6'b1 (Mika review #3): a readonly row's how line may carry an id (SettingRow readonly howId) so a key in that row points its aria-describedby at it: the visible why of an aria-disabled key, e.g. Kept memory's Delete while another delete runs: 'waits: another delete is running'."
    shared_limit: "C6'b1 (Mika review #4): a limit that disables many keys for the same reason is said ONCE, in the section heading (h3 with an id), and every disabled key's aria-describedby points at that heading; a per-row why line is kept only for a reason that belongs to that row. Example: 'Pins · 8 of 8 · unpin one to pin another' (id td-h-pins) for every Pin at 8 pins; 'the model can’t use this one; run it from /' stays on its own row."
    counts_readout: "C6'b1 (Mika review #5): counts of a closed set of classes read label then number, zero classes left out, joined by ' · ': 'reads 4 · changes 1 · can’t be undone 1', 'changes 1'; with none in any class: 'no tools listed'. Never '1 changes' and never a zero (core/tools-drawer.ts countsWords)."
    reused_by: "C6'b1: the Tools and memory drawer paints its sections with the same readonly rows with keys (ui/settings-sheet.ts rowEl, keyEl, resultEl), a narrower label column in the 520px drawer (minmax(96px, 150px)). Settings › Local model › Kept memory: readonly row 'Kept memory' · 'n sessions' (grp, live; how 'The working memory of sessions that ended stays on this Mac until you delete it.'), then each ended session (label its title, value 'ended · memory kept', keys Open · Delete, quiet); Delete asks inline (confirm 'Delete this ended session’s working memory? The conversation stays.' · Delete memory (pri) · Keep (quiet)); no row when none is kept."
    tokens:
      rule: "2px solid --ink at the left, padding-left 12 (as .vs-flow)"
      gap: "10 between fields; 2 between label, control and note"
      label: "10.5 --sec"
      control: "11.5, min-height 28; width by content: address 34ch, name 16ch, model and paths min(100%, 60ch)"
      note: "10.5 --sec"
      invalid: "aria-invalid, 2px --fail-edge, message 10.5 600 --fail led by ✕, linked by aria-describedby; it replaces the note"
      request-chip: "chip (plain): a waiting card is not a warning (rule three-semantic-colours)"
      result: "10.5 --ink2, the outcome word 600; a refusal in --fail"
    never: ["a modal over a sheet (rule teach-inline)", "a toast as the only sign the request went out", "an amber chip for a waiting card", "a placeholder that looks like a value", "a form that drops config it doesn't show (it edits one endpoint by id and keeps the rest)"]
