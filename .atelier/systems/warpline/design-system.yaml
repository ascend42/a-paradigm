foundations:
  color:
    # role → value. Spec §1.1 table, verbatim hexes. Alpha variants of these
    # (e.g. #E9A23B4d) are on-palette.
    ground.page: "#0B0D14"        # --ink-900
    ground.section: "#0F1220"     # --ink-850
    ground.card: "#141829"        # --ink-800
    rule.default: "#1C2138"       # --ink-700, borders + warp-grid skeleton
    rule.hover: "#2A3050"         # --ink-600
    text.primary: "#F4F1EA"       # --linen-50
    text.body: "#CFCABE"          # --linen-200
    text.muted: "#8B8A82"         # --linen-400 (bytes tone; 4.99:1 on ink-850)
    thread.a: "#E9A23B"           # --warp, branch A ONLY
    thread.a-soft: "#F2C078"      # --warp-soft, hash chips, emphasis
    thread.b: "#2DD4BF"           # --weft, branch B / weave clean
    thread.b-soft: "#5EEAD4"      # --weft-soft
    seam: "#7C6FF0"               # git is blind here. Rule 1.
    git.clean-trap: "#34D8A0"     # --clean, git's CLEAN chip ONLY
    thread.cut: "#5E5C54"         # severed end, retired ghosts (decorative only: 2.6:1)
    scrim: "#0B0D1499"            # drill-over backdrop = ink-900 @ 60%; replaces rgba(0,0,0,.4)
    weave-grad: "linear-gradient(135deg, #E9A23B 0%, #2DD4BF 100%)"
    status: clear
    from: { spec: "docs/specs/warpline-design-system.md:38-60", plus: "scrim derived from ink-900, no new hue (one-meaning-per-hue)" }
  color_roles_contested:
