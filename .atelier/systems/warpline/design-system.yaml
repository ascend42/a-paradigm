components:
  verdict-chip:
    role: "A verdict pill; the hero's point is two of these contradicting. Never a button."
    anatomy: [label]
    variants: { git-clean: "git's CLEAN trap, --clean", git-conflict: "git CONFLICT", divergent: "--seam", weave-clean: "--weft" }
    sizes: { default: { font: 13, weight: 600, padding: "4 12", radius: pill } }
    states: [static]   # colour IS the state; the label must carry it too (not colour alone)
    tokens: { border: currentColor, git-clean: --clean, git-conflict: "git-voice (contested)", divergent: --seam, weave-clean: --weft }
    source: packages/paradigm/platform-ui/src/sections/warpline/styles/warpline.css:165-176
    examples:
      git-clean: '<div class="warpline" style="display:block;height:auto;padding:16px"><span class="wl-chip wl-chip--clean">CLEAN ✓</span></div>'
      git-conflict: '<div class="warpline" style="display:block;height:auto;padding:16px"><span class="wl-chip wl-chip--conflict">CONFLICT</span></div>'
      divergent: '<div class="warpline" style="display:block;height:auto;padding:16px"><span class="wl-chip wl-chip--divergent">DIVERGENT</span></div>'
      weave-clean: '<div class="warpline" style="display:block;height:auto;padding:16px"><span class="wl-chip wl-chip--weave-clean">CLEAN</span></div>'
    status: clear
    from: { spec: "§1.3 Chip" }
  hash-chip:
    role: "A mono fact tag (hash, symbol key) on the brand pages; filled, 6 radius. Not the verdict chip."
    variants: { plain: ink-700 fill, hash: warp-soft, weft: weft, seam: "seam (git-blind only)", clean: "clean (git trap only)" }
    sizes: { default: { font: "11.5 → 12", padding: "3 9", radius: control } }
    states: [static]
    source: docs/warpline/pov.html:107-110, docs/warpline/system.html:212-220
    examples:
      hash: '<span class="chip hash">#b30f-77ac-e1</span>'
    status: clear
    from: { extract: 2026-10-21, note: "class .chip means a different thing in docs than .wl-chip in the console; named apart here" }
  status-pill:
    role: "Build status on the system map (built / warp / weft)."
    source: docs/warpline/system.html:265-273
    examples: { built: '<span class="pill built">BUILT</span>' }
    status: clear
    from: { extract: 2026-10-21 }
  verdict-card:
    role: "The scored result plus one plain-language consequence; the score always sits beside its raw counts."
    anatomy: [label, counts, consequence]
    variants: { divergent: "label --seam", convergent: "label --weft" }
    states: [divergent, convergent]
    tokens: { label: "--warp-serif 22", counts: "--warp-mono 12 text.muted", border: rule.default, radius: card }
    source: packages/paradigm/platform-ui/src/sections/warpline/components/OracleDivergenceViewer.tsx:192-211
    examples:
      divergent: '<div class="warpline" style="display:block;height:auto"><div class="wl-verdict"><div class="wl-verdict__head"><span class="wl-verdict__label wl-verdict__label--divergent">DIVERGENT</span><span class="wl-verdict__counts">score 0.93 · agree 41 / git-only 2 / meaning-only 1</span></div><div class="wl-verdict__consequence">contradictory edits to #code:checkout::submit · slots: body, signature</div></div></div>'
      convergent: '<div class="warpline" style="display:block;height:auto"><div class="wl-verdict"><div class="wl-verdict__head"><span class="wl-verdict__label wl-verdict__label--convergent">CONVERGENT</span><span class="wl-verdict__counts">score 1.00 · agree 44 / git-only 0 / meaning-only 0</span></div><div class="wl-verdict__consequence">No knots. No dangles. The weave is clean.</div></div></div>'
    status: clear
    from: { spec: "§1.3 Verdict card" }
  meaning-bytes-split:
    role: "The thesis on one row: git's bytes verdict left, Warpline's meaning verdict right, the seam between."
    anatomy: [bytes-side, seam, meaning-side, title, chip, tally]
    variants: { divergence: "seam pulses (only animated state)", both-caught: "seam static 0.45", git-noise: "seam 0.25", convergent: "seam 0.25" }
    states: [divergence, both-caught, git-noise, convergent, reduced-motion]
    tokens: { grid: "1fr 1px 1fr", bytes: "--warp-mono text.muted", meaning: --warp-serif, seam: --seam }
    narrow: "contested: see zones.viewer.overflow"
    source: packages/paradigm/platform-ui/src/sections/warpline/components/OracleDivergenceViewer.tsx:75-126
    examples:
      divergence: '<div class="warpline" style="display:block;height:auto"><div class="wl-split"><div class="wl-split__side wl-split__side--bytes"><div class="wl-split__title">git · bytes</div><span class="wl-chip wl-chip--clean">CLEAN ✓</span><div class="wl-split__tally">0 conflicted paths</div></div><div class="wl-seam wl-seam--divergence"></div><div class="wl-split__side wl-split__side--meaning"><div class="wl-split__title">warpline · meaning</div><span class="wl-chip wl-chip--divergent">DIVERGENT</span><div class="wl-split__tally">1 knot · 1 dangle — <b>1 git-blind</b></div></div></div></div>'
      both-caught: '<div class="warpline" style="display:block;height:auto"><div class="wl-split"><div class="wl-split__side wl-split__side--bytes"><div class="wl-split__title">git · bytes</div><span class="wl-chip wl-chip--conflict">CONFLICT</span><div class="wl-split__tally">2 conflicted paths</div></div><div class="wl-seam wl-seam--both-caught"></div><div class="wl-split__side wl-split__side--meaning"><div class="wl-split__title">warpline · meaning</div><span class="wl-chip wl-chip--divergent">DIVERGENT</span><div class="wl-split__tally">1 knot · 0 dangles</div></div></div></div>'
      convergent: '<div class="warpline" style="display:block;height:auto"><div class="wl-split"><div class="wl-split__side wl-split__side--bytes"><div class="wl-split__title">git · bytes</div><span class="wl-chip wl-chip--clean">CLEAN ✓</span><div class="wl-split__tally">0 conflicted paths</div></div><div class="wl-seam"></div><div class="wl-split__side wl-split__side--meaning"><div class="wl-split__title">warpline · meaning</div><span class="wl-chip wl-chip--weave-clean">CLEAN</span><div class="wl-split__tally">0 knots · 0 dangles</div></div></div></div>'
    status: clear
    from: { spec: "§1.3 Meaning-vs-bytes split" }
  matrix-cell:
    role: "One cell of the literal 2x2 (git x meaning); click lists the real symbol keys. Counts never animate."
