content:
  vocabulary:
    use:
      PICK: "one change (commit's replacement)"
      WEAVE: "merge two lines of intent; '◀ weave ▶' between branch names"
      KNOT: "two intents bind contradictory meaning to one symbol"
      DECIDE: "a human resolves a KNOT"
      SELVAGE: "HEAD"
      TAPESTRY: "woven history"
      OFFER: "proposal (PR's replacement)"
      ENDORSEMENT: "trust approval"
      DANGLE: "a call into a symbol the other branch retired"
      BOLT: "a signed release cut"
      Oracle run: "one recorded git-vs-meaning comparison"
      DIVERGENT / CONVERGENT: "the meaning verdict"
      git-blind: "what git cannot see; the only thing violet marks"
      HELD: "needs a human (neutral mark, no hue)"
    git_terms_allowed: "merge, commit, conflict, PR are git's words; use them only when naming what git does (the bytes side, comparison tables)."
    retired: {}
    status: clear
    from: { preserve: nomenclature, spec: "§3 'Nomenclature is locked (flows §1)'", extract: 2026-10-21 }
  contested:
    meaning-clean-word:
      rank: 5
      instances: ["OracleDivergenceViewer.tsx:111 meaning chip says CLEAN", "viewerState.ts:40 git chip says CLEAN ✓", "OracleLedgerRail.tsx:59 + OracleDivergenceViewer.tsx:200 say CONVERGENT"]
      recommended: CONVERGENT
      from: { extract: 2026-10-21, spec: "--clean exists so git-clean never reads as Warpline-clean" }
  voice:
    - "Name the verdict, then the count with its denominator. A score never stands alone."
    - "Restraint: calm copy for clean runs ('No knots. No dangles. The weave is clean.')."
    - "Render only real data; a proxy is labelled 'proxy', never 'scrutiny'."
    - "Byte-only files say 'not yet meaning', never a fake semantic verdict."
  voice_from: { spec: "§1.3 verdict card, §2 dependency note, GAP-1" }

