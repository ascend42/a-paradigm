# Warpline console design system (product: warpline, extends: none).
# Layers: recorded decisions (moved verbatim) + v2 foundations, components, zones, content.
# PROVENANCE of the recorded block below:
#   lines "read" through "decisions" = .atelier/design-system.yaml:1-49 @ 927b1a36, unchanged
#   except version (1 there; 2 here for the v2 layers). Mechanical rules are appended to
#   `rules:` after the recorded entries, marked "drafted 2026-10-21".
#   recorded.design_md = .atelier/DESIGN.md:1-39 @ 927b1a36, verbatim.
#   Sessions: 2026-10-14-warpline-console, 2026-10-15-paradigm-8-spec.
# The repo-wide files are untouched; the session thread retires them after all products are drafted.
version: 2   # recorded: version: 1 (.atelier/design-system.yaml:1)
read: "The control room for an agent armada's source control: you and a dev team check in a few times a day to make the calls machines can't; calm, exact, a dark loom register where violet only ever means 'git is blind here'."
source_of_truth: "docs/specs/warpline-design-system.md (tokens, type, components, the three system rules) is preserved as-is; this file records console decisions on top of it."
dials: { layout: 3, motion: 4, density: 7, from: { session: 2026-10-14-warpline-console, board: intent-dials } }
hierarchy:
  levels: [org-dashboard, repo]
  org: "repo cards with visibility, activity and needs-you counts; cross-repo needs-you list"
  repo_tabs: [Inbox, Floor, Code, Offers, Tapestry, Runs, Releases, Fleet, Settings]
  scope: v1
  from: { session: 2026-10-14-warpline-console, board: repos-and-nav, note: "too generic of a style ... form and function i like so we can go with it for v1" }
structure:
  home: inbox
  nav: [Inbox, Floor, Offers, Tapestry, Symbols, Fleet, Calibration]
  live_band: { placement: above-inbox, sizes: [hidden, compact, expanded], default: compact }
  floor: { section: true, same_motion_rule: true }
  from: { session: 2026-10-14-warpline-console, board: console-structure }
rules:
  - id: motion-on-events-only
    rule: "Live surfaces (band, Floor) move only when a pick is admitted, a KNOT forms, or a KNOT is resolved; no idle or ambient animation. Reduced motion: final state, no travel."
    from: { session: 2026-10-14-warpline-console, board: console-structure, note: "only reall animate when changes come in and they get rectified" }
  - id: live-band-resizable
    rule: "The live band can be hidden, compact, or expanded (labelled lanes); the choice persists per viewer."
    from: { session: 2026-10-14-warpline-console, board: console-structure, note: "maybe ways to makek the live larger or smaller" }
  - id: decide-in-split-view
    rule: "Decisions open in a split view: the ranked queue stays on the left, the selected KNOT or HELD item on the right; sealing advances to the next open item."
    from: { session: 2026-10-14-warpline-console, board: decision-surface }
  - id: roles-by-domain
    rule: "Owner decides everything incl. gate/auth contracts; Developer decides KNOTs only in domains they own, others read-only with a stated reason; Observer is read-only; agents never sign in to the console (MCP/CLI only, visible on the Floor). Every decision requires a human key."
    from: { session: 2026-10-14-warpline-console, board: access }
  - id: one-meaning-per-hue
    rule: "No new hue for human states. HELD = linen-50 outline + human mark; human principal = filled linen chip with mark; agent principal = outlined linen-400 chip. Amber stays branch A, teal branch B, violet git-blind conflict."
    from: { session: 2026-10-14-warpline-console, board: human-states }
  - id: density-control-room
    rule: "Card padding 10x14, row gap 6, tally padding 10x14, main padding 18x20 (all on the 4px scale)."
    from: { session: 2026-10-14-warpline-console, board: intent-dials }
  # ── drafted 2026-10-21 (Mika): enforced + agent rules on top of the recorded ones ──
  # Appended to the recorded rules above (kept verbatim). Mechanical ids run in `atelier check`.
  - { id: color-on-palette, check: color-off-palette, status: clear, from: { spec: "§1.1" } }
  - { id: font-on-system, check: font-off-system, status: clear, from: { spec: "§1.2" } }
  - { id: type-on-scale, check: type-off-scale, status: clear, from: { spec: "§1.2" } }
  - { id: spacing-on-scale, check: spacing-off-scale, status: contested, from: { decision: rules.density-control-room, spec: "§1.2" } }
  - { id: radius-on-scale, check: radius-off-scale, status: clear, from: { spec: "§1.2" } }
  - id: seam-only-where-git-blind
    rule: "--seam appears only on git-blind meaning: ★ cell, seam, DIVERGENT, knot glyph, dangle void/target, divergent ledger dot, body slot; one exception, the Run button."
    status: clear
    from: { spec: "docs/specs/warpline-design-system.md:19-24" }
  - { id: restraint-default, rule: "CONVERGENT is calm: seam dim and static, nothing glows.", status: clear, from: { spec: "docs/specs/warpline-design-system.md:25-27" } }
  - { id: no-count-animation, rule: "Counts, tallies and scores render their final value on mount.", status: clear, from: { spec: "docs/specs/warpline-design-system.md:28-32" } }
  - { id: one-drift-per-screen, rule: "Only the first dangle drifts; the rest hang.", status: clear, from: { spec: "§1.3 Dangle render" } }
  - id: contrast-aa
    rule: "Text 4.5:1, large text and UI glyphs 3:1, in every Platform theme. --cut is decorative only (2.6:1)."
    status: clear
    from: { checklist: "Mika review-checklist 1" }
  - id: target-size
    rule: "Pointer targets at least 24x24 (WCAG 2.5.8) at control-room density; 44x44 under (pointer: coarse)."
    status: clear
    from: { checklist: "Mika review-checklist 2", decision: rules.density-control-room }
  - id: keyboard-reachable
    rule: "Everything clickable is a button or link with a visible :focus-visible ring; the drill-over closes on Escape and returns focus."
    status: clear
    from: { checklist: "Mika review-checklist 7" }
preserve:
  - { what: system-rules, value: "seam violet only where git is blind; restraint is the default; no count animation (warpline-design-system.md:19-32)" }
  - { what: tokens, value: "ink/linen/warp/weft/seam/clean/cut + Fraunces/Inter/JetBrains Mono" }
  - { what: nomenclature, value: "PICK, WEAVE, KNOT, DECIDE, SELVAGE, TAPESTRY, OFFER, ENDORSEMENT (warpline-flows.md section 1)" }
  - { what: api-routes, value: "/api/warpline/* and WS warpline:* events" }
decisions:
  - session: 2026-10-14-warpline-console
    board: console-structure
    choice: { home: inbox-first, live: "band + Floor section" }
  - { session: 2026-10-14-warpline-console, board: decision-surface, choice: split }
  - { session: 2026-10-14-warpline-console, board: access, choice: roles-by-domain }
  - { session: 2026-10-14-warpline-console, board: intent-dials, choice: control-room }
  - { session: 2026-10-14-warpline-console, board: human-states, choice: neutral-mark }
  - { session: 2026-10-14-warpline-console, board: repos-and-nav, choice: two-levels, scope: v1 }

recorded:
  design_md:
    from: { file: .atelier/DESIGN.md, lines: "1-39", commit: 927b1a36 }
    text: |
      # Warpline Console: design direction

      Session `2026-10-14-warpline-console` set this direction with Luna and Mika. It is approved as the starting version. The approved comps are `sessions/2026-10-14-warpline-console/refs/direction.html` (inside a repo) and `refs/repos.html`, option B (the org level). Comps are local renders and gitignored. The decision record is `sessions/2026-10-14-warpline-console/session.yaml`, and the enforced tokens and rules are in `design-system.yaml`.

      ## The read
      This is the control room for an agent armada's source control. You and a dev team check in a few times a day to make the calls machines can't. The register is calm, exact and dark, like a loom, and violet only ever means "git is blind here."

      ## What stays
      The Warpline design system (`docs/specs/warpline-design-system.md`) is preserved whole:
      - **Palette:** ink and linen ground. Amber is branch A, teal is branch B, and violet is the git-blind conflict.
      - **Type:** Fraunces for meaning, Inter for chrome, JetBrains Mono for bytes.
      - **The three system rules:** violet only where git is blind; restraint by default; no count animation.

      ## Structure
      - **Two levels (v1).** An org dashboard of repos (visibility, activity, needs-you counts, plus a cross-repo needs-you list) leads to a repo page with tabs: Inbox, Floor, Code, Offers, Tapestry, Runs, Releases, Fleet, Settings. The creator likes the form and function but finds the style too generic; giving it Warpline's own character is a v2 item.
      - **Inbox first.** A repo opens on its Inbox: decisions ranked by expected loss, with the folded admissions below.
      - **Live band.** The band above the Inbox is the Floor in miniature. It can be hidden, compact or expanded, and it moves only when a pick is admitted, a KNOT forms, or a KNOT is resolved. The Floor tab is the same view at full size.
      - **Deciding happens in a split view.** The queue sits on the left and the decision on the right: both intents, contested slots, blast radius, and a resolve form with a required reason. Sealing a decision advances to the next item.
      - **Roles by domain.**
        - Owner decides everything, including gate, auth and pipeline changes.
        - Developer decides KNOTs only in the domains they own and sees the rest read-only, with the reason stated.
        - Observer reads.
        - Agents never sign in; they act through MCP or the CLI and appear on the Floor.

      ## Look
      - **Control room dials 3·4·7.** Strict grid, dense rows, and events with real presence (arrive, cinch, settle), all gated on reduced motion.
      - **One meaning per hue.** "Needs a human" is drawn neutral: a linen outline with a human mark. Humans are filled linen chips and agents are outlined grey.

      ## Forge surfaces (TD-2026-10-14-551)
      - **Code:** files at any state, with meaning blame per symbol in the margin and an honesty label on every file (meaning-decided or byte-decided).
      - **Runs:** the verdict runs first, so a KNOT is never built. Checks become signed witnesses, and a failing required check parks a protected landing.
      - **Releases:** signed cuts (BOLTs) with their checks attached.
      - **Settings:** visibility, collaborators, protected refs and required checks, and webhooks.

      ## Open
      - The v2 look for the org/repo shell.
      - A failure colour for failed checks. It needs its own board, because every hue already carries a meaning.
      - Offer review threads, which are deferred.
      - Build gate: no console build starts while F4 (cold-agent legibility) is unmeasured.
  sessions:
    - { id: 2026-10-14-warpline-console, path: .atelier/sessions/2026-10-14-warpline-console/session.yaml, boards: [console-structure, decision-surface, access, intent-dials, human-states, repos-and-nav], audit_keep_retire_gates: "see session audit:" }
    - id: 2026-10-15-paradigm-8-spec
      path: .atelier/sessions/2026-10-15-paradigm-8-spec/session.yaml
      carried: "Only the decisions that touch Warpline, verbatim:"
      principles: ["warpline-opt-in: Warpline is opt-in per project. A project the user declares a Warpline project runs native (TD-2026-10-14-735); every other project runs on standard git, and the rest of the harness (kernel, budget, contracts, learning loop, Shuttle) works the same."]
      rules:
        - "Kernel log is separate from Warpline's fabric; every PICK event carries causes[] to its strand"
        - "Spawn injects one logged pointer line to `warpline status`; the skill is installed, never pushed (F4)"
        - "Git-mode nodes: tests + key-proven reviewer + clean merge onto base with CI green; git conflicts become inbox items without semantic judgment"
      read: "the Warpline loom register (session read)"
    - { audit_gates_from: 2026-10-14-warpline-console, gates: ["Roadmap hard stop: no console build begins while F4 (cold-agent legibility) is unmeasured; design is allowed, build is gated", "Forge spec G4: no forge-private storage; every screen field maps to a fabric record"] }
    - { audit_retire_from: 2026-10-14-warpline-console, retire: ["Viewer binds OracleRecord, one era stale; the console must bind KnotPayload / verdict JSON (forge spec §3)"] }

