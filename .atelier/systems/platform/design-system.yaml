rules:
  - { id: type-on-scale,    check: type-off-scale,    from: { extract: 2026-10-21 } }
  - { id: spacing-on-scale, check: spacing-off-scale, from: { extract: 2026-10-21 } }
  - { id: radius-on-scale,  check: radius-off-scale,  from: { extract: 2026-10-21 } }
  - { id: colour-on-palette, check: color-off-palette, from: { extract: 2026-10-21 } }
  - { id: font-on-system,   check: font-off-system,   from: { extract: 2026-10-21 } }
  - id: shared-idioms-in-shared-css
    rule: "A class used by more than one section (view-switcher, view-tab, filter-bar, empty-state, tabs) is defined once in src/styles/, never in a lazy section sheet."
    from: { extract: 2026-10-21 }
  - id: tokens-defined
    rule: "Every var(--p-*) referenced is defined in tokens.css for both themes. Undefined today: --p-accent, --p-green, --p-bg-subtle (no fallback: team.css:34 :54 :94 :109 :159 :163 :165 :227, ambient.css:81), --p-font-mono, --p-border-subtle, --p-space-lg, --p-symbol-*-rgb."
    from: { extract: 2026-10-21 }
  - id: focus-visible
    rule: "Every interactive element shows a 2px --p-border-active ring on :focus-visible; outline:none only with a replacement (10 outline:none today, 8 :focus rules, 0 :focus-visible)."
    from: { review: review-checklist-7 }
  - id: reduced-motion
    rule: "Loops (task-agent-pulse, agent-highlight-glow, sentinel live dot) stop under prefers-reduced-motion."
    from: { review: review-checklist-5 }
  - id: text-contrast
    rule: "Text tokens meet 4.5:1 on every surface in both themes; filled buttons use action.fill.* with on-accent text."
    from: { review: review-checklist-1 }

