known:
  - fact: "the wrapper exposes no IPC to the page by design: no #[tauri::command], capabilities [], withGlobalTauri false, postMessage replaced to throw"
    evidence: packages/gnomon-wrapper/src/surface.rs:1-31; tauri.conf.json:10,25
  - fact: "the kernel refuses a cwd that is not an existing absolute directory at session.open, after the sheet has closed; the GUI shows it as a toast"
    evidence: packages/gnomon/src/kernel/supervisor/local-session.ts:665-667; packages/gnomon-gui/src/ui/app.ts:3061-3063,1419-1436
  - fact: "auto-edits is refused for the home folder, any folder above it, and /"
    evidence: packages/gnomon/src/kernel/broker/run-mode.ts:350-355
  - fact: "the GUI knows each session's cwd (session.open rows) but not the home path, so it can't shorten with ~ itself"
    evidence: packages/gnomon-gui/src/core/store.ts:82-83,275
  - fact: "a terminal-suggested folder is displayed through one escape rule and prefilled only when clean (Aegis L3)"
    evidence: packages/gnomon-gui/src/core/launch.ts:43-83
  - fact: "a browser drop of a Finder folder gives the page a name and a handle, never an absolute path; in the wrapper Tauri's native drop handler sees paths but has no route to the page"
    evidence: "HTML DataTransfer / File System Access (no path by design); surface.rs (no IPC)"

findings_on_now:   # the shipped sheet, captured refs/shots/now-new-session-*.png
  - { id: N1, cost: high, what: "a blank text field labelled 'cwd' is the only way to name the folder; placeholder /absolute/path/to/project", rule: "founder; friction-log-walkthrough", fix: "folder-field" }
  - { id: N2, cost: high, what: "the sheet closes before session.open answers (app.ts:3061), so a refusal arrives as a toast and the choice is lost", rule: "functional-states-say-what-happened; in-between-states-designed", fix: "state opening: the sheet stays with Open busy; a refusal shows in place" }
  - { id: N3, cost: medium, what: "'cwd' is shell jargon; the vocabulary says a session is 'a conversation in a folder'", rule: "content.vocabulary.session", fix: "label 'folder'" }
  - { id: N4, cost: medium, what: "the form has no role=dialog / aria-modal / accessible name (index.html:72-73); title is <p class=title>", rule: "migration batch sheets-and-headings; WCAG 4.1.2", fix: "role=dialog aria-modal aria-labelledby, <h2 class=title>New session</h2>" }
  - { id: N5, cost: low, what: "'open' is a default key, not the sheet's primary; the model switch sheet uses a pri 'Switch'", rule: "components.key.variants.pri (one primary per group)", fix: "key pri 'Open'" }
  - { id: N6, cost: low, what: "the claude model is remembered per folder but restored only on the cwd input's 'change' event (model-picker.ts:85)", rule: "consistency", fix: "every folder choice (recent, chooser, typed, hint) runs restore()" }

contested:   # for the founder (and Arky/Aegis on C1)
  - id: C1
    question: "Who draws the macOS folder chooser?"
    options:
      kernel: "a kernel verb folder.choose opens the Mac's own chooser (osascript 'choose folder' now; a signed helper later if the panel misbehaves). Works in the wrapper AND in a browser on the same Mac; the wrapper keeps zero page IPC."
      wrapper: "Tauri's dialog plugin in the wrapper. Needs a page-to-wrapper channel that surface.rs deliberately removed (four layers); a browser gets no chooser."
    recommend: kernel
    why: "The kernel is already the page's one trusted, authenticated channel, so the chooser comes to every surface without reopening the IPC the wrapper was built to close."
  - id: C2
    question: "What is chosen when the sheet opens?"
    options: { preselect: "the folder of the session in the centre, else the most recent; ⌘N, Enter opens", none: "nothing; Open disabled until you pick" }
    recommend: preselect
    why: "Opening a session is cheap and reversible, and the usual case is 'another session where I already am'; the opens-in line names the folder before Enter."
  - id: C3
    question: "Drag a folder from Finder into the sheet?"
    options: { park: "not in 8.0; the Mac's chooser accepts a Finder drag and ⌘⇧G itself", build: "wrapper catches the native drop and hands the path to the kernel, which pushes it to the page (a new wrapper→kernel→page channel, Aegis review)" }
    recommend: park
    why: "A browser never gives the page an absolute path, and the wrapper route is a new trusted channel for a gesture the native chooser already supports."
  - id: C4
    question: "The home folder (or / or above it)?"
    options: { warn: "allowed, amber warning naming what it costs (auto-edits off, every project readable)", block: "Open disabled" }
    recommend: warn
    why: "The kernel allows it; only auto-edits is refused, so the GUI should say that, not invent a stricter rule."

verdict:
  covers: "the proposal as rendered: heuristics, states, copy, contrast, keyboard order, grayscale and CVD, 1024 and 1440, day and night"
  result: approved-with-fixes   # fixes are the build requirements in system-proposal.yaml; C1-C4 await the founder
  cannot_establish: "that ⌘N then Enter is what the founder does most, or that an osascript chooser comes to the front reliably"
  cheapest_check: "a week of the founder's session.open rows: how often the cwd equals the centre session's or the most recent folder (C2); and ten chooser opens from the browser and the wrapper, counting how often the panel opens behind (C1)"

founder_note_2026-10-23:
  words: "the designs from mika look good, but ive noticed we have inconsistent button heights"
  cause: ".key and .key.pri are 28px; .key.quiet is 24px (styles.css:248), as are the chat-header and composer glyph keys (1011, 1019, 1030); the day offset shadow makes a default key read 30 beside a 24 quiet one. System-wide, not local to this design."
  fix: "one token --key-h 28px for every key; quiet changes the look, not the size (system-proposal.yaml, batch key-height). Applied in refs/folder-field.css; board K shows every variant before and after."
  rendered: [refs/shots/keys-before-after-day.png, refs/shots/keys-before-after-night.png, refs/shots/ff-keys-after-day.png, refs/shots/ff-keys-after-night.png]

decided:   # the founder's picks, relayed by the coordinator 2026-10-23
