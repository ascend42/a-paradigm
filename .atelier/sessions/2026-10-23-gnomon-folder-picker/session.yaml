id: 2026-10-23-gnomon-folder-picker
verb: propose
scope: "Every place a human types a filesystem path in the Gnomon GUI, starting with New session's cwd field: a folder-field
  component (Choose folder… through a native macOS chooser, recent folders as one-click choices, the typed path kept only as
  an Advanced fallback), its states and copy, applied to New session, Settings › Local model runner and Mods › Add from folder."
product: gnomon
system: .atelier/systems/gnomon/
depth: focused
surface: desktop GUI (New session sheet, Settings sheet, Mods sheet)
mode: extend
change: add
by: Mika (design engineer)
founder_words: "we need a folder picker because writing out a path is bad UX"
read: "One operator opens a session in one of a handful of project folders many times a day. The usual open should be ⌘N,
  Enter. Choosing a new folder should be the Mac's own chooser, and typing a path the rare exception."
