# Proposed amendment to .atelier/systems/gnomon/design-system.yaml (session 2026-10-23-gnomon-folder-picker).
# NOT applied: it goes into the system once the founder settles C1-C4 (session.yaml contested). Reference render:
# refs/folder-picker.html; bridge CSS refs/folder-field.css (moves into packages/gnomon-gui/static/styles.css at build).

components:
  folder-field:
    role: "Naming a folder (or, in the file variant, a file) on this Mac. You choose it; you don't type it. Recent folders are one-click choices. Choose folder… opens the Mac's own chooser. Typing a path is an Advanced fallback, shown open only when no chooser exists."
    variants:
      recents: "New session: a radiogroup of up to six recent folders, then Choose folder… and Type a path ▸"
      compact: "one value, no recents (Settings › Local model runner, Mods › Add from folder): the value or 'none · <what happens>', Choose folder… / Choose another…, Clear, Type a path ▸"
      file: "the compact variant for a file (Mods › Configure command): Choose file…"
    anatomy:
      - "legend: the sheet's own label style (New session: .meta 11.5 --sec, like 'model'; settings-form: .sf-label 10.5)"
      - "recent row (.ff-row, role=radio, roving tabindex, min-height 40): mark column (✓ chosen, ✕ chosen but failed its check) · project swatch · name (11.5, 500; 600 when chosen) over path (10.5 --sec, ~-shortened by the kernel) · when (10.5 --sec: 'today 14:06', 'yesterday', 'Oct 19', 'just chosen', 'from terminal')"
      - "opens-in line (10.5 --ink2, path 600 --ink, wraps anywhere): the whole path of the chosen folder, plus ' · outside your home folder' when it is"
      - "keys: Choose folder… (default key; busy 'Choosing…') and Type a path ▸ (quiet, aria-expanded)"
      - "typed field (folded): label 'path', no placeholder, note 'a full path, or one starting with ~/ · checked as you type'"
      - "one line for the check: ✓ note, ✕ error (.sf-err, role=alert), or ◆ warning (10.5 --warn-ink, role=status)"
    states: [empty, recents, chosen, chooser-open, chooser-cancelled, typed-open, checking, found, not-absolute, missing, not-a-folder, unreadable, wrong-contents, home-or-above, outside-home, terminal-hint, no-chooser, opening, refused]
    behaviour:
      - "Sheet opens: the chosen row is the centre session's folder, else the most recent (contested C2); focus on it. No recents: focus on Choose folder…"
      - "Arrows move and choose within the list; Home/End jump; Tab leaves the list. Enter anywhere submits the sheet."
      - "Choose folder… asks the kernel for the chooser (trusted event only), starting in the parent of the most recent folder. The key is busy and the status line reads 'The macOS folder chooser is open. If you don't see it, it may be behind this window.' Picking a recent, Esc or cancel closes the chooser."
      - "A chosen folder that isn't a recent goes to the top of the list, chosen, noted 'just chosen'; focus returns to it. Cancelling the chooser changes nothing; focus returns to Choose folder… and a hidden status says 'No folder chosen. Nothing changed.'"
      - "Every choice is checked by the kernel (read-only) before Open is enabled; a check slower than 150 ms shows 'checking…'. Typed paths are checked 300 ms after the last key."
      - "Every folder choice (row, chooser, typed, hint) restores the claude model remembered for that folder (model-picker.ts restore)."
      - "Open keeps the sheet open, busy 'Opening…', until session.open answers; success closes it and focuses the session; a refusal shows in place and keeps the choice."
      - "Recents that no longer exist are left out (the kernel filters them); a recents list is not a registry."
    copy:
      title: "New session"
      legend: "folder"
      keys: { choose: "Choose folder…", choose-again: "Choose another…", choosing: "Choosing…", typed: "Type a path ▸ / ▾", clear: "Clear", open: "Open", opening: "Opening…", cancel: "cancel" }
      chooser-prompt: "Choose the folder this session works in."   # runner: "Choose the folder that holds cli.js." mod: "Choose the folder that holds gnomon-manifest.json."
      empty: "No recent folders yet. Choose the project folder this session works in."
      opens-in: "opens in <path>"            # + " · outside your home folder"
      chooser-open: "The macOS folder chooser is open. If you don't see it, it may be behind this window."
      cancelled-sr: "No folder chosen. Nothing changed."
      typed-note: "a full path, or one starting with ~/ · checked as you type"
      found: "✓ folder found"
      not-absolute: "✕ Start the path with / or ~/"
      missing: "✕ Nothing at <path>. Check the spelling, or use Choose folder…."
      not-a-folder: "✕ <path> is a file. Choose the folder that holds it."
      unreadable: "✕ Gnomon can't read <path>: macOS hasn't allowed it. next: System Settings › Privacy & Security › Files and Folders, allow Gnomon, then choose the folder again."
      wrong-contents: { runner: "✕ <path> has no cli.js. Its dist folder does.  [Use <path>/dist]", mod: "✕ <path> has no gnomon-manifest.json. Choose the folder that holds it." }
      home-or-above: "◆ This is your home folder. A session here can read every project in it, and auto-edits is off here. Choose a project folder inside it if you can."   # '/' and above: "◆ <path> is above your home folder. …"
      hint: "Suggested by `gnomon` in a terminal: check it, then Open."   # not prefilled: unchanged (launch.ts:100)
      no-chooser: "This kernel can't open the macOS folder chooser here. Type a full path, or pick a recent folder."
      refused: "<CODE>  <path> is no longer there · next: choose the folder again"
      open-disabled: { none: "choose a folder first", chooser: "waiting for the chooser", invalid: "fix the path first", unreadable: "Gnomon can't read this folder", refused: "choose another folder" }
      runner-none: "none · the bundled runner is used"
    tokens:
      row: "min-height 40; padding 4 8; gap 8; hover --fold; chosen: 1px --key-edge ring + ✓ + 600 (never a hue); focus: inset 2px --key-edge"
      gaps: "2 between rows, 6 inside the field, 14 between the sheet's groups"
      width: "New session sheet min(560px, 100vw − 32px)"
    never:
      - "a text field as the first or only way to name a folder where a chooser exists"
      - "a placeholder path that looks like a value (/absolute/path/to/project, /Users/you/…)"
      - "a chosen state told apart by hue; the swatch is the project (rule hue-is-identity)"
      - "a folder name rendered from anything but the kernel's escaped display string, as textContent (the launch.ts escape rule)"
      - "a refusal that closes the sheet and drops the choice"
    build_requirements:
      - "kernel verb folder.choose {purpose: session|runner|mod|file, startIn?} → {path, display} | {cancelled} | refused no-chooser | busy; one chooser at a time; trusted user event only; owner per C1"
      - "kernel verb folder.check {path, expect?: cli.js|gnomon-manifest.json} → {exists, isDir, readable, real, display (~-shortened, escaped), name, home: inside|outside|home-or-above, expectFound, suggest?} (read-only, no row written)"
      - "kernel verb folder.recent → up to 6 [{path, display, name, lastAt, hue key}] from session.open rows, deduped by realpath, missing dropped, newest first"
      - "status/hello says whether folder.choose is offered (drives the no-chooser state)"
      - "index.html:72-77 → role=dialog aria-modal aria-labelledby, h2 title; app.ts:3055-3064 keeps the sheet open until session.open answers"
      - "Aegis reviews folder.choose and folder.check (a page can learn whether a path exists; it is already the authenticated GUI)"
      - "rendered at 1024 and 1440, day and night, with 0, 1, 6 recents, a 60-character name and a 110-character path; atelier check clean"
    from: { session: 2026-10-23-gnomon-folder-picker, by: Mika, founder_words: "we need a folder picker because writing out a path is bad UX", contested: [C1, C2, C3, C4] }

rules:
  - id: paths-are-chosen
    rule: "A folder or file on this Mac is chosen, not typed: recent choices first, then the Mac's own chooser; a typed path is an Advanced fallback, open by default only when no chooser exists. Every choice is checked by the kernel before the key that uses it is enabled."
    from: { session: 2026-10-23-gnomon-folder-picker }

content:
  vocabulary:
    use:
      folder: "where a session works (the session.open cwd), in UI copy; 'cwd' stays in the wire, the CLI and logs"
      recent folders: "the folders past sessions opened in, newest first"
    retired:
      cwd: "'folder' in GUI copy (index.html:74)"

migration:
  - { batch: folder-field, status: pending, from: "New session 'cwd' text field (placeholder /absolute/path/to/project)", to: "folder-field recents; label 'folder'; Open pri; sheet stays open until session.open answers", uses: 1, files: ["packages/gnomon-gui/static/index.html:72-77", "packages/gnomon-gui/src/ui/app.ts:3050-3064,1419-1436", "packages/gnomon-gui/src/ui/model-picker.ts:59,85", "packages/gnomon-gui/src/core/launch.ts:92-108"] }
  - { batch: folder-field, status: pending, from: "Local model 'use another runner (optional)' text field (placeholder /Users/you/code/gnomon-local/dist)", to: "folder-field compact; expect cli.js", uses: 1, files: ["packages/gnomon-gui/src/core/local-model.ts:44-46,383", "packages/gnomon-gui/src/ui/settings-sheet.ts:88"] }
  - { batch: folder-field, status: pending, from: "Mods 'Add from folder' text field (placeholder /Users/you/code/my-mod)", to: "folder-field compact; expect gnomon-manifest.json; Add disabled with its reason until checked", uses: 1, files: ["packages/gnomon-gui/src/ui/mods-panel.ts:163-165"] }
  - { batch: folder-field, status: pending, from: "Mods Configure 'command (an absolute path)' text field", to: "folder-field file variant (Choose file…)", uses: 1, files: ["packages/gnomon-gui/src/ui/mods-panel.ts:89"] }

# ── Key height (founder, 2026-10-23: "we have inconsistent button heights") ────────────────────────────────────────
# Cause, measured in the real styles.css (refs/folder-picker.html board K, shots/keys-before-after-*.png):
#   .key and .key.pri are 28px (padding 4 10 + line 18 + 2 edge, min-height 28, styles.css:171-182);
#   .key.quiet is 24px (padding 2 8, min-height 24, styles.css:248), and so is every key built on it: summary keys
#   (Advanced ▸), seg keys, Type a path ▸, cancel, and the chat-header ✎ / run mode / ⋯ / composer ⤢ (1011, 1019, 1030).
#   By day the default and pri keys also draw a 2px offset shadow outside the box, so beside a quiet key they read
#   30 against 24. Size was being used to mean "secondary"; the system already says that with the look (no offset, --ink2).
foundations:
  target:
    key-h: 28            # NEW token --key-h: the one height of every key, any variant, any zone
    header-control: 28   # = key-h (unchanged)
    min: 24              # stays the WCAG 2.5.8 floor for pointer targets; no longer a key size
    amended_by: { session: 2026-10-23-gnomon-folder-picker, what: "key-h 28 is the one key height; 24 is only the floor" }
components:
  key:
    sizes: { all: { height: "var(--key-h) 28", font: 11.5 } }   # replaces header / row / quiet sizes
    build: "height from min-height: var(--key-h) with inline-flex centring (padding 0 10, quiet 0 8), not from padding + line-height, so glyph labels (✎ ⋯ ⤢ ▸) and words land on the same box. The day offset shadow stays outside the layout box."
    variants: { quiet: "no offset, --ink2, same height as every key (was: 24px min)" }
migration:
  - { batch: key-height, status: pending, from: ".key height from padding 4 10 + line-height 18", to: ":root --key-h 28px; .key inline-flex, align-items centre, min-height var(--key-h), padding 0 10", uses: "every key (~70 call sites)", files: ["packages/gnomon-gui/static/styles.css:109-131 (:root token)", "packages/gnomon-gui/static/styles.css:171-182"] }
  - { batch: key-height, status: pending, from: ".key.quiet min-height 24, padding 2 8 (Type a path, cancel, close, done, Advanced ▸ summaries, seg keys, pile-more, lt-fold, lp-back)", to: "min-height var(--key-h), min-width var(--key-h), padding 0 8", uses: 19, files: ["packages/gnomon-gui/static/styles.css:248", "packages/gnomon-gui/static/styles.css:1290 (.sf-adv summary inherits)"] }
  - { batch: key-height, status: pending, from: "chat-header small keys at 24 (✎ rename, run mode ▾, stack filter) and the 24px rename input beside them", to: "var(--key-h); the chat header row grows 4px", uses: 4, files: ["packages/gnomon-gui/static/styles.css:1011", "packages/gnomon-gui/static/styles.css:1013"] }
  - { batch: key-height, status: pending, from: ".more-btn padding 2 8 line-height 1; .composer-tall padding 2 8 line-height 1.4 (24px beside the 28px send)", to: "padding 0 8; height from the token", uses: 2, files: ["packages/gnomon-gui/static/styles.css:1019", "packages/gnomon-gui/static/styles.css:1030"] }
  - { batch: key-height, status: pending, from: ".composer-ctrls .key.pri min-height 24 padding 4 10", to: "min-height var(--key-h), padding 0 10", uses: 1, files: ["packages/gnomon-gui/static/styles.css:1040"] }
  - { batch: key-height, status: pending, from: "fixed 28px restated per zone (.chrome .key, .menu-theme .seg-key)", to: "var(--key-h) (or drop: the base rule now gives it)", uses: 2, files: ["packages/gnomon-gui/static/styles.css:779", "packages/gnomon-gui/static/styles.css:802"] }
  - { batch: key-height, status: pending, from: "design-system.yaml components.key.sizes {header 28, row 28, quiet 24}; specimen key rows", to: "one size var(--key-h); regenerate specimen.html", uses: 1, files: [".atelier/systems/gnomon/design-system.yaml:185-213", ".atelier/systems/gnomon/specimen.html"] }
