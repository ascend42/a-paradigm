contested:
  - id: C1
    question: "Check the server before the card, or only after Allow?"
    options:
      - { id: check-first, label: "Check before the card", description: "A Check key (and Save runs it first) asks the kernel to probe the address without signing anything: a new read-only, loopback-only request. The card is raised only when the server answers and the model is there.", tradeoff: "kernel scope during the build; saves a card and a typed password per mistake" }
      - { id: check-after, label: "Check after Allow only", description: "No new kernel request. The probe runs once the signed config applies; a typo shows as '✕ no answer' and costs another card and password to fix.", tradeoff: "no kernel work; each wrong try costs a password" }
    recommended: check-first
    why: "Presence is a typed password for the founder; a typo in a model name should not cost one."
    decision: { kind: pick, choice: check-first, decided_by: creator, date: 2026-10-22 }
  - id: C2
    question: "Turning off: one press, or an inline confirm when loops use it?"
    options:
      - { id: confirm-when-used, label: "Confirm only when loops use it", description: "One inline confirm naming the loops that stop; no confirm when nothing depends on it." }
      - { id: one-press, label: "One press, always", description: "Notify-and-proceed in the GUI too; the result line and the toast name what stopped." }
    recommended: confirm-when-used
    decision: { kind: pick, choice: confirm-when-used, decided_by: creator, date: 2026-10-22 }
    why: "The kernel stays notify-and-proceed. The one GUI step exists because undoing a misclick costs a card and a typed password, and it appears only when loops would stop."
  - id: C3
    question: "Which family does a root configuration card (local.config; also daemon-stop, api-token) name in its head?"
    options:
      - { id: gnomon, label: "⊙ gnomon", description: "A new family for cards about Gnomon itself; ⊙ reads as a sundial's face and has no emoji form." }
      - { id: none, label: "No family", description: "Keep the head as it is for kernel cards until the mod and voice families land." }
    recommended: gnomon
    decision: { kind: pick, choice: gnomon, decided_by: creator, date: 2026-10-22 }
    why: "Rule family-by-glyph-and-word says every card names what it relates to; these cards relate to Gnomon, not a session or a loop. A taste call: Luna or the founder."

system_proposal:
  target: .atelier/systems/gnomon/design-system.yaml
  status: applied 2026-10-22 to .atelier/systems/gnomon/design-system.yaml and DESIGN.md (founder approved the design and C1-C3)
  add:
    components:
      settings-form:
        role: "A form that opens inline under its row in a sheet (Settings, Mods) and asks the kernel for a change. Labelled fields, one key that names its cost, cancel. When the change raises a card, the row shows the request in place and offers Decide in the stack, because toasts and the stack are hidden under an overlay. Codifies the shipped Mods Configure form (.mod-config/.mod-field) and the Voice sheet's inline flow (.vs-flow)."
        anatomy: ["lead line (11.5 --ink2)", "fields: label (10.5 --sec) over control (.field or .seg) over note (10.5 --sec)", "Advanced (a quiet key on a <summary>) for rarely needed fields", "keys: the cost-label pri key + quiet cancel; a disabled key says why beside it", "foot note: what happens after the key", "request line after submit: plain chip 'card waiting' + what was asked + quiet key Decide in the stack", "result line: role=status; a refusal in --fail with CODE, reason and next:"]
        states: [closed, open, invalid, submitting, card-waiting, denied, expired, refused, applied]
        tokens:
          rule: "2px solid --ink at the left, padding-left 12 (as .vs-flow)"
          gap: "10 between fields, 2 between label, control and note"
          label: "10.5 --sec"
          control: "11.5, min-height 28; width by content: address 34ch, name 16ch, model and paths min(100%, 60ch)"
          note: "10.5 --sec"
          invalid: "aria-invalid, 2px --fail-edge, message 10.5 600 --fail starting with ✕, linked by aria-describedby; replaces the note"
          request-chip: "chip (plain): a waiting card is not a warning"
          result: "10.5 --ink2, the outcome word in 600"
        behaviour: ["Enter in a field presses the key", "Esc closes the form before the sheet; entries are kept until the sheet closes", "on submit with errors, focus moves to the first invalid field", "on submit, focus moves to the request line's key", "Decide in the stack closes the sheet and focuses the card group, never its Allow", "one request at a time: the form is replaced by the request line while a card waits", "denied or expired brings the form back with the entries and a 'Not changed' line", "every press is a trusted user event (G-GUI-04)"]
        row_kinds: "SettingRow gains kind 'form' (closed: a key; open: the form) and kind 'request' (the card-waiting line). Neither runs through SETTINGS_RUNS; like 'revoke', each is a kind of its own with its own press path."
        never: ["a modal over a sheet (rule teach-inline)", "a toast as the only sign the request went out (toasts are hidden under overlays)", "an amber chip for a waiting card", "a placeholder that looks like a value"]
        source: ".atelier/sessions/2026-10-22-gnomon-local-model/refs/local-model.html (classes .set-form .sf-*); shipped precedent packages/gnomon-gui/src/ui/mods-panel.ts:80-95"
        from: { session: 2026-10-22-gnomon-local-model, by: Mika, decided_by: creator }
    card:
      family: { gnomon: "⊙ gnomon (root configuration cards: local.config, daemon-stop, api-token). Contested C3." }
      variant: { local-config: "kind grant, detail.action local.config; kernel-composed title 'Set up the local model' | 'Change the local model'; signed lines one per field through rootRowLine(gnomon-root-local:v1), changed lines with the loop-diff marks; presence line; hand only · root key" }
    alert:
      variant: { refused-start: "a loop whose trigger fired but which refused to start (no-local-model): '■ <id> didn’t start', path 'no local model · scheduled hh:mm · refused before any step · ×n since <day>', quiet keys Set up local model… and Dismiss; one per loop, deduped; clears when the cause clears" }
    loop-detail:
      anatomy_add: "start-refusal line between the meta and the graph: ✕ can’t start · <code> (600 --ink), the kernel's reason in words, one key to the fix; key-edge box, no fill colour"
    sheet:
      section_focused: "open(section) scrolls to the section, focuses its heading (tabindex -1), draws a 2px --key-edge rule at its left until focus leaves; close returns focus to the opener"
      section_owner: "a section the kernel owns says '· kernel-owned' once in its heading, and its rows drop the per-row suffix"
    content:
      vocabulary:
        local model: "a model server on this Mac that sessions and loops can use instead of Claude (8.0: loopback only)"
        card waiting: "a request whose card is in the stack (plain chip)"
        presence: "amended: fresh Touch ID, or the Mac password where Touch ID is unavailable; long copy says 'Touch ID or your Mac password', keys say 'presence'"
    rules:
      - id: form-says-where-the-card-is
        rule: "A form whose submit raises a card names the cost in its key ('Save · root card'), shows the request in place, and offers Decide in the stack; it never relies on a toast while an overlay is open."
      - id: no-password-for-a-typo
        rule: "Anything the page or the kernel can check without signing is checked before a card that needs presence is raised (C1: check-first)."
    migration:
      - { batch: settings-form, from: ".mod-config / .mod-field and 'Ask for the change' in the Mods sheet", to: "settings-form classes and anatomy; key 'Save · card' names its cost", files: ["packages/gnomon-gui/src/ui/mods-panel.ts:85-95", "packages/gnomon-gui/static/styles.css:1072-1077"] }
      - { batch: settings-form, from: "Mods 'card waiting' chips drawn as chip warn", to: "chip (plain)", files: ["packages/gnomon-gui/src/ui/mods-panel.ts:80-82"] }
      - { batch: keys, from: ".key.pri[disabled]: --sec text on the ink fill", to: "sheet fill, --rule edge, --sec text (as .seg-key[disabled])", files: ["packages/gnomon-gui/static/styles.css:183,192"] }

build_requirements:
  - "core/render.ts rootRowLine: a case on schemaVersion 'gnomon-root-local:v1' rendering every signed field; null on anything it can't render (no Allow)"
  - "core/settings.ts: SectionId 'local-model' between voice and permissions; row kinds 'form' and 'request'; values from status.local only"
  - "ui/settings-sheet.ts: open(section?) (section-focused); Esc closes an open form first; a press path for request.local.config and the remove request outside SETTINGS_RUNS, trusted events only"
  - "commands: palette local.setup → settings.open at local-model"
  - "loops: the start-refusal line maps the kernel's why, never infers it; the refused-start alert needs the kernel to log a refused fire"
  - "test at 1024 and 1440, day and night, with 0, 1 and 2 endpoints, a 52-character model id and a 90-character runner path"

decisions:
  - { what: "the Local model design (refs/local-model.html)", choice: approved, decided_by: creator, date: 2026-10-22 }
  - { contested: C1, choice: check-first, decided_by: creator, note: "needs a read-only, loopback-only kernel probe request before the card (kernel work for the builder)" }
  - { contested: C2, choice: confirm-when-used, decided_by: creator }
  - { contested: C3, choice: gnomon, decided_by: creator, note: "⊙ gnomon family for root configuration cards" }
