known:
  - fact: "local config is root-signed (local.signed.json, schema gnomon-root-local:v1); a set raises a grant card (detail.action local.config); remove is notify-and-proceed"
    evidence: TD-2026-10-22-769; packages/gnomon/src/kernel/local/config.ts:15-34
  - fact: "an endpoint is {id, base, model, compat, surface?, textTools?, loops?}; compat is one of llama.cpp, ollama, lm-studio, vllm, mlx-lm; up to 16 endpoints"
    evidence: packages/gnomon/src/kernel/local/config.ts:45-75,131
  - fact: "probe yields ok, model, tools, nCtx (+source), error; routing reasons no-endpoint, probe-failed, no-tools, ctx-unknown, ctx-below-floor, no-runner"
    evidence: packages/gnomon/src/kernel/local/probe.ts; routing.ts:26-40
  - fact: "no-local-model has three kernel whys: none marked loops:true, none matches the profile, no runner pinned"
    evidence: packages/gnomon/src/kernel/loops/runner.ts:108,443,487-488
  - fact: "toasts are hidden while any overlay is open, and the stack sits under the scrim"
    evidence: design-system.yaml zones.overlays.never; zones.toasts.overflow
  - fact: "the Mods sheet already ships a form that raises a card: inline Configure (.mod-config/.mod-field), 'Ask for the change', 'decide in the stack'"
    evidence: packages/gnomon-gui/src/ui/mods-panel.ts:80-95; styles.css:1072-1077
  - fact: "a root-capable card shows no Allow unless every signed row renders (rootRowLine, fail closed); gnomon-root-local:v1 has no case yet"
    evidence: packages/gnomon-gui/src/core/render.ts:531-560,569-597,794-799
  - fact: "the Settings sheet's charter is 'existing GUI commands only, no new kernel verb' (SETTINGS_RUNS); open() takes no section"
    evidence: packages/gnomon-gui/src/core/settings.ts:7-10,82-99; ui/settings-sheet.ts:83-89
  - fact: "Touch ID fails for the founder: presence is the typed Mac password"
    evidence: founder memory user_touchid_password
assumed:
  - claim: "status.local will carry endpoints, runner, config version and signer, the last probe and the last fallback, and an unsupported:'platform' flag on Windows"
    check: "Arky / the builder confirm the status.local shape before the GUI build"
  - claim: "the founder sets one endpoint from the GUI; more than one comes only from the CLI"
    check: "field run: does he ever add a second server?"

findings_on_the_sketch:
  - id: F1
    cost: high
    what: "Submitting shows a toast. While the Settings sheet is open toasts are hidden and the stack is under the scrim, so the founder sees nothing and can't reach the card."
    rule: "zones.overlays.never (toasts); functional-states-say-what-happened"
    fix: "the section shows 'card waiting' in place with a Decide in the stack key that closes the sheet and focuses the card (not its Allow), as the Mods sheet does"
  - id: F2
    cost: high
    what: "A wrong model name or a stopped server is found only after Allow, so each mistake costs another card and another typed password."
    rule: "in-between-states-designed; friction-log-walkthrough"
    fix: "check the server before the card (contested C1); in any case the page validates scheme, loopback host, port and a model name on Save, before any card"
  - id: F3
    cost: high
    what: "No rootRowLine case for gnomon-root-local:v1: the card would render 'This card does not show what its approval signs' and no Allow."
    rule: "Aegis C1e (render.ts:794-799)"
    fix: "add the case; one line per signed field (config version, each endpoint, model and loops, runner pin); return null on any field it can't render"
  - id: F4
    cost: medium
    what: "A scheduled loop refused with no-local-model at 02:00 is visible only in its detail, which nobody opens; it fails silently."
    rule: "stuck-to-stack-done-to-toast"
    fix: "a stack alert per loop ('■ evening-tidy didn't start'), deduped with a count, cleared when a local model is set; the row joins needs you"
  - id: F5
    cost: medium
    what: "The Settings sheet has no section-focused open (settings-sheet.ts open() takes no argument), though the system lists the state."
    rule: "sheet.states section-focused"
    fix: "open(section?) scrolls to the section and focuses its heading (tabindex -1); a 2px key-edge rule until focus leaves; close returns focus to the opener"
  - id: F6
    cost: medium
    what: "A free-text endpoint id and a free toggle for loops; the id means nothing to the founder and the toggle reads as on/off by fill."
    rule: "copy: say what to do; status-in-ink"
    fix: "id moves under Advanced with a default from the server ('ollama'); loops becomes a two-word seg 'Sessions and loops | Sessions only'"
  - id: F7
    cost: medium
    what: "The form would replace the whole signed config; an endpoint added from the CLI would be dropped."
    rule: "stress-with-real-content (1, 2, 16 endpoints)"
    fix: "the form edits one endpoint by id; others are listed read-only and appear 'unchanged' on the card"
  - id: F8
    cost: low
    what: "Seven read-only rows each carry '· kernel-owned', which drowns the values."
    rule: "group-by-space-before-boxes"
    fix: "the section heading carries '· kernel-owned' once; rows grouped by space: what (endpoint, model, used by) · health (check, last fallback) · provenance (runner, signed)"
  - id: F9
    cost: low
    what: "Copy says 'Touch ID' everywhere; for the founder presence is his Mac password."
    rule: "content.vocabulary presence"
    fix: "long copy says 'your presence: Touch ID or your Mac password'; key labels keep the one word 'presence'"
  - id: F10
    cost: low
    what: "Existing, seen in the render: a disabled .key.pri (Run now, busy Allow) draws --sec text on the ink fill, about 2.6:1 by day, so its label is near-unreadable."
    rule: "functional-states-say-what-happened (disabled says why); exempt from 1.4.3 but still must read"
    fix: "migration: .key.pri[disabled] draws as a default key with --sec text (sheet fill, --rule edge), as .seg-key[disabled] does (styles.css:924)"

state_diagram: |
  not offered ─(kernel update)→ none
  windows (terminal; no key)
  none ─Set up…→ form ─Save (page invalid)→ form+errors ─fix→ form
                      ─Save (kernel refusal)→ form+refusal line
                      ─Save→ card waiting ─Deny/expire→ form (entries kept, 'Not changed' line)
                                          ─Allow→ waiting presence ─sign→ set·checking ─→ set·ok | set·check failed
                      ─cancel/Esc→ none (entries kept until the sheet closes)
  set·* ─Change…→ change form (Save disabled 'no change' until edited) ─Save→ card waiting …
  set·failed ─Check again→ set·checking
  set·* ─Turn off→ (loops use it) confirm ─Turn off→ turning off → none + 'Turned off' line
                   (no loop uses it) turning off → none
  interrupted: sheet closed while card waiting → card stays in the stack; reopening shows 'card waiting'
               sheet closed with form open → entries dropped; nothing sent
               kernel restarts while card waiting → card expires cancelled; section shows 'Not changed: the card expired'

