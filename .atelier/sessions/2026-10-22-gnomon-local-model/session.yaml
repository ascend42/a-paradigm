id: 2026-10-22-gnomon-local-model
verb: propose
scope: "Guided local-model setup for Gnomon (TD-2026-10-22-769): a Local model section in the Settings sheet, its form, the
  root card for gnomon-root-local:v1, the turn-off path, and how a loop refused with no-local-model sends you there."
product: gnomon
system: .atelier/systems/gnomon/
depth: focused
surface: desktop GUI (Settings sheet overlay, stack, Loops leaf)
mode: extend
change: add
by: Mika (design engineer), over Arky's sketch
read: "One operator, on his own Mac, sets up a loopback model server once, then mostly forgets it. Calm, exact, says what
  each press costs; the password is the expensive step, so no press should waste one."
started: 2026-10-22 23:30:00+00:00
reference: refs/local-model.html
