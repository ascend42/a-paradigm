verdict_scope: "This review shows the flow holds up against the heuristics and the system. It doesn't show the founder can finish setup at the field run. Cheapest check: before the run, give him the built section with Ollama stopped and a misspelled model, and watch him get from 'none set up' to '✓ answers' without help, counting password prompts."
