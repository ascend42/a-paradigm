version: 1
read: "The control room for an agent armada's source control: you and a dev team check in a few times a day to make the calls machines can't; calm, exact, a dark loom register where violet only ever means 'git is blind here'."
source_of_truth: "docs/specs/warpline-design-system.md (tokens, type, components, the three system rules) is preserved as-is; this file records console decisions on top of it."
dials: { layout: 3, motion: 4, density: 7, from: { session: 2026-10-14-warpline-console, board: intent-dials } }
hierarchy:
  levels: [org-dashboard, repo]
  org: "repo cards with visibility, activity and needs-you counts; cross-repo needs-you list"
  repo_tabs: [Inbox, Floor, Code, Offers, Tapestry, Runs, Releases, Fleet, Settings]
  scope: v1
  from: { session: 2026-10-14-warpline-console, board: repos-and-nav, note: "too generic of a style ... form and function i like so we can go with it for v1" }
structure:
  home: inbox
  nav: [Inbox, Floor, Offers, Tapestry, Symbols, Fleet, Calibration]
  live_band: { placement: above-inbox, sizes: [hidden, compact, expanded], default: compact }
  floor: { section: true, same_motion_rule: true }
  from: { session: 2026-10-14-warpline-console, board: console-structure }
rules:
  - id: motion-on-events-only
    rule: "Live surfaces (band, Floor) move only when a pick is admitted, a KNOT forms, or a KNOT is resolved; no idle or ambient animation. Reduced motion: final state, no travel."
    from: { session: 2026-10-14-warpline-console, board: console-structure, note: "only reall animate when changes come in and they get rectified" }
  - id: live-band-resizable
    rule: "The live band can be hidden, compact, or expanded (labelled lanes); the choice persists per viewer."
    from: { session: 2026-10-14-warpline-console, board: console-structure, note: "maybe ways to makek the live larger or smaller" }
  - id: decide-in-split-view
    rule: "Decisions open in a split view: the ranked queue stays on the left, the selected KNOT or HELD item on the right; sealing advances to the next open item."
    from: { session: 2026-10-14-warpline-console, board: decision-surface }
  - id: roles-by-domain
    rule: "Owner decides everything incl. gate/auth contracts; Developer decides KNOTs only in domains they own, others read-only with a stated reason; Observer is read-only; agents never sign in to the console (MCP/CLI only, visible on the Floor). Every decision requires a human key."
    from: { session: 2026-10-14-warpline-console, board: access }
  - id: one-meaning-per-hue
    rule: "No new hue for human states. HELD = linen-50 outline + human mark; human principal = filled linen chip with mark; agent principal = outlined linen-400 chip. Amber stays branch A, teal branch B, violet git-blind conflict."
    from: { session: 2026-10-14-warpline-console, board: human-states }
  - id: density-control-room
    rule: "Card padding 10x14, row gap 6, tally padding 10x14, main padding 18x20 (all on the 4px scale)."
    from: { session: 2026-10-14-warpline-console, board: intent-dials }
preserve:
  - { what: system-rules, value: "seam violet only where git is blind; restraint is the default; no count animation (warpline-design-system.md:19-32)" }
  - { what: tokens, value: "ink/linen/warp/weft/seam/clean/cut + Fraunces/Inter/JetBrains Mono" }
  - { what: nomenclature, value: "PICK, WEAVE, KNOT, DECIDE, SELVAGE, TAPESTRY, OFFER, ENDORSEMENT (warpline-flows.md section 1)" }
  - { what: api-routes, value: "/api/warpline/* and WS warpline:* events" }
decisions:
  - session: 2026-10-14-warpline-console
    board: console-structure
    choice: { home: inbox-first, live: "band + Floor section" }
  - { session: 2026-10-14-warpline-console, board: decision-surface, choice: split }
  - { session: 2026-10-14-warpline-console, board: access, choice: roles-by-domain }
  - { session: 2026-10-14-warpline-console, board: intent-dials, choice: control-room }
  - { session: 2026-10-14-warpline-console, board: human-states, choice: neutral-mark }
  - { session: 2026-10-14-warpline-console, board: repos-and-nav, choice: two-levels, scope: v1 }

gnomon:
  read: "An instrument for one operator running an armada: glanced at many times a day in the Claude Code band, opened a few times a day to decide; exact, calm, quietly beautiful, a made object that reads a larger order."
  world:
    choice: shadow-instrument
    rules:
      - "One raking light from the top left; surfaces carry a hard cast shadow as material, never as a state signal (Mika)"
      - "The light edge on a surface is the gnomon's line: linen, never a hue"
      - "Progress reads as a shadow sweeping a dial"
      - "Warpline surfaces keep the loom (threads, selvage); Constellation views keep the sky; both sit under the one light"
    from: { session: 2026-10-15-gnomon-aesthetic, board: world }
  style:
    choice: "light = papercraft (cut-paper sheets, grain, ink lines, folded paper caps, pressable ink keys); dark = phosphor terminal (mono, glow, bracketed keys, glyph caps); optional automatic day/night swap"
    supersedes: { board: world, choice: shadow-instrument }
    overrides:
      - { tell: default-warm-paper, scope: "light mode", reason: "creator wants a papercraft feel", from: { session: 2026-10-15-gnomon-aesthetic, board: style } }
    from: { session: 2026-10-15-gnomon-aesthetic, board: style }
  colour:
    choice: pigment-set
    tokens:
      day:   { ground: "#EDE8DC", sheet: "#F8F5EE", ink: "#16150F", ink2: "#2A2925", sec: "#5A5850", rule: "#D9D5CB", fold: "#E1DBCC" }
      night: { ground: "#0F1116", sheet: "#171A21", ink: "#E8F4F0", ink2: "#C9DCD6", sec: "#86998F", rule: "#2A2F38", fold: "#23262E" }
      project:   # fill (caps, edges, swatches) / ink (any text in that hue) / night (phosphor; fill and text)
        terracotta: { fill: "#C08A73", ink: "#8E4E38", night: "#E6A88F" }
        sage:       { fill: "#9DAF8C", ink: "#56663F", night: "#B7CCA3" }
        slate:      { fill: "#8C9DBB", ink: "#44577C", night: "#A9B9DB" }
        ochre:      { fill: "#D2B074", ink: "#7A5A1C", night: "#E8C88C" }
        rose-clay:  { fill: "#C9949A", ink: "#874B54", night: "#E4AEB4" }
        sea-grey:   { fill: "#8FB0AE", ink: "#3F6664", night: "#A8CFCB" }
      semantic:
        failure: { day: "#B4382A", night: "#FF7A66" }
        warning: { edge: { day: "#C98A12", night: "#FFC15A" }, ink: { day: "#6E4700", night: "#FFC15A" }, bg: { day: "#F6E3B8", night: "rgba(255,193,90,.10)" } }
        knot:    { day: "#5B4FD6", night: "#A79CFF" }
    rules:
      - "Project hue fills never carry text; any text in a project hue uses its ink pair (>= 5.1:1 on sheet and ground); night hues pass as text (>= 8.6:1)"
      - "Caps and swatches always keep a 1px ink edge, so a fill (2-2.7:1 on paper) is never the only boundary (WCAG 1.4.11)"
      - "Failure = vermilion, only for failed sessions/runs; warning amber = warnings, held voice countdowns and the GATE-armed indicator; violet = KNOT only; no other saturated colour"
      - "A project hue is identity, never state: state is carried by edge colour from the semantic set plus a word"
    from: { session: 2026-10-15-gnomon-aesthetic, board: colour, ref: refs/colour.html }
  type:
    choice: mono-spine
    tokens:
      mono: "JetBrains Mono (400/500/600)"
      display: "Fraunces opsz 9..144 (460/600), day mode only"
    rules:
      - "JetBrains Mono sets all UI and body text in both modes, the same mono as Warpline (one mono across the suite); Inter is not used in Gnomon"
      - "Fraunces appears only on the wordmark and page/section titles in day mode; at night titles are mono, uppercase, letter-spacing .08em"
      - "Long-form text in mono (agent replies, card bodies): 13.5px, line-height 1.6, measure <= 80ch (Mika: mono body needs the extra leading)"
      - "Timestamps, durations, handles and meta lines are mono at 11-11.5px in the secondary ink"
    from: { session: 2026-10-15-gnomon-aesthetic, board: type, ref: refs/type.html }
  motion:
    choice: lively-workshop
    tokens:
      card-in: "spring flutter 550ms cubic-bezier(.3,.7,.3,1): in from the right at 12deg, overshoot -5%/-3deg, settle at a random +-1.5deg"
      card-decide: "stamp scales 1.9 -> .92 -> 1 (400ms, cubic-bezier(.3,1.4,.5,1)), then the card dips to .97 and flies off up-left at -14deg (450ms)"
      card-fail: "droop: rotate 2.2deg + 3px down (500ms ease-out) while the edge turns vermilion; never a shake"
      cap-walk: "900ms step-bob path from Working to Needs you"
      cap-stream: "bob 1.1s ease-in-out, only while the session streams"
    rules:
      - "Motion still fires only on events (a card arrives, is decided, fails; a cap changes lanes; a session streams); nothing idles"
      - "Voice-held cards show the 3s countdown bar first; the stamp plays only after the hold commits, never during it"
      - "Reduced motion (OS setting or in-app): every transition is instant; the stamp shows without scaling"
      - "Stack reflow uses 220ms top transitions so the pile closes up without jumps"
    from: { session: 2026-10-15-gnomon-aesthetic, board: motion, ref: refs/motion.html }
  cli-voice:
    choice: instrument-readout
    rules:
      - "Aligned two-column readouts: lowercase label column, value column; numbers before nouns ('4 running'); items joined with ' · '"
      - "Marks: ✓ ok, ✕ refused/failed, ◆ KNOT; no emoji, no exclamation marks, no 'Oops'"
      - "Colour only for semantics (vermilion fail, amber warn, violet KNOT); output stays readable with NO_COLOR"
      - "Every refusal prints the refusal code in caps, the reason in plain words, then an indented 'next:' line from refusal:v1.next[]"
      - "Durations as '2m 14s', clock times as '14:02'; thin-space thousands ('1 204')"
    example: |
      $ gnomon status
      sessions  4 running · 1 failed · 2 need you
      cards     permission ×1 · knot ×1
      voice     armed · reversible · 41:10 left
      ✓ kernel 8.0.0-dev · log verified (1 204 events)
    from: { session: 2026-10-15-gnomon-aesthetic, board: cli-voice }
  layout:
    choice: desk
    structure:
      header: "wordmark · command palette (⌘K) · kernel-owned voice-armed indicator with Disarm · ⊞ Layout presets"
      left: "sessions: + New (⌘N), Active grouped with project swatch + state note (needs you / failed / streaming), Past collapsed"
      centre: "the chat: per-message timestamps, 'took Ns' durations, collapsible activity history; that project's pending cards pinned above the composer"
      right: "global decision stack as a paper pile, sorted by urgency; hover fans it out to compare and pick which to hit first"
      footer: "Workshop mod: Needs you | Working caps"
    rules:
      - "Every panel (sidebar, stack rail, Workshop) can be hidden or moved via ⊞ Layout; the choice persists per viewer"
      - "A card appears both in the global stack and pinned in its own session's chat; deciding it in either place removes it from both"
      - "Kernel-owned regions (voice-armed indicator, handle words, held countdown) cannot be hidden by any layout preset"
    from: { session: 2026-10-15-gnomon-aesthetic, board: decision-stack-and-sidebar, ref: refs/layout.html, note: "desk is totally it" }
