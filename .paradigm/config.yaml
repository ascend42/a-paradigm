# Paradigm Configuration
# Source of truth for AI-assisted development in this project

version: "2.0"
project: "a-paradigm"

# Discipline - determines symbol mappings, scan patterns, and purpose-required paths
# Options: web, backend, fullstack, api, cli, ml, mobile, game, embedded, devops, data, library, monorepo, custom
# See specs/disciplines.md for symbol interpretations per discipline
discipline: monorepo

# Agent Provider - which backend to use for multi-agent orchestration
# Options: auto, claude, claude-code, cursor-cli, claude-cli, manual
# - auto: Auto-detect best available (default)
# - claude: Anthropic API (requires ANTHROPIC_API_KEY)
# - claude-code: Claude Code Task tool (works with Max subscription)
# - cursor-cli: Cursor agent CLI (auto-detected in Cursor IDE)
# - claude-cli: Spawn claude CLI processes (works with Max subscription)
# - manual: File-based handoffs (always works, requires manual execution)
agent-provider: auto

# Guidelines for AI agents working in this codebase
agent-guidelines:
  overview: |
    This project uses Paradigm v2 for structured AI-assisted development.
    All context, symbols, and specifications live in the .paradigm/ directory.

    v2 uses 5 operational symbols (#, $, ^, !, ~) plus a tag bank for classification.

  how-to-use:
    - "Check .paradigm/specs/ for philosophy and patterns before making changes"
    - "Reference symbols using prefixes: #component $flow ^gate !signal ~aspect"
    - "Use tags for classification: [feature], [integration], [state], [idea]"
    - "Use the Paradigm logger instead of raw console.log/print statements"
    - "Aspects (~) MUST have code anchors - no unanchored aspects allowed"
    - "Run `paradigm probe` with screenshots to map UI to code"
    - "Check .paradigm/docs/ for command reference and troubleshooting"
    - "Read .index.yaml files first when navigating documentation"
    - "Use `paradigm team handoff` when approaching context limits"

  update-rules:
    - "When adding a feature, create/update .purpose with #name and tags: [feature]"
    - "When adding authorization, update portal.yaml with ^gate"
    - "When adding cross-cutting rules, create ~aspect with required anchors"
    - "When exploring ideas, add [idea] tag to the symbol"
    - "Always update references when renaming symbols"

# Symbol system v2 - the shared language between code and AI
# Uses 5 operational symbols plus a tag bank for classification
symbol-system:
  "#":
    name: Component
    description: Any documented code unit (function, class, module, service)
    examples: ["#PaymentService", "#login-handler", "#Button"]
  "$":
    name: Flow
    description: Multi-step processes with defined sequence
    examples: ["$checkout-flow", "$onboarding", "$auth-flow"]
  "^":
    name: Gate
    description: Authorization/validation checkpoints
    examples: ["^authenticated", "^admin-only", "^rate-limited"]
  "!":
    name: Signal
    description: Events emitted for side effects
    examples: ["!login-success", "!payment-failed", "!rate-limited"]
  "~":
    name: Aspect
    description: Rules/constraints with required code anchors
    examples: ["~audit-required", "~cached", "~encrypted"]

# Tag bank configuration
# Tags replace classification symbols (@feature, &integration, %state, ?idea)
tag-bank:
  # Path to tag definitions file
  file: tags.yaml

  # Core tags (always available)
  # See tags.yaml for full definitions
  core-tags:
    - feature      # User-facing functionality (was @)
    - integration  # External service connection (was &)
    - state        # Application state management (was %)
    - idea         # Proposed, not implemented (was ?)
    - deprecated   # Scheduled for removal
    - critical     # Major business impact
    - security     # Security-sensitive
    - compliance   # Regulatory requirement

  # Allow AI to suggest new tags (requires human approval)
  allow-suggestions: true

# Component types glossary — defines the project vocabulary for the `type` field on components
# Each type describes a structural role (what the code IS), not behavior (use tags for that)
component_types:
  command: "CLI command handler — registers subcommand, parses args, calls core logic"
  tool: "MCP tool definition + handler — serves AI agents via JSON-RPC"
  utility: "Shared helper function or module — no side effects, pure logic"
  engine: "Stateful processing core — owns data transformation lifecycle"
  loader: "Reads and parses data sources into typed structures"
  writer: "Writes structured data to files (YAML, JSON)"
  service: "Business logic coordinator — orchestrates tools, loaders, writers"
  model: "Data shape — TypeScript interface or type definition"
  view: "UI rendering unit — SwiftUI view, React component"
  provider: "Protocol-conforming platform capability wrapper — owns lifecycle"
  manager: "Stateful coordinator that owns child lifecycles"
  detector: "Observes external state and emits events"
  router: "Maps input signals to targets based on rules"
  filter: "Transforms or smooths data in a pipeline"
  store: "Persistent or reactive state container"
  handler: "Event handler, webhook receiver, or request processor"
  config: "Configuration, environment, constants"

# Logging configuration
logging:
  # Include logging rules in generated IDE instructions
  enforce: true

  # Default log level (debug, info, warn, error)
  default-level: debug

  # Map directory patterns to symbol types for logging (v2)
  # All code units use #component; gates, signals, flows, aspects use their symbols
  symbol-mapping:
    # All code directories use #component
    "features/**": "#"
    "routes/**": "#"
    "api/**": "#"
    "endpoints/**": "#"
    "commands/**": "#"
    "models/**": "#"
    "components/**": "#"
    "lib/**": "#"
    "utils/**": "#"
    "services/**": "#"
    "core/**": "#"
    "drivers/**": "#"
    "systems/**": "#"
    "integrations/**": "#"
    "external/**": "#"
    "vendors/**": "#"
    "stores/**": "#"
    "state/**": "#"
    "reducers/**": "#"
    "config/**": "#"

    # Gates (^)
    "middleware/**": "^"
    "auth/**": "^"
    "guards/**": "^"
    "policies/**": "^"

    # Signals (!)
    "events/**": "!"
    "handlers/**": "!"
    "listeners/**": "!"
    "hooks/**": "!"

    # Flows ($)
    "flows/**": "$"
    "sagas/**": "$"
    "workflows/**": "$"
    "pipelines/**": "$"

    # Aspects (~)
    "aspects/**": "~"
    "rules/**": "~"
    "constraints/**": "~"

# Probe configuration for visual discovery
probe:
  enabled: true
  auto-include: true

# Project states
states:
  user:
    authenticated:
      type: boolean
      default: false
      description: User is logged in
    role:
      type: enum
      values: [guest, user, admin]
      description: User access level
  app:
    loading:
      type: boolean
      default: false
      description: App is loading

# Where .purpose files should exist
# Customize these patterns for your project structure
purpose-required:
  - pattern: "src/*"
    depth: 1
  - pattern: "lib/*"
    depth: 1
  - pattern: "packages/*"
    depth: 1

# Custom symbols (extend the core set)
# custom-symbols:
#   "§":
#     name: "Domain"
#     description: "Domain-specific concepts"
#     examples: ["§patient", "§transaction"]

# Coding conventions
conventions:
  - "Use kebab-case for symbol IDs (#feature-name, not #featureName)"
  - "Use PascalCase for class-like components (#PaymentService, #UserProfile)"
  - "Document flows when logic spans 3+ components"
  - "Reference related items using symbol prefixes (# $ ^ ! ~) and tags"
  - "Add descriptions to all components and gates"
  - "Update .purpose files when changing behavior"
  - "Keep gates minimal - one responsibility per gate"
  - "Use signals for side effects, not direct mutations"
  - "Aspects (~) MUST have code anchors - no unanchored aspects"
  - "ALWAYS use Paradigm logger, NEVER raw console.log/print"

# AI agent context management
ai-agent:
  # Model being used
  model: claude-opus-4.6
  # Context window size in tokens
  context-window: 200000
  # Use `paradigm team handoff` for context continuity

# Documentation index settings
context:
  # Enable documentation indexing
  enabled: true
  # Index file name
  index-file: .index.yaml
  # Root documentation directory
  docs-path: docs/
workspace: "../.paradigm-workspace"

