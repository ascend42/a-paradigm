# Paradigm Configuration
# Source of truth for AI-assisted development in this project

version: "1.0"
project: "a-paradigm"

# Discipline (optional) - helps AI understand your domain
# Options: web, backend, ml, mobile, game, embedded, devops, custom
# See specs/disciplines.md for symbol interpretations per discipline
discipline: auto  # auto-detect from project structure

# Guidelines for AI agents working in this codebase
agent-guidelines:
  overview: |
    This project uses Paradigm for structured AI-assisted development.
    All context, symbols, and specifications live in the .paradigm/ directory.
  
  how-to-use:
    - "Check .paradigm/specs/ for philosophy and patterns before making changes"
    - "Reference symbols using prefixes: @feature #component ^portal !signal %state $flow"
    - "Use the Paradigm logger instead of raw console.log/print statements"
    - "Run `paradigm probe` with screenshots to map UI to code"
    - "Check .paradigm/docs/ for command reference and troubleshooting"
    - "Read .index.yaml files first when navigating documentation"
    - "Use Phoenix Protocol when approaching context limits"
  
  update-rules:
    - "When adding a feature, create/update the nearest .purpose file"
    - "When adding authorization, update portal.yaml"
    - "When exploring ideas, use ?symbol prefix"
    - "Always update references when renaming symbols"

# Symbol system - the shared language between code and AI
symbol-system:
  "@":
    name: Feature
    description: User-facing capabilities and functionality
    owner: purpose
    examples: ["@checkout", "@user-login", "@search"]
  "#":
    name: Component
    description: Reusable code units, UI components, or modules
    owner: purpose
    examples: ["#Button", "#api-client", "#AuthProvider"]
  "$":
    name: Flow
    description: Multi-step processes or user journeys
    owner: shared
    examples: ["$checkout-flow", "$onboarding", "$auth-flow"]
  "%":
    name: State
    description: Global or user state conditions
    owner: purpose
    examples: ["%user.authenticated", "%cart.items", "%app.loading"]
  "^":
    name: Portal
    description: Access control points and authorization rules
    owner: portal
    examples: ["^auth-required", "^admin-only", "^rate-limited"]
  "!":
    name: Signal
    description: Events, errors, and side effects
    owner: portal
    examples: ["!login-success", "!payment-failed", "!rate-limited"]
  "?":
    name: Idea
    description: Free-form exploration and future possibilities
    owner: premise
    examples: ["?subscription-model", "?ai-recommendations"]
  "~":
    name: Deprecated
    description: Features or components marked for removal
    owner: shared
    examples: ["~legacy-api", "~v1-auth", "~old-dashboard"]
  "&":
    name: Integration
    description: External services and third-party connections
    owner: shared
    examples: ["&stripe", "&supabase", "&resend", "&google-calendar"]

# Logging configuration
logging:
  # Include logging rules in generated IDE instructions
  enforce: true
  
  # Default log level (debug, info, warn, error)
  default-level: debug
  
  # Map directory patterns to symbol types for logging
  # These are generic patterns - customize for your project structure
  symbol-mapping:
    # Features/Capabilities (@)
    "features/**": "@"
    "routes/**": "@"
    "api/**": "@"
    "endpoints/**": "@"
    "commands/**": "@"
    "models/**": "@"        # ML models as features
    
    # Components/Building Blocks (#)
    "components/**": "#"
    "lib/**": "#"
    "utils/**": "#"
    "services/**": "#"
    "core/**": "#"
    "drivers/**": "#"       # Embedded
    "systems/**": "#"       # Game dev
    
    # Access Control (^)
    "middleware/**": "^"
    "auth/**": "^"
    "guards/**": "^"
    "policies/**": "^"
    
    # State (%)
    "stores/**": "%"
    "state/**": "%"
    "reducers/**": "%"
    "config/**": "%"
    
    # Events/Signals (!)
    "events/**": "!"
    "handlers/**": "!"
    "listeners/**": "!"
    "hooks/**": "!"
    
    # Flows/Processes ($)
    "flows/**": "$"
    "sagas/**": "$"
    "workflows/**": "$"
    "pipelines/**": "$"     # ML/Data pipelines
    
    # Integrations (&)
    "integrations/**": "&"
    "external/**": "&"
    "vendors/**": "&"

# Probe configuration for visual discovery
probe:
  enabled: true
  auto-include: true

# Project states
states:
  user:
    authenticated:
      type: boolean
      default: false
      description: User is logged in
    role:
      type: enum
      values: [guest, user, admin]
      description: User access level
  app:
    loading:
      type: boolean
      default: false
      description: App is loading

# Where .purpose files should exist
# Customize these patterns for your project structure
purpose-required:
  - pattern: "src/*"
    depth: 1
  - pattern: "lib/*"
    depth: 1
  - pattern: "packages/*"
    depth: 1

# Custom symbols (extend the core set)
# custom-symbols:
#   "§": 
#     name: "Domain"
#     description: "Domain-specific concepts"
#     examples: ["§patient", "§transaction"]

# Coding conventions
conventions:
  - "Use kebab-case for all symbol IDs (feature-name, not featureName)"
  - "Document flows when logic spans 3+ components"
  - "Reference related items using symbol prefixes (@ # $ % ~ ^ ! ?)"
  - "Add descriptions to all features and portals"
  - "Update .purpose files when changing feature behavior"
  - "Keep portals minimal - one responsibility per portal"
  - "Use signals for side effects, not direct state mutations"
  - "ALWAYS use Paradigm logger, NEVER raw console.log/print"

# AI agent context management (Phoenix Protocol)
ai-agent:
  # Model being used
  model: claude-opus-4.5
  # Context window size in tokens
  context-window: 200000
  # Threshold to trigger phoenix protocol (percentage)
  phoenix-threshold: 0.8
  # Where phoenix files are written
  phoenix-path: .context/phoenix.yaml

# Documentation index settings
context:
  # Enable documentation indexing
  enabled: true
  # Index file name
  index-file: .index.yaml
  # Root documentation directory
  docs-path: docs/
