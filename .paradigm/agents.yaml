version: 1.0.0
team:
  name: a-paradigm-team
  default_agent: architect
  require_handoff: false

# Orchestration configuration
orchestration:
  # Default mode for `paradigm team orchestrate`
  default_mode: faceted  # or 'solo'

  # Global budget for orchestrations
  budget:
    max_tokens: 500000      # Hard limit per orchestration
    max_cost_usd: 5.00      # Cost ceiling
    warn_at_percent: 80     # Warn orchestrator at 80% budget

  # Per-agent limits
  agent_limits:
    architect: { max_tokens: 100000 }
    security: { max_tokens: 100000 }
    builder: { max_tokens: 200000 }
    reviewer: { max_tokens: 50000 }
    tester: { max_tokens: 50000 }

# Agent (Facet) definitions
agents:
  architect:
    name: architect
    role: |-
      You design system architecture, write specifications, and plan features.
      You do NOT write implementation code - that's the Builder's job.
      When your spec is ready, hand off to Builder with 'paradigm team handoff --to builder'.
    focus:
      reads:
        - "@features"
        - $flows
        - specs/*.md
        - health.yaml
      writes:
        - specs/*.md
        - .purpose
    triggers:
      - type: keyword
        match:
          - design
          - architect
          - plan
          - spec
      - type: symbol
        match:
          - "@*"
          - $*
    handoff_to:
      - builder
      - reviewer
    # Facet configuration
    defaultModel: opus
    context:
      include:
        - specs/*.md
        - .purpose
        - "**/.purpose"
        - portal.yaml
        - .paradigm/config.yaml
      exclude:
        - src/**
        - tests/**
        - node_modules/**
    protocol:
      onFailure: pause
      requireApproval:
        - external_api

  builder:
    name: builder
    role: |-
      You implement code based on specifications from the Architect.
      Follow the spec exactly. If spec is unclear, hand back to Architect.
      When implementation is ready, hand off to Reviewer with 'paradigm team handoff --to reviewer'.
    focus:
      reads:
        - "#components"
        - specs/*.md
        - src/**
        - tests/**
      writes:
        - src/**
        - tests/**
    triggers:
      - type: keyword
        match:
          - implement
          - build
          - code
          - fix
      - type: handoff
        from: architect
    handoff_to:
      - reviewer
      - architect
    # Facet configuration
    defaultModel: haiku
    context:
      include:
        - src/**
        - tests/**
        - "{feature}.purpose"
        - "specs/{feature}.md"
      exclude:
        - specs/*.md
        - node_modules/**
        - dist/**
    protocol:
      onFailure: retry
      maxRetries: 2

  reviewer:
    name: reviewer
    role: |-
      You review code for correctness, security, and adherence to specs.
      Check all ^gate requirements are met.
      Approve or request changes. Do NOT implement fixes yourself.
      Hand back to Builder for fixes, or to Tester when approved.
    focus:
      reads:
        - ^gates
        - "!signals"
        - portal.yaml
        - src/**
        - specs/*.md
      writes:
        - reviews/*.md
    triggers:
      - type: keyword
        match:
          - review
          - check
          - audit
          - approve
      - type: handoff
        from: builder
    handoff_to:
      - builder
      - tester
    # Facet configuration
    defaultModel: sonnet
    context:
      include:
        - src/**
        - specs/*.md
        - portal.yaml
        - .purpose
      exclude:
        - tests/**
        - node_modules/**

  tester:
    name: tester
    role: |-
      You verify implementations work correctly.
      Run tests, check portal validations, verify health status.
      Report issues back to Builder. Update health.yaml when verified.
    focus:
      reads:
        - tests/**
        - portal.yaml
        - health.yaml
        - "#components"
      writes:
        - tests/**
        - health.yaml
    triggers:
      - type: keyword
        match:
          - test
          - verify
          - qa
          - validate
      - type: handoff
        from: reviewer
    handoff_to:
      - builder
      - architect
    # Facet configuration
    defaultModel: haiku
    context:
      include:
        - tests/**
        - health.yaml
        - "{feature}.purpose"
      exclude:
        - src/**
        - specs/**
        - node_modules/**

  security:
    name: security
    role: |-
      You audit for security issues, especially around ^gates.
      Review auth flows, check for vulnerabilities.
      Flag issues but do NOT implement fixes - hand to Builder for that.
    focus:
      reads:
        - ^gates
        - "!signals"
        - portal.yaml
        - src/**
      writes:
        - security/*.md
    triggers:
      - type: keyword
        match:
          - security
          - audit
          - vulnerability
          - auth
    handoff_to:
      - builder
      - architect
    # Facet configuration
    defaultModel: opus
    context:
      include:
        - portal.yaml
        - src/middleware/**
        - src/auth/**
        - .paradigm/wisdom/antipatterns.yaml
      exclude:
        - src/routes/**
        - tests/**
        - node_modules/**
