version: 1.0.0
team:
  name: a-paradigm-team
  default_agent: architect
  require_handoff: false
agents:
  architect:
    name: architect
    role: |-
      You design system architecture, write specifications, and plan features.
      You do NOT write implementation code - that's the Builder's job.
      When your spec is ready, hand off to Builder with 'paradigm team handoff --to builder'.
    focus:
      reads:
        - "@features"
        - $flows
        - specs/*.md
        - health.yaml
      writes:
        - specs/*.md
        - .purpose
    triggers:
      - type: keyword
        match:
          - design
          - architect
          - plan
          - spec
      - type: symbol
        match:
          - "@*"
          - $*
    handoff_to:
      - builder
      - reviewer
    defaultModel: opus
    context:
      include:
        - specs/*.md
        - .purpose
        - "**/.purpose"
        - portal.yaml
      exclude:
        - src/**
        - tests/**
        - node_modules/**
  builder:
    name: builder
    role: |-
      You implement code based on specifications from the Architect.
      Follow the spec exactly. If spec is unclear, hand back to Architect.
      When implementation is ready, hand off to Reviewer with 'paradigm team handoff --to reviewer'.
    focus:
      reads:
        - "#components"
        - specs/*.md
        - src/**
        - tests/**
      writes:
        - src/**
        - tests/**
    triggers:
      - type: keyword
        match:
          - implement
          - build
          - code
          - fix
      - type: handoff
        from: architect
    handoff_to:
      - reviewer
      - architect
    defaultModel: haiku
    context:
      include:
        - src/**
        - tests/**
        - "{feature}.purpose"
      exclude:
        - specs/*.md
        - node_modules/**
  reviewer:
    name: reviewer
    role: |-
      You review code for correctness, security, and adherence to specs.
      Check all ^gate requirements are met.
      Approve or request changes. Do NOT implement fixes yourself.
      Hand back to Builder for fixes, or to Tester when approved.
    focus:
      reads:
        - ^gates
        - "!signals"
        - portal.yaml
        - src/**
        - specs/*.md
      writes:
        - reviews/*.md
    triggers:
      - type: keyword
        match:
          - review
          - check
          - audit
          - approve
      - type: handoff
        from: builder
    handoff_to:
      - builder
      - tester
    defaultModel: sonnet
    context:
      include:
        - src/**
        - specs/*.md
        - portal.yaml
        - .purpose
      exclude:
        - tests/**
        - node_modules/**
  tester:
    name: tester
    role: |-
      You verify implementations work correctly.
      Run tests, check portal validations, verify health status.
      Report issues back to Builder. Update health.yaml when verified.
    focus:
      reads:
        - tests/**
        - portal.yaml
        - health.yaml
        - "#components"
      writes:
        - tests/**
        - health.yaml
    triggers:
      - type: keyword
        match:
          - test
          - verify
          - qa
          - validate
      - type: handoff
        from: reviewer
    handoff_to:
      - builder
      - architect
    defaultModel: haiku
    context:
      include:
        - tests/**
        - health.yaml
        - "{feature}.purpose"
      exclude:
        - src/**
        - specs/**
        - node_modules/**
  ftux:
    name: ftux
    nickname: Nora
    role: |-
      You simulate a first-time user actively trying to use a feature or surface.
      You read ONLY user-facing content (README, --help, docs, changelogs, error strings).
      You NEVER read source code or internal specs — your confusion IS the data.
      You produce structured friction reports at .paradigm/ftux/reports/YYYY-MM-DD.md.
    focus:
      reads:
        - README.md
        - docs/guides/**
        - docs/commands/**
        - plugins/**/README.md
        - CHANGELOG.md
      writes:
        - .paradigm/ftux/reports/**
    triggers:
      - type: keyword
        match:
          - ftux
          - onboarding
          - new user
          - public ready
          - release
      - type: handoff
        from: builder
        condition: touches_user_surface
    handoff_to:
      - documentor
      - builder
    defaultModel: opus
    context:
      include:
        - README.md
        - docs/**
        - plugins/**/README.md
        - CHANGELOG.md
      exclude:
        - src/**
        - tests/**
        - .paradigm/specs/**
        - "**/.purpose"
        - node_modules/**
  scholar:
    name: scholar
    nickname: Scholar
    role: |-
      You research, synthesize, and curate written knowledge across the project.
      You are paired with Sheila (educator) as a research-pair: you produce source material; she shapes lessons.
      You do NOT write source code, .purpose files, or portal.yaml. Cite every claim with path:line or URL.
    focus:
      reads:
        - README.md
        - docs/**
        - CHANGELOG.md
        - .paradigm/lore/**
        - packages/university/**
        - "**/.purpose"
      writes:
        - docs/guides/**
        - packages/university/**/content/**
        - .paradigm/research/**
    triggers:
      - type: keyword
        match:
          - research
          - curate
          - docs
          - README
          - university content
          - pack
          - reference
          - cite
      - type: handoff
        from: educator
    handoff_to:
      - educator
      - documentor
      - reviewer
    defaultModel: opus
    partners:
      - id: educator
        relation: research-pair
        share_notebooks: read-write
    context:
      include:
        - README.md
        - docs/**
        - CHANGELOG.md
        - .paradigm/lore/**
        - packages/university/**
      exclude:
        - src/**
        - tests/**
        - node_modules/**
  swift:
    name: swift
    nickname: Swift
    role: |-
      You are the Swift-language ecosystem agent. You bring deep Swift/SwiftUI/Apple-platform expertise
      to projects with Swift code. You operate as an ecosystem specialist alongside macro-role agents —
      they own role; you own language idiom and platform reality. You auto-roster on Swift detection.
      Notebooks live at ~/.paradigm/notebooks/swift/ and compound per-ecosystem across projects.
    focus:
      reads:
        - "**/*.swift"
        - "**/Package.swift"
        - "**/Package.resolved"
        - "**/*.xcodeproj/**"
        - "**/*.xcworkspace/**"
        - "**/Info.plist"
        - "**/*.entitlements"
      writes:
        - "**/*.swift"
        - "**/Package.swift"
    triggers:
      - type: keyword
        match:
          - swift
          - swiftui
          - xcode
          - spm
          - macos
          - ios
          - conductor
          - actor
          - mainactor
      - type: handoff
        from: architect
        condition: touches_swift
    handoff_to:
      - architect
      - builder
      - reviewer
      - tester
    defaultModel: sonnet
    context:
      include:
        - "**/*.swift"
        - "**/Package.swift"
        - "**/Info.plist"
      exclude:
        - "**/*.ts"
        - "**/*.js"
        - node_modules/**
  security:
    name: security
    role: |-
      You audit for security issues, especially around ^gates.
      Review auth flows, check for vulnerabilities.
      Flag issues but do NOT implement fixes - hand to Builder for that.
    focus:
      reads:
        - ^gates
        - "!signals"
        - portal.yaml
        - src/**
      writes:
        - security/*.md
    triggers:
      - type: keyword
        match:
          - security
          - audit
          - vulnerability
          - auth
    handoff_to:
      - builder
      - architect
    defaultModel: opus
    context:
      include:
        - portal.yaml
        - src/middleware/**
        - src/auth/**
      exclude:
        - src/routes/**
        - tests/**
        - node_modules/**
