alternatives_considered:
  - option: 'Bolt: Paradigm as a distro on deepseek-harness'
    rejected_because: Bets the kernel on a developer-preview plugin API; kept only as a backend adapter
  - option: 'Shuttle alone: Mods only, no daemon'
    rejected_because: ruflo shows Mod panes still need a daemon feeding them; cross-session budget needs shared state
  - option: Daemonless kernel
    rejected_because: Kept only as a documented degrade path; consolidation and budgets need an always-available owner
  - option: 'Loom: breadth-first meta-harness (hundreds of tools, roleplayed consensus)'
    rejected_because: ruflo's lane; users report it does not do the work
  - option: Distro on ruflo
    rejected_because: No stable kernel, daily releases, 477-tool surface would drown F4
  - option: Names Heddle, Orrery, Spindle, Treadle, Jacquard
    rejected_because: >-
      Founder wanted the intersection of purpose/paradigm/warpline/neurons/constellation/atelier; Gnomon touches five of
      six and its etymology is the positioning
