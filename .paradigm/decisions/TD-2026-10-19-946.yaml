    rejected_because: it removes presence; anyone holding the token can approve
  - option: Never allow any phone path
    rejected_because: the founder wants enrolled-device approval eventually
  - option: Build an enrolled phone in Move 2
    rejected_because: too early; the core loop has to be tested first
