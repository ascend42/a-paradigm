title: 'Gnomon boards: whiteboard first on Excalidraw, free hues, Constellation merges into boards'
decision: >-
  Build the co-authored whiteboard (S1, spec §12.7 Doodle core) first, on Excalidraw as the engine, reskinned to the
  Gnomon design system. Board content may use free hues, kept in a content palette separate from the UI's mineral and
  semantic colours. Constellation merges into boards as a node kind or mod; its separate app winds down over time. Team
  consensus carried in: agents propose boards via offer slips; hybrid truth (kernel-log ops, compacted to
  .paradigm/boards/ per-node files via a human export card with redaction); declarative board mods; webpage snapshots,
  no live iframes; boards never cover approval surfaces.
rationale: >-
  Founder chose the whiteboard as the core of the vision (FigJam-style collaboration with agents) over the live context
  board, and Excalidraw for speed to a drawable surface. Costs accepted: P12 export fixes (self-hosted fonts, no eval in
  the font-subset worker, data: images), React in the GUI, and a full reskin so the stock hand-drawn look does not ship
  (house rule). Free hues follow FigJam's model; Luna's condition is a separate content palette.
