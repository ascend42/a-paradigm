alternatives_considered:
  - option: Harden the meaning-layer-on-git (team's unanimous rec)
    rejected_because: >-
      Founder's call: replacement is the arc's north star; an accountability overlay, however differentiated, is not the
      product goal.
  - option: Prove the byte-wedge first, then decide
    rejected_because: Founder committed to replacement outright; the wedge is retained as M1 sequencing rather than as a decision gate.
