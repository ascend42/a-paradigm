alternatives_considered:
  - option: Adopt warm/SendMessage subagents into the default pipeline now
    rejected_because: >-
      Couples orchestration to an off-by-default experimental flag; session-boundary/compaction silently invalidates
      held agent IDs (silent severe failure); bypasses the auditable notebook learning layer
  - option: Prototype warm-resume behind a flag immediately (Architect's initial lean)
    rejected_because: >-
      Premature — the orchestrator lacks an iteration-loop seam to attach it to; the stateless loop must exist first,
      and once it does the tax may already be acceptably paid down
  - option: Document-and-wait, change nothing (Loid's initial lean)
    rejected_because: >-
      Leaves the genuine narrow gap (no iteration/re-review primitive) unaddressed; the stateless loop is worth building
      on its own merits independent of warm-resume
