alternatives_considered:
  - option: Keep competing on orchestration mechanics (maintain two diverging engines)
    rejected_because: >-
      Each CC release absorbs another mechanic; dual-engine maintenance already costs more per year than the 4-6 week
      compiler move (Builder's sizing); the YAML-parsing and provider-drift fixes are recurring, not one-time
  - option: Kill Paradigm orchestration entirely and ride harness primitives everywhere
    rejected_because: >-
      Commoditization is Claude-Code-specific — Cursor, headless CI, and API surfaces still require our engine; and
      the learning loop dies without the capture seams our orchestration carries (attribution, verdicts, identity)
  - option: Enforce team-invocation with hard blocks immediately
    rejected_because: >-
      Zero baseline exists on invocation rate — guarding before measuring makes it impossible to separate 'gate works'
      from 'gate annoys' (Loid); and coerced orchestration risks polluting attribution with compliance theater
