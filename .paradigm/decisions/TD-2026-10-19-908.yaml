alternatives_considered:
  - option: Live handover of child pipes
    rejected_because: unprobed, large cost, a trust transfer between kernels
  - option: Per-session stdio holder process
    rejected_because: moves session custody out of the kernel
  - option: Defer to 8.1
    rejected_because: every update kills sessions during dogfood
