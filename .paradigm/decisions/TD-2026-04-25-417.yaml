alternatives_considered:
  - option: Strengthen framework-level enforcement (add 1:1 component-to-aspect ratio check to Stop hook with severity=block)
    rejected_because: >-
      Violates user reframe that paradigm should not coerce symbol discipline. Would freeze every user project on Monday
      morning with massive backlogs. Treats users without their consent as needing the same discipline as Paradigm
      itself.
  - option: Pure-advisory model (warnings only, no agent ownership)
    rejected_because: >-
      What we have today. Producing 0.31:1 ratios on Paradigm itself even when the user agrees with the rule.
      Pure-advisory does not work even when the user agrees.
  - option: CI-only enforcement (move all checks to GitHub Actions, drop hooks)
    rejected_because: >-
      Same coercion problem at a different layer. Also breaks projects that do not use GitHub Actions. CI is downstream
      of where the work happens.
  - option: Hard block when Rune rostered (write-tool refusal on missing aspect)
    rejected_because: >-
      Re-introduces parent-framework that user reject. Rune-as-CI is just hooks wearing a costume. Loid: 'Both extremes
      fail. Block deploys reintroduces the parent-framework that the reframe just rejected.'
  - option: Pull soft-block primitive forward to v6.0.4 alongside the emergency cuts
    rejected_because: >-
      Pending user decision (open call 3). Rune effective sooner but harder release. Default plan: hold soft-block for
      v6.1 with rest of authority work; v6.0.4 ships emergency cuts only.
