id: TD-2026-04-25-417
timestamp: '2026-04-25T22:22:12.676Z'
title: Paradigm enforcement model pivot — agent-owned, not framework-owned
decision: >-
  Paradigm framework stops enforcing symbol/aspect discipline at the framework level. The framework provides ENABLING
  PRIMITIVES (signals, metrics, soft-block tool, authority registry); active agents on the project roster determine
  POLICY (whether/how to enforce). When a compliance-archetype agent (Rune) is rostered, HE owns the entire
  symbol/aspect ecosystem with three authority modes (advise/auto-author/guard, default advise). When no compliance
  archetype is rostered, the framework computes coverage data as visible metrics but emits NO warnings, NO nominations,
  NO blocks — silence respects user agency. v6.0.4 ships emergency cuts (drop framework-level aspect-coverage block when
  no claimant; nominate Rune via paradigm shift; rename compliance-check → aspect-report data-only). v6.1 ships the
  load-bearing soft-block primitive plus authority claim registry plus hook orchestrator plus tier-1/tier-2 notebook
  split. v6.2 ships polish (archetype defaults, opt-out registry, JSONLogic unblock predicates, override-cluster
  auto-coaching).
rationale: >-
  User reframe: 'It's not technically paradigm that needs to enforce this. If Rune is in the project he NEEDS to manage
  the entire eco space. People that use paradigm are within their own right to not use the symbols.' Framework currently
  conflates 'Paradigm thinks symbols matter' with 'this project's team thinks symbols matter' — those are different
  claims. Dogfooding failure proves the descriptive-enforcement model fails: 704 components / 219 aspects (0.31:1 vs
  documented ≥1:1 floor); 316 missing aspect anchors; cross-project pattern reported across multiple of user's projects.
  Loid's framing crystallized the design contract: 'The user's reframe is a contract that Rune must be powerful enough
  to honor. If the framework stops enforcing and Rune can't pick up the slack, drift wins by default.' Soft-block
  primitive (paradigm_propose_block — agent-initiated, framework-honored, user-keystroke-overridable) is the
  load-bearing piece both Architect and Loid converge on. Without it, agent-owned enforcement is rhetoric. Notebook
  tier-1/tier-2 split (transferable rules vs project-local exceptions) is the missing primitive that lets Rune compound
  across projects — currently all his notebook content is tier-2 which is why he's helpless on new-project
  onboarding.</rationale>

