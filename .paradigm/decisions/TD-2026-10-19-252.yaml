    stance: neutral
  - id: loid
    role: agent
    stance: supported
alternatives_considered:
  - option: ACP for LAN agents in Move 2
    rejected_because: not a priority; the founder wants proper support per backend instead
  - option: Full ACP including cloud
    rejected_because: it would loosen law 7 without a ruling
