      B's trust gate (scrutiny=fragility×(1−trust)) is honest rather than shallow. Deferred to after A; B does not block
      A and A does not block B.
  - option: Commit to A blind (skip the spike)
    rejected_because: >-
      The determinism/soundness risk was the one disqualifying unknown; a cheap read-only spike resolved it before
      committing months of effort.
  - option: Merge both loom branches to main now
    rejected_because: loom-presentation may overstate an unshipped write path (Aegis); held on-branch until claims are verified.
