alternatives_considered:
  - option: Extend .purpose per folder (Option A)
    rejected_because: Labels orphan on moves, nobody writes .purpose for thousands of notes, PDFs/binaries unaddressed, dev-shaped.
  - option: Frontmatter-native only (Option B)
    rejected_because: Mixed folders (PDF/docx/images) can't carry frontmatter; writing into user files unacceptable by default.
  - option: Embedding/RAG-first
    rejected_because: Drifts, opaque, fails at scale (Smart Connections); abandons Paradigm's determinism moat.
