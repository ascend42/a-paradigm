title: 'Paradigm Brain ("Obsidian Brain"): adjacent document-corpus layer on the symbol-graph engine'
decision: >-
  Build a Brain as an ADJACENT layer, not user-authored .purpose: same engine (symbol graph, ^gates, deterministic
  index, suggest→confirm), new authoring surface for any folder of mixed documents. Index-not-store; out-of-tree
  sidecars (~/.paradigm/brains/<root>/), no writes into user folders by default (optional frontmatter write-back for
  md). Three layers: deterministic local scan → declared (human-confirmed) → inferred (suggestions only; classifier =
  certifiable skill). Body text never symbol-scanned. Privacy: brain.yaml default-deny roots, ^gates enforced in code,
  local-only default, egress log, one-button forget. Non-developer UX: Platform section primary, plain vocabulary.
  Sequencing: prerequisites (shared frontmatter parser, heading/block anchors, incremental index, SourceType
  'frontmatter') fold into Phases 3–4; Brain = Phase 5 of TD-2026-09-26-846. Spec: docs/specs/brain.md.
rationale: >-
  Symbol prefixes collide with Markdown/Obsidian syntax (aggregator.ts:418 would read #tag/^block/$latex/~~strike~~ as
  symbols); PDFs/docx cannot carry labels; non-developers won't tolerate sidecars or symbol jargon. Market research:
  embedding tools drift and fail at scale, explicit-graph tools rely on unenforced discipline; white space = provable
  staleness, link integrity under renames, declared-schema validation, provenance, sensitivity-as-structure — all native
  Paradigm strengths.
