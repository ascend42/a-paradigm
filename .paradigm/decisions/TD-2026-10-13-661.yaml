    rejected_because: Abandons .purpose as authored truth; the parse is cheap; the defects are local to identity/edges/freshness
  - option: Add embeddings/semantic search
    rejected_because: Rejected in TD-2026-09-29-204; abandons the determinism moat
  - option: Push-retrieval hook now
    rejected_because: Would inject stale/wrong context until identity and freshness are fixed
