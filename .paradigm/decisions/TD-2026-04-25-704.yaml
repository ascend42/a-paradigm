alternatives_considered:
  - option: >-
      Slim — Soak Release: Failure Ledger + CI drift + observability-only partner_id emission, no share_notebooks
      activation, no cross-refs
    rejected_because: >-
      Jinx's framing — but cross-refs converts soak-time into signal-generating time without baking content-merge
      semantics, so the soak benefit is preserved with more value.
  - option: >-
      Mid — Loid synthesis: activate share_notebooks runtime with strict caps (top-K=5, 2000-token budget, [from: X]
      tags), pair-coherence metrics observability-only, pair_evidence_boost opt-in flag
    rejected_because: >-
      Loid herself reversed: '[from: X] tags were a band-aid. The content still landed in agent A's prompt as if A had
      thought it.' Sovereignty by construction beats attribution by annotation. Cross-refs is the better primitive AND
      smaller surface area.
  - option: >-
      Full — activate share_notebooks runtime + pair-namespace writer + cross-pair analytics consumer +
      threshold-coupling foundations
    rejected_because: >-
      All three agents flagged threshold coupling as hazardous with N=1 data — risks wisdom-spam from coupled
      calibration. Cross-pair analytics with N=1 (Scholar↔Sheila is one pairing shape; peer↔peer /
      supervisor↔subordinate are different) overfits to research↔educator dynamic.
  - option: '0-kind taxonomy (Jinx): just target + free-text note'
    rejected_because: >-
      User picked structured kinds for semantic queryability (paradigm_notebook_diverges_from etc) and to give Loid's
      learning loop typed signal for corroboration vs contradiction. Tradeoff acknowledged: kinds designed under N=1 may
      need migration in v6.2.
  - option: '4-kind taxonomy (Loid): grounds-in / corroborates / contradicts / extends'
    rejected_because: >-
      User picked Architect's 5-kind taxonomy (agrees/diverges/supersedes/builds_on/see_also). Both work for Loid's
      learning loop; Architect's covers semantic-relationship space slightly more granularly.
  - option: Coexist share_notebooks + cross-refs
    rejected_because: >-
      Architect: 'pick one — both can't coexist or injection wins by default.' Agents follow path of least resistance.
      Loid agreed — deprecate share_notebooks 'read'/'read-write' values to 'off'-only, schema preserved for possible
      v6.2+ revival if cross-refs prove insufficient.
