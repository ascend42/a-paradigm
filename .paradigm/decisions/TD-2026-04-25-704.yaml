title: v6.1 = Sovereign Notebooks + Cross-References (replaces share_notebooks runtime activation)
decision: >-
  v6.1 ships disjointed-notebooks-with-cross-references as the partners-learning primitive instead of activating
  v6.0.3's reserved `share_notebooks` content-injection runtime. Each agent's notebook stays sovereign; entries
  reference partner entries via structured `refs: [{target, kind, note}]` field with 5-kind taxonomy
  (agrees/diverges/supersedes/builds_on/see_also). No content crosses notebook boundaries at runtime — labels only in
  prompts. share_notebooks field schema preserved but restricted to 'off' only at v6.1; 'read'/'read-write' values
  deprecated with warnings.
rationale: >-
  User reframe surfaced a fundamentally better primitive than what v6.0.3 reserved. Loid (who designed share_notebooks)
  explicitly reversed her position during the critique pass: "I was wrong to settle for [from: X] — sovereignty by
  construction beats attribution by annotation." Cross-refs solves the same pair-learning problem without the costs
  share_notebooks would have introduced: no token-budget injection, no namespace-collision rules, no
  calibration-coupling hazard, no attribution blur, naturally accommodates asymmetric pairings (A→B without B→A is
  legal). Loid confirmed the learning loop is preserved and SHARPENED — bidirectional_promotion_rate becomes a measure
  of genuine convergence rather than echo, and ref-creation is itself the acceptance signal. Jinx's N=1 prematurity
  concern partially mitigated by smaller surface area (pointer semantics simpler than content-merge semantics) plus
  schema marked v0-experimental for explicit migration path. User chose Architect's 5-kind taxonomy over Loid's 4-kind
  and Jinx's 0-kind; tradeoff accepted: kinds designed under N=1 condition, v6.2 may migrate based on observed usage.
  All three discovery affordances ship (search tool, session-start digest, debrief candidate-refs) — Jinx flagged
  "library with no card catalog" as fatal flaw if discovery missing.
