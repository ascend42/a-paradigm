    rejected_because: Founder declined the ceremony after understanding it is the only cryptographic human boundary; chose procedural
  - option: Git-committed root public keyId witness
    rejected_because: Founder chose to keep keys entirely out of git
  - option: Defer auto-resolve grants to M3.5
    rejected_because: Founder wants the continue-through option for long autonomous builds now; grant ships in M3, OFF for the run
