alternatives_considered:
  - option: Unify Conductor + web into one shell / Conductor as native shell over web views
    rejected_because: >-
      Net-new WKWebView bridge (Conductor reaches substrate via its own stdio MCP, zero shared UI code); months of work
      that buys nothing for the moat. Helix's dissent noted.
  - option: Pure-web, delete Conductor
    rejected_because: Throws away ~23k LOC of irreplaceable OS integration (overlay/gaze/terminal) the web cannot replicate.
  - option: Greenfield 'unify the surfaces' renaissance
    rejected_because: >-
      The shell already exists and works; the real gap is that zero surfaces render the v7 substrate.
      Subtractive-then-additive is the honest scope.
  - option: Defer canvas instead of deleting
    rejected_because: >-
      Stub serializer, zero .canvas files, empty symbols map, no substrate linkage — defer-to-someday is the trap; Matt
      confirmed delete.
