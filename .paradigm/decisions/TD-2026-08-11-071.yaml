alternatives_considered:
  - option: Rostered Paradigm agent (the founder's question)
    rejected_because: >-
      warm by construction — notebooks + recent-decisions injection carry the field-test answer key; owned falsifier is
      a yes-man
  - option: Blind-profile of a roster agent (fresh, no notebooks)
    rejected_because: >-
      blindness becomes a suppressible config that can silently fail on any one of 100 invocations and void the run;
      still inherits the session model alias, cannot satisfy exact-version pinning
