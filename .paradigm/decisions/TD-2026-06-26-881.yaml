id: TD-2026-06-26-881
timestamp: '2026-06-26T03:15:08.152Z'
title: 'Classroom × registry: publish the prior SHAPE, never the local trust number'
decision: >-
  For the nevr.land registry, an agent's Classroom calibration is published ONLY as a population prior — a
  notebook-hash's outcome distribution (survivalShape {survived,overturned,pending} + sampleSize + an
  exercise-intensity denominator; see amendments), aggregated across projects — never as a local repeat-failure-rate.
  An imported prior sets a fresh install's START-POINT shape; local trust is earned per-project and confirmed by local
  evidence. Scenario outcomes on other projects feed the population prior only, never a local trust number
  (anti-laundering — necessary but NOT sufficient; see amendment 1). field-failures + per-project cert rows stay
  non-portable (the moat); refined "X except Y" notebook entries + scenarios (SC-*) are portable knowledge. Land
  CalibrationPrior/TrustProfile/ScenarioRef as contracts-only in registry-types.ts; ship NO published figure until the
  loop resolves real outcomes AND the amendment prerequisites are met (today 0 certs are resolved).
  Scenarios are the first artifact worth propagating (pure knowledge, no moat risk) — after payload redaction (amendment 8).
rationale: >-
  Resolves the apparent contradiction that the registry already shows a calibrationScore
  (packages/paradigm/src/commands/agent/registry.ts:50-54, CONFIRMED) while 'non-portable calibration = the moat': the
  distribution-over-many-projects tells you what to EXPECT (a prior); the actionable number only exists after the agent
  survives YOUR field. Publishing a distribution + sampleSize (not a scalar score) is more honest than a scalar — BUT
  the adversarial review (orch-mr2dysn1-ypmg, Arky + Loid, both RATIFY-WITH-AMENDMENTS) found the distribution defense
  is insufficient on its own: `survived` is minted by TIME-DECAY (decay.ts:52, a 14-day no-attributed-break window),
  not by "the field exercised this and it held", so a survivalShape carries no exercise-intensity signal and a
  population of idle throwaway projects is indistinguishable from hard ones. The anti-laundering rule guards only the
  local number, so the harm re-enters through the PRIOR (the marketing surface). Hence the amendments: an
  exercise-intensity denominator, a search-render gate, and a defined tamper-evident training-identity before any figure
  ships. Keeping number-writes strictly local still prevents trust-laundering of the local number; the amendments close
  the population-prior laundering channel.
