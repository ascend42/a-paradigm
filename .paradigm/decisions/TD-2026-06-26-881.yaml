id: TD-2026-06-26-881
timestamp: '2026-06-26T03:15:08.152Z'
title: 'Classroom × registry: publish the prior SHAPE, never the local trust number'
decision: >-
  For the nevr.land registry, an agent's Classroom calibration is published ONLY as a population prior — a
  notebook-hash's outcome distribution (survivalShape {survived,overturned,pending} + sampleSize), aggregated across
  projects — never as a local repeat-failure-rate. An imported prior sets a fresh install's START-POINT shape; local
  trust is earned per-project and confirmed by local evidence. Scenario outcomes on other projects feed the population
  prior only, never a local trust number (anti-laundering). field-failures + per-project cert rows stay non-portable
  (the moat); refined "X except Y" notebook entries + scenarios (SC-*) are portable knowledge. Land
  CalibrationPrior/TrustProfile/ScenarioRef as contracts-only in registry-types.ts; ship NO published figure until the
  loop resolves real outcomes (today repeat-failure-rate is null). Scenarios are the first artifact worth propagating
  (pure knowledge, no moat risk).
rationale: >-
  Resolves the apparent contradiction that the registry already shows a calibrationScore while 'non-portable calibration
  = the moat': the distribution-over-many-projects tells you what to EXPECT (a prior); the actionable number only exists
  after the agent survives YOUR field. Publishing a distribution + sampleSize (not a scalar score) prevents the 'green
  that lies' the Classroom exists to kill, and keeping number-writes strictly local prevents trust-laundering (buying
  standing on an easy project). Strengthens the moat by naming exactly what's portable, so the network can be generous
  with knowledge while trust stays earned.
