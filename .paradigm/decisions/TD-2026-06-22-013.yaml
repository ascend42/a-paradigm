alternatives_considered:
  - option: Build meaning-primary (WARP-as-truth) from the start
    rejected_because: bets the repo on absorb-soundness/round-trip fidelity before it's proven; Jinx's data-loss kill shot; huge scope
  - option: One-off weekend read-only Oracle, then decide
    rejected_because: >-
      dual-write gives the same proof CONTINUOUSLY and simultaneously builds the real thing — strictly more information
      for similar cost
  - option: Just make Paradigm-on-git great, never replace
    rejected_because: >-
      founder wants the eventual replacement; dual-write keeps that door open and lets WARP earn the flip, rather than
      foreclosing it
