    role: agent
    stance: supported
alternatives_considered:
  - option: Ship parity now with Aegis's escape blocks
    rejected_because: Blocks the ssh agent, launchctl and tmux, which keeps the friction
  - option: Ship parity now and accept key exposure
    rejected_because: A session could forge approvals
  - option: Keep presence for peer, cloud and voice when Touch ID is off
    rejected_because: 'Founder: everything is a click'
