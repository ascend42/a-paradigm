    role: agent
    stance: supported
alternatives_considered:
  - option: Lift ALL files to a 'text-meaning' essence (everything is meaning)
    rejected_because: >-
      non-code/non-structured bytes have no deterministic structural essence; forcing it reintroduces the
      embedding-in-the-hash trap and non-determinism
  - option: Only version symbol-bearing files; ignore the rest
    rejected_because: loses real files (config/prose/assets) — unacceptable for a git replacement; the opaque tier must be durable
