alternatives_considered:
  - option: Driven swarm on a-paradigm for the denominator
    rejected_because: >-
      Fastest to a non-zero number, but it is our own codebase and our own calibration — a skeptic reads it as
      self-generated evidence, and the headline claim is exactly the thing under scrutiny.
  - option: Synthetic harness for the denominator
    rejected_because: >-
      Fully controlled and repeatable, and still the right instrument for the F4 cold-agent run specifically — but as
      evidence that contested merges OCCUR it assumes its conclusion.
  - option: Build re-derivation of states/ from provenance.gitCommit
    rejected_because: >-
      Would remove the permanent-fail-closed class outright, but it is real work whose value is near zero on a fresh
      repo, and it only holds while the git commits survive — which is the same dependency being accepted anyway.
  - option: Keep byte-authoritative replacement as the active goal
    rejected_because: >-
      Team readiness panel scored ~0.05; M4 remote/sync is pure git-parity plumbing with zero differentiation (Loid A7).
      The real gate on replacement was never format — it is distribution: no host, no review surface, no bisect/blame
      analogue, and not in weights or fingers.
  - option: Freeze descriptorsId now and accept a denominator reset later
    rejected_because: >-
      Would start accumulating scored runs immediately, but any later descriptor change discards them — and two known
      CLI-arm asymmetries are still open, so a change is likely rather than hypothetical.
  - option: Fix the over-block ceiling before the swarm
    rejected_because: >-
      Deliberately declined: the real-world false-KNOT rate on a live codebase is itself unmeasured and worth knowing.
      Accepted with the mitigation that each KNOT must be classified genuine-vs-over-block at resolve time.
  - option: Run the field test at N<=2 to sidestep the H1 guard
    rejected_because: >-
      Would reach real contention sooner, but caps the concurrency story at a number git already handles well —
      measuring nothing the product is for.
