id: TD-2026-08-11-663
timestamp: '2026-08-11T18:36:32.638Z'
title: >-
  Warpline flight-version decisions: the Expo project supplies the denominator, mirror mode ships, and two safety items
  gate the swarm
decision: >-
  Six founder decisions taken 2026-08-11, ahead of the first real field test (an Expo/React Native app). (1) THE
  CONTESTED DENOMINATOR comes from the EXPO FIELD-TEST PROJECT — real agents contending on a real app, not a driven
  swarm on a-paradigm and not a synthetic harness. (2) REPLICATION for this run: git-track the tip (fabric.jsonl + refs
  already push with the repo), states/ stays a regenerable cache; the permanent-fail-closed risk on a lost state file is
  accepted explicitly rather than engineered away. (3) THE H1 GUARD (T-2026-07-01-030) is FIXED BEFORE the field test —
  relax the refusal on CLEAN admits over a merged tip using the MergeRecipe, which was the stated blocker and already
  shipped. (4) PRODUCT SHAPE is MIRROR MODE NOW, with an explicit trigger to revisit: when the Expo project accumulates
  history the founder would be unwilling to lose, replication and replacement get re-decided TOGETHER, because they are
  the same decision. M4 remote/sync, M2.5 branching and M3 signing stay unfunded. (5) FG-3: a DESCRIPTOR REVIEW PASS
  runs BEFORE the freeze is pinned, including whether the two remaining CLI-arm asymmetries (daemon `status`,
  `shadow.tail`) should close; descriptorsId is pinned once, afterward. (6) SWARM SAFETY: Tier-0 invariant conflicts
  (T-2026-06-24-015) and the blind injection corpus (T-2026-06-24-013) are addressed BEFORE the swarm runs; the
  over-block ceiling (T-2026-07-15-008) is deliberately NOT — it is observed in the field instead.
rationale: >-
  Sequencing was unblocked by evidence, not argument. The dress rehearsal proved the contested lifecycle works end to
  end (genesis, fork x2, propose x2, FAST_ADMIT, KNOT with hydrated payload, human resolve, byte-identical restore at
  depth 41), which promoted "where does the denominator come from" from one open question among many to the item
  everything else waits on — every `unmeasured` on the standing report reduces to it. The Expo project was chosen over a
  driven swarm because self-generated contention on our own calibrated codebase invites the obvious objection at
  publication time, and over a synthetic harness because a harness assumes the very thing the measurement is meant to
  show (that contested merges HAPPEN). Replication is deliberately under-engineered for THIS run because the field-test
  repo starts with no history worth losing; the risk is real but its cost is currently near zero, and pairing the
  revisit trigger to accumulated history keeps it from being forgotten. Mirror mode was confirmed reversible by direct
  test rather than by reasoning: the full native cycle (pick, fork with tree restore, propose, admit) runs in a
  directory with NO .git present at all, so the git-independent substrate is built, not deferred — what mirror mode
  defers (M4/M2.5/M3) is purely additive. The coupling that actually hardens over time is decision (2), git-tracking the
  tip, which makes git load-bearing for durability; naming that explicitly is why (2) and (4) share a revisit trigger.
  FG-3's own task text says every fix after the pin is expensive, so the review pass pays that cost once. On safety,
  Tier-0 invariant conflicts auto-weave disjoint-but-jointly-wrong changes with ZERO review — the failure that reaches
  production on a real app — and agent prose flows between agents in any real swarm, so the injection envelope needs its
  blind externally-authored corpus before, not after. KNOWN CONSEQUENCE, accepted: declining the over-block fix while
  sourcing the denominator from the field test means that denominator will contain false KNOTs from commuting edits
  (measured 3/3 on Move-3). The field test must therefore CLASSIFY each KNOT as genuine or over-block at resolve time,
  or the headline number will not survive scrutiny.
