alternatives_considered:
  - option: Weave (founder's first idea)
    rejected_because: >-
      Taken everywhere (W&B Weave, Weave GitOps, getweave, npm taken, software trademarks) AND self-collides with the
      internal WEAVE merge verb.
  - option: Space theme / Gravitas (founder's second idea)
    rejected_because: >-
      Gravitas npm-taken + live software trademark + 'gravi.tas' not a registrable TLD; and a space brand over textile
      internals is 'split-brain' (North) — would force rethem ing the whole internal vocabulary. Staying textile is
      coherent at near-zero cost.
  - option: Treadle / Weftwise (other clear textile options)
    rejected_because: >-
      Verified clear but 'ok, not exciting' to the founder; Warpline was preferred (on-theme: the held line of warp =
      the line of truth).
