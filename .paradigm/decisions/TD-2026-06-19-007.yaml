alternatives_considered:
  - option: PLSAT-style quiz as the agent exam
    rejected_because: >-
      agents pass recall trivially (content in context); self-authored quiz = self-assessment theater; wrong audience
      (human credentialing)
  - option: High-confidence certification gate at entry
    rejected_because: >-
      all learnings are provisional and break in the field; front-loaded verification over-weights the entry; the
      recovery flow is what matters
  - option: Let autonomous study-hall write notebooks directly
    rejected_because: >-
      self-study + self-certify is the journal-flood / self-rated-confidence trap; autonomous must STAGE only, gated
      class is the sole certifier
  - option: Trust the hypothesis as worded ('greater outcomes as long as Loid/Cid adapt')
    rejected_because: >-
      unfalsifiable — the 'as long as they adapt' clause absorbs all failure; requires outside-the-loop metric +
      poison-pill + no-scapegoat falsification clause
