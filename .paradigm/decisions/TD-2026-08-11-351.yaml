    role: human
    stance: proposed
  - id: claude
    role: agent
    stance: supported
alternatives_considered:
  - option: Retire F4 entirely once notebooks ship
    rejected_because: >-
      Would free the whole harness/corpus/freeze/runs programme, but loses all evidence that anything works outside
      Paradigm — and the floor is exactly where this session's failure occurred (a warm agent misled by the CLI three
      times).
  - option: Run F4 cold first, add notebooks afterwards
    rejected_because: >-
      Would capture a clean cold number while it is still obtainable, and a surface that needs notebooks to be usable is
      itself a finding — but it delays the distribution turn for a measurement that is no longer the headline claim.
  - option: Non-Claude on both arms for the first scored run
    rejected_because: >-
      The full matrix and the strongest claim, but with F4 demoted to the floor and the 'any provider' claim now resting
      on notebooks rather than on F4, the extra harness day buys less than it did when F4 was load-bearing.
  - option: Keep moat-silence indefinitely
    rejected_because: >-
      Consistent with the prior record, but pays the cold-agent cost forever to protect an asset the memo says a
      specification cannot reach.
  - option: Sequential stopping design with pre-registered boundaries
    rejected_because: >-
      Statistically valid and cheaper in tokens, but the boundary must be exactly right before the first run and is easy
      to get subtly wrong — fixed n is unambiguous.
