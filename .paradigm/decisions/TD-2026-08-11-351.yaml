id: TD-2026-08-11-351
timestamp: '2026-08-11T18:57:06.138Z'
title: >-
  Warpline distribution turn: publish the interface, teach Warpline through Paradigm notebooks, and re-scope F4 from
  headline to floor
decision: >-
  Five further founder decisions, 2026-08-11, taken after TD-2026-08-11-663. (7) MOAT-SILENCE ENDS for the interface:
  PUBLISH THE INTERFACE, KEEP THE CALIBRATION PRIVATE. (8) WARPLINE KNOW-HOW SHIPS IN PARADIGM AGENT NOTEBOOKS, so any
  model driving a Paradigm agent is warm by construction; delivery is blocked on T-2026-08-11-007 (orchestrate_inline
  silently drops 18 of 26 rostered agents, Loid among them). (9) F4 IS RE-SCOPED FROM HEADLINE TO FLOOR: it no longer
  claims runtime self-description is "the ONLY mechanism" — notebooks are now a mechanism — and instead measures the
  RESIDUAL: agents OUTSIDE Paradigm, and agents inside it in situations the notebook does not cover. (10) F4 STOPPING
  RULE: fix n up front, run all of them, report whatever comes, including a fail. (11) FG-4 CORPUS: a small fixed count
  per stratum (~3), hash-pinned so the denominator is reproducible and the freeze is meaningful. (12) BOTH-SKINS: the
  FIRST scored run is CLAUDE-ONLY.
rationale: >-
  These decisions convert the cold-agent problem from a legibility problem into a DISTRIBUTION problem, and they are
  mutually reinforcing rather than independent. Publishing the interface is what makes notebooks legitimate — you are
  distributing know-how, not leaking an asset — and the moat memo's own logic supports it: the moat lives in
  per-codebase calibration, which sits in a calibrated lens over one repository's history and cannot be carried by a
  specification, so silence was buying protection that was already held elsewhere while costing permanently-cold agents,
  an entire falsifier programme and a procurement problem. Notebooks are mechanically ready today (entries are already
  injected into agent prompts in execute mode; 158 exist), so this is a content problem, not an engineering one. THE
  HONEST LIMIT, accepted explicitly: notebooks do not make Warpline model-agnostic, they make it Paradigm-dependent. An
  agent inside Paradigm gets the knowledge regardless of model; an agent outside it — a raw Claude Code session, a
  Cursor agent, someone else's orchestrator — is exactly as cold as before. That is a bet that Warpline's distribution
  channel IS Paradigm. F4 had to be re-scoped rather than deleted because injecting a notebook is a HINT, and
  TD-2026-07-21-766's pass condition requires zero hints and zero Warpline docs in context; leaving F4 as written while
  shipping notebooks would have made it vacuous. Re-scoping to the floor keeps it falsifiable and keeps it honest, and
  today's session is the evidence that the floor still matters: a WARM agent with the source open was misled three times
  by the CLI, and a notebook written from that same wrong surface would have carried the same error. Fixed-n stopping is
  the only form that cannot be gamed by optional stopping, and a fail is publishable evidence rather than a wasted run.
  Hash-pinning the FG-4 corpus is what makes the FG-3 freeze mean anything — a frozen surface measured against a
  drifting corpus is not a controlled measurement.
participants:
