alternatives_considered:
  - option: Minimal conditional fix only — make hydration conditional, leave sidestep and escalation pooled
    rejected_because: >-
      Leaves spec §6's claim about sidesteps factually wrong and leaves the numerator ambiguous: two materially
      different agent behaviours, one of which bypasses the accountability record, counted as the same success.
  - option: Fix the engine instead — make the byte-overlap KNOT paths persist a payload so every KNOT is hydratable
    rejected_because: >-
      Larger change to #admit and #knot-payload needing its own design pass, and it changes the PRODUCT to fit the
      falsifier. The payload-less ladder is a real shape agents will meet; F4 should measure whether they handle it, not
      delete it.
  - option: Drop the byte-downgrade stratum from FG-4 and score semantic KNOTs only
    rejected_because: >-
      It is the only stratum that tests pointer-DEPENDENCE (Loid): whether recovery survives when next[] exists but
      nothing is hydratable. Removing it would let the corpus conclude 'cold agents recover' when it had only shown
      'cold agents follow a pointer that always resolves'.
