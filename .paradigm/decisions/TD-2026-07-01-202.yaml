alternatives_considered:
  - option: One-time re-seal/migration of seq 0–7 under the current rule
    rejected_because: >-
      Breaks the immutability thesis, and seq 1–7's original confidence is unrecoverable so it can only re-STAMP (assign
      new ids), not faithfully re-hash — losing the original pickIds is exactly what immutability exists to prevent.
      Little gained for a dogfood fabric.
  - option: Persist a per-strand rule/version tag and dispatch verify per strand
    rejected_because: >-
      Doesn't help seq 1–7 (graded-over regardless of which rule tag), and adds a field to strands whose ids can't be
      recomputed anyway. 'Try known rules' achieves the recoverable-strand goal without mutating history.
  - option: Classify all 8 (seq 0–7) as legacy-unverifiable
    rejected_because: >-
      Over-broad — seq 0 reproduces perfectly under the whole-body rule. Trying known rules re-verifies it; only the 7
      truly-destroyed strands need grandfathering.
