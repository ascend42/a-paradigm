    rejected_because: Evidence does not justify it yet; turns an armada into a queue
  - option: Expo field test first
    rejected_because: Slow, founder-gated, small n; replay + swarm answer the questions in weeks
  - option: Git as authority / git as a door for developers
    rejected_because: 'Founder: a Warpline project is run as one; git only as milestone backup'
  - option: Separate Linux runner host with gVisor (Aegis)
    rejected_because: Founder chose the simpler home-box v1 with compensating controls; revisit before public repos
