alternatives_considered:
  - option: Stay the course — ship M1c restore next, A1 later
    rejected_because: >-
      Accepts a growing unauthenticatable + non-well-formed strand prefix that pickId immutability makes permanent;
      cutover deletes the last detection mechanism (shadow gitOid) at the moment the store becomes load-bearing.
  - option: Fix the confirmed bugs first, defer schema
    rejected_because: >-
      Good hygiene but doesn't stop the identity-debt clock; the schema change is the compounding-cost item, so it
      leads. Bugs fold into it since they share files.
  - option: Pivot to the Guard wedge, pause replacement
    rejected_because: >-
      Founder kept replacement as the headline; the Guard/mirror-mode packaging is retained as a parallel go-to-market
      option, not a redirection of the build.
