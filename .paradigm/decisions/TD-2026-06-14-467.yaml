alternatives_considered:
  - option: A new dedicated PM/task-governor agent
    rejected_because: >-
      Hangs off no symbol/agent/lore substrate (chrome by Paradigm's own rule); would steal ops from Cid
      (assembleCaptainBoard) and Loid (settlement chain) who already own the structure. All three lenses rejected it.
  - option: Leave governance implicit (no protocols)
    rejected_because: >-
      13 real gaps have NO owner today (DAG cycle validation, blocked_on clearing, calibration aggregation, archival,
      priority-aging) — implicit ownership left them unaddressed.
  - option: Coordinator micro-agent now
    rejected_because: >-
      Premature — justified only once two-way GitHub sync AND multi-machine peer teams both land (drift reconciliation +
      peer-claim arbitration). Accepted as a future trigger, not now.
