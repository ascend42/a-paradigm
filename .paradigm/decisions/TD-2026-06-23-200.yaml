alternatives_considered:
  - option: External ids pin dependency name@version (Cid's proposal)
    rejected_because: >-
      Resolved version/path is a node_modules-state function → drifts with npm install → breaks
      byte-identical-across-machines non-locally (one unstable extern id poisons every transitive caller). Determinism
      wins; dependency-meaning-change is DEFERRED to a future low-weight lockfile-fed 'dependency-version' delta class
      (not the hash).
  - option: Include checker-inferred types in the essence (richer code meaning)
    rejected_because: >-
      Inferred-type string form is not stable across TS versions/tsconfig/@types → same source hashes differently across
      machines, the exact failure the project prevents. Written annotations give the meaningful 80% with zero
      determinism cost.
  - option: Keep the spike's flat first-declaration-order alpha-normalization
    rejected_because: >-
      Unsound under shadowing/hoisting and cross-scope-order-dependent → both false-DIFFER on rename and dangerous
      false-EQUAL on shadowing. v1 requires scope-resolved binding indices + a type-param namespace.
