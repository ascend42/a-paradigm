id: TD-2026-06-25-564
timestamp: '2026-06-25T07:29:23.594Z'
title: Warpline coexists with git; start building this project's native Warpline history now (write path Phase A/B)
decision: >-
  Keep git as the working substrate for a-paradigm (continue to push/update git, CI, forge — unchanged). In PARALLEL,
  begin building Warpline's OWN native history of this project: implement the durable single-writer write path — Phase A
  (durable .warp/ store seeded from current project state → refs/selvage) then Phase B (warpline pick seals a WEFT and
  advances selvage) — and record ongoing changes as native PICKs going forward. DEFER the "rip git out as substrate"
  question and the multi-writer per-domain CAS protocol until the native history and Jinx's false-AUTOFOLD gate provide
  real data.
rationale: >-
  Dissolves the git-vs-native fork. The user gets 'Warpline is its own thing, accumulating its own meaning-history' and
  the moat clock starts (Loid: the clock starts when the write path ships) WITHOUT the multi-year storage rewrite or the
  silent-wrong-merge exposure (Jinx's double-tax false-autofold) on the project's critical path. Git coexistence keeps
  CI/forge/durability free. Single-writer history-building does NOT depend on auto-merge safety, so it is a no-regret
  first move; the native store remains swappable behind the broker, and the substrate decision is reopened later with
  measured data. The conflict algebra (predict/consolidate/sem-delta) is already substrate-agnostic and reused verbatim;
  absorb's WORKTREE_REF path is already git-free and becomes the genesis template.
