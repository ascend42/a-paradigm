alternatives_considered:
  - option: Full native rip-out now (Arky Phase A→D, git only as export boundary)
    rejected_because: >-
      Multi-year storage rewrite re-deriving Unison+Pijul+Dolt; introduces silent-wrong-merge exposure (Jinx) with no
      human byte-diff backstop once Warpline is the primary auto-admitting store. Decision deferred until data justifies
      it.
  - option: Git invisible + swappable broker now (no visible git)
    rejected_because: >-
      User wants to KEEP pushing/updating git visibly for this project while starting to accumulate Warpline history in
      parallel — not hide git yet.
  - option: Decide nothing until the false-AUTOFOLD gate runs
    rejected_because: >-
      Single-writer history-building doesn't depend on auto-merge safety, so we can start building the native history
      immediately; the gate gates multi-writer auto-admission (Phase C), not Phase A/B.
