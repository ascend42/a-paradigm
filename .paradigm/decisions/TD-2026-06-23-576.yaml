alternatives_considered:
  - option: Standalone Warpline web app
    rejected_because: >-
      Re-fragments the surfaces the Suite renaissance exists to unify; the Platform chassis + section pattern + WS bus +
      render-by-projection projector are all reusable.
  - option: Lead with the Tapestry (woven history) or the full WARP graph
    rejected_because: >-
      Tapestry needs the write path + Classroom field outcomes (not yet real) → chrome over absent data; the full graph
      is a force-directed hairball whose non-deterministic layout contradicts Warpline's determinism thesis.
  - option: Lead with the semantic-diff viewer
    rejected_because: >-
      Noise-reduction is a comfort/preference argument a skeptic can shrug off; the Oracle's
      scored-disagreement-with-git is a correctness argument. Lead with correctness, follow with comfort (#2).
