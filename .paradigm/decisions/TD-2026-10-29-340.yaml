    role: human
    stance: proposed
  - id: architect
    role: agent
    stance: supported
alternatives_considered:
  - option: No wrapper at all
    rejected_because: A session could read Gnomon's signing keys and forge approvals; revisit once the key is in the helper
  - option: Keep it strict with fewer cards
    rejected_because: Founder chose terminal parity
status: active
