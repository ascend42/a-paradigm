alternatives_considered:
  - option: Matt-directed only, no scheduled scouts (Loid's lean)
    rejected_because: >-
      Matt wants the base to grow horizontally without driving every expedition; accepted flood risk in exchange for a
      per-term cap
  - option: External caps at provisional; certified requires field survival (Loid's lean)
    rejected_because: >-
      Matt wants strong sourcing + his ruling to be able to fast-track to certified; kept the field-veto as the honesty
      backstop
