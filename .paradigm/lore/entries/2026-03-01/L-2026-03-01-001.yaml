title: Bundle Sentinel binaries into Paradigm 3.13.0
summary: Bundled sentinel and sentinel-mcp CLIs into @a-company/paradigm so a single `npm i -g @a-company/paradigm` provides all four binaries. Renamed the dashboard command to `defend`. Fixed UI asset serving — tsup only bundles JS, so static HTML/CSS/JS assets need an explicit copy step during build, matching the existing university-assets pattern.
