lines_added: 21
lines_removed: 8
commit: eecd695
decisions:
  - id: D-defend-rename
    decision: Rename sentinel 'dashboard' command to 'defend'
    rationale: User preference — 'paradigm sentinel defend' is more distinctive and memorable than 'dashboard'
  - id: D-ui-copy-pattern
    decision: Copy sentinel UI assets into paradigm/dist/sentinel-ui/ during build
    rationale: tsup only bundles JS modules. Static assets need explicit copy, same pattern as university-assets and lore-ui
  - id: D-multi-path-resolution
    decision: Use multi-candidate path array for UI asset discovery
    rationale: __dirname shifts when code is bundled into a different package. Trying multiple paths (bundled, standalone server/, standalone flat) ensures it works in all contexts
errors_encountered:
  - description: Sentinel dashboard returned 'Cannot GET /' — UI assets not found
    resolution: Added build:sentinel-assets script to copy ui/dist into paradigm/dist/sentinel-ui/ and updated path candidates
    time_to_fix: 15min
  - description: Global install didn't reflect new build artifacts
    resolution: Re-ran npm link to establish symlink instead of stale copy from previous npm install -g
    time_to_fix: 5min
learnings:
  - tsup only bundles JS — static UI assets need explicit copy steps in the build pipeline
  - npm install -g creates a full copy, not a symlink — npm link is needed for local dev iteration
  - __dirname shifts in bundled context — multi-candidate path arrays are the robust pattern
  - Paradigm already had the copy-assets pattern (university, lore-ui) — check existing patterns first
