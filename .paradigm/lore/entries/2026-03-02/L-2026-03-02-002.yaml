decisions:
  - id: D-protocol-extension
    decision: Use .protocol file extension instead of .yaml for protocol files
    rationale: Follows the .persona convention — semantic file extensions over generic ones, making protocol files immediately identifiable
  - id: D-protocol-search-weights
    decision: 'Fuzzy search with weighted scoring: triggers (3), tags (2), name/desc (1), notes (0.5)'
    rationale: Trigger phrases are hand-crafted match targets so they deserve highest weight. Tags are curated. Name/desc are natural language. Notes are supplementary.
  - id: D-freshness-model
    decision: 'Three-state freshness: current, stale, broken'
    rationale: Stale (exemplar modified since last_verified) is recoverable — the protocol likely still works. Broken (files missing) is not — the protocol cannot be followed. Current means validated.
learnings:
  - totalSlots in PLSAT JSON should reflect resolved question count (including passage sub-questions), not item array length
  - Vite define values are build-time only — ui/dist must be rebuilt for changes to take effect, and prepublishOnly handles this during npm publish
  - The university UI sub-package version (0.1.0) was never updated — reading parent package.json in vite.config.ts is the correct fix since the UI is an internal build artifact
