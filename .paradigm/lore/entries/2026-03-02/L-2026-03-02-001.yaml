decisions:
  - id: manual-timestamp
    decision: Use manual date formatting instead of toLocaleTimeString
    rationale: toLocaleTimeString with fractionalSecondDigits produced inconsistent output across browsers/systems, showing only fractional seconds on macOS Safari
  - id: grid-layout
    decision: Switch LogsView from flexbox to CSS grid matching EventsView
    rationale: CSS grid enables consistent column sizing between header and rows, plus resizable columns via CSS custom properties
  - id: expand-visual
    decision: Expanded rows unwrap message text via CSS class rather than only showing data payload
    rationale: Most log entries have long messages but no separate data field — expansion must have visible effect regardless of data presence
errors_encountered:
  - description: Grid template produced 4 columns instead of 5 — message column wrapped under timestamp
    resolution: Changed gridTemplate to append ' 1fr' after all px widths instead of replacing last width
  - description: Null ref crash when resizing columns (dragging.current read inside setWidths callback)
    resolution: Captured ref into local const before the guard check so it stays stable through the callback
  - description: toLocaleTimeString showing only fractional seconds (084, 117) instead of full HH:MM:SS
    resolution: Replaced with manual padStart-based formatting that is locale-independent
learnings:
  - toLocaleTimeString with fractionalSecondDigits is unreliable cross-platform — prefer manual formatting for log timestamps
  - When using useRef inside a setState callback, always capture the ref value in a local variable before entering the callback to avoid null dereference races
  - CSS grid column count must exactly match the number of direct children — conditional React children (like log-duration) must be nested inside a grid cell, not as siblings
