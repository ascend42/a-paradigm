title: Overhaul Sentinel dashboard UX for Logs and Events views
summary: 'Implemented 4 major UX improvements to the Sentinel dashboard: full YYYY-MM-DD HH:MM:SS timestamps (locale-independent manual formatting), Expand All/Collapse All with expanded row message unwrapping, merged Level+Category columns in EventsView, and right-click exclusion filters with dismissible chips. Switched both views from flexbox to CSS grid layout and added draggable column resize handles. Fixed auto-scroll direction (top instead of bottom for newest-first ordering). Required 3 follow-up bugfix commits for grid column count, null ref in resize handler, and timestamp locale issues.'
