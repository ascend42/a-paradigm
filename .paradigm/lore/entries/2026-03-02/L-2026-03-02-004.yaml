decisions:
  - id: author-string
    decision: Make author a plain string instead of a typed object
    rationale: There is always a human user behind every session — even AI-assisted ones. The old {type, id, model} format conflated identity with tooling. A string author + optional agent field properly models reality.
  - id: lore-extension
    decision: Adopt .lore as the canonical file extension
    rationale: Gives lore entries their own file identity instead of being generic .yaml. Backward compatible — old .yaml files still load.
  - id: author-keyed-filenames
    decision: Include author and HHMMSS in lore filenames
    rationale: The old sequential counter (L-2026-03-02-001) caused conflicts when multiple users recorded lore on the same day. Author+time scoping eliminates this.
  - id: git-context-auto-capture
    decision: Auto-capture git ref, branch, and dirty status on every lore entry
    rationale: Answers 'what did the codebase look like when this decision was made?' — enables point-in-time context for auditing and team continuity.
  - id: meta-field-open-ended
    decision: Add an open-ended meta field rather than prescribing specific metadata keys
    rationale: Projects have wildly different needs (sprint numbers, meeting types, experiment IDs). Paradigm provides the mechanism, projects define the vocabulary.
learnings:
  - The identity model must be correct before building higher-order features on top of it — the author/agent split was prerequisite for proper plan tracking and deliberation records
  - Agent behavior habits (like 'ask to save lore after planning') should be project-level opt-in via habits.yaml, not baked into the framework for everyone
  - Old entries should always be normalized on read rather than requiring migration — defensive normalization at load boundaries keeps the system backward compatible forever
