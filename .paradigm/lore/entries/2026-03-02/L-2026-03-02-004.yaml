title: 'Refactor lore schema: author/agent split, .lore extension, git context, and custom metadata'
summary: 'Separated the lore author field from a type-discriminated object into a plain string (always the human user) plus an optional agent field for AI metadata. New entries use .lore extension with author+time filenames (L-{date}-{author}-{HHMMSS}-{counter}.lore) to prevent multi-user conflicts. Added automatic git_context capture (ref, branch, dirty) on every lore entry, and a meta field for project-defined key-value metadata. Old .yaml entries with the object author format are normalized transparently on read. Also discussed the broader vision: lore as the connective tissue for all agent work — meeting notes, plan tracking, deliberation records, and a habit-driven protocol where agents proactively ask to save plans as lore.'
