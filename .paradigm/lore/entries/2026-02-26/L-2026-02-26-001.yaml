decisions:
  - id: parser-preprocess-before-yaml
    decision: Pre-process .purpose files with regex to quote symbol prefixes before YAML parsing
    rationale: '#/~/!/$/^ prefixes conflict with YAML syntax (comments, tags). Quoting them inline is simpler than requiring users to always quote symbols in their .purpose files.'
  - id: normalize-before-zod
    decision: Normalize symbol-prefixed top-level keys into standard dicts BEFORE Zod validation
    rationale: 'Zod''s safeParse strips unknown keys. If normalization happens after validation, #MCPServer entries are lost. Moving it before validation preserves them as components.MCPServer.'
  - id: mcp-server-no-hot-reload
    decision: Accept that MCP server needs restart for engine changes, no hot-reload needed
    rationale: Normal user workflow (editing .purpose files) already works with reloadContext(). Only framework developer changes to parser code require restart — rare enough not to warrant hot-reload complexity.
errors_encountered:
  - description: paradigm_reindex via MCP only found 11 aspects (expected 200)
    resolution: 'Root cause: purpose-core parser couldn''t handle #Component: format (YAML comment) and !signal arrays (YAML tag). Fixed with regex pre-processing + normalization before Zod validation.'
    time_to_fix: 45min
  - description: After parser fix, MCP reindex still showed 79 aspects
    resolution: Node.js module cache — MCP server process has old purpose-core loaded. CLI works fine (fresh process). Server needs restart to pick up engine changes.
learnings:
  - Node.js caches ES modules in long-running processes — changing dist on disk doesn't affect already-imported code
  - Zod safeParse strips unknown keys, so any normalization of custom keys must happen BEFORE validation
  - 'The #Component: format in .purpose files was silently broken for YAML parsing since inception — # starts a YAML comment'
  - 'PLSAT rule: questions = minutes (86 questions = 86 minutes = 5160 seconds)'
