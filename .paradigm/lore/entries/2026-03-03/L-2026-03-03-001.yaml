decisions:
  - id: types-first
    decision: Runtime package defines contracts only — no server, no storage, no DB
    rationale: Studio owns the runtime server. This package is what generated apps compile against. Keeping it types-first means the contract is clean and the implementation boundary between paradigm and studio is sharp.
  - id: sub-path-exports
    decision: 'Five sub-path exports: root, /schema, /migration, /logger, /telemetry'
    rationale: Tree-shaking. An app that only needs schema types shouldn't pull the migration engine. Each sub-path is an independent concern.
  - id: forward-only-migrations
    decision: No rollback support in the migration engine
    rationale: Rollback in graph schemas is deceptively complex — relationships, pattern engines, memory config all have cascade effects. Forward-only with dry-run and safety classification is safer and simpler.
  - id: logger-reexport
    decision: Re-export logger types through runtime rather than direct dependency
    rationale: Shielding layer. If paradigm-logger reorganizes internals, Studio apps only need a runtime patch, not a cascading update across every generated app.
  - id: v0-1-0
    decision: Start at v0.1.0, not 1.0.0
    rationale: Signals pre-1.0 contract. Studio is still being built. The types will evolve as we discover what the generation pipeline actually needs. 1.0.0 comes when Studio launches.
  - id: public-package
    decision: Publish as public on npm, not restricted
    rationale: Consistent with the rest of the paradigm ecosystem. People building their own graph-based apps might find the schema types and migration engine useful independently of Studio.
learnings:
  - The paradigm ecosystem is crossing from 'tools for developers' to 'platform for generated apps' — this is a fundamentally different design surface
  - Sub-path exports in tsup require a multi-entry config but the DX is worth it — consumers get exactly the slice they need
  - Peer dependencies with optional:true is the right pattern for re-export shielding layers — the runtime package doesn't force logger/sentinel installation
  - Schema format version should be decoupled from package version — structural format changes and feature additions have different cadences
  - The migration engine's safety classification (safe/cautious/dangerous) maps naturally to UX — Studio can auto-apply safe ops and prompt for dangerous ones
