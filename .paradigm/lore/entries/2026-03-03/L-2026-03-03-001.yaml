title: Paradigm Runtime Foundation — the bridge to Studio
summary: Created @a-company/paradigm-runtime v0.1.0, the contracts package that Paradigm Studio (a-animus) generated apps compile against. This is the first package in the paradigm ecosystem that exists purely for a downstream consumer — everything before this was self-contained tooling. The runtime defines graph schema types, a forward-only migration engine, runtime API operation types, and version fingerprinting. It deliberately has no storage layer; that's Studio's job. This marks the moment Paradigm stopped being a developer tools CLI and started becoming a platform.
