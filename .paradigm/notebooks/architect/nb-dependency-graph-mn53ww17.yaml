context: When designing new features or evaluating cross-package impact
snippet: >-
  Package dependency graph: paradigm (CLI) depends on paradigm-mcp, sentinel, university. paradigm-mcp depends on sql.js
  (aspect graph), @modelcontextprotocol/sdk, ws (WebSocket). Conductor is fully independent Swift — communicates via
  Symphony WebSocket relay and checkpoint JSON files. Plugin at plugins/paradigm/ is directory-based — pushing to GitHub
  IS the update. Three automation tiers: MCP tools (always available) → habits (compliance checks) → hooks
  (pre-commit/stop/post-write enforcement). New features should enter at MCP tier and graduate upward.
