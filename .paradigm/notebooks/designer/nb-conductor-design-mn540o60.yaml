context: When working on Conductor SwiftUI views or Platform UI React components
snippet: >-
  Conductor design constraints: macOS 14+ only, floating NSPanel overlay (always-on-top), must not block user
  interaction with other apps. WorkspaceGrid uses recursive TileNode with 6 layout presets (single, split-h, split-v,
  grid-2x2, etc.). Agent colors are assigned per-agent for visual identity in TeamThreadView and AgentRosterView.
  Platform UI uses React with a store pattern (teamStore.ts, etc.) — sections are lazy-loaded. Canvas design tool
  planned (Sprint 0) using Craft.js for visual editing — will ship as a Platform section with *.canvas YAML files and
  bidirectional CSS sync. No shared component library yet — opportunity for design system unification across all 5 UI
  surfaces.
