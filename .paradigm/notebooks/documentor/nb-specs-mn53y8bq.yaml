context: When updating Paradigm documentation after code changes
snippet: >-
  Documentation locations: .paradigm/specs/ (detailed specifications), .paradigm/docs/ (commands, patterns,
  troubleshooting), docs/specs/ (feature design docs like model-resolution.md, per-project-roster.md,
  conductor-team-collab.md, maestro-learning.md). Lore entries at .paradigm/lore/ track project history — record via
  paradigm_lore_record for sessions modifying 3+ files. CLAUDE.md at root is the primary AI context file — keep it
  current with project conventions. The plugin skills at plugins/paradigm/skills/*/SKILL.md define slash command
  behavior — update when adding new capabilities.
