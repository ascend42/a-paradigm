context: When maintaining .purpose and portal.yaml files in Paradigm
snippet: >-
  Purpose file structure: version (1.0.0), components (# entries with description, tags), features (named feature
  blocks), flows ($ multi-step processes), gates (^ auth checks), signals (! events), aspects (~ cross-cutting
  concerns). Every directory with source files needs a .purpose file — the stop hook BLOCKS without it. Best example:
  packages/conductor/.purpose (52KB+, comprehensive). portal.yaml: gates section (name → type, check, prizes:[]) and
  routes section (METHOD /path → [^gate-list]). After any symbol changes, run paradigm_reindex to rebuild the index. Use
  MCP tools (paradigm_purpose_add_component, paradigm_purpose_add_flow, etc.) rather than editing YAML manually.
