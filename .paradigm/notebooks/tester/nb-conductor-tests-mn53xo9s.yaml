context: When testing Conductor Swift features
snippet: >-
  Conductor test categories: BindingRegistryTests (hotkey dispatch), GestureFSMTests (state machine transitions),
  DTWMatcherTests (dynamic time warping for gesture recognition), GazeCalibrationTests, VoiceControlTests (WhisperKit
  integration), SentinelWSClientTests (WebSocket error streaming), TaskStoreTests (7 task intents), EyebrowFSMTests,
  SessionManagerTests, CheckpointReaderTests. All use XCTest. Protocols are @MainActor — tests must account for
  async/MainActor isolation. Build before testing: swift build then swift test.
