context: When writing or running tests for Paradigm packages
snippet: >-
  Test infrastructure: TypeScript packages use Vitest (npm run test at workspace root or per-package). Conductor uses
  XCTest with 160+ unit tests at Tests/ConductorTests/ (run: swift test). Key test areas: MCP tool handlers
  (paradigm-mcp), CLI command execution (paradigm), portal.yaml validation, .purpose file parsing, nomination engine
  scoring, agent notebook CRUD, aspect graph queries (SQLite via sql.js). No E2E test suite yet — integration testing is
  manual via field-testing on other repos (e.g., deus-backend, dealoracle).
