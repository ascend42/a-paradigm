context: When designing new tools, commands, or skills
snippet: >-
  DX patterns to follow: MCP tools should have concise response_format option ("concise" vs "detailed") to let agents
  save tokens. Tool descriptions end with token estimate (~100 tokens). CLI commands use consistent subcommand structure
  (paradigm {domain} {action} [--flags]). Skills in SKILL.md use structured prompt format with clear instructions for
  the AI. Hooks: pre-commit (advisory, auto-rebuilds index), post-write (advisory reminder for .purpose), stop (BLOCKING
  enforcement). The stop hook is the enforcement backstop — it should never surprise users who follow the conventions.
  Error messages should suggest the fix, not just state the problem.
