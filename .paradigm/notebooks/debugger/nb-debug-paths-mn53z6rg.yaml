context: When tracing issues across Paradigm packages
snippet: >-
  Debug paths by symptom: MCP tool returns error → check packages/paradigm-mcp/src/tools/{tool-file}.ts handler, look
  for undefined property access on YAML-parsed data. CLI command fails → check
  packages/paradigm/src/commands/{domain}/{action}.ts. Hook blocks unexpectedly → check plugins/paradigm/scripts/
  (paradigm-postwrite.sh, paradigm-stop.sh), note: post-write hook keeps getting reverted by plugin cache regeneration
  (known issue). Conductor doesn't connect → check Symphony WebSocket (ws://localhost port), verify CLI platform server
  is running. Agent not appearing → check .paradigm/roster.yaml active list and ~/.paradigm/agents/{id}.agent file
  exists.
