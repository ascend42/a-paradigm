context: When debugging gate detection false positives
snippet: >-
  Gate symbol detection (^gate-name) must ONLY scan .purpose files and portal.yaml — not arbitrary source code. The ^
  character appears in regex [^a-z], JSX components, CSS hex colors, URLs, and docs. Portal compliance checker at
  packages/paradigm/src/core/portal-compliance.ts was fixed in v5.21.1. If false positives recur, check that
  findGateReferences() is not doing broad grep.
