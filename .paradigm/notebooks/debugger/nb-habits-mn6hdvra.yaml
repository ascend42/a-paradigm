context: When debugging habits evaluation or stop hook blocking issues
snippet: >-
  CRITICAL: Habits evaluation logic exists in TWO separate copies. The stop hook calls the CLI copy
  (packages/paradigm/src/core/habits/evaluator.ts) via `paradigm compliance-check`. MCP tools use a different copy
  (packages/paradigm-mcp/src/utils/habits-loader.ts). Fixing one does NOT fix the other. Always check WHICH evaluator
  the failing code path calls before patching. The CLI evaluator is what matters for stop hook issues.
