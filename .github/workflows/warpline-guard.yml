# Warpline Guard self-test — run the Guard action on this repo's own PRs.
# ADVISORY, never blocking: fail-on-flag stays false and the whole job is
# continue-on-error, so a red engine day cannot gate a PR.
name: Warpline Guard

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  guard:
    runs-on: ubuntu-latest
    continue-on-error: true # advisory self-test — never blocks a PR
    steps:
      - name: Checkout (full history — the oracle needs the merge-base)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # npm optional-deps bug (npm/cli#4828): a lockfile resolved on macOS omits
      # the Linux-specific rollup binary, so tsup -> rollup crashes at build time
      # ("Cannot find module @rollup/rollup-linux-x64-gnu"). Install the binary
      # matching the resolved rollup version, without touching the manifest/lock.
      - name: Work around npm optional-deps bug (rollup linux binary)
        run: |
          ver=$(node -p "require('./node_modules/rollup/package.json').version")
          npm install --no-save --force "@rollup/rollup-linux-x64-gnu@${ver}" || true

      # Build the engine's workspace dependency chain, then the engine, then
      # the action bundle (purpose-core/portal-core → premise-core → warpline).
      - name: Build the engine + action
        run: |
          npm run build --workspace=@a-company/purpose-core
          npm run build --workspace=@a-company/portal-core
          npm run build --workspace=@a-company/premise-core
          npm run build --workspace=@a-company/warpline
          npm run build --workspace=@a-company/warpline-action

      - name: Warpline Guard
        id: guard
        uses: ./packages/warpline-action
        with:
          fail-on-flag: 'false' # explicit: advisory

      - name: Upload JSON report
        if: always() && steps.guard.outputs.report-path != ''
        uses: actions/upload-artifact@v4
        with:
          name: warpline-guard-report
          path: ${{ steps.guard.outputs.report-path }}
