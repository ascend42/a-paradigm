name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20, 22]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        uses: ./.github/actions/install-deps

      - name: Build all packages
        run: npm run build

      - name: Test
        run: npm test

      - name: Typecheck
        run: npm run typecheck

      - name: Format check
        run: npm run format:check
        continue-on-error: true

  # Warpline's vitest suite (packages/warpline/test/) gets its OWN blocking job
  # rather than riding the `build` job's `npm test` leg, which also carries
  # @a-company/paradigm — a warpline gate mixed into that would be red for
  # unrelated reasons and therefore ignored (the "wired to nothing" failure this
  # job exists to close, panel B-1).
  #
  # Pinned to Node 20, with the same dependency build chain warpline-guard.yml
  # establishes. Unlike warpline-guard, this one is NOT continue-on-error:
  # descriptors-frozen.test.ts and the rest of the F4 tripwires have to be able
  # to fail a PR.
  warpline:
    runs-on: ubuntu-latest
    name: Warpline tests

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        uses: ./.github/actions/install-deps

      # Same chain as warpline-guard.yml: purpose-core → portal-core →
      # premise-core, then the engine itself.
      - name: Build workspace dependencies
        run: |
          npm run build --workspace=@a-company/purpose-core
          npm run build --workspace=@a-company/portal-core
          npm run build --workspace=@a-company/premise-core

      # `test:warpline` rebuilds dist before running. That is load-bearing, not
      # belt-and-braces: four tests (f4-cli-arm, pick-agentid-env, two in
      # stake-denylist-v2) are `it.skipIf(!existsSync(dist/cli.js))`, so an
      # unbuilt or STALE dist makes them vanish silently while the run still
      # reports green. Building immediately before the run is what makes the
      # CLI arm observable at all.
      - name: Test (@a-company/warpline)
        run: npm run test:warpline

      - name: Typecheck (@a-company/warpline src)
        run: npm run typecheck --workspace=@a-company/warpline

  publish-dry-run:
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        uses: ./.github/actions/install-deps

      - name: Build
        run: npm run build

      - name: Dry run publish
        run: npm publish --dry-run --workspace=@a-company/paradigm
        continue-on-error: true
