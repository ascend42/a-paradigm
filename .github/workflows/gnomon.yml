# Gnomon (Paradigm 8.0) — PR-0 CI (research 29 §3; spec §16 rule, §19.1).
# Platform-independent tests run on Windows from day one (A23-5). Since 8.0 M3
# (T-2026-10-21-030) Gnomon is part of the root build/test scripts too (ci.yml,
# Node 24, the floor for every package); this workflow keeps the cross-OS matrix through build:gnomon /
# test:gnomon on Node 24 only.
name: Gnomon

on:
  push:
    # feat/gnomon: the integration branch runs the cross-OS matrix (incl. windows-latest) on every push, no PR needed
    branches: [main, feat/gnomon]
    paths:
      - 'packages/gnomon*/**'
      - 'packages/paradigm-mcp/**'
      - 'packages/paradigm/scripts/build-mcp-bundle.mjs'
      - 'docs/specs/gnomon*.md'
      - '.github/**'
  pull_request:
    paths:
      - 'packages/gnomon*/**'
      - 'packages/paradigm-mcp/**'
      - 'packages/paradigm/scripts/build-mcp-bundle.mjs'
      - 'docs/specs/gnomon*.md'
      - '.github/**'

permissions:
  contents: read

concurrency:
  group: gnomon-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # GitHub's macOS runners have SIP off, so the session enforcement suite skips there (floor sip) and the
        # refusal runs; macos-15 also records (informational, no assertion) the copied-osascript exit under the generated profile.
        # macos-14 is retired (T-2026-10-31-001): the macOS floor refusal (need 15) runs on every host with an injected
        # version (test/session-sandbox.test.ts, parseSwVersMajor in test/macos-version.test.ts). The full enforcement
        # suite runs only on a SIP-on macOS 15+ host.
        os: [macos-15, windows-latest, ubuntu-latest]
        node: [24]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: 'npm'

      - name: Install dependencies
        uses: ./.github/actions/install-deps

      # W2/W3 (docs/plans/gnomon-windows.md): the kernel's Windows backends need the Rust platform helper; the
      # win32-helper suite fails (never skips) on CI when it is missing. Unsigned: signing identities never enter CI.
      - name: Build the Windows platform helper (unsigned)
        if: runner.os == 'Windows'
        run: node packages/gnomon-helper/scripts/build-win32.mjs

      # test:gnomon rebuilds first: the G-KRN-02 dist scan fails loudly (never
      # skips) when dist/ is missing.
      - name: Build (@a-company/gnomon-contracts, @a-company/gnomon)
        run: npm run build:gnomon

      # test/paradigm-staged-lane.test.ts (darwin, linux) runs a local session against the REAL single-file Paradigm
      # MCP bundle (packages/paradigm/dist/mcp-bundle). build:mcp-bundle compiles paradigm-mcp from source but resolves
      # its workspace imports through their dist: build:core (logger, university-core, purpose-core, portal-core,
      # probe-core), premise-core and sentinel's library (not its UI); gnomon is built above.
      - name: Build the Paradigm MCP bundle (paradigm-staged-lane e2e)
        if: runner.os != 'Windows'
        run: |
          npm run build:core
          npm run build --workspace=@a-company/premise-core
          npm run build:core --workspace=@a-company/sentinel
          npm run build:mcp-bundle --workspace=@a-company/paradigm

      - name: Test (contracts, kernel fence G-KRN-02, G-SEC-01, G-WIN-05)
        run: npm run test:gnomon

      # M1.12 slice 3: the honesty gate on its own line, so a G-HON failure is named in the run (it also
      # runs inside test:gnomon; platform-independent). The client-API doc fixed point (G-HON-04 rule)
      # runs in the contracts suite above.
      - name: Honesty CI (G-HON-02, G-HON-03, G-HON-05, G-HON-06, G-HON-07)
        working-directory: packages/gnomon
        run: npx vitest run test/honesty.test.ts

      - name: Typecheck
        run: |
          npm run typecheck --workspace=@a-company/gnomon-contracts
          npm run typecheck --workspace=@a-company/gnomon
          npm run typecheck --workspace=@a-company/gnomon-gui

  # The board in the REAL APP, in a real Chrome (T-2026-11-25-001 item 7; boards S1.3 P4b-3). test/board-app.test.ts
  # drives the dev preview's real ui/app.ts with real pointer and key input over the DevTools protocol; until this job
  # it ran only on a developer Mac, because it skipped whenever CI was set. It runs ALONE in its own job (the suite
  # times out on a loaded machine) on macos-15, whose image carries Google Chrome at the path the suite looks for
  # (the `test` job's gui-browser-darwin suite already uses it). GNOMON_BROWSER_TESTS=1 is the ask: with it a missing
  # Chrome FAILS the run, it never skips. No retry, no longer timeouts and no assertion differs from a local run.
  #
  # NOT here: packages/gnomon/test/dimension-board-browser.test.ts (the same page served by the real kernel with a
  # real session) needs the darwin session floor, which SIP-off runners fail; it runs in `gnomon-e2e-sip-stubbed`.
  board-browser:
    name: board in a real Chrome (macos-15)
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        uses: ./.github/actions/install-deps

      - name: Build (@a-company/gnomon-contracts, @a-company/gnomon)
        run: npm run build:gnomon

      - name: The board in the real app (real Chrome, real input; G-DDL-08)
        working-directory: packages/gnomon-gui
        env:
          GNOMON_BROWSER_TESTS: '1'
        run: npx vitest run test/board-app.test.ts

      # S1.4: the draw keys and the hands foot's +<k> menu (T-2026-11-26-004), and the Dimensions list under the head
      # key, each alone, with the same ask: a missing Chrome fails, never skips
      - name: The draw keys and the hands menu (real Chrome, real input)
        working-directory: packages/gnomon-gui
        env:
          GNOMON_BROWSER_TESTS: '1'
        run: npx vitest run test/board-grant-key.test.ts

      - name: The Dimensions list (real Chrome, real input)
        working-directory: packages/gnomon-gui
        env:
          GNOMON_BROWSER_TESTS: '1'
        run: npx vitest run test/board-dims-list.test.ts

  # S1.4 P5 (Aegis ruling 1(a), 1(b); T-2026-11-27-001): the real-kernel e2e that gates the board bridge. GitHub's
  # macOS runners have SIP off, so the kernel refuses every session there (floor sip). This job passes ONE test-only
  # seam, `DaemonSeams.supervisor.sessionSipStub` (GNOMON_E2E_SIP_STUB=1, read by the tests, never by src): it
  # answers only the SESSION and MOD floors' SIP probe, only with a claudePath seam (tests pass the fake); the macOS
  # floor, the sandbox-exec check, the generated profiles and their argv stay real. It exercises the real profiles under
  # a stubbed SIP answer: it is NOT proof that the sandbox enforces, and NOT the merge gate. GNOMON_E2E_REQUIRED=1 makes a skip FAIL.
  # The first step proves the unstubbed kernel still refuses sandbox-unavailable{floor:'sip'} here, and that a
  # stubbed plan is the same launch. The merge gate is the recorded local run on a SIP-on Mac. Required status check for the integration branch and main.
  gnomon-e2e-sip-stubbed:
    name: gnomon-e2e-sip-stubbed (macos-15)
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        uses: ./.github/actions/install-deps

      - name: Build (@a-company/gnomon-contracts, @a-company/gnomon)
        run: npm run build:gnomon

      - name: The unstubbed kernel refuses floor sip; a stubbed launch is the same launch
        working-directory: packages/gnomon
        env:
          GNOMON_E2E_REQUIRED: '1'
        run: npx vitest run test/session-sip-stub.test.ts

      - name: The bridge e2e (G-MOD-19..22, G-DDL-03, G-DDL-09, M2, the E-case)
        working-directory: packages/gnomon
        env:
          GNOMON_E2E_SIP_STUB: '1'
          GNOMON_E2E_REQUIRED: '1'
        run: npx vitest run test/dimension-bridge-e2e.test.ts

      - name: The dimension dogfood rig
        working-directory: packages/gnomon
        env:
          GNOMON_E2E_SIP_STUB: '1'
          GNOMON_E2E_REQUIRED: '1'
        run: npx vitest run test/dimension-dogfood.test.ts

      - name: The board in a real Chrome on the real kernel
        working-directory: packages/gnomon
        env:
          GNOMON_E2E_SIP_STUB: '1'
          GNOMON_E2E_REQUIRED: '1'
          GNOMON_BROWSER_TESTS: '1'
        run: npx vitest run test/dimension-board-browser.test.ts

  # M1.0 probes runnable on hosted runners. PR-0 runs only the harness
  # self-test; PR-2 adds P03 (win), P08, P09, P11, P12 and the P06 smoke.
  # Results are uploaded as artifacts only — real results are committed from
  # hardware runs (research 29 §3).
  probes-ci:
    name: probes (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      # Zero deps, no build: run.mjs must work on a fresh checkout.
      # CI results go to a runner temp dir (--out-dir), never into
      # probes/results/: the committed files there are hardware runs only,
      # and the artifact must not mix them in.
      - name: Probe harness self-test (p-harness)
        shell: bash
        run: node packages/gnomon/probes/run.mjs p-harness --out-dir "$RUNNER_TEMP/probe-results"

      # P12 runs two pages: the pinned board bytes (zero deps) and a probe
      # build made in memory for its edit checks, which needs the workspace
      # dependencies (esbuild and the board engine). The harness self-test
      # above stays zero-deps; this install is for P12's probe build only.
      - name: Install workspace dependencies (P12 probe build)
        shell: bash
        run: npm ci

      # P09 + P12 on hosted runners (mechanics only; the runner's Chrome).
      # Exit 2 (partial: a missing optional engine, or a non-darwin host) is
      # accepted; a fail (exit 1) or a harness error fails the step. On macOS
      # P12 itself fails when it has no WKWebView row (the wrapper's engine),
      # and the step checks the written result for that row as well.
      - name: Probe P09 (Ed25519 in browser engines under the §11.2 CSP)
        shell: bash
        run: |
          code=0
          node packages/gnomon/probes/run.mjs p09-ed25519-matrix --timeout 900000 --out-dir "$RUNNER_TEMP/probe-results" || code=$?
          if [ "$code" -ne 0 ] && [ "$code" -ne 2 ]; then exit 1; fi

      # P12's own budget (T-2026-11-25-002): 3 runs x 2 pages in each of 4
      # engines took 11 to 14 min on macos-15, against the 15 min it shared
      # with P09. A page that misses its report is retried once per engine,
      # which can add up to ~2 min an engine; 30 min covers that with room,
      # and the run count and every check stay as they are.
      - name: Probe P12 (the board under the §11.2 CSP)
        shell: bash
        timeout-minutes: 35
        run: |
          status=0
          code=0
          node packages/gnomon/probes/run.mjs p12-excalidraw-csp --timeout 1800000 --out-dir "$RUNNER_TEMP/probe-results" || code=$?
          if [ "$code" -ne 0 ] && [ "$code" -ne 2 ]; then status=1; fi
          if [ "$RUNNER_OS" = "macOS" ]; then
            node -e 'const r=JSON.parse(require("fs").readFileSync(process.argv[1],"utf8"));const w=r.evidence&&r.evidence.engines&&r.evidence.engines.wkwebview;if(!w||!w.clean||w.mountedRuns!==w.runs){console.error("P12: no clean WKWebView row on macOS");process.exit(1)}' "$RUNNER_TEMP/probe-results/p12-excalidraw-csp.darwin.json" || status=1
          fi
          exit $status

      - name: Upload probe results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: probe-results-${{ matrix.os }}
          path: ${{ runner.temp }}/probe-results/*.json
          if-no-files-found: warn

  # Aegis L2 (C6'a2-1): the helper's unit tests, including testSharedBindingVectors over the shared decision.sign
  # vectors (packages/gnomon-contracts/test/fixtures/decision-batch-vectors.json). Pure logic, unsigned (no Secure
  # Enclave, no entitlements). macOS 15: the package's deployment floor (TD-2026-10-22-220), so the test bundle loads.
  helper-swift:
    name: gnomon-helper swift test (macos-15)
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: swift test (gnomon-helper, darwin, unsigned)
        working-directory: packages/gnomon-helper/darwin
        run: swift test

  native:
    name: native (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Unsigned: signing identities and secrets never enter CI.
      - name: Build gnomon-helper (darwin, unsigned)
        if: runner.os == 'macOS'
        working-directory: packages/gnomon-helper/darwin
        run: |
          swift build
          .build/debug/gnomon-helper --version

      # #gnomon-voice-io (TD-2026-10-19-298, V2b): macOS only (AVAudioEngine, CoreAudio, Carbon). Unsigned; the
      # unit tests need no audio hardware, and nothing here opens the mic (--selftest is founder-run, PROBES.md).
      - name: Build + test gnomon-voice-io (darwin, unsigned)
        if: runner.os == 'macOS'
        working-directory: packages/gnomon-voice/io-darwin
        run: |
          swift build
          swift test
          .build/debug/gnomon-voice-io --version

      # #gnomon-wrapper (M1.13 slice 1): macOS only. Unsigned, no notarization (identities never enter CI).
      # The Windows wrapper (WebView2, named-pipe channel) is the parity phase (P8-D78), so it is not built there.
      # The kernel dist is built FIRST: build.rs pins its tree hash and tests/live_kernel.rs runs against it
      # (with CI=true it fails rather than skips when dist or node is missing).
      - name: Setup Node.js (gnomon-wrapper live test)
        if: runner.os == 'macOS'
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies (gnomon-wrapper live test)
        if: runner.os == 'macOS'
        uses: ./.github/actions/install-deps

      - name: Build the kernel dist (gnomon-wrapper live test)
        if: runner.os == 'macOS'
        run: npm run build:gnomon

      - name: Test gnomon-wrapper (Rust/Tauri, macOS)
        if: runner.os == 'macOS'
        working-directory: packages/gnomon-wrapper
        run: cargo test --locked

      # W0 (docs/plans/gnomon-windows.md): the Rust helper's own tests (pure checks: SDDL verdicts, path, pipe-name
      # and URL bounds, argv quoting) plus a release build. The WebView2 wrapper joins this leg in W6.
      - name: Test + build gnomon-helper (win32, unsigned)
        if: runner.os == 'Windows'
        working-directory: packages/gnomon-helper/win32
        run: |
          cargo test --locked
          cargo build --release --locked
          target/release/gnomon-helper.exe --version
