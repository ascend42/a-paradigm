name: Install dependencies
description: >
  npm ci plus a workaround for the npm optional-deps bug (npm/cli#4828). A
  lockfile resolved on one OS omits the other platforms' rollup binaries, so
  tsup -> rollup crashes at build time ("Cannot find module
  @rollup/rollup-<platform>-<arch>[-gnu|-musl|-msvc]"). We install the binary
  matching the runner's process.platform/process.arch and the resolved rollup
  version, without touching the manifest/lock. Works on Linux, macOS and
  Windows runners (bash is available on all three). Requires actions/checkout
  to have run first (needs .github/actions on disk).

runs:
  using: composite
  steps:
    - name: Install dependencies
      shell: bash
      run: npm ci

    - name: Work around npm optional-deps bug (rollup + rolldown native binaries)
      shell: bash
      run: |
        # rollup (tsup) and rolldown (vitest/vite) ship per-platform native
        # bindings as optional deps; a lockfile resolved on macOS omits the rest.
        triple=$(node -e '
          const { platform, arch } = process;
          let suffix = "";
          if (platform === "linux") {
            const glibc = process.report?.getReport?.().header?.glibcVersionRuntime;
            suffix = glibc ? "-gnu" : "-musl";
          } else if (platform === "win32") {
            suffix = "-msvc";
          }
          process.stdout.write(`${platform}-${arch}${suffix}`);
        ')
        # One npm install for all missing bindings: a second `--no-save` install
        # prunes the extraneous package the first one added.
        missing=()
        for spec in "rollup:@rollup/rollup-${triple}" "rolldown:@rolldown/binding-${triple}"; do
          host="${spec%%:*}"; pkg="${spec#*:}"
          if [ ! -f "node_modules/${host}/package.json" ]; then
            echo "${host} not installed; skipping ${pkg}"
            continue
          fi
          ver=$(node -p "require('./node_modules/${host}/package.json').version")
          if [ -d "node_modules/${pkg}" ]; then
            echo "${pkg} already present"
          else
            missing+=("${pkg}@${ver}")
          fi
        done
        if [ ${#missing[@]} -gt 0 ]; then
          echo "installing ${missing[*]}"
          npm install --no-save --force "${missing[@]}" || true
          for m in "${missing[@]}"; do
            n="${m%@*}"
            [ -d "node_modules/${n}" ] && echo "ok ${n}" || echo "::warning::${n} still missing"
          done
        fi
