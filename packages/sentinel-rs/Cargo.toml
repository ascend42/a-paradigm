[package]
name = "sentinel-client"
version = "0.2.0"
edition = "2021"
description = "Rust client SDK for Paradigm Sentinel observability server"
license = "MIT"
repository = "https://github.com/ascend42/a-paradigm"

[features]
default = []
tracing = ["tracing-core", "tracing-subscriber"]

[dependencies]
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["time", "sync", "rt"] }
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
tracing-core = { version = "0.1", optional = true }
tracing-subscriber = { version = "0.3", optional = true, default-features = false, features = ["registry"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
