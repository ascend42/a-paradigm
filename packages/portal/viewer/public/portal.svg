<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="portal-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f97316;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ea580c;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="1.5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Outer ring -->
  <circle cx="16" cy="16" r="14" fill="none" stroke="url(#portal-gradient)" stroke-width="2" opacity="0.3"/>
  <!-- Middle ring -->
  <circle cx="16" cy="16" r="10" fill="none" stroke="url(#portal-gradient)" stroke-width="2" opacity="0.6"/>
  <!-- Inner door shape -->
  <path d="M12 8 L12 24 L20 24 L20 8 Z" fill="url(#portal-gradient)" filter="url(#glow)" rx="2"/>
  <!-- Door handle -->
  <circle cx="18" cy="16" r="1.5" fill="#0a0a0f"/>
</svg>
