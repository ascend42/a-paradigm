# Paradigm Configuration
# Source of truth for AI-assisted development in this project

version: "1.0"
project: "{{PROJECT_NAME}}"

# Discipline (optional) - helps AI understand your domain
# Options: web, backend, ml, mobile, game, embedded, devops, custom
# See specs/disciplines.md for symbol interpretations per discipline
discipline: auto  # auto-detect from project structure

# Guidelines for AI agents working in this codebase
agent-guidelines:
  overview: |
    This project uses Paradigm for structured AI-assisted development.
    All context, symbols, and specifications live in the .paradigm/ directory.
  
  how-to-use:
    - "Check .paradigm/specs/ for philosophy and patterns before making changes"
    - "Reference symbols using prefixes: #component ^gate !signal $flow ~aspect"
    - "Use the Paradigm logger instead of raw console.log/print statements"
    - "Run `paradigm probe` with screenshots to map UI to code"
    - "Check .paradigm/docs/ for command reference and troubleshooting"
    - "Read .index.yaml files first when navigating documentation"
    - "Use `paradigm team handoff` when approaching context limits"
  
  update-rules:
    - "When adding a feature, create/update the nearest .purpose file"
    - "When adding authorization, update portal.yaml"
    - "When exploring ideas, use [idea] tag on any symbol"
    - "Always update references when renaming symbols"

# Symbol system v2 - the shared language between code and AI
# 5 operational symbols + tag bank for classification
symbol-system:
  "#":
    name: Component
    description: Any documented code unit (feature, service, module, integration)
    owner: purpose
    examples: ["#checkout", "#login-handler", "#Button", "#stripe-client"]
  "$":
    name: Flow
    description: Multi-step processes or user journeys
    owner: shared
    examples: ["$checkout-flow", "$onboarding", "$auth-flow"]
  "^":
    name: Gate
    description: Access control points and authorization rules
    owner: portal
    examples: ["^authenticated", "^admin-only", "^rate-limited"]
  "!":
    name: Signal
    description: Events emitted for side effects
    owner: purpose
    examples: ["!login-success", "!payment-failed", "!rate-limited"]
  "~":
    name: Aspect
    description: Cross-cutting rules with required code anchors
    owner: purpose
    examples: ["~audit-required", "~rate-limited", "~cached"]

# Logging configuration
logging:
  # Include logging rules in generated IDE instructions
  enforce: true
  
  # Default log level (debug, info, warn, error)
  default-level: debug
  
  # Map directory patterns to symbol types for logging
  # These are generic patterns - customize for your project structure
  symbol-mapping:
    # Components (#) - all code units
    "features/**": "#"
    "routes/**": "#"
    "api/**": "#"
    "endpoints/**": "#"
    "commands/**": "#"
    "models/**": "#"
    "components/**": "#"
    "lib/**": "#"
    "utils/**": "#"
    "services/**": "#"
    "core/**": "#"
    "drivers/**": "#"       # Embedded
    "systems/**": "#"       # Game dev
    "stores/**": "#"
    "state/**": "#"
    "reducers/**": "#"
    "config/**": "#"
    "integrations/**": "#"
    "external/**": "#"
    "vendors/**": "#"

    # Gates (^) - access control
    "middleware/**": "^"
    "auth/**": "^"
    "guards/**": "^"
    "policies/**": "^"

    # Signals (!) - events
    "events/**": "!"
    "handlers/**": "!"
    "listeners/**": "!"
    "hooks/**": "!"

    # Flows ($) - multi-step processes
    "flows/**": "$"
    "sagas/**": "$"
    "workflows/**": "$"
    "pipelines/**": "$"     # ML/Data pipelines

    # Aspects (~) - cross-cutting rules
    "aspects/**": "~"
    "rules/**": "~"

# Probe configuration for visual discovery
probe:
  enabled: true
  auto-include: true

# Project states (define as #components with [state] tag in .purpose files)
# states:
#   user-store:
#     description: User authentication state
#     tags: [state]
#   app-store:
#     description: Application loading state
#     tags: [state]

# Where .purpose files should exist
# Customize these patterns for your project structure
purpose-required:
  - pattern: "src/*"
    depth: 1
  - pattern: "lib/*"
    depth: 1
  - pattern: "packages/*"
    depth: 1

# Custom symbols (extend the core set)
# custom-symbols:
#   "§": 
#     name: "Domain"
#     description: "Domain-specific concepts"
#     examples: ["§patient", "§transaction"]

# Coding conventions
conventions:
  - "Use kebab-case for all symbol IDs (feature-name, not featureName)"
  - "Document flows when logic spans 3+ components"
  - "Reference related items using symbol prefixes (# $ ^ ! ~)"
  - "Add descriptions to all components and gates"
  - "Update .purpose files when changing feature behavior"
  - "Keep gates minimal - one responsibility per gate"
  - "Use signals for side effects, not direct state mutations"
  - "ALWAYS use Paradigm logger, NEVER raw console.log/print"

# AI agent context management
ai-agent:
  # Model being used
  model: claude-opus-4.5
  # Context window size in tokens
  context-window: 200000
  # Use `paradigm team handoff` for context continuity

# Documentation index settings
context:
  # Enable documentation indexing
  enabled: true
  # Index file name
  index-file: .index.yaml
  # Root documentation directory
  docs-path: docs/
