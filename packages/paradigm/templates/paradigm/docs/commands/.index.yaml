# Command Documentation Index

title: "Paradigm Commands - Detailed Guides"
description: "Comprehensive documentation for each Paradigm CLI command"

# Commands by category
categories:
  setup:
    - init
    - sync
    - mcp-setup
    
  ai_context:
    - beacon
    - constellation
    - index
    
  analysis:
    - ripple
    - status
    - doctor
    
  development:
    - lint
    - watch
    - echo
    
  collaboration:
    - team
    - thread

# Command metadata
commands:
  init:
    title: "paradigm init"
    summary: "Initialize Paradigm in your project"
    file: "init.md"
    category: "setup"
    frequency: "once per project"
    
  sync:
    title: "paradigm sync"
    summary: "Regenerate IDE instruction files"
    file: "sync.md"
    category: "setup"
    frequency: "after config changes"
    
  mcp-setup:
    title: "paradigm mcp setup"
    summary: "Configure MCP for AI clients"
    file: "mcp-setup.md"
    category: "setup"
    frequency: "once per machine/project"
    
  beacon:
    title: "paradigm beacon"
    summary: "Generate quick-start orientation for AI"
    file: "beacon.md"
    category: "ai_context"
    frequency: "weekly or after feature additions"
    
  constellation:
    title: "paradigm constellation"
    summary: "Build complete symbol relationship graph"
    file: "constellation.md"
    category: "ai_context"
    frequency: "with beacon, weekly"
    
  index:
    title: "paradigm index"
    summary: "Generate visual discovery index"
    file: "index.md"
    category: "ai_context"
    frequency: "optional, for screenshot analysis"
    
  ripple:
    title: "paradigm ripple"
    summary: "Analyze symbol impact before changes"
    file: "ripple.md"
    category: "analysis"
    frequency: "before every modification"
    
  status:
    title: "paradigm status"
    summary: "Show project health and symbol counts"
    file: "status.md"
    category: "analysis"
    frequency: "anytime for overview"
    
  doctor:
    title: "paradigm doctor"
    summary: "Run health checks on Paradigm setup"
    file: "doctor.md"
    category: "analysis"
    frequency: "after setup, when troubleshooting"

# Reading order for new users
reading_order:
  - init        # Start here
  - sync        # Keep IDE in sync
  - mcp-setup   # Enable AI tools
  - beacon      # Generate AI context
  - constellation # Detailed relationships
  - ripple      # Before modifications
  - doctor      # Verify health

# Quick reference
quick_start:
  - command: "paradigm init --quick"
    description: "Initialize new project"
  - command: "paradigm sync --all"
    description: "Generate IDE files"
  - command: "paradigm mcp setup --client all"
    description: "Configure MCP"
  - command: "paradigm beacon && paradigm constellation"
    description: "Generate AI context"
  - command: "paradigm doctor"
    description: "Verify setup"
