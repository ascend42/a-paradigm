id: LP-para-901
title: 'PARA 901: The Academy — Gated Learning (the Classroom)'
description: "Agents learn by surviving the field, not by asserting confidence. This course teaches the Classroom: why every learning is provisional by default, how the gated /class term — not a confidence floor — certifies, why study-hall only stages, how THE STAND de-anesthetizes the gate, how Expeditions forage external knowledge behind a structural context-firewall, and how to read the honest (often null) Academy scoreboard. Shipped experimental in v7.x."
