# ShopFlow Authorization Gates
# Defines access control points throughout the application

version: "1.0"

dev:
  # Development overrides for testing
  bypass_all: false
  mock_user:
    id: "dev-user-123"
    email: "dev@shopflow.test"
    roles: ["customer", "admin"]
    subscription: "premium"

gates:
  # Authentication required gate
  - id: "^auth-required"
    name: Authentication Required
    description: User must be logged in to access
    locks:
      - id: authenticated
        description: Valid session required
        keys:
          - expr: "user.id != null"
            name: Has User ID
    prizes:
      - type: access
        resource: protected-content

  # Premium checkout features
  - id: "^premium-checkout"
    name: Premium Checkout
    description: Enhanced checkout for premium subscribers
    locks:
      - id: is-premium
        description: Premium subscription active
        keys:
          - expr: "user.subscription == 'premium'"
            name: Premium Subscriber
          - expr: "user.subscription == 'enterprise'"
            name: Enterprise Subscriber
    prizes:
      - type: feature
        name: Express Checkout
        description: One-click checkout with saved payment
      - type: feature
        name: Priority Support
        description: 24/7 customer support access

  # Admin panel access
  - id: "^admin-panel"
    name: Admin Panel Access
    description: Full administrative access to store management
    locks:
      - id: admin-role
        description: Must have admin role
        keys:
          - expr: "user.roles includes 'admin'"
            name: Admin Role
      - id: verified-email
        description: Email must be verified
        keys:
          - expr: "user.emailVerified == true"
            name: Email Verified
    prizes:
      - type: access
        resource: admin-dashboard
      - type: action
        name: manage-products
        description: Create, update, delete products
      - type: action
        name: manage-orders
        description: View and process orders
      - type: action
        name: manage-users
        description: User administration

  # Store owner gate
  - id: "^store-owner"
    name: Store Owner
    description: Access for store owners/merchants
    locks:
      - id: owner-role
        description: Must be a store owner
        keys:
          - expr: "user.roles includes 'owner'"
            name: Owner Role
          - expr: "user.storeId != null"
            name: Has Store Assignment
    prizes:
      - type: access
        resource: store-dashboard
      - type: feature
        name: Analytics Dashboard
        description: Sales and traffic analytics
      - type: feature  
        name: Inventory Management
        description: Stock level controls

  # Rate-limited checkout (anti-fraud)
  - id: "^checkout-rate-limit"
    name: Checkout Rate Limit
    description: Prevents rapid checkout attempts (fraud protection)
    locks:
      - id: rate-check
        description: Not exceeding checkout rate
        keys:
          - expr: "context.checkoutAttempts < 5"
            name: Under Rate Limit
    prizes:
      - type: access
        resource: checkout-process
